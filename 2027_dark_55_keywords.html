      "교사 역할은 초심 상담자에게 구체적인 상담 지식과 기법을 직접 가르치고 평가한다.",
      "상담자 역할은 수련생의 역전이와 미해결 감정 및 내면적 불안을 탐색하고 다룬다.",
      "자문자 역할은 수련생을 동료로 존중하며 개입 대안을 수평적으로 함께 탐색한다.",
      "조하리의 창에서 피드백을 수용하여 눈먼 창을 줄이고 열린 창을 넓혀 성장한다."
    ]
  },
  {
    id: 55, group: "진로·다문화·위기·집단", cat: "위기개입 및 학교폭력예방법",
    title: "길리랜드(Gilliland)의 위기개입 6단계·안전계획서 + 학폭법 제16조·제17조",
    keywords: ["경청 3단계(문제정의·안전확보·지지)", "활동 3단계(대안탐색·계획수립·다짐)", "안전계획서", "학폭법 16조(피해자)·17조(가해자)"],
    lines: [
      "위기개입은 문제 정의와 안전 확보 및 정서적 지지를 제공하는 경청 단계를 거친다.",
      "이후 대안 탐색과 행동 계획 수립 및 실천 다짐을 받는 활동 단계로 나아간다.",
      "안전계획서에는 위기 경고 신호와 치명적 수단 제거 및 긴급 연락처를 명시한다.",
      "학폭법 제16조는 피해학생 심리상담과 일시보호, 제17조는 가해학생 접촉금지다."
    ]
  }
];

let currentFilter = 'ALL';
let fontScale = 1.0;
let allTypingOpen = false;
let doneState = JSON.parse(localStorage.getItem('kice2027_done55') || '{}');

function saveDone(id) {
  doneState[id] = !doneState[id];
  localStorage.setItem('kice2027_done55', JSON.stringify(doneState));
  renderCards();
}

function updateProgress() {
  const count = Object.values(doneState).filter(Boolean).length;
  const pct = Math.round((count / 55) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${count} / 55 완료 (${pct}%)`;
}

function setFilter(filterVal, btn) {
  currentFilter = filterVal;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function changeFontScale(delta) {
  fontScale = Math.min(1.4, Math.max(0.85, fontScale + delta));
  document.documentElement.style.setProperty('--font-Scale', fontScale);
}

function toggleTyping(id) {
  const el = document.getElementById('typing-' + id);
  if (el) el.classList.toggle('open');
}

function toggleAllTyping() {
  allTypingOpen = !allTypingOpen;
  document.querySelectorAll('.typing-area').forEach(el => {
    if (allTypingOpen) el.classList.add('open');
    else el.classList.remove('open');
  });
}

function checkInputMatch(inputEl, targetStr, id) {
  const val = inputEl.value.trim();
  if (val === targetStr.trim()) {
    inputEl.classList.add('match');
  } else {
    inputEl.classList.remove('match');
  }
}

function renderCards() {
  updateProgress();
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const container = document.getElementById('cardContainer');
  container.innerHTML = '';

  const filtered = ITEMS_55.filter(item => {
    if (currentFilter === 'UNDONE' && doneState[item.id]) return false;
    if (currentFilter !== 'ALL' && currentFilter !== 'UNDONE' && item.group !== currentFilter) return false;
    if (query) {
      const hay = (item.title + ' ' + item.keywords.join(' ') + ' ' + item.lines.join(' ')).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });

  filtered.forEach(item => {
    const isDone = !!doneState[item.id];
    const isPedagogy = item.id <= 20;
    const numStr = String(item.id).padStart(2, '0');

    const card = document.createElement('div');
    card.className = 'card' + (isDone ? ' done' : '');

    const kwHtml = item.keywords.map(k => `<span class="kw-pill">🔑 ${k}</span>`).join('');
    const linesHtml = item.lines.map((ln, idx) => `
      <div class="line-item">
        <span class="line-label">${idx + 1}줄 (${ln.length}자)</span>
        <span class="line-text">${ln}</span>
      </div>
    `).join('');

    const typingRowsHtml = item.lines.map((ln, idx) => `
      <div class="typing-row">
        <div class="typing-target">${idx + 1}줄: ${ln}</div>
        <input type="text" class="typing-input" placeholder="${idx + 1}줄 문장을 그대로 타이핑해 보세요..." oninput="checkInputMatch(this, '${ln.replace(/'/g, "\\'")}', ${item.id})">
      </div>
    `).join('');

    card.innerHTML = `
      <div class="card-header">
        <div class="card-title-group">
          <span class="num-badge">#${numStr}</span>
          <span class="cat-badge ${isPedagogy ? 'pedagogy' : ''}">${item.cat}</span>
          <span class="card-title">${item.title}</span>
        </div>
        <button class="check-btn ${isDone ? 'checked' : ''}" onclick="saveDone(${item.id})">
          ${isDone ? '✅ 암기·타이핑 완료' : '⬜ 완료 체크'}
        </button>
      </div>
      <div class="keywords-box">${kwHtml}</div>
      <div class="lines-container">${linesHtml}</div>
      <div class="typing-toggle-bar">
        <button class="btn-practice" onclick="toggleTyping(${item.id})">⌨️ 이 문항 4줄 타이핑 연습창 열기/닫기</button>
      </div>
      <div class="typing-area ${allTypingOpen ? 'open' : ''}" id="typing-${item.id}">
        ${typingRowsHtml}
      </div>
    `;
    container.appendChild(card);
  });
}

renderCards();
</script>
</body>
</html>
