<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>150문제 기출문제 뷰어 - 실전 모의고사</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #121212;
    color: #ffffff;
    margin: 0;
    padding: 0;
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.6;
    font-size: 16px;
  }
  /* Header */
  .header-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #1e1e1e;
    padding: 0.8rem 1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    border-bottom: 1px solid #333;
    z-index: 1000;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  
  .mode-btn {
    background: #333; color: #fff; border: 1px solid #555;
    padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold;
  }
  .mode-btn.active { background: #facc15; color: #000; border-color: #facc15; }
  
  /* Content Container */
  .content { margin-top: 5rem; padding: 1rem; max-width: 900px; margin-left: auto; margin-right: auto; }
  
  /* Common Question Styles */
  .question-box {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  h2.q-title { font-size: 1.3rem; margin-top: 0; color: #facc15; border-bottom: 1px dashed #444; padding-bottom: 0.5rem; }
  .label { color: #60a5fa; font-weight: bold; margin-top: 1rem; display: inline-block; }
  .text-content { white-space: pre-wrap; word-break: break-word; background: #000; padding: 1rem; border-radius: 4px; margin-top: 0.5rem; border: 1px solid #333; }
  .answer-text { color: #facc15; font-weight: bold; }
  
  /* Study Mode specific */
  .hidden-answer { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed #444; }
  .show-answer-btn { background: #2563eb; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 1rem; width: 100%; }
  
  /* Test Mode specific */
  .test-textarea {
    width: 100%; height: 150px; background: #000; color: #fff; border: 1px solid #444;
    border-radius: 4px; padding: 1rem; font-family: inherit; font-size: 1rem; margin-top: 1rem; resize: vertical;
  }
  .test-textarea:focus { outline: 2px solid #60a5fa; }
  .test-controls { display: flex; justify-content: space-between; margin-top: 1rem; }
  .nav-btn { background: #4b5563; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
  .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .check-btn { background: #059669; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
  
  /* Timer */
  #timer { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: #f87171; }
</style>
</head>
<body>
<div class="header-bar">
  <div class="header-left">
    <button class="mode-btn active" id="btnStudyMode" onclick="setMode('study')">학습 모드 (전체보기)</button>
    <button class="mode-btn" id="btnTestMode" onclick="setMode('test')">실전 모드 (1문제씩)</button>
  </div>
  <div class="header-right">
    <div style="font-size:0.9rem;">
      글씨: <input type="range" id="fontSizeRange" min="12" max="32" value="16" style="width: 80px;" />
    </div>
    <div id="timerContainer" style="display:none;">남은시간: <span id="timer">90:00</span></div>
  </div>
</div>

<div class="content" id="app"></div>

<script>
  const ITEMS = [{"id": 1, "cat": "상담이론과 실제", "sub": "정신분석 상담", "title": "001. 프로이트(Freud)의 방어기제: 투사적 동일시 vs 투사", "passage": "[문제 지문]\n내담자(고1): \"선생님도 결국 우리 엄마처럼 저를 귀찮고 쓸모없는 애라고 생각하시잖아요! 그래서 지금 표정도 차가우신 거잖아요!\"\n상담자: (내담자의 계속된 비난에 실제로 짜증과 무력감이 올라오며 내담자를 밀어내고 싶은 충동을 느낀다.)\n\n1. 내담자가 자신의 수용하기 힘든 내적 대상이나 충동을 타인에게 투사한 후, 상대방이 실제로 그 투사된 내용대로 느끼고 행동하게끔 유도하는 방어기제의 명칭을 쓰시오.\n2. 이때 상담자가 경험하는 정서적 반응을 무엇이라 하는지 쓰시오.", "answer": "1. 투사적 동일시 (Projective Identification)\n2. 역전이 (Countertransference, 객관적 역전이)", "explanation": "[설명]\n• 투사(Projection)는 자신의 욕구나 감정을 타인의 것으로 돌리는 데 그치지만, 클라인(M. Klein)이 제시한 '투사적 동일시'는 투사된 내용을 상대방(상담자)이 실제로 내면화하여 그 역할대로 느끼고 행동하도록 압력을 가하는 원시적 방어기제(주로 경계성 성격조직에서 빈발)이다.\n• 상담자는 이를 자신의 개인적 미해결 과제 때문이 아닌 내담자의 투사적 동일시에 의한 '객관적 역전이'로 이해하고, 이를 버텨주기(Holding) 및 담아주기(Containing)로 소화해 내담자에게 돌려주어야 한다."}, {"id": 2, "cat": "상담이론과 실제", "sub": "정신분석 상담", "title": "002. 프로이트(Freud)의 방어기제: 반동형성과 취소", "passage": "[문제 지문]\n사례 A: 동생이 태어난 후 엄마의 사랑을 빼앗겨 동생을 미워하는 무의식적 적개심을 가진 첫째 아이가, 오히려 동생을 과도하게 껴안고 '세상에서 동생이 제일 좋다'며 지나치게 친절하게 행동한다.\n사례 B: 친구에게 심한 욕설을 한 뒤 죄책감을 느낀 학생이 집에 돌아와 손을 열 번 이상 반복해서 씻으며 자신의 나쁜 행동이 없었던 것으로 만들려 한다.\n\n사례 A와 사례 B에 해당하는 방어기제의 명칭을 각각 쓰시오.", "answer": "사례 A: 반동형성 (Reaction Formation)\n사례 B: 취소 (Undoing, 무효화)", "explanation": "[설명]\n• 반동형성(Reaction Formation): 무의식의 용납할 수 없는 충동이나 욕구(적개심, 미움)와 정반대되는 태도나 행동(과도한 애정, 친절)을 과장되게 표현하여 불안을 방어하는 기제이다.\n• 취소(Undoing): 이미 저지른 용납하기 힘든 생각이나 행동으로 인한 죄책감을 벗어나기 위해, 그 행동을 무효화하는 상징적·의식적 행동(강박적 손 씻기 등)을 반복하는 방어기제이다."}, {"id": 3, "cat": "상담이론과 실제", "sub": "개인심리학(아들러)", "title": "003. 아들러(Adler) 상담기법: 수프에 침 뱉기 & 마치 ~인 것처럼", "passage": "[문제 지문]\n내담자(중2): \"시험 기간만 되면 불안해서 밤새 스마트폰 게임만 해요. 엄마가 잔소리하면 보란 듯이 더 게임을 해서 엄마를 속상하게 만들어요.\"\n상담자 A: \"민수가 게임을 함으로써 엄마의 관심을 독차지하고 엄마를 이기려는 숨은 목적이 있었구나. 이제 민수의 그 숨은 전략을 우리 둘 다 알게 되었네.\"\n상담자 B: \"민수야, 이번 주 딱 3일 동안만 시험 불안을 스스로 잘 조절하는 '침착한 우등생'이 된 것처럼 연극하듯 행동해 보는 건 어떨까?\"\n\n상담자 A와 상담자 B가 사용한 개인심리학 상담기법의 명칭을 각각 쓰시오.", "answer": "상담자 A: 수프에 침 뱉기 (Spitting in the client's soup)\n상담자 B: 마치 ~인 것처럼 행동하기 (Acting 'as if')", "explanation": "[설명]\n• 수프에 침 뱉기: 내담자의 부적응적 증상이나 행동 이면에 숨겨진 의도(사적 논리, 이차적 이득)를 상담자가 명확히 드러내어, 내담자가 더 이상 그 행동을 예전처럼 즐겁게(효용성 있게) 수행하지 못하도록 매력을 떨어뜨리는 기법이다.\n• 마치 ~인 것처럼 행동하기: 내담자가 자신이 할 수 없다고 믿는 바람직한 역할을 다음 회기까지 연극하듯 시험 삼아 행동해 보게 함으로써 자기제한적 신념을 깨뜨리는 기법이다."}, {"id": 4, "cat": "상담이론과 실제", "sub": "개인심리학(아들러)", "title": "004. 아들러(Adler)의 생활양식 4유형 및 사회적 관심", "passage": "[문제 지문]\n아들러는 개인의 생활양식(Life Style)을 '사회적 관심(Social Interest)'과 '활동성 수준(Activity Level)'이라는 2가지 차원을 축으로 하여 4가지 유형으로 분류하였다.\n\n1. 사회적 관심은 낮고 활동성 수준은 높아 타인을 지배하고 군림하려는 유형의 명칭을 쓰시오.\n2. 사회적 관심과 활동성 수준이 모두 높으며, 공동체의 문제를 협력적으로 해결하려는 건강한 유형의 명칭을 쓰시오.", "answer": "1. 지배형 (Ruling type)\n2. 사회적 유용형 (Socially useful type)", "explanation": "[설명]\n• 아들러의 4대 생활양식:\n  ① 지배형(사회적 관심 낮음 / 활동성 높음): 독단적, 공격적, 타인 통제.\n  ② 기생형/획득형(사회적 관심 낮음 / 활동성 보통~낮음): 타인에게 의존하여 욕구 충족.\n  ③ 회피형(사회적 관심 낮음 / 활동성 매우 낮음): 실패가 두려워 모든 직면을 회피.\n  ④ 사회적 유용형(사회적 관심 높음 / 활동성 높음): 심리적으로 가장 건강한 적응적 인간상."}, {"id": 5, "cat": "상담이론과 실제", "sub": "개인심리학(아들러)", "title": "005. 아들러(Adler)의 초기기억(Early Recollections)과 사적 논리", "passage": "[문제 지문]\n상담자는 중학생 내담자의 생활양식을 평가하기 위해 어린 시절 가장 생생하게 떠오르는 구체적인 사건들을 탐색하였다. 내담자는 \"5살 때 길을 잃어 울고 있었는데 아무도 저를 도와주지 않았어요\"라고 회상하며, 현재도 \"나는 나약하고 세상은 위험하니 타인을 절대 믿어선 안 된다\"라는 신념을 가지고 있다.\n\n1. 상담자가 생활양식 평가를 위해 사용한 투사적 기법의 명칭을 쓰시오.\n2. 내담자가 자신, 타인, 세상에 대해 주관적으로 형성한 고유한 신념 체계를 무엇이라 하는지 쓰시오.", "answer": "1. 초기기억 탐색 (Early Recollections)\n2. 사적 논리 (Private Logic)", "explanation": "[설명]\n• 초기기억: 8~9세 이전에 있었던 구체적인 일화적 기억으로, 사실 여부와 관계없이 현재 내담자의 생활양식과 인생관을 보여주는 핵심적인 투사적 평가 도구이다.\n• 사적 논리(Private Logic): 개인이 어린 시절 경험을 바탕으로 구성한 자기 이미지, 세계관, 도덕적 신념으로, 공동체 감각에 기반한 '상식(Common Sense)'과 대비되는 주관적·자기중심적 신념이다."}, {"id": 6, "cat": "상담이론과 실제", "sub": "게슈탈트 상담", "title": "006. 게슈탈트(Gestalt) 접촉경계 혼란 6가지 유형", "passage": "[문제 지문]\n내담자(고2): \"부모님이 '너는 무조건 의대에 가야 가문이 산다'고 하신 말씀을 비판 없이 그대로 제 인생 목표로 삼았어요(㉠). 친구들이 부탁하면 미움받을까 봐 내 생각은 없애고 무조건 친구 의견에 다 맞춰줘요(㉡). 그러다 화가 나면 친구에게 말하지 못하고 밤마다 제 머리를 쥐어뜯고 자해해요(㉢).\"\n\n밑줄 친 ㉠, ㉡, ㉢에 해당하는 게슈탈트 접촉경계 혼란의 명칭을 각각 쓰시오.", "answer": "㉠ 내사 (Introjection)\n㉡ 융합 (Confluence)\n㉢ 반전 (Retroflection)", "explanation": "[설명]\n• 게슈탈트 접촉경계 혼란 6유형:\n  ① 내사: 타인의 가치관·규칙을 비판적으로 소화(동화)하지 않고 그대로 삼킴('~해야 한다').\n  ② 투사: 자신의 욕구나 감정을 타인의 탓으로 돌림.\n  ③ 융합: 나와 타인의 경계를 허물고 갈등이 두려워 무조건 동조함.\n  ④ 반전: 타인에게 향할 행동·분노를 자기 자신에게 돌림(자책, 자해, 신체화).\n  ⑤ 편향: 핵심 감정을 피하기 위해 농담, 말 돌리기, 시선 회피로 접촉을 약화시킴.\n  ⑥ 자기의식: 타인의 시선과 평가에 과도하게 집착하여 자연스러운 행동을 못 함."}, {"id": 7, "cat": "상담이론과 실제", "sub": "게슈탈트 상담", "title": "007. 게슈탈트(Gestalt) 신경증의 5개 층(Layers of Neurosis)", "passage": "[문제 지문]\n펄스(F. Perls)는 내담자가 피상적인 상태에서 벗어나 진정한 자기(Authentic Self)를 회복하기 위해 통과해야 하는 신경증의 5개 층을 제시하였다.\n\n[ 1단계: 피상층(거짓층) ➔ 2단계: ( ㉠ ) ➔ 3단계: 교착층(막다른 골목층) ➔ 4단계: ( ㉡ ) ➔ 5단계: 폭발층 ]\n\n빈칸 ㉠, ㉡에 들어갈 단계의 명칭을 순서대로 쓰시오.", "answer": "㉠ 공포층 (연기층 / 역할연기층, Phobic layer)\n㉡ 내파층 (내적 파열층, Implosive layer)", "explanation": "[설명]\n• 신경증의 5개 층(피-공-교-내-폭):\n  1. 피상층(Phony): 형식적이고 의례적인 인사말과 가식적 교류.\n  2. 공포층(Phobic): 자신의 약점이 드러날까 두려워 사회적 역할(착한 아이 등)을 연기함.\n  3. 교착층(Impasse): 기존의 역할은 버렸으나 새로운 대안이 없어 무력감과 공허감을 느끼는 막다른 지점.\n  4. 내파층(Implosive): 억압했던 감정과 죽음의 공포를 내면에서 직면하며 에너지가 안으로 응축되는 단계.\n  5. 폭발층(Explosive): 억압된 에너지가 밖으로 터져 나오며 진정한 감정(슬픔, 분노, 기쁨)을 회복하고 참자아를 만나는 단계."}, {"id": 8, "cat": "상담이론과 실제", "sub": "실존주의 상담", "title": "008. 프랭클(Frankl)의 의미치료(Logotherapy)와 역설적 의도", "passage": "[문제 지문]\n발표 시간만 되면 손이 떨리고 목소리가 갈라질까 봐 극심한 예기불안을 겪는 고등학생에게 상담자가 다음과 같이 개입하였다.\n상담자: \"오늘 발표할 때는 손을 안 떨려고 애쓰지 말고, 반 친구들에게 '내가 세상에서 손을 제일 심하게 떨 수 있다'는 걸 보여주기 위해 일부러 온몸을 사시나무 떨듯 최대한 심하게 떨어보세요!\"\n\n1. 상담자가 사용한 기법의 명칭을 쓰시오.\n2. 프랭클이 제시한 삶의 의미를 발견하는 3가지 가치 범주를 모두 쓰시오.", "answer": "1. 역설적 의도 (Paradoxical Intention)\n2. 창조적 가치, 경험적 가치, 태도적 가치", "explanation": "[설명]\n• 역설적 의도: 내담자가 두려워하는 증상(예기불안)을 오히려 일부러 과장해서 수행하도록 지시함으로써, '예기불안 ➔ 과잉의도 ➔ 증상 악화'의 악순환 고리를 끊어내는 기법이다.\n• 탈숙고(반성제거, Dereflection): 자신에게 쏠린 과도한 주의를 외부의 의미 있는 활동으로 전환시키는 기법.\n• 의미 발견의 3대 가치: ① 창조적 가치(일·성취), ② 경험적 가치(사랑·자연·예술 감상), ③ 태도적 가치(피할 수 없는 고통 앞에서 취하는 숭고한 태도)."}, {"id": 9, "cat": "상담이론과 실제", "sub": "실존주의 상담", "title": "009. 얄롬(Yalom)의 4대 실존적 궁극적 관심사", "passage": "[문제 지문]\n실존주의 치료자 어빈 얄롬(I. Yalom)은 인간이 실존적 조건으로 인해 필연적으로 직면하게 되는 4가지 궁극적 관심사(Ultimate Concerns)가 실존적 불안의 원천이라고 보았다. 이 4가지 궁극적 관심사를 모두 쓰시오.", "answer": "죽음(Death), 자유와 책임(Freedom), 실존적 고립(Isolation), 무의미성(Meaninglessness)", "explanation": "[설명]\n• 얄롬의 4대 궁극적 관심사:\n  ① 죽음: 삶의 유한성과 죽음의 불가피성 사이의 갈등.\n  ② 자유: 자신의 삶을 스스로 선택하고 그 결과에 대해 온전히 책임져야 하는 부담.\n  ③ 실존적 고립: 아무리 친밀해도 결국 세상에 혼자 태어나 혼자 떠난다는 근원적 분리감.\n  ④ 무의미성: 정해진 삶의 목적이나 의미가 없는 세상에서 스스로 삶의 의미를 창조해야 하는 과제."}, {"id": 10, "cat": "상담이론과 실제", "sub": "인간중심 상담", "title": "010. 로저스(Rogers)의 충분한 기능하는 인간과 상담자 3대 핵심 조건", "passage": "[문제 지문]\n부모로부터 '공부를 잘할 때만 사랑받을 가치가 있다'는 평가를 받고 자란 학생은 자신의 진정한 유기체적 경험과 자기개념(Self-concept) 사이에 괴리가 발생하여 심한 불안을 겪고 있다.\n\n1. 부모의 조건부 존중이 내면화되어 자신을 평가하는 기준이 된 개념을 무엇이라 하는지 쓰시오.\n2. 로저스가 제시한 내담자의 성장을 촉진하는 상담자의 3가지 태도적 조건을 모두 쓰시오.", "answer": "1. 가치의 조건 (Conditions of Worth)\n2. 일치성(진솔성, Congruence), 무조건적 긍정적 존중(Unconditional Positive Regard), 공감적 이해(Empathic Understanding)", "explanation": "[설명]\n• 가치의 조건: 중요한 타인(부모)으로부터 조건부 긍정적 존중을 받으며 형성된 자기평가 기준으로, 유기체적 경험과 자기개념 간의 '불일치(Incongruence)'를 유발하여 심리적 부적응을 초래한다.\n• 상담자가 3대 핵심 조건(일치성, 무조건적 긍정적 존중, 공감적 이해)을 제공하면 내담자는 방어를 내려놓고 경험에 개방적이며 실존적인 삶을 사는 '충분히 기능하는 사람(Fully Functioning Person)'으로 성장한다."}, {"id": 11, "cat": "상담이론과 실제", "sub": "인지행동 상담(REBT)", "title": "011. 엘리스(Ellis)의 REBT: 비합리적 신념의 4대 범주와 논박(Dispute)", "passage": "[문제 지문]\n내담자(고3): \"이번 모의고사에서 1등급을 받지 못했어요. 저는 반드시 1등급을 받았어야만 해요(㉠). 1등급을 못 받은 건 제 인생이 완전히 끝장난 끔찍한 재앙이에요(㉡). 저는 이런 좌절을 도저히 견딜 수가 없어요(㉢). 저는 완전히 실패자이자 쓰레기예요(㉣).\"\n\n밑줄 친 ㉠, ㉡, ㉢, ㉣에 해당하는 엘리스의 비합리적 신념 4가지 범주의 명칭을 각각 쓰시오.", "answer": "㉠ 당위적 요구 (절대적 강요, Demandingness)\n㉡ 파국화 (과장하기, Awfulizing / Catastrophizing)\n㉢ 좌절 인내력 부족 (인내심 부족, Low Frustration Tolerance: LFT)\n㉣ 자기비하 (전면적 인간 가치 평가절하, Self-downing)", "explanation": "[설명]\n• 엘리스는 모든 비합리적 신념의 뿌리에 '당위적 요구(반드시 ~해야만 한다)'가 있으며, 여기서 파국화, 좌절 인내력 부족, 자기/타인 비하가 파생된다고 보았다.\n• 논박(Dispute)의 유형: ① 논리적 논박(논리적 비약 지적), ② 경험적/실증적 논박(현실적 증거 확인), ③ 실용적/기능적 논박(그 신념이 삶에 어떤 도움이 되는지 확인), ④ 철학적 논박."}, {"id": 12, "cat": "상담이론과 실제", "sub": "인지치료(Beck)", "title": "012. 벡(Beck)의 인지적 오류(인지적 왜곡) 유형 감별", "passage": "[문제 지문]\n사례 1: 복도에서 친한 친구가 인사를 안 하고 지나가자, 아무런 근거 없이 \"내가 지난번에 실수해서 나를 미워하는 게 틀림없어\"라고 단정 지었다.\n사례 2: 체육 대회 계주에서 우리 반이 진 이유가 다른 요인도 많았음에도 불구하고 \"전부 내가 바통을 조금 늦게 넘겨서 우리 반 전체가 망한 거야\"라며 모든 책임을 자신에게 돌렸다.\n\n사례 1과 사례 2에 해당하는 벡(Beck)의 인지적 오류 명칭을 각각 쓰시오.", "answer": "사례 1: 임의적 추론 (Arbitrary Inference)\n사례 2: 개인화 (Personalization)", "explanation": "[설명]\n• 임의적 추론: 충분하고 객관적인 증거가 없거나 오히려 반대 증거가 있음에도 성급하게 부정적인 결론을 내리는 오류.\n• 개인화: 자신과 무관하거나 통제 밖의 외부 사건을 아무런 근거 없이 자기 탓으로 연결 짓는 오류.\n• 기타 필수 인지적 오류: 선택적 추상화(긍정적인 면은 무시하고 부정적인 일부 세부사항만 부각), 과잉일반화(한두 번의 사건으로 모든 상황에 법칙처럼 적용), 흑백논리(이분법적 사고), 정신적 여과, 극대화 및 극소화."}, {"id": 13, "cat": "상담이론과 실제", "sub": "인지치료(Beck)", "title": "013. 벡(Beck)의 소크라테스식 대화와 하향화살표 기법", "passage": "[문제 지문]\n상담자는 학생의 표면적인 자동적 사고(\"발표에서 실수하면 안 된다\") 밑바탕에 깔려 있는 근원적인 핵심신념(Core Belief)을 찾기 위해, \"만약 발표에서 실수를 한다면 그것이 본인에게 어떤 의미인가요?\"라는 질문을 연쇄적으로 던져 결국 \"나는 무능하고 사랑받을 가치가 없는 인간이다\"라는 핵심신념을 도출하였다.\n\n상담자가 자동적 사고에서 출발하여 중간신념과 핵심신념을 탐색하기 위해 사용한 기법의 명칭을 쓰시오.", "answer": "하향화살표 기법 (Downward Arrow Technique, 수직화살표 기법)", "explanation": "[설명]\n• 하향화살표 기법: 내담자의 자동적 사고가 사실이라고 가정했을 때(\"만약 그것이 사실이라면 어떤 일이 벌어지나요? / 그것이 당신에게 무슨 의미인가요?\")를 반복 질문하여 내담자의 가장 깊은 기저에 있는 역기능적 인지도식(핵심신념)을 수면 위로 끌어올리는 기법이다."}, {"id": 14, "cat": "상담이론과 실제", "sub": "현실치료(Glasser)", "title": "014. 글래서(Glasser)의 선택이론 5대 기본욕구와 WDEP 절차", "passage": "[문제 지문]\n현실치료를 창시한 글래서(W. Glasser)는 인간의 모든 행동이 내면의 5가지 기본 욕구를 충족하기 위한 전행동(Total Behavior: 활동하기, 생각하기, 느끼기, 생리작용)의 선택이라고 보았다.\n\n1. 글래서의 5대 기본 욕구를 모두 쓰시오.\n2. 현실치료 상담 절차인 WDEP에서 W, D, E, P가 각각 무엇을 의미하는지 쓰시오.", "answer": "1. 생존의 욕구, 사랑과 소속의 욕구, 힘(성취·인정)의 욕구, 자유의 욕구, 즐거움의 욕구\n2. W(Wants: 바람·욕구 탐색), D(Doing & Direction: 현재 하고 있는 전행동 탐색), E(Evaluation: 자기평가), P(Planning: 구체적 행동 계획 수립)", "explanation": "[설명]\n• 전행동(Total Behavior)의 자동차 비유: 앞바퀴 2개는 내담자가 직접 통제 가능한 '활동하기(Acting)'와 '생각하기(Thinking)'이며, 뒷바퀴 2개는 간접적으로 따라오는 '느끼기(Feeling)'와 '생리작용(Physiology)'이다.\n• WDEP의 핵심은 E(자기평가, Self-Evaluation) 단계로, 내담자 스스로 자신의 현재 행동이 원하는 것을 얻는 데 실제로 도움이 되는지 평가하게 하는 것이다."}, {"id": 15, "cat": "상담이론과 실제", "sub": "변증법적 행동치료(DBT)", "title": "015. 리네한(Linehan)의 변증법적 행동치료(DBT) 4대 기술훈련 모듈", "passage": "[문제 지문]\n반복적인 비자살적 자해와 경계성 성격 특성을 보이는 청소년을 돕기 위해 리네한(M. Linehan)의 변증법적 행동치료(DBT) 기술훈련을 실시한다. DBT의 4대 핵심 기술훈련 모듈의 명칭을 모두 쓰시오. (2026 청상 2급 16번 출제)", "answer": "1. 핵심 마음챙김 기술 (Core Mindfulness)\n2. 고통 감내 기술 (Distress Tolerance)\n3. 감정 조절 기술 (Emotion Regulation)\n4. 대인관계 효율성 기술 (Interpersonal Effectiveness)", "explanation": "[설명]\n• 수용(Acceptance) 지향 기술: ① 핵심 마음챙김 기술(이성적 마음과 감정적 마음을 통합한 '지혜로운 마음[Wise Mind]' 상태 도달), ② 고통 감내 기술(위기 상황에서 자해 등 충동적 행동을 하지 않고 견디는 TIPP 기술, 근본적 수용).\n• 변화(Change) 지향 기술: ③ 감정 조절 기술(정서적 취약성 낮추기, PLEASE 기술, 반대로 행동하기), ④ 대인관계 효율성 기술(자기존중과 관계 유지를 지키며 요청/거절하는 DEAR MAN, GIVE, FAST 기술)."}, {"id": 16, "cat": "상담이론과 실제", "sub": "수용전념치료(ACT)", "title": "016. 헤이즈(Hayes)의 수용전념치료(ACT) 심리적 유연성 6가지 핵심 과정", "passage": "[문제 지문]\n내담자: \"'나는 쓸모없는 패배자다'라는 생각이 떠오르면 그 생각이 100% 사실처럼 느껴져서 아무것도 못 하겠어요.\"\n상담자: \"그 생각을 사실로 믿고 싸우는 대신, 마음속에서 '나는 내가 쓸모없는 패배자라는 생각을 하고 있구나'라고 한 걸음 물러서서 그 생각을 구름 흘러가듯 바라볼까요?\"\n\n1. 내담자가 자신의 생각과 현실을 동일시하는 현상(㉠)과, 상담자가 생각과 자신 사이에 거리를 두도록 개입한 기법(㉡)의 명칭을 각각 쓰시오.", "answer": "㉠ 인지적 융합 (Cognitive Fusion)\n㉡ 인지적 탈융합 (Cognitive Defusion)", "explanation": "[설명]\n• ACT의 심리적 경직성 요인: 경험 회피, 인지적 융합, 과거/미래에의 집착, 개념화된 자기에의 집착, 가치의 불명확성, 무행동/충동성.\n• ACT의 심리적 유연성(Psychological Flexibility) 6대 핵심 과정(Hexaflex): ① 수용(Acceptance), ② 인지적 탈융합(Defusion), ③ 현재 순간과의 접촉(Being Present), ④ 맥락으로서의 자기(Self-as-Context), ⑤ 가치 명료화(Values), ⑥ 전념 행동(Committed Action)."}, {"id": 17, "cat": "상담이론과 실제", "sub": "해결중심 단기상담", "title": "017. 드세이저와 인수킴 버그의 해결중심 단기상담 질문 기법", "passage": "[문제 지문]\n상담자 A: \"오늘 밤 자는 동안 기적이 일어나서 네가 힘들어하던 교우관계 문제가 모두 해결되었다고 상상해 보자. 아침에 눈을 떴을 때 기적이 일어났다는 것을 무엇을 보고 제일 먼저 알 수 있을까?\"\n상담자 B: \"이번 주 내내 지각했다고 했는데, 유일하게 수요일 아침에는 제시간에 등교했구나! 수요일 아침에는 어떻게 정시에 올 수 있었니?\"\n\n상담자 A와 상담자 B가 사용한 해결중심 상담의 질문 기법 명칭을 각각 쓰시오.", "answer": "상담자 A: 기적 질문 (Miracle Question)\n상담자 B: 예외 질문 (Exception Question)", "explanation": "[설명]\n• 해결중심 상담 5대 질문 기법:\n  ① 기적 질문: 문제가 해결된 미래의 구체적 모습을 생생하게 그려보게 하여 상담 목표를 설정함.\n  ② 예외 질문: 문제가 일어나지 않았거나 덜 심각했던 성공 경험(예외 상황)을 찾아 내담자의 자원과 강점을 발굴함.\n  ③ 척도 질문(Scaling Question): 1~10점 척도로 현재 상태와 진전 정도를 수치화함.\n  ④ 대처 질문(Coping Question): 극심한 역경 속에서도 어떻게 버텨내고 있는지 생존 자원을 확인함.\n  ⑤ 관계성 질문: 중요한 타인의 시선에서 내담자의 변화를 조망하게 함."}, {"id": 18, "cat": "상담이론과 실제", "sub": "해결중심 단기상담", "title": "018. 해결중심 상담의 내담자-상담자 관계 유형 3가지", "passage": "[문제 지문]\n해결중심 단기치료에서는 내담자의 문제 인식과 변화 동기에 따라 상담 관계를 3가지 유형으로 구분한다.\n1. 타인(교사·부모)의 강요로 상담실에 와서 자신에게는 아무런 문제가 없다고 주장하는 유형은?\n2. 문제에 대해 불평은 많이 하지만 문제의 원인이 타인에게 있다며 자신이 변화할 책임은 수용하지 않는 유형은?\n3. 문제를 자신의 것으로 인식하고 문제 해결을 위해 적극적으로 행동할 준비가 된 유형은?", "answer": "1. 방문형 (Visitor)\n2. 불평형 (Complainant)\n3. 고객형 (Customer)", "explanation": "[설명]\n• 방문형: 과제 부여 금지! 칭찬과 존중, 온화한 수용만 제공.\n• 불평형: 행동 과제 대신 '관찰 과제'(언제 문제가 나아지는지 관찰해보기)만 부여.\n• 고객형: 구체적인 '행동 과제'(예외 행동 더 많이 해보기 등)를 직접 부여."}, {"id": 19, "cat": "상담이론과 실제", "sub": "이야기치료(Narrative)", "title": "019. 화이트와 엡스턴의 이야기치료: 문제의 외재화와 독특하고 새로운 결과", "passage": "[문제 지문]\n내담자(초6): \"저는 원래 화를 못 참는 폭력적인 아이예요.\"\n상담자: \"민준이가 폭력적인 아이가 아니라, '분노 괴물'이 민준이를 자꾸 조종하려고 찾아오는 거구나! 분노 괴물이 민준이를 속이려 할 때 민준이가 분노 괴물의 명령을 이겨냈던 적은 언제였니?\"\n\n1. 내담자와 문제를 분리하여 문제에 이름을 붙이는 기법의 명칭을 쓰시오.\n2. 문제 중심의 지배적 이야기(Dominant Story)에 배치되는 성공적 예외 사건을 이야기치료에서 무엇이라 부르는지 쓰시오.", "answer": "1. 문제의 외재화 (Externalization of the Problem)\n2. 독특한 결과 (Unique Outcomes, 반짝이는 사건 / Sparkling Events)", "explanation": "[설명]\n• 이야기치료의 핵심 철학: \"사람이 문제가 아니라, 문제가 문제다(The person is not the problem, the problem is the problem).\"\n• 외재화를 통해 내담자의 죄책감과 낙인을 줄이고, '독특한 결과(반짝이는 사건)'를 발굴하여 긍정적인 '대안적 이야기(Alternative Story)'를 재저작(Re-authoring)하도록 돕는다."}, {"id": 20, "cat": "상담이론과 실제", "sub": "교류분석(TA)", "title": "020. 번(Berne)의 교류분석: 기능적 자아상태 5가지와 이고그램", "passage": "[문제 지문]\n교류분석(TA)에서는 인간의 자아상태를 기능적 측면에 따라 어버이 자아 2가지, 어른 자아 1가지, 어린이 자아 2가지의 총 5가지로 구분한다. (2026 청상 2급 1번, 24번 출제)\n이 5가지 기능적 자아상태의 명칭을 약어(영문)와 함께 모두 쓰시오.", "answer": "1. 통제적(비판적) 어버이 자아 (CP: Critical Parent)\n2. 양육적 어버이 자아 (NP: Nurturing Parent)\n3. 어른 자아 (A: Adult)\n4. 자유로운 어린이 자아 (FC: Free Child)\n5. 순응하는 어린이 자아 (AC: Adapted Child)", "explanation": "[설명]\n• 구조분석의 병리: ① 배타(Exclusion: 특정 자아상태만 고집하고 나머지를 차단), ② 오염(Contamination: P나 C가 A의 영역을 침범하여 편견이나 망상을 합리적 사실로 착각함).\n• 교류 유형: 상보적 교류(의사소통 지속), 교차적 교류(의사소통 단절 및 갈등), 이면적 교류(사회적 수준과 심리적 수준이 다른 이중 메시지로 '심리적 게임'을 유발)."}, {"id": 21, "cat": "상담이론과 실제", "sub": "교류분석(TA)", "title": "021. 교류분석(TA)의 4가지 기본 생활자세와 카프만(Karpman) 드라마 삼각형", "passage": "[문제 지문]\n교류분석에서 개인이 유아기에 자신(I)과 타인(You)에 대해 형성하는 4가지 기본 생활자세 중 심리적으로 가장 건강한 자세를 쓰고, 카프만(Karpman)이 제시한 심리적 게임 속 드라마 삼각형(Drama Triangle)의 3가지 역할을 쓰시오.", "answer": "• 건강한 생활자세: 자기긍정 - 타인긍정 (I'm OK, You're OK)\n• 드라마 삼각형 3가지 역할: 박해자(Persecutor), 구원자(Rescuer), 희생자(Victim)", "explanation": "[설명]\n• 4가지 생활자세: ① 자기긍정-타인긍정(건강), ② 자기긍정-타인부정(독선적·투사적·박해자), ③ 자기부정-타인긍정(우울·열등감·회피), ④ 자기부정-타인부정(절망·자포자기).\n• 심리적 게임(Game)에서 내담자는 박해자, 구원자, 희생자 역할을 번갈아 바꾸며 부정적 정서(라켓 감정, Racket Feeling)를 수집하고 각본을 강화한다."}, {"id": 22, "cat": "상담이론과 실제", "sub": "분석심리학(Jung)", "title": "022. 융(Jung)의 분석심리학: 원형(Archetypes) 4가지와 개성화", "passage": "[문제 지문]\n융(C. G. Jung)은 집단무의식 속에 존재하는 보편적인 원형들을 제시하였다.\n1. 개인이 사회적 요구에 맞추어 외부 세계에 보여주는 공적인 얼굴(가면)은?\n2. 의식적 자아가 억압하고 외면한 내면의 어두운 동물적 본능과 열등한 측면은?\n3. 남성 무의식 속의 여성적 측면과 여성 무의식 속의 남성적 측면을 각각 무엇이라 하는가?\n4. 의식과 무의식이 통합되어 전체성(Self)을 실현해 가는 과정을 무엇이라 하는가?", "answer": "1. 페르소나 (Persona)\n2. 그림자 (Shadow)\n3. 아니마 (Anima) / 아니무스 (Animus)\n4. 개성화 (Individuation, 자기실현)", "explanation": "[설명]\n• 분석심리학의 핵심 상담기법(2026 청상 2급 1번 선지 출제): 꿈 분석(전망적·보상적 기능), 적극적 상상(Active Imagination: 무의식의 심상을 깨어 있는 상태에서 능동적으로 직면하고 대화하는 기법), 단어연상검사(콤플렉스 탐색)."}, {"id": 23, "cat": "상담이론과 실제", "sub": "상담윤리", "title": "023. 키치너(Kitchener)의 5대 윤리적 의사결정 원칙", "passage": "[문제 지문]\n키치너(K. Kitchener)가 제시한 상담자의 윤리적 의사결정의 5대 도덕적 원칙(자율성, 비유해성, 선행, 정의, 충실성) 중 다음 사례에서 상담자가 위반한 원칙을 쓰시오. (2026 청상 2급 7번 출제)\n\n[사례] 상담교사가 자신의 개인적인 사정으로 인해 학생과의 상담 약속을 깜빡 잊고 연락 없이 상담을 취소하여 학생과의 신뢰 관계를 무너뜨렸다.", "answer": "충실성 (Fidelity, 성실성)", "explanation": "[설명]\n• 키치너 5대 윤리원칙:\n  ① 자율성(Autonomy): 내담자의 자기결정권과 선택의 자유 존중(충분한 설명에 근거한 동의).\n  ② 비유해성(Nonmaleficence, 해악금지): 내담자에게 신체적·심리적 해를 끼치지 않을 의무(최우선 원칙).\n  ③ 선행(Beneficence): 내담자의 복지와 성장을 적극적으로 증진할 의무.\n  ④ 정의(Justice): 모든 내담자를 차별 없이 공정하고 평등하게 대우할 의무.\n  ⑤ 충실성(Fidelity): 내담자와의 약속을 이행하고 정직하며 신뢰를 지킬 의무."}, {"id": 24, "cat": "상담이론과 실제", "sub": "상담윤리", "title": "024. 비밀보장의 예외(한계) 조건과 타라소프(Tarasoff) 판례의 의무", "passage": "[문제 지문]\n전문상담교사는 원칙적으로 내담 학생의 비밀을 보장해야 하지만, 윤리강령 및 법률상 비밀보장을 제한(예외)해야 하는 경우가 있다.\n1. 내담자가 특정 제3자에게 심각한 신체적 위해를 가할 구체적인 계획이 있을 때, 상담자가 잠재적 피해자 및 경찰/보호자에게 알려야 하는 법적·윤리적 의무를 무엇이라 하는지 쓰시오.\n2. 비밀보장의 예외가 적용되는 대표적인 상황 3가지를 서술하시오.", "answer": "1. 경고의 의무 및 보호의 의무 (Duty to Warn and Protect)\n2. ① 내담자 자신(자살)이나 타인(타해)의 생명·안전에 심각한 위험이 있을 때, ② 아동학대·성폭력·가정폭력 등 법적 신고 의무 대상일 때, ③ 치명적인 전염성 질환이나 법원의 정당한 문서 제출 명령이 있을 때", "explanation": "[설명]\n• 타라소프(Tarasoff) 사건 이후 상담자에게는 내담자의 위험으로부터 제3자를 보호하기 위한 '경고 및 보호의 의무'가 확립되었다. 상담 시작 시 '구조화(Structuring)'와 '충분한 설명에 근거한 동의(Informed Consent)' 과정에서 비밀보장의 한계를 반드시 사전 고지해야 한다."}, {"id": 25, "cat": "상담이론과 실제", "sub": "여성주의 및 다문화 상담", "title": "025. 여성주의 상담(Feminist Therapy)의 핵심 원리와 기법", "passage": "[문제 지문]\n성폭력 피해 및 외모 비하로 인해 심각한 우울과 자책을 겪는 여학생에게 여성주의 상담자가 개입하고 있다. (2026 청상 2급 17번 연계)\n1. 여성주의 상담의 가장 핵심적인 슬로건이자 원리인 문장을 쓰시오.\n2. 내담자의 심리적 고통이 개인의 결함이 아니라 가부장적 사회 구조와 성역할 고정관념에서 비롯된 것임을 자각하도록 돕는 기법 2가지를 쓰시오.", "answer": "1. 개인적인 것이 곧 정치적인 것이다 (The personal is political)\n2. 성역할 분석 (Gender-role Analysis), 권력 분석 (Power Analysis) / 재명명(Reframing)", "explanation": "[설명]\n• 여성주의 상담의 특징: ① 상담자와 내담자의 평등한 관계(전문가적 권위 해체), ② 병리적 진단명 부여 지양(증상을 억압적 환경에서 살아남기 위한 '생존 전략'으로 재명명), ③ 성역할 분석 및 권력 분석을 통한 임파워먼트(Empowerment) 및 사회 변혁 추구."}, {"id": 26, "cat": "상담이론과 실제", "sub": "다문화 및 이주배경 상담", "title": "026. 베리(Berry)의 문화적응(Acculturation) 4가지 유형", "passage": "[문제 지문]\n이주배경(다문화·중도입국·탈북) 청소년이 주류 사회(한국 문화)와의 관계 유지 및 모국 문화 정체성 유지라는 두 가지 차원에 따라 보이는 베리(J. Berry)의 문화적응 4가지 전략 유형을 모두 쓰시오. (2026 청상 2급 15번 연계)", "answer": "1. 통합 (Integration): 모국 문화 정체성과 한국 주류 문화를 모두 수용·유지함\n2. 동화 (Assimilation): 모국 문화를 버리고 한국 주류 문화만 수용함\n3. 분리 (Separation): 모국 문화만 고수하고 한국 주류 문화와의 접촉을 거부함\n4. 주변화 (Marginalization): 모국 문화와 한국 주류 문화 양쪽 모두에서 소외·거부됨", "explanation": "[설명]\n• 연구 결과 심리적 적응 수준과 자아존중감이 가장 높은 유형은 '통합(Integration)'이며, 문화적응 스트레스와 우울·비행 위험이 가장 높은 유형은 '주변화(Marginalization)'이다."}, {"id": 27, "cat": "상담이론과 실제", "sub": "동기강화상담(MI)", "title": "027. 밀러와 롤닉의 동기강화상담(MI): 4대 원리(RULE)와 핵심 기법(OARS)", "passage": "[문제 지문]\n스마트폰 과의존으로 의뢰되었으나 변화 동기가 전혀 없고 양가감정(Ambivalence)을 보이는 청소년에게 밀러와 롤닉(Miller & Rollnick)의 동기강화상담(MI)을 실시한다.\n1. 내담자의 입에서 스스로 변화해야 할 이유와 소망, 다짐이 나오도록 유도하는 발화를 무엇이라 하는가?\n2. 동기강화상담의 4가지 핵심 소통 기술(OARS)을 쓰시오.", "answer": "1. 변화 대화 (Change Talk)\n2. O(Open questions: 열린 질문), A(Affirming: 인정하기), R(Reflecting: 반영하기), S(Summarizing: 요약하기)", "explanation": "[설명]\n• 동기강화상담의 전통적 4원리(DEARS): 공감 표현하기(Express empathy), 불일치 유발하기(Develop discrepancy), 저항과 함께 구르기(Roll with resistance), 자기효능감 지지하기(Support self-efficacy).\n• 변화 대화(Change Talk) 약어 DARN-CAT: 소망(Desire), 능력(Ability), 이유(Reason), 필요(Need) ➔ 다짐(Commitment), 활성화(Activation), 실행(Taking steps)."}, {"id": 28, "cat": "상담이론과 실제", "sub": "상담 과정과 기법", "title": "028. 접수면접(Intake Interview)과 구조화(Structuring)", "passage": "[문제 지문]\n상담 첫 회기에서 상담자가 내담 학생에게 상담의 진행 방식, 시간과 빈도, 상담자와 내담자의 역할, 비밀보장의 원칙과 한계 등을 명확히 안내하여 상담에 대한 비현실적 기대와 불안을 낮추는 작업의 명칭을 쓰시오. (2026 청상 2급 13번 연계)", "answer": "구조화 (Structuring, 상담의 구조화)", "explanation": "[설명]\n• 구조화의 목적: 상담 과정을 예측 가능하게 만들어 내담자의 초기 불안을 감소시키고, 내담자의 주도적 참여를 촉진하며, 비밀보장의 예외(자살·타해·학대 등)를 사전 고지하여 윤리적 문제를 예방한다."}, {"id": 29, "cat": "상담이론과 실제", "sub": "상담 과정과 기법", "title": "029. 즉시성(Immediacy)과 직면(Confrontation)", "passage": "[문제 지문]\n내담자: (시계를 자꾸 쳐다보며 단답형으로 대답한다) \"네... 별로 할 말 없어요.\"\n상담자: \"지금 지훈이가 시계를 자주 보면서 제 질문에 짧게만 대답하고 있는데, 오늘 저와 여기 앉아 이야기하는 것이 불편하거나 답답한 마음이 드는지 궁금해요.\"\n\n상담자가 과거의 사건이 아니라 '지금-여기(Here and Now)' 상담 관계 안에서 상담자와 내담자 사이에 일어나고 있는 상호작용과 감정을 즉시 다루는 기법의 명칭을 쓰시오.", "answer": "즉시성 (Immediacy, 관계의 즉시성)", "explanation": "[설명]\n• 즉시성(Immediacy): 상담실 안의 '지금-여기'에서 내담자와 상담자 사이에 흐르는 미묘한 긴장, 저항, 대인관계 패턴을 그 자리에서 즉시 언어화하여 다루는 고급 기법이다.\n• 직면(Confrontation): 내담자의 말과 행동의 불일치, 방어, 모순을 상담자가 따뜻하면서도 명확하게 지적하여 자각을 돕는 기법이다."}, {"id": 30, "cat": "상담이론과 실제", "sub": "대상관계 이론", "title": "030. 위니콧(Winnicott)의 대상관계 이론: 충분히 좋은 어머니와 중간대상", "passage": "[문제 지문]\n도널드 위니콧(D. Winnicott)의 대상관계 이론에서 다음 괄호에 들어갈 개념을 쓰시오.\n1. 유아의 전능감을 처음에는 100% 충족시켜 주다가, 유아의 성장에 맞추어 점진적이고 감당할 수 있는 최적의 좌절을 경험하게 해주는 양육자: ( ㉠ )\n2. 유아가 어머니와 분리되는 과정에서 불안을 달래기 위해 애착을 갖는 애착 인형이나 담요 같은 대상: ( ㉡ )", "answer": "㉠ 충분히 좋은 어머니 (Good-enough Mother)\n㉡ 중간대상 (이행대상, Transitional Object)", "explanation": "[설명]\n• 충분히 좋은 어머니가 제공하는 '안아주기(Holding) 환경' 속에서 유아는 '참자기(True Self)'를 발달시킨다. 반대로 양육자의 요구에 과도하게 순응해야 할 때는 '거짓자기(False Self)'가 형성된다."}, {"id": 31, "cat": "상담이론과 실제", "sub": "대상관계 이론", "title": "031. 말러(Mahler)의 분리-개별화 과정 4하위 단계", "passage": "[문제 지문]\n마가렛 말러(M. Mahler)는 유아가 어머니와의 공생기(Symbiosis)를 벗어나 독립된 개체로 성장하는 '분리-개별화(Separation-Individuation)' 과정을 4가지 하위 단계로 제시하였다. 특히 생후 16~24개월경 유아가 독립 욕구와 어머니에 대한 재융합 욕구 사이에서 심한 양가감정과 분리불안을 겪으며 경계성 성격장애의 고착점이 되는 제3단계를 포함하여 4단계를 순서대로 쓰시오.", "answer": "1단계: 분화기 (Differentiation)\n2단계: 연습기 (Practicing)\n3단계: 재접근기 (화해접근기, Rapprochement) ★\n4단계: 개체성 공고화 및 정서적 대상항상성 확립기 (Object Constancy)", "explanation": "[설명]\n• 재접근기(16~24개월): 유아는 자신이 전능하지 않음을 깨닫고 어머니에게 다시 매달리면서도 동시에 자율성을 원하여 극심한 양가감정을 겪는다. 이 시기 어머니가 유아의 독립을 거부하거나 밀어내면 '분열(Splitting)' 방어기제가 고착되어 경계성 성격장애의 원인이 된다."}, {"id": 32, "cat": "상담이론과 실제", "sub": "자기심리학(Kohut)", "title": "032. 코헛(Kohut)의 자기심리학: 자기대상(Self-object)과 변형적 내재화", "passage": "[문제 지문]\n하인즈 코헛(H. Kohut)은 유아의 건강한 응집적 자기(Cohesive Self)가 발달하기 위해 부모(자기대상)가 충족시켜 주어야 할 두 가지 핵심 욕구와, 상담자의 공감적 이해 및 '최적의 좌절(Optimal Frustration)'을 통해 내담자가 자기대상의 기능을 자신의 심리 구조로 흡수하는 치료 원리를 제시하였다.\n\n1. 유아의 과대자기를 인정받고 칭찬받고 싶어 하는 욕구에 부응하는 전이는?\n2. 완벽해 보이는 부모의 이미지에 융합되어 안도감을 느끼고자 하는 전이는?\n3. 최적의 좌절을 통해 자기대상의 기능을 내면의 구조로 삼는 과정의 명칭은?", "answer": "1. 거울 전이 (반영 전이, Mirroring Transference)\n2. 이상화 전이 (Idealizing Transference)\n3. 변형적 내재화 (Transmuting Internalization)", "explanation": "[설명]\n• 코헛은 자기애성 성격장애의 원인을 유아기 자기대상(부모)의 공감 실패로 인한 발달 정지로 보았으며, 상담자가 거울 전이와 이상화 전이를 공감적으로 수용해주고 최적의 좌절을 거치면서 '변형적 내재화'를 통해 건강한 응집적 자기를 형성하도록 돕는다."}, {"id": 33, "cat": "상담이론과 실제", "sub": "행동주의 상담", "title": "033. 울피(Wolpe)의 체계적 둔감법(Systematic Desensitization) 원리와 3단계", "passage": "[문제 지문]\n시험 불안이 극심한 학생에게 불안과 양립할 수 없는 근육 이완 반응을 학습시킨 뒤, 가장 약한 시험 자극부터 가장 강한 시험 자극까지 상상하게 하여 불안을 소거하는 기법을 적용하고자 한다.\n\n1. 이 기법의 기반이 되는 학습 원리(상호제지)를 쓰시오.\n2. 체계적 둔감법의 실시 3단계를 순서대로 쓰시오.", "answer": "1. 상호제지 원리 (Reciprocal Inhibition, 역조건형성)\n2. 1단계: 근육 이완 훈련 ➔ 2단계: 불안 위계표 작성 ➔ 3단계: 둔감화 (이완 상태에서 낮은 불안 자극부터 순차적 제시)", "explanation": "[설명]\n• 상호제지(Reciprocal Inhibition): 불안 반응과 근육 이완 반응은 자율신경계에서 동시에 양립할 수 없으므로, 이완 반응이 우세하도록 만들어 조건화된 불안 반응을 억제·소거하는 원리이다."}, {"id": 34, "cat": "상담이론과 실제", "sub": "행동주의 상담", "title": "034. 스키너(Skinner)의 조작적 조건형성: 정적강화, 부적강화, 정적처벌, 부적처벌", "passage": "[문제 지문]\n1. 학생이 숙제를 성실히 해왔을 때 화장실 청소 당번(혐오 자극)을 면제해 주어 숙제하는 행동을 증가시키는 절차는?\n2. 동생을 때린 아이에게 하루 동안 스마트폰을 압수(선호 자극 제거)하여 때리는 행동을 감소시키는 절차는?", "answer": "1. 부적 강화 (Negative Reinforcement)\n2. 부적 처벌 (Negative Punishment, 타임아웃/반응대가)", "explanation": "[설명]\n• 행동 증가(강화): 정적 강화(선호 자극 제공), 부적 강화(혐오 자극 제거).\n• 행동 감소(처벌): 정적 처벌(혐오 자극 제공), 부적 처벌(선호 자극 박탈 - 토큰 몰수[반응대가], 강화 환경에서 격리[타임아웃])."}, {"id": 35, "cat": "상담이론과 실제", "sub": "초기 아동·청소년 발달", "title": "035. 마샤(Marcia)의 자아정체감 지위 4유형", "passage": "[문제 지문]\n제임스 마샤(J. Marcia)는 에릭슨의 자아정체감 이론을 확장하여 '위기(탐색, Exploration)'와 '전념(수행/결정, Commitment)'의 유무에 따라 청소년의 정체감 지위를 4가지로 분류하였다. (2026 청상 2급 3번 연계)\n\n진로에 대해 스스로 진지하게 고민하거나 대안을 탐색한 경험(위기)은 없지만, 부모님이 정해주신 가업을 아무런 의심 없이 그대로 따르기로 결정(전념)한 정체감 지위의 명칭을 쓰시오.", "answer": "정체감 유실 (정체감 조기완료, Identity Foreclosure)", "explanation": "[설명]\n• 마샤의 4가지 정체감 지위:\n  ① 정체감 성취(위기 O / 전념 O): 자율적 탐색 후 스스로의 가치관과 진로에 전념.\n  ② 정체감 유예(위기 O / 전념 X): 현재 치열하게 탐색 중이나 아직 최종 결정을 내리지 못한 상태(불안이 높으나 성취로 갈 가능성이 가장 높음).\n  ③ 정체감 유실(위기 X / 전념 O): 탐색 없이 부모·권위자의 가치를 그대로 수용(권위주의 성향 높음).\n  ④ 정체감 혼미(위기 X / 전념 X): 탐색도 하지 않고 관심이나 결정도 없는 무기력한 상태."}, {"id": 36, "cat": "상담이론과 실제", "sub": "청소년 인지 발달", "title": "036. 엘킨드(Elkind)의 청소년기 자아중심성: 상상적 관중과 개인적 우화", "passage": "[문제 지문]\n중학교 2학년 수진이는 앞머리가 조금 삐뚤어지자 \"학교 애들이 전부 내 앞머리만 쳐다보고 비웃을 거야\"라며 등교를 거부한다(㉠). 한편 같은 반 민호는 오토바이를 헬멧 없이 위험하게 몰면서 \"다른 애들은 사고가 나도 나는 특별한 존재라 절대 죽거나 다치지 않아\"라고 믿는다(㉡).\n\n데이비드 엘킨드(D. Elkind)가 제시한 청소년기 자아중심성의 두 가지 현상 ㉠, ㉡의 명칭을 쓰시오.", "answer": "㉠ 상상적 관중 (Imaginary Audience)\n㉡ 개인적 우화 (Personal Fable)", "explanation": "[설명]\n• 형식적 조작기에 진입한 청소년이 자신과 타인의 생각을 개념화할 수 있게 되었으나, 자신의 관심사와 타인의 관심사를 객관적으로 분화하지 못해 나타나는 인지적 왜곡 현상이다.\n• 상상적 관중은 대인불안과 외모 집착을 유발하고, 개인적 우화는 무모한 비행·약물·자해 행동의 원인이 된다."}, {"id": 37, "cat": "상담이론과 실제", "sub": "위기상담 및 자해개입", "title": "037. 비자살적 자해(NSSI) 청소년의 심리적 기능과 대안 행동 교육", "passage": "[문제 지문]\n최근 학교 현장에서 죽으려는 의도 없이 자신의 신체에 고의적으로 상처를 입히는 '비자살적 자해(Non-Suicidal Self-Injury: NSSI)' 학생이 급증하고 있다. (2026 청상 2급 22번 출제)\n\n1. 청소년이 비자살적 자해를 반복하는 가장 대표적인 심리내적 기능(목적) 1가지와 대인관계적 기능 1가지를 쓰시오.\n2. 자해 충동이 급격히 치솟을 때 신체 감각을 강하게 자극하여 자해 행동을 대체하는 DBT 고통감내 기법(예: 얼음 쥐기, 찬물 세수)의 원리를 설명하시오.", "answer": "1. 심리내적 기능: 참기 힘든 부정적 정서(불안, 분노, 공허감)의 즉각적 완화 및 감정 조절(부적 강화)\n   대인관계적 기능: 고통의 표현 및 타인의 관심·도움 유도(정적 강화)\n2. 신체 생리적 각성 수준을 안전하고 강렬한 감각 자극(온도 변화 등)으로 즉각 전환하여 부교감신경계를 활성화하고 자해 충동을 진정시킨다.", "explanation": "[설명]\n• 비자살적 자해는 자살 의도가 없더라도 반복될수록 고통 감내력과 죽음에 대한 두려움을 둔감시켜 실제 자살 시도의 가장 강력한 위험 요인이 되므로 즉각적인 정서조절·고통감내 개입이 필수적이다."}, {"id": 38, "cat": "상담이론과 실제", "sub": "위기상담", "title": "038. 자살 위험성 평가(Suicide Risk Assessment)의 핵심 3요소", "passage": "[문제 지문]\n자살 사고를 보고하는 학생의 응급 위기 수준(낮음/중간/높음)을 판별할 때 전문상담교사가 반드시 확인해야 할 자살 위험성 평가 핵심 3요소(생각-계획-수단/과거력)를 서술하시오.", "answer": "1. 자살 생각(사고)의 빈도·강도 및 죽고 싶은 의도의 심각성\n2. 자살 계획의 구체성 (구체적 시간, 장소, 방법의 유무)\n3. 자살 수단의 치명성·접근 가능성 및 과거 자살 시도력 유무", "explanation": "[설명]\n• 특히 '구체적인 계획 + 치명적 수단 확보 + 과거 자살 시도력'이 결합된 경우 '고위험군(응급)'으로 분류하여 학생을 절대 혼자 두지 말고 즉시 보호자 인계 및 정신건강의학과/위기개입기관 연계를 실시해야 한다."}, {"id": 39, "cat": "상담이론과 실제", "sub": "미술·놀이치료", "title": "039. 액슬라인(Axline)의 아동중심 놀이치료 8대 기본 원리", "passage": "[문제 지문]\n버지니아 액슬라인(V. Axline)이 제시한 아동중심 놀이치료에서, 아동이 놀이실 장난감으로 치료자의 안경을 부수려 하거나 창문을 깨려 할 때 치료자가 적용하는 '제한 설정(Limit Setting)'의 ACT 모형 3단계를 쓰시오.", "answer": "A(Acknowledge: 아동의 감정과 욕구 인정하기) ➔ C(Communicate the limit: 제한 규칙을 명확히 전달하기) ➔ T(Target acceptable alternatives: 수용 가능한 대안 행동 제시하기)", "explanation": "[설명]\n• 예시: \"민수가 지금 화가 많이 나서 이 블록을 던지고 싶구나(A: 감정 인정). 하지만 치료실 유리에 던지는 건 안 돼(C: 제한 전달). 대신 저기 있는 부드러운 샌드백을 치거나 찰흙을 던질 수는 있어(T: 대안 제시).\"\n• 감정은 100% 수용하되 파괴적 행동만 제한함으로써 아동의 자기통제력과 안전감을 길러준다."}, {"id": 40, "cat": "상담이론과 실제", "sub": "사이버 및 AI 상담윤리", "title": "040. 사이버 상담의 특성 및 생성형 AI 활용 상담 연구윤리", "passage": "[문제 지문]\n2026년 제25회 청소년상담사 2급 17번(사이버상담) 및 50번(AI 연구윤리)에서 동시에 출제된 최신 경향 문항이다.\n1. 대면 상담과 비교할 때 청소년 사이버(채팅/게시판) 상담이 갖는 장점 2가지와 한계점 2가지를 쓰시오.\n2. 상담자가 내담자의 상담 축어록을 외부 상용 생성형 AI(ChatGPT 등)에 그대로 입력하여 사례개념화를 요청했을 때 위반되는 가장 치명적인 상담 윤리 원칙을 쓰시오.", "answer": "1. 장점: 익명성 보장으로 높은 자기개방 촉진, 시공간적 접근성 우수 및 내담자의 통제감 증가\n   한계점: 비언어적 단서(표정, 목소리) 파악 불가로 인한 오해 가능성, 자살 등 위기 상황 발생 시 즉각적인 물리적 개입의 어려움\n2. 비밀보장의 원칙 및 개인정보(민감정보) 보호 의무 위반", "explanation": "[설명]\n• 외부 AI 서버에 내담자의 축어록이나 신상정보를 동의 없이 업로드하는 행위는 내담자의 개인정보 자기결정권 및 비밀보장 의무를 심각하게 침해하므로, 반드시 비식별화(익명화) 처리 및 내담자의 사전 동의가 전제되어야 한다."}, {"id": 41, "cat": "상담이론과 실제", "sub": "법령 및 청소년안전망", "title": "041. 청소년복지 지원법상 위기청소년 특별지원 및 청소년안전망", "passage": "[문제 지문]\n지역사회 내 위기청소년을 조기에 발견하고 상담·보호·의료·자립 등 맞춤형 서비스를 통합 제공하기 위해 지방자치단체와 청소년상담복지센터를 중심으로 구축된 다기관 협력 네트워크의 법적 명칭을 쓰시오. (2026 청상 2급 23번 출제)", "answer": "청소년안전망 (Youth Safety Net, 구 CYS-Net)", "explanation": "[설명]\n• 청소년복지 지원법 제9조에 근거한 '청소년안전망'은 위기청소년에게 상담·보호·교육·자립 등 맞춤형 서비스를 제공하기 위한 지역사회 통합지원체계이다. 필수연계기관에는 교육지원청, 각급 학교, 경찰서, 보건소, 고용노동관서 등이 포함된다."}, {"id": 42, "cat": "상담이론과 실제", "sub": "행동주의 상담", "title": "042. 반두라(Bandura)의 사회학습이론: 자기효능감(Self-Efficacy)의 4대 정보원", "passage": "[문제 지문]\n반두라(A. Bandura)는 개인이 특정 과제를 성공적으로 수행할 수 있다는 신념인 '자기효능감'이 행동 변화의 핵심 결정요인이라고 보았다. 자기효능감을 형성하고 증진시키는 4가지 주요 원천(정보원)을 영향력이 가장 큰 순서대로 쓰시오.", "answer": "1. 성공적인 수행 경험 (성취 경험, Performance Accomplishments) ★가장 강력\n2. 대리 경험 (관찰 학습, Vicarious Experience)\n3. 언어적 설득 (Verbal Persuasion)\n4. 정서적·생리적 각성 상태 (Emotional/Physiological Arousal)", "explanation": "[설명]\n• 자기효능감을 가장 강력하게 높이는 요인은 내담자 자신이 작은 목표라도 직접 성공해 보는 '성공적 수행 경험'이며, 자신과 유사한 또래 모델이 성공하는 것을 보는 '대리 경험'이 그다음으로 효과적이다."}, {"id": 43, "cat": "상담이론과 실제", "sub": "상담 과정과 기법", "title": "043. 보딘(Bordin)의 작업동맹(Working Alliance) 3대 구성요소", "passage": "[문제 지문]\n에드워드 보딘(E. Bordin)은 상담의 이론적 학파를 초월하여 상담 성과를 예측하는 가장 강력한 공통 요인으로 '작업동맹(치료적 동맹, Working Alliance)'을 제시하였다. 작업동맹을 구성하는 3가지 핵심 요소를 쓰시오.", "answer": "1. 상담 목표에 대한 합의 (Agreement on Goals)\n2. 상담 과제(방법)에 대한 합의 (Agreement on Tasks)\n3. 상담자와 내담자 간의 정서적 유대 (Emotional Bond)", "explanation": "[설명]\n• 보딘의 작업동맹 3요소(목표 합의, 과제 합의, 정서적 유대) 중 어느 하나라도 균열이 생기면 상담 조기 종결이나 저항이 발생하므로, 상담자는 지속적으로 작업동맹을 점검하고 균열을 복구해야 한다."}, {"id": 44, "cat": "상담이론과 실제", "sub": "단기역동치료", "title": "044. 말란(Malan)의 갈등의 삼각형과 인물의 삼각형", "passage": "[문제 지문]\n단기역동정신치료(Brief Psychodynamic Therapy)에서 내담자의 핵심 역동을 파악하기 위해 사용하는 두 가지 삼각형 모형이 있다.\n1. 갈등의 삼각형(Triangle of Conflict)을 이루는 3가지 요소는?\n2. 인물의 삼각형(Triangle of Person)을 이루는 3가지 대상은?", "answer": "1. 갈등의 삼각형: 방어(Defense), 불안(Anxiety), 숨겨진 감정/충동(Feeling/Impulse)\n2. 인물의 삼각형: 과거의 중요한 인물(부모), 현재의 타인(친구/배우자), 상담자(전이 대상)", "explanation": "[설명]\n• 단기역동상담자는 내담자가 과거 부모와의 관계에서 형성한 '방어-불안-감정'의 패턴이 현재의 대인관계와 상담자와의 전이 관계에서 어떻게 동일하게 반복되는지 해석하여 통찰을 돕는다."}, {"id": 45, "cat": "상담이론과 실제", "sub": "상담 수퍼비전", "title": "045. 스톨텐버그(Stoltenberg)의 통합적 발달모형(IDM)과 평행과정(Parallel Process)", "passage": "[문제 지문]\n수퍼비전 장면에서 초심 상담자가 내담자에게 느꼈던 무력감과 의존성을 수퍼바이저와의 관계에서 그대로 똑같이 재현하고, 수퍼바이저가 초심 상담자를 대하는 태도가 다시 다음 상담 회기에서 내담자에게 그대로 전달되는 현상의 명칭을 쓰시오.", "answer": "평행과정 (Parallel Process, 동형과정)", "explanation": "[설명]\n• 평행과정(Parallel Process): 상담 관계(상담자-내담자)의 역동이 수퍼비전 관계(수퍼바이저-수퍼바이지)에서 무의식적으로 거울처럼 그대로 복제·재현되는 현상이다. 수퍼바이저는 이를 포착하여 초심 상담자가 내담자의 역동을 이해하도록 돕는 교육적 도구로 활용한다."}, {"id": 46, "cat": "이상심리", "sub": "불안장애", "title": "046. 공황장애의 인지행동치료", "passage": "내담자는 지하철을 탈 때 심박수가 증가하면 곧 심장마비로 죽을 것이라는 공포를 느낀다. 이때 인지적 오류의 명칭을 쓰시오.", "answer": "파국화 (Catastrophizing) / 파국적 오해석", "explanation": "신체적 감각을 생명에 위협적인 것으로 잘못 해석하는 파국적 오해석이 핵심이다."}, {"id": 47, "cat": "이상심리", "sub": "우울장애", "title": "047. 벡(Beck)의 우울증 인지삼제", "passage": "우울증을 겪는 학생이 지니는 3가지 부정적 인지 도식(인지삼제)을 쓰시오.", "answer": "자신에 대한 부정적 관점, 미래에 대한 부정적 관점, 세상(환경)에 대한 부정적 관점", "explanation": "벡의 인지삼제는 우울증 환자의 자동적 사고의 바탕이 된다."}, {"id": 48, "cat": "이상심리", "sub": "성격장애", "title": "048. 경계성 성격장애의 방어기제", "passage": "내담자는 상담자를 완벽한 구원자로 찬양하다가, 작은 거절에도 가장 악독한 사람으로 비난한다. 이 방어기제는?", "answer": "분리 (Splitting)", "explanation": "자신과 타인의 좋은 면과 나쁜 면을 통합하지 못하고 극단적으로 양극화하는 현상이다."}, {"id": 49, "cat": "이상심리", "sub": "강박장애", "title": "049. 강박장애의 치료기법", "passage": "강박장애 환자에게 두려워하는 자극(먼지)에 노출시키고, 강박행동(손씻기)을 하지 못하게 막는 행동치료 기법은?", "answer": "노출 및 반응방지 기법 (ERP: Exposure and Response Prevention)", "explanation": "불안이 자연스럽게 감소할 때까지 강박행동을 억제하여 습관화를 유도한다."}, {"id": 50, "cat": "이상심리", "sub": "외상후스트레스장애", "title": "050. PTSD의 핵심 증상", "passage": "PTSD의 4가지 주요 증상 군 중, 외상적 사건이 자꾸 떠오르거나 악몽을 꾸는 증상은?", "answer": "침투 증상 (Intrusion symptoms)", "explanation": "플래시백, 악몽 등 원치 않는 고통스러운 기억이 침투하는 현상이다."}, {"id": 51, "cat": "이상심리", "sub": "조현병", "title": "051. 조현병의 양성증상과 음성증상", "passage": "조현병 환자에게서 나타나는 환각, 망상은 어떤 증상에 속하며, 무논리증, 무욕증은 어떤 증상에 속하는가?", "answer": "환각/망상: 양성증상 (Positive symptoms), 무논리증/무욕증: 음성증상 (Negative symptoms)", "explanation": "양성증상은 일반인에게 없는 것이 추가된 것이고, 음성증상은 일반인에게 있는 정상적 기능이 결핍된 것이다."}, {"id": 52, "cat": "이상심리", "sub": "식이장애", "title": "052. 신경성 식욕부진증의 특성", "passage": "체중 증가에 대한 극심한 두려움과 자신의 체형에 대한 왜곡된 지각을 특징으로 하는 식이장애의 명칭은?", "answer": "신경성 식욕부진증 (Anorexia Nervosa)", "explanation": "거식증이라고도 하며, 저체중임에도 비만이라는 왜곡된 신체상을 가진다."}, {"id": 53, "cat": "이상심리", "sub": "수면장애", "title": "053. 기면증의 주요 증상", "passage": "낮 시간에 참을 수 없는 수면 발작이 일어나며, 강한 감정을 느낄 때 갑자기 근육의 힘이 빠지는 증상의 명칭은?", "answer": "기면증 (Narcolepsy), 근력 소실(탈력발작, Cataplexy)", "explanation": "기면증 환자는 렘수면으로 직행하며 탈력발작을 흔히 동반한다."}, {"id": 54, "cat": "이상심리", "sub": "아동기 장애", "title": "054. 자폐스펙트럼장애 핵심 증상", "passage": "자폐스펙트럼장애 진단을 위한 2가지 핵심 증상 영역을 쓰시오.", "answer": "1. 사회적 의사소통 및 상호작용의 지속적인 결함\n2. 제한적이고 반복적인 행동, 관심사 및 활동", "explanation": "DSM-5에서는 과거의 여러 진단을 자폐스펙트럼장애(ASD)로 통합하고 2대 핵심 영역으로 재편하였다."}, {"id": 55, "cat": "이상심리", "sub": "아동기 장애", "title": "055. ADHD의 하위 유형", "passage": "주의력결핍 과잉행동장애(ADHD)의 주요 3가지 하위 유형(발현 형태)을 쓰시오.", "answer": "주의력결핍 우세형, 과잉행동/충동 우세형, 복합형", "explanation": "증상의 발현 양상에 따라 세 가지로 구분하며, 성인이 되면서 과잉행동은 줄고 부주의가 남는 경향이 있다."}, {"id": 56, "cat": "심리검사", "sub": "MMPI-2", "title": "056. MMPI-2 타당도 척도: F척도", "passage": "MMPI-2에서 수검자가 문항을 비정상적인 방향으로 응답하는 빈도를 측정하여 '무작위 반응'이나 '증상 과장(꾀병)'을 탐지하는 타당도 척도의 이름은?", "answer": "F 척도 (비전형 척도, Infrequency)", "explanation": "정상인들이 거의 응답하지 않는 방향의 문항들로 구성되어 수검 태도를 파악한다."}, {"id": 57, "cat": "심리검사", "sub": "MMPI-2", "title": "057. MMPI-2 임상 척도 4번과 9번 상승", "passage": "임상 척도 중 4번(Pd)과 9번(Ma)이 함께 상승한(4-9/9-4 코드) 프로파일의 전형적인 임상적 특징은?", "answer": "충동성, 반사회적 성향, 권위자와의 갈등, 행동화(Acting out) 위험", "explanation": "에너지와 충동성이 높고 규범을 무시하는 경향이 결합되어 비행 청소년에게서 흔히 나타난다."}, {"id": 58, "cat": "심리검사", "sub": "웩슬러 지능검사", "title": "058. K-WISC-V의 주요 지표", "passage": "K-WISC-V(한국웩슬러아동지능검사 5판)의 5가지 기본 지표를 모두 쓰시오.", "answer": "언어이해, 시공간, 유동추론, 작업기억, 처리속도", "explanation": "지각추론 지표가 시공간 지표와 유동추론 지표로 분리되어 5대 지표 체계로 개편되었다."}, {"id": 59, "cat": "심리검사", "sub": "투사검사", "title": "059. 로르샤흐 검사의 엑스너(Exner) 채점: 반응결정인", "passage": "로르샤흐 잉크반점 검사에서 수검자가 '형태', '색채', '음영', '운동' 중 무엇을 보고 응답했는지를 채점하는 항목의 명칭은?", "answer": "결정인 (Determinants)", "explanation": "결정인은 수검자의 인지적, 정서적 처리 방식과 심리적 자원을 보여준다."}, {"id": 60, "cat": "심리검사", "sub": "홀랜드 검사", "title": "060. 홀랜드 육각형 모형의 진단 지표", "passage": "수검자의 홀랜드 프로파일 결과에서, 첫 번째 흥미 유형과 두 번째 흥미 유형 간의 거리가 가까울수록 점수가 높게 나오는 지표의 명칭은?", "answer": "일관성 (Consistency)", "explanation": "인접한 유형(예: RI)은 일관성이 높고, 대각선에 위치한 유형(예: RS)은 일관성이 낮다."}, {"id": 61, "cat": "진로상담", "sub": "수퍼(Super)의 진로발달이론", "title": "061. 수퍼의 진로발달단계", "passage": "수퍼의 전 생애 진로발달 5단계 중, 15~24세 무렵 자신의 욕구, 흥미, 능력을 고려하여 진로를 탐색하고 구체화하는 단계는?", "answer": "탐색기 (Exploration)", "explanation": "성장기-탐색기-확립기-유지기-쇠퇴기 중 청소년~초기성인기에 해당하는 핵심 시기이다."}, {"id": 62, "cat": "진로상담", "sub": "크롬볼츠(Krumboltz)", "title": "062. 크롬볼츠의 우연학습이론", "passage": "크롬볼츠 이론에서, 예기치 않은 우연한 사건을 자신의 진로에 긍정적으로 활용하는 능력을 무엇이라 하는가?", "answer": "계획된 우연 (Planned Happenstance)", "explanation": "우연을 기회로 바꾸기 위해 호기심, 인내심, 융통성, 낙관성, 위험감수 등의 기술이 필요하다."}, {"id": 63, "cat": "진로상담", "sub": "로(Roe)의 욕구이론", "title": "063. 로의 부모 양육방식", "passage": "로(Roe)에 따르면, 부모의 양육방식(수용형, 정서집중형, 회피형)이 자녀의 직업 선택 방향(인간지향적 vs 비인간지향적)을 결정한다. 과보호하는 부모 밑에서 자란 아이는 주로 어느 쪽으로 향하는가?", "answer": "인간지향적 직업 (서비스, 비즈니스, 조직 등)", "explanation": "정서집중형(과보호, 과요구)과 수용형 양육은 타인과의 상호작용이 잦은 인간지향적 직업 선택으로 이어진다."}, {"id": 64, "cat": "집단상담", "sub": "집단의 발달단계", "title": "064. 얄롬(Yalom)의 집단 발달단계: 과도기", "passage": "초기 단계를 지나 집단원들이 불안과 방어를 드러내고 상담자에게 저항하거나 집단원 간 갈등이 발생하는 단계의 명칭은?", "answer": "과도기 (Transition stage) 또는 갈등기", "explanation": "이 단계에서는 불안, 방어, 저항, 통제력 투쟁이 나타나며 상담자의 적절한 개입이 필수적이다."}, {"id": 65, "cat": "집단상담", "sub": "집단상담의 치료적 요인", "title": "065. 얄롬의 치료적 요인: 보편성", "passage": "'나만 이런 끔찍한 고통을 겪는 것이 아니구나, 다른 사람들도 비슷한 상처가 있구나'라고 느끼며 위로를 얻는 치료적 요인의 명칭은?", "answer": "보편성 (Universality)", "explanation": "자신의 문제가 독특하고 고립된 것이 아니라 인간의 보편적인 경험임을 깨닫는 것이다."}, {"id": 66, "cat": "가족상담", "sub": "보웬(Bowen)", "title": "066. 보웬의 다세대 가족상담: 자아분화", "passage": "보웬 이론에서, 개인의 지적 기능(이성)과 정서적 기능(감정)이 분리된 정도를 의미하며 타인과의 융합에서 벗어난 상태를 뜻하는 개념은?", "answer": "자아분화 (Self-Differentiation)", "explanation": "자아분화 수준이 높을수록 감정에 휩쓸리지 않고 객관적이고 이성적으로 사고하고 행동할 수 있다."}, {"id": 67, "cat": "가족상담", "sub": "구조적 가족상담", "title": "067. 미누친(Minuchin)의 하위체계와 경계선", "passage": "미누친의 구조적 가족상담에서, 가족 구성원 간의 지나친 간섭으로 독립성이 부족한 가족의 경계선 유형은 무엇인가?", "answer": "밀착된 경계선 (Enmeshed boundary)", "explanation": "밀착된 경계선은 소속감은 높지만 자율성이 부족한 얽힌 상태를 말한다."}, {"id": 68, "cat": "가족상담", "sub": "사티어(Satir)", "title": "068. 사티어의 경험적 가족상담: 의사소통 유형", "passage": "스트레스 상황에서 자신의 감정을 무시하고 타인의 의견에 무조건 동조하며 비위를 맞추려는 사티어의 역기능적 의사소통 유형은?", "answer": "회유형 (Placating)", "explanation": "자신을 무시하고 타인과 상황만을 중시하는 유형이다."}, {"id": 69, "cat": "가족상담", "sub": "해결중심 가족상담", "title": "069. 해결중심 상담의 질문기법", "passage": "내담자에게 '어느 날 밤 기적이 일어나 당신의 모든 문제가 해결되었다고 상상해 봅시다. 다음 날 아침 당신은 무엇을 보고 기적이 일어난 것을 알 수 있을까요?'라고 묻는 기법은?", "answer": "기적 질문 (Miracle question)", "explanation": "문제가 해결된 미래의 상태를 구체적으로 상상하게 하여 목표를 설정하게 돕는다."}, {"id": 70, "cat": "학습심리", "sub": "조작적 조건형성", "title": "070. 스키너(Skinner)의 강화계획", "passage": "도박 슬롯머신이나 낚시처럼 반응의 횟수가 예측할 수 없이 변동하는 비율로 강화가 주어져, 소거에 대한 저항이 가장 강한 강화계획은?", "answer": "변동비율계획 (Variable-Ratio schedule, VR)", "explanation": "보상이 언제 나올지 모르기 때문에 행동이 폭발적으로 유지되고 잘 소거되지 않는다."}, {"id": 71, "cat": "발달심리", "sub": "피아제(Piaget)", "title": "071. 피아제의 인지발달: 조절과 동화", "passage": "새로운 정보를 기존의 인지 도식에 맞춰 받아들이는 과정을 '동화'라고 한다면, 기존의 도식으로 새로운 정보를 이해할 수 없어 도식 자체를 수정하는 과정을 무엇이라 하는가?", "answer": "조절 (Accommodation)", "explanation": "동화와 조절의 과정을 통해 인지적 평형(Equilibration)을 이룬다."}, {"id": 72, "cat": "발달심리", "sub": "에릭슨(Erikson)", "title": "072. 에릭슨의 심리사회적 발달 5단계", "passage": "청소년기에 해당하는 발달 위기로, '나는 누구인가'에 대한 해답을 찾고 다양한 역할을 탐색하며 획득해야 하는 과업은?", "answer": "자아정체감 대 역할 혼미 (Identity vs. Role confusion)", "explanation": "이 시기에 정체감을 확립하지 못하면 가치관과 역할에 혼란을 겪게 된다."}, {"id": 73, "cat": "발달심리", "sub": "마르시아(Marcia)", "title": "073. 마르시아의 정체감 지위", "passage": "마르시아의 정체감 4가지 지위 중, 스스로 위기(탐색)를 경험하지 않고 부모나 사회의 가치관을 그대로 수용하여 전념(관여)하고 있는 상태는?", "answer": "정체감 유실 (Identity Foreclosure, 정체감 폐쇄)", "explanation": "위기(탐색)는 없고 관여(전념)만 있는 상태이다."}, {"id": 74, "cat": "성격심리", "sub": "융(Jung)", "title": "074. 융의 분석심리학: 원형(Archetypes)", "passage": "융의 이론에서, 개인이 사회적 요구에 부응하기 위해 쓰는 가면(사회적 역할)을 뜻하는 원형과, 의식에 용납되지 않아 억압된 어둡고 파괴적인 원형을 각각 쓰시오.", "answer": "페르소나 (Persona), 그림자 (Shadow)", "explanation": "자아실현(개성화)을 위해서는 페르소나와 그림자를 인식하고 통합해야 한다."}, {"id": 75, "cat": "성격심리", "sub": "빅파이브", "title": "075. 성격의 5요인(Big 5)", "passage": "Costa & McCrae의 성격 5요인 중, 불안, 분노, 우울 등 부정적 감정을 쉽게 느끼며 정서적으로 불안정한 정도를 나타내는 요인은?", "answer": "신경증 (Neuroticism, 정서적 불안정성)", "explanation": "나머지 4요인은 외향성, 개방성, 우호성, 성실성이다."}, {"id": 76, "cat": "윤리 및 법률", "sub": "상담 윤리", "title": "076. 비밀보장의 예외 한계", "passage": "상담자가 내담자의 비밀을 지켜야 하는 의무를 파기하고 타인에게 알려야 하는 예외 상황 3가지를 쓰시오.", "answer": "1. 자신이나 타인의 생명에 대한 명백하고 임박한 위험 (자살, 타살)\n2. 아동학대 및 노인학대가 의심되는 경우\n3. 법원의 명령이 있는 경우 (또는 치명적 감염병 등)", "explanation": "상담의 신뢰보다 생명 보호와 법적 의무가 우선하는 상황이다."}, {"id": 77, "cat": "상담이론과 실제", "sub": "인간중심 상담", "title": "077. 로저스(Rogers)의 핵심 조건", "passage": "상담자가 내담자의 내면 세계를 자신의 것처럼 깊이 이해하되 객관적인 '마치 ~인 것처럼'의 입장을 잃지 않는 상담자의 태도는?", "answer": "공감적 이해 (Empathic understanding)", "explanation": "무조건적 긍정적 존중, 진정성(일치성)과 함께 로저스의 3대 핵심 조건이다."}, {"id": 78, "cat": "상담이론과 실제", "sub": "인지행동치료", "title": "078. 엘리스(Ellis)의 REBT", "passage": "REBT의 ABCDE 모형에서 A, B, C가 의미하는 바를 각각 쓰시오.", "answer": "A: 선행사건(Activating event)\nB: 비합리적 신념(Belief system)\nC: 결과(Consequence, 정서/행동)", "explanation": "문제의 원인은 사건(A)이 아니라 비합리적 신념(B)이므로 이를 논박(D)하여 효과(E)를 이끌어낸다."}, {"id": 79, "cat": "상담이론과 실제", "sub": "형태주의 상담", "title": "079. 펄스(Perls)의 게슈탈트 상담: 미해결 과제", "passage": "과거에 해소되지 않은 욕구나 감정이 현재의 전경으로 떠오르지 못하고 배경에 남아 현재의 삶을 방해하는 상태를 무엇이라 하는가?", "answer": "미해결 과제 (Unfinished business)", "explanation": "이를 해결하기 위해 '빈 의자 기법' 등을 사용하여 억압된 감정을 자각하고 해소한다."}, {"id": 80, "cat": "심리검사", "sub": "MBTI", "title": "080. MBTI의 4가지 선호 지표", "passage": "MBTI에서 외부 세계의 정보 수집 방식에 따라 오감에 의존하는 감각(S)과 직관(N)으로 나뉘며, 판단 및 결정 방식에 따라 나누어지는 두 가지 지표는 무엇인가?", "answer": "사고(T, Thinking)와 감정(F, Feeling)", "explanation": "결정을 내릴 때 논리와 인과관계를 중시하면 T, 사람과 관계를 중시하면 F이다."}, {"id": 81, "cat": "진로상담", "sub": "다위스 & 롭퀴스트", "title": "081. 직업적응이론(TWA)", "passage": "미네소타 직업적응이론에서 개인의 욕구와 직업 환경의 보상체계가 일치하는 정도를 의미하며 직무 '만족(Satisfaction)'을 결정하는 개념은?", "answer": "조화 / 일치도 (Correspondence)", "explanation": "개인의 능력과 환경의 요구가 일치하면 '충족(Satisfactoriness)' 상태가 되어 근속으로 이어진다."}, {"id": 82, "cat": "발달심리", "sub": "애착이론", "title": "082. 에인스워스(Ainsworth)의 애착 유형", "passage": "낯선 상황 실험에서 양육자가 떠나도 크게 동요하지 않고, 양육자가 돌아와도 무시하거나 피하는 애착 유형은?", "answer": "불안정 회피 애착 (Insecure-Avoidant attachment)", "explanation": "양육자의 지속적인 거절이나 무감각한 반응으로 인해 아동이 감정 표현을 억제하는 것이다."}, {"id": 83, "cat": "이상심리", "sub": "해리장애", "title": "083. 해리성 정체감 장애", "passage": "한 사람 안에 둘 이상의 뚜렷이 구별되는 성격 상태(다중 인격)가 존재하며 교대로 행동을 통제하는 장애의 명칭은?", "answer": "해리성 정체감 장애 (Dissociative Identity Disorder, DID)", "explanation": "심한 아동기 외상과 관련이 깊으며, 심리적 고통으로부터 자신을 방어하기 위해 인격을 분리한다."}, {"id": 84, "cat": "상담이론과 실제", "sub": "교류분석", "title": "084. 에릭 번(Berne)의 교류분석: 자아상태", "passage": "교류분석에서 인간의 3가지 자아상태(PAC)를 모두 쓰시오.", "answer": "부모 자아(P, Parent), 어른 자아(A, Adult), 아동 자아(C, Child)", "explanation": "내담자의 PAC 상태를 분석하여 역기능적 교류(교차교류, 이면교류)를 파악하고 보완교류로 돕는다."}, {"id": 85, "cat": "상담이론과 실제", "sub": "현실치료", "title": "085. 글래서(Glasser)의 기본 욕구", "passage": "현실치료에서 인간의 행동을 동기화하는 5가지 기본 욕구는 생존, 사랑과 소속, 힘(권력), 자유, 그리고 무엇인가?", "answer": "즐거움 (Fun, 재미)", "explanation": "현실치료에서는 모든 문제행동이 이 5가지 욕구를 충족시키기 위한 내담자의 최선의 선택이라고 본다."}, {"id": 86, "cat": "상담이론과 실제", "sub": "현실치료", "title": "086. WDEP 체계", "passage": "현실치료의 상담 과정인 WDEP에서 E가 의미하는 과정은 무엇인가?", "answer": "평가 (Evaluation, 자신의 행동 평가하기)", "explanation": "W(바람 탐색) - D(현재 행동 파악) - E(행동 평가: 이 행동이 너에게 도움이 되는가?) - P(계획 수립)의 순서이다."}, {"id": 87, "cat": "집단상담", "sub": "집단원의 역할", "title": "087. 역기능적 집단원의 행동: 소외자/희생양", "passage": "집단 내에서 다른 집단원들로부터 지속적으로 비난을 받거나 배척당하며, 집단의 긴장과 분노의 배출구가 되는 집단원의 역할을 무엇이라 하는가?", "answer": "희생양 (Scapegoat)", "explanation": "상담자는 희생양 현상을 방치하지 말고, 집단원들이 자신의 억압된 부정적 감정을 희생양에게 투사하고 있음을 직면시켜야 한다."}, {"id": 88, "cat": "집단상담", "sub": "집단상담 기법", "title": "088. 집단상담의 연결짓기 기법", "passage": "상담자가 집단원 A의 발언이나 감정을 집단원 B의 경험과 유사함을 지적하며 상호작용을 촉진하는 기법은?", "answer": "연결하기 (Linking)", "explanation": "이를 통해 보편성을 증진하고 집단원 간의 응집력을 강화할 수 있다."}, {"id": 89, "cat": "가족상담", "sub": "전략적 가족상담", "title": "089. 밀란(Milan) 모델의 기법", "passage": "가족의 증상이나 문제 행동을 긍정적인 동기나 사랑의 표현으로 재해석하여 가족들에게 전달하는 밀란 모델의 기법은?", "answer": "긍정적 의미부여 (Positive connotation)", "explanation": "가족원들의 방어를 낮추고 변화에 대한 저항을 우회하는 효과가 있다."}, {"id": 90, "cat": "가족상담", "sub": "해결중심 가족상담", "title": "090. 예외질문", "passage": "내담자가 호소하는 문제가 발생하지 않았거나 덜 심각했던 상황을 찾아내어 내담자의 성공 경험을 환기시키는 질문 기법은?", "answer": "예외 질문 (Exception question)", "explanation": "문제에만 몰두하던 내담자에게 해결의 단서와 자원이 이미 자신에게 있음을 깨닫게 한다."}, {"id": 91, "cat": "심리검사", "sub": "지능검사", "title": "091. 유동지능과 결정지능", "passage": "카텔(Cattell)의 지능 이론에서 경험, 교육을 통해 습득되며 연령이 증가해도 유지되는 지능(가)과 유전적 신경학적 요인에 의해 결정되며 20대 이후 감퇴하는 지능(나)의 명칭은?", "answer": "(가) 결정성 지능 (Crystallized intelligence)\n(나) 유동성 지능 (Fluid intelligence)", "explanation": "어휘력이나 상식은 결정지능, 도형추론이나 암기력은 유동지능에 속한다."}, {"id": 92, "cat": "발달심리", "sub": "도덕성 발달", "title": "092. 콜버그(Kohlberg)의 인습적 수준", "passage": "콜버그의 도덕성 발달 3수준 6단계 중, 타인의 인정을 받고 착한 아이가 되기 위해 도덕적 행동을 하는 단계는 몇 단계인가?", "answer": "제3단계: 착한 소년/소녀 지향 (인습적 수준)", "explanation": "타인의 승인과 조화를 중시하며 '대인관계적 조화' 지향 단계라고도 한다."}, {"id": 93, "cat": "학습심리", "sub": "반두라(Bandura)", "title": "093. 사회인지학습이론의 4단계", "passage": "관찰학습 과정의 4단계를 순서대로 쓰시오.", "answer": "주의집중(Attention) - 파지(Retention, 기억) - 재생(Reproduction, 운동재생) - 동기화(Motivation)", "explanation": "단순한 모방이 아니라 인지적 과정(파지, 동기)이 필수적으로 개입한다."}, {"id": 94, "cat": "특수아상담", "sub": "학습장애", "title": "094. 학습장애 진단 기준", "passage": "지능이 정상이고 적절한 교육 기회가 주어졌음에도 불구하고 읽기, 쓰기, 수학 등의 특정 학업 영역에서 현저한 성취 부진을 보이는 장애의 명칭은?", "answer": "특정학습장애 (Specific Learning Disorder)", "explanation": "DSM-5에서는 난독증, 난산증 등을 특정학습장애의 하위 명시자로 통합하였다."}, {"id": 95, "cat": "특수아상담", "sub": "지적장애", "title": "095. 지적장애 진단", "passage": "지적장애 진단을 위해 지능지수(IQ) 70 이하와 함께 반드시 함께 나타나야 하는 결함 영역은?", "answer": "적응행동(Adaptive functioning)의 결함", "explanation": "지능 지수뿐만 아니라 일상생활(개념적, 사회적, 실용적 기술)을 독립적으로 수행하는 능력의 저하가 필수 기준이다."}, {"id": 96, "cat": "진로상담", "sub": "홀랜드(Holland)", "title": "096. 육각형 모형의 6가지 성격 유형", "passage": "홀랜드의 직업흥미 유형 6가지(RIASEC)를 모두 쓰시오.", "answer": "실재형(R), 탐구형(I), 예술형(A), 사회형(S), 진취형(E), 관습형(C)", "explanation": "개인의 성격 유형과 직업 환경의 유형이 일치할 때 직무 만족도가 가장 높다."}, {"id": 97, "cat": "진로상담", "sub": "사회인지진로이론", "title": "097. SCCT의 3대 핵심 변인", "passage": "렌트(Lent) 등의 사회인지진로이론(SCCT)에서 진로 발달에 영향을 미치는 3가지 인지적 핵심 변인은 자기효능감, 결과기대, 그리고 무엇인가?", "answer": "개인적 목표 (Personal Goals)", "explanation": "개인이 결과를 얻기 위해 참여하려는 결심이나 의도된 행동을 말한다."}, {"id": 98, "cat": "성격심리", "sub": "아들러(Adler)", "title": "098. 개인심리학의 주요 개념: 사회적 관심", "passage": "아들러 이론에서, 인간이 타인과 협력하고 인류의 복지에 기여하려는 선천적인 유대감과 공감 능력을 무엇이라 하는가?", "answer": "사회적 관심 (Social interest)", "explanation": "심리적 건강의 척도이며, 사회적 관심이 낮을수록 열등감에 빠지거나 우월성 추구가 이기적인 형태로 나타난다."}, {"id": 99, "cat": "성격심리", "sub": "켈리(Kelly)", "title": "099. 개인구성개념이론", "passage": "조지 켈리의 이론에서, 개인이 세상을 해석하고 예측하기 위해 사용하는 자신만의 인지적 틀이나 안경을 무엇이라 하는가?", "answer": "개인 구성개념 (Personal Construct)", "explanation": "인간은 과학자처럼 세상을 예측하고 통제하기 위해 지속적으로 자신의 구성개념 체계를 검증하고 수정한다."}, {"id": 100, "cat": "이상심리", "sub": "기분장애", "title": "100. 양극성 장애 1형과 2형의 차이", "passage": "제1형 양극성 장애와 제2형 양극성 장애를 구분하는 가장 핵심적인 진단 기준의 차이는?", "answer": "조증 삽화(Manic episode)의 유무", "explanation": "1형은 조증 삽화가 최소 1회 이상 있어야 하나, 2형은 경조증 삽화와 주요 우울 삽화만 있고 조증 삽화는 절대 없어야 한다."}, {"id": 101, "cat": "이상심리", "sub": "성격장애", "title": "101. A군 성격장애", "passage": "사회적 관계에서 고립되어 있고 감정 표현이 제한적이며 칭찬이나 비판에도 무관심한 성격장애의 명칭은?", "answer": "조현성 성격장애 (Schizoid Personality Disorder)", "explanation": "타인과 관계 맺으려는 욕구 자체가 거의 없는 것이 회피성 성격장애와의 가장 큰 차이점이다."}, {"id": 102, "cat": "이상심리", "sub": "신체증상장애", "title": "102. 질병불안장애", "passage": "실제 신체 증상은 없거나 매우 경미함에도 불구하고 자신이 심각한 질병에 걸렸다고 집착하고 두려워하는 장애는?", "answer": "질병불안장애 (Illness Anxiety Disorder)", "explanation": "과거의 '건강염려증'이 DSM-5에서 신체증상장애와 질병불안장애로 세분화되었다."}, {"id": 103, "cat": "상담이론과 실제", "sub": "해결중심 상담", "title": "103. 척도질문", "passage": "내담자의 문제의 심각성, 상담에 대한 동기, 자신감 등을 1에서 10까지의 숫자로 표현하게 하여 구체적인 목표를 설정하는 기법은?", "answer": "척도 질문 (Scaling question)", "explanation": "작은 변화를 확인하고 다음 단계의 구체적 행동을 탐색하는 데 매우 유용하다."}, {"id": 104, "cat": "상담이론과 실제", "sub": "아들러(Adler) 개인심리학", "title": "104. 생활양식", "passage": "개인이 어린 시절 경험을 바탕으로 삶의 목표를 달성하기 위해 형성한 독특한 신념과 행동 방식을 의미하는 아들러의 개념은?", "answer": "생활양식 (Lifestyle)", "explanation": "초기 기억이나 출생순위 분석을 통해 내담자의 왜곡된 생활양식을 파악하고 재교육한다."}, {"id": 105, "cat": "심리검사", "sub": "지능검사", "title": "105. 웩슬러 지능검사의 편차지능지수", "passage": "현재 웩슬러 지능검사에서 사용하는 IQ 산출 방식으로, 동일 연령 집단 내에서 개인의 상대적 위치를 나타내는 개념은?", "answer": "편차 지능지수 (Deviation IQ)", "explanation": "평균을 100, 표준편차를 15로 하는 표준점수로 변환하여 산출한다."}, {"id": 106, "cat": "심리검사", "sub": "로르샤흐", "title": "106. 형태질(Form Quality)", "passage": "로르샤흐 검사 채점에서, 수검자의 반응이 잉크반점의 실제 형태와 얼마나 일치하는지(현실 검증력)를 평가하는 지표는?", "answer": "형태질 (Form Quality)", "explanation": "형태질이 우수하면(+, o) 현실 검증력이 양호한 것이고, 불량하면(-) 왜곡된 현실 지각을 의미한다."}, {"id": 107, "cat": "가족상담", "sub": "보웬", "title": "107. 삼각관계(Triangulation)", "passage": "두 사람 사이의 긴장과 불안이 높아질 때, 이를 해소하기 위해 제3자(주로 자녀)를 끌어들여 긴장을 분산시키는 현상은?", "answer": "삼각관계 (Triangulation)", "explanation": "가장 취약한 자녀가 희생양이 되기 쉬우며, 상담자는 탈삼각화(Detriangulation)를 통해 부부 문제를 부부끼리 해결하도록 돕는다."}, {"id": 108, "cat": "가족상담", "sub": "구조적 가족상담", "title": "108. 합류(Joining)", "passage": "미누친의 상담 기법 중, 상담자가 가족의 상호작용 방식과 언어를 모방하고 순응하며 가족 체계의 일원으로 수용되는 과정은?", "answer": "합류 (Joining)", "explanation": "구조 변화를 시도하기 전 필수적으로 라포를 형성하고 저항을 줄이는 작업이다."}, {"id": 109, "cat": "집단상담", "sub": "지도성", "title": "109. 민주적 리더십", "passage": "집단상담자가 집단원들에게 의사결정의 권한을 공유하고 스스로 방향을 찾도록 조력하는 지도성 유형은?", "answer": "민주적 리더십 (Democratic leadership)", "explanation": "권위적이나 방임적 리더십보다 집단원의 책임감과 자율성을 가장 잘 촉진한다."}, {"id": 110, "cat": "진로상담", "sub": "긴즈버그(Ginzberg)", "title": "110. 직업선택의 발달단계", "passage": "긴즈버그의 진로발달이론에서 환상기(~11세)를 지나 능력, 가치, 흥미를 고려하기 시작하는 11~17세 시기의 명칭은?", "answer": "잠정기 (Tentative period)", "explanation": "환상기 -> 잠정기 -> 현실기의 순서로 발달한다."}, {"id": 111, "cat": "발달심리", "sub": "비고츠키(Vygotsky)", "title": "111. 근접발달영역(ZPD)", "passage": "비고츠키 이론에서 아동이 혼자서는 해결할 수 없지만, 유능한 타인의 도움을 받으면 해결할 수 있는 영역의 명칭은?", "answer": "근접발달영역 (ZPD: Zone of Proximal Development)", "explanation": "교사나 또래는 ZPD 내에서 적절한 발판(Scaffolding)을 제공하여 인지 발달을 촉진한다."}, {"id": 112, "cat": "학습심리", "sub": "고전적 조건형성", "title": "112. 체계적 둔감법", "passage": "파블로프의 고전적 조건형성 원리를 응용하여, 불안을 유발하는 자극을 점진적으로 노출시키며 이완 반응과 연합시키는 기법은?", "answer": "체계적 둔감법 (Systematic Desensitization)", "explanation": "조셉 울페(J. Wolpe)가 개발했으며, 상호억제 원리를 기반으로 공포증 치료에 효과적이다."}, {"id": 113, "cat": "윤리 및 법률", "sub": "다중관계", "title": "113. 이중관계 금지", "passage": "상담자가 내담자와 전문적인 상담 관계 외에 사적인 친분, 사업, 성적인 관계 등을 맺는 것을 금지하는 윤리적 원칙은?", "answer": "이중관계 (다중관계) 금지", "explanation": "내담자를 착취할 위험이 있고 상담의 객관성을 훼손하기 때문에 엄격히 금지된다."}, {"id": 114, "cat": "특수아상담", "sub": "시각장애", "title": "114. 시각장애 아동의 특징", "passage": "시각장애 아동이 단어의 의미나 개념을 정확히 이해하지 못한 채 언어를 모방하여 기계적으로 유창하게 말하는 현상은?", "answer": "언어주의 (Verbalism)", "explanation": "시각적 경험의 부재로 인해 경험과 단어가 연결되지 못해 발생한다."}, {"id": 115, "cat": "심리검사", "sub": "투사검사", "title": "115. BGT 검사", "passage": "9개의 기하학적 도형을 보여주고 그대로 모사하게 하여 기질적 뇌손상, 시지각 발달, 성격적 특성을 평가하는 검사는?", "answer": "벤더 게슈탈트 검사 (Bender Gestalt Test, BGT)", "explanation": "간편하고 비언어적이며, 로트(Lacks)의 12가지 감별 기준 등을 사용하여 뇌손상을 판별한다."}, {"id": 116, "cat": "상담이론과 실제", "sub": "여성주의 상담", "title": "116. 여성주의 상담 원리", "passage": "여성주의 상담의 핵심 원리로, 개인의 심리적 문제는 개인적 결함이 아니라 가부장적 사회 구조와 억압적 환경에서 비롯된다는 명제는?", "answer": "개인적인 것이 정치적인 것이다 (The personal is political)", "explanation": "문제의 원인을 사회적 맥락으로 외재화하여 내담자의 죄책감을 줄이고 힘을 부여(임파워먼트)한다."}, {"id": 117, "cat": "상담이론과 실제", "sub": "실존주의 상담", "title": "117. 실존적 불안", "passage": "얄롬(Yalom)이 제시한 인간의 4가지 궁극적 관심사(실존적 조건)는 죽음, 자유(책임), 무의미, 그리고 무엇인가?", "answer": "고립 (Isolation, 소외)", "explanation": "실존주의 상담은 실존적 불안을 병적인 것으로 보지 않고, 성장을 위해 직면해야 할 보편적 조건으로 본다."}, {"id": 118, "cat": "이상심리", "sub": "우울장애", "title": "118. 파괴적 기분조절부전장애", "passage": "아동청소년기에 나타나며, 만성적으로 짜증나는 기분 상태에서 상황에 맞지 않는 극심한 분노 폭발이 반복되는 장애는?", "answer": "파괴적 기분조절부전장애 (DMDD)", "explanation": "소아청소년 양극성 장애의 과잉 진단을 막기 위해 DSM-5에 새롭게 추가되었다."}, {"id": 119, "cat": "이상심리", "sub": "중독장애", "title": "119. 물질사용장애의 내성과 금단", "passage": "동일한 효과를 얻기 위해 점차 더 많은 양의 물질이 필요해지는 현상과, 물질 사용을 중단했을 때 나타나는 고통스러운 신체적/심리적 증상을 각각 쓰시오.", "answer": "내성 (Tolerance), 금단 (Withdrawal)", "explanation": "중독을 진단하는 가장 핵심적인 두 가지 생리적 지표이다."}, {"id": 120, "cat": "집단상담", "sub": "집단 발달단계", "title": "120. 종결기", "passage": "집단상담의 종결 단계에서 집단원들이 상담이 끝나는 것에 대한 아쉬움, 이별의 슬픔, 미래에 대한 불안 등을 느끼는 것은 자연스럽다. 이때 상담자가 다루어 주어야 할 중요한 과업은?", "answer": "미해결 감정 처리 (이별 감정 다루기)", "explanation": "종결에 대한 감정을 충분히 표현하게 하고, 변화된 점을 확인하며 미래 적용 계획을 세운다."}, {"id": 121, "cat": "가족상담", "sub": "전략적 가족상담", "title": "121. 헤일리(Haley)", "passage": "증상을 가진 내담자에게 증상을 의도적으로 과장되게 수행하도록 지시하여, 내담자가 증상을 스스로 통제할 수 있음을 깨닫게 하는 역설적 개입 기법은?", "answer": "증상 처방 (Symptom prescription)", "explanation": "반항심을 이용하거나 문제 통제력을 부여하여 증상을 포기하게 만든다."}, {"id": 122, "cat": "가족상담", "sub": "해결중심", "title": "122. 관계성 질문", "passage": "'네가 학교에 잘 다니게 된다면, 너의 어머니는 너를 보고 뭐라고 칭찬하실까?'와 같이 타인의 관점을 통해 자신의 문제를 객관적으로 보게 하는 질문은?", "answer": "관계성 질문 (Relationship question)", "explanation": "중요한 타인의 눈을 통해 자신을 보게 함으로써 문제 해결의 가능성을 넓힌다."}, {"id": 123, "cat": "심리검사", "sub": "신뢰도", "title": "123. 검사-재검사 신뢰도", "passage": "동일한 검사를 동일한 집단에게 일정한 시간 간격을 두고 두 번 실시하여 얻은 두 점수 간의 상관계수로 추정하는 신뢰도는?", "answer": "검사-재검사 신뢰도 (Test-retest reliability, 안정성 계수)", "explanation": "시간의 경과에 따른 검사 점수의 안정성을 보여주지만, 이월 효과나 연습 효과의 단점이 있다."}, {"id": 124, "cat": "심리검사", "sub": "타당도", "title": "124. 구성타당도(Construct Validity)", "passage": "심리검사가 이론적으로 의도한 추상적 개념이나 심리적 특성(예: 불안, 지능)을 얼마나 잘 측정하고 있는가를 나타내는 타당도는?", "answer": "구성타당도 (구인타당도, Construct Validity)", "explanation": "요인분석, 수렴타당도, 변별타당도 등을 통해 검증한다."}, {"id": 125, "cat": "발달심리", "sub": "가드너(Gardner)", "title": "125. 다중지능이론", "passage": "가드너의 다중지능 중, 타인의 감정, 의도, 동기를 이해하고 대인관계를 원만하게 유지하는 능력과, 자신의 내면을 성찰하는 능력을 각각 무엇이라 하는가?", "answer": "대인관계 지능(Interpersonal), 개인내적 지능(Intrapersonal, 자기이해 지능)", "explanation": "현대 심리학의 정서지능(EQ) 개념 발달에 큰 영향을 미쳤다."}, {"id": 126, "cat": "진로상담", "sub": "타이드만과 오하라", "title": "126. 진로의사결정 모델", "passage": "타이드만과 오하라의 진로의사결정 단계 중, '예상기'의 4단계를 순서대로 쓰시오.", "answer": "탐색기 -> 구체화기(체계화기) -> 선택기 -> 명료화기", "explanation": "예상기(4단계) 이후 실행기(순응-개혁-통합)로 이어진다."}, {"id": 127, "cat": "성격심리", "sub": "프로이트", "title": "127. 성심리성적 발달단계", "passage": "구강기, 항문기, 남근기에 이어 나타나며, 성적 에너지가 억압되고 지적 호기심과 또래 관계에 에너지가 집중되는 초등학교 시기의 명칭은?", "answer": "잠복기 (Latency stage)", "explanation": "이 시기에는 동성 친구와의 우정이 발달하고 사회적, 인지적 기술을 습득한다."}, {"id": 128, "cat": "상담이론과 실제", "sub": "통합적 상담", "title": "128. 라자루스(Lazarus) 다중양식치료", "passage": "라자루스가 내담자의 특성을 평가하기 위해 고안한 7가지 인간 기능 양식인 'BASIC-ID'에서 B와 A가 의미하는 바는?", "answer": "B: 행동 (Behavior), A: 정서 (Affect)", "explanation": "각각의 양식에 맞추어 맞춤형 기법을 통합적으로 적용한다."}, {"id": 129, "cat": "이상심리", "sub": "신경인지장애", "title": "129. 알츠하이머와 혈관성 치매", "passage": "서서히 점진적으로 발병하여 뇌의 위축이 나타나는 치매(A)와, 뇌졸중 등 뇌혈관 질환으로 인해 계단식으로 급격히 인지 기능이 떨어지는 치매(B)는?", "answer": "A: 알츠하이머병, B: 혈관성 신경인지장애", "explanation": "가장 흔한 치매의 두 가지 주요 원인이다."}, {"id": 130, "cat": "학습심리", "sub": "파블로프", "title": "130. 자극 일반화와 변별", "passage": "고전적 조건형성에서 흰 쥐에게 공포를 느낀 아이가 흰 토끼, 흰 수염에도 공포를 느끼는 현상(A)과, 오직 흰 쥐에게만 공포를 느끼는 현상(B)의 명칭은?", "answer": "A: 자극 일반화 (Stimulus Generalization), B: 자극 변별 (Stimulus Discrimination)", "explanation": "일반화는 유사한 자극에 동일하게 반응하는 것이고, 변별은 차이를 인식하는 것이다."}, {"id": 131, "cat": "심리검사", "sub": "TAT", "title": "131. 주제통각검사", "passage": "머레이(Murray)가 개발한 투사검사로, 인물들이 등장하는 모호한 그림 카드를 보고 과거, 현재, 미래가 포함된 이야기를 꾸며내게 하여 개인의 욕구와 환경의 압력을 분석하는 검사는?", "answer": "주제통각검사 (Thematic Apperception Test, TAT)", "explanation": "욕구-압력 이론을 바탕으로 대인관계 역동과 내면의 동기를 평가한다."}, {"id": 132, "cat": "심리검사", "sub": "HTP", "title": "132. 집-나무-사람 검사", "passage": "HTP 검사에서 '집(House)'과 '나무(Tree)'가 상징하는 무의식적 투사 내용은 보통 무엇인가?", "answer": "집: 가정환경과 가족 관계, 나무: 무의식적이고 깊은 수준의 자아상(자아강도)", "explanation": "사람(Person)은 의식적인 자아상이나 대인관계를 주로 반영한다."}, {"id": 133, "cat": "상담이론과 실제", "sub": "이야기치료", "title": "133. 문제의 외재화", "passage": "마이클 화이트(White)의 이야기 치료에서, 내담자를 문제와 동일시하지 않고 문제를 내담자 밖의 객체로 분리하여 이름을 붙이는 기법은?", "answer": "외재화 (Externalization)", "explanation": "'사람이 문제가 아니라 문제가 문제다'라는 철학을 바탕으로 무력감을 극복하게 돕는다."}, {"id": 134, "cat": "상담이론과 실제", "sub": "이야기치료", "title": "134. 독특한 결과", "passage": "내담자의 문제 중심의 지배적 이야기(문제 이야기)와 일치하지 않는, 예외적이고 성공적인 사건이나 행동을 무엇이라 하는가?", "answer": "독특한 결과 (Unique outcomes, 예외적 사건)", "explanation": "이를 단서로 대안적 이야기(새로운 이야기)를 재저작(Re-authoring)해 나간다."}, {"id": 135, "cat": "가족상담", "sub": "경험적 가족상담", "title": "135. 가족 세워보기 (가족조각)", "passage": "사티어의 기법으로, 가족원들이 언어를 사용하지 않고 신체적인 자세나 위치를 통해 서로에 대한 인식과 감정(가족 역동)을 표현하게 하는 기법은?", "answer": "가족 조각 (Family Sculpting)", "explanation": "말로는 숨길 수 있는 억압된 감정과 은폐된 가족 관계를 시각화하여 통찰을 준다."}, {"id": 136, "cat": "가족상담", "sub": "다세대 가족상담", "title": "136. 가계도(Genogram)", "passage": "보웬 학파에서 최소 3세대 이상의 가족 구성원과 그들 간의 관계 양상(밀착, 갈등, 단절 등)을 기호를 사용하여 도식화한 도구는?", "answer": "가계도 (Genogram)", "explanation": "다세대 전수 과정과 가족의 융합/단절 패턴을 파악하는 주요 평가 도구이다."}, {"id": 137, "cat": "진로상담", "sub": "가치관", "title": "137. 직업가치관", "passage": "개인이 직업을 통해 충족하고자 하는 신념으로, 직무 만족에 큰 영향을 미친다. 보수나 안정성 등은 (A) 가치에, 성취나 창의성 등은 (B) 가치에 속한다.", "answer": "A: 외재적 가치(보상), B: 내재적 가치", "explanation": "내재적 가치관이 직업 선택의 동기일 때 장기적 직무 만족이 더 높다."}, {"id": 138, "cat": "이상심리", "sub": "강박관련장애", "title": "138. 신체이형장애", "passage": "타인의 눈에는 띄지 않거나 미미한 신체의 결함을 심각하게 추하다고 인식하여 거울을 반복적으로 확인하거나 성형수술에 집착하는 장애는?", "answer": "신체이형장애 (Body Dysmorphic Disorder)", "explanation": "강박 및 관련 장애 범주에 속하며, 외모에 대한 강박사고와 확인 행동이 특징이다."}, {"id": 139, "cat": "이상심리", "sub": "급식장애", "title": "139. 이식증", "passage": "종이, 흙, 페인트 등 영양가 없는 비음식 물질을 1개월 이상 지속적으로 먹는 급식장애는?", "answer": "이식증 (Pica)", "explanation": "발달 수준에 적합하지 않은 행동일 때 진단되며, 유아기뿐만 아니라 지적장애 아동에게서도 나타난다."}, {"id": 140, "cat": "집단상담", "sub": "상담자의 기술", "title": "140. 차단하기", "passage": "집단상담자가 한 집단원의 지나친 수다, 공격적 언행, 타인에 대한 충고나 질문 공세 등으로 인해 집단 과정이 방해받을 때 이를 개입하여 중단시키는 기술은?", "answer": "차단하기 (Blocking)", "explanation": "공격이나 배척이 아닌 부드럽고 단호한 방식으로 차단하여 집단과 상처받는 개인을 보호해야 한다."}, {"id": 141, "cat": "심리검사", "sub": "척도", "title": "141. 비율척도", "passage": "측정 척도의 4가지 유형 중, 절대 영점(zero)이 존재하여 더하기, 곱하기 등의 모든 사칙연산이 가능하며 비율의 의미(2배 무겁다 등)를 갖는 척도는?", "answer": "비율척도 (Ratio Scale)", "explanation": "키, 몸무게 등이 해당하며 명명-서열-등간-비율 척도 중 가장 많은 정보를 담고 있다."}, {"id": 142, "cat": "심리검사", "sub": "MMPI", "title": "142. L척도", "passage": "MMPI-2에서 자신을 지나치게 긍정적이고 도덕적인 사람으로 포장하려는 '방어적 태도'를 측정하는 척도는?", "answer": "L 척도 (부인 척도, Lie)", "explanation": "일상적인 작은 단점조차 부인하려는 고의적이고 순진한 속임수를 탐지한다."}, {"id": 143, "cat": "발달심리", "sub": "보울비(Bowlby)", "title": "143. 내적 작동 모형", "passage": "보울비의 애착이론에서, 유아기 양육자와의 상호작용 경험을 바탕으로 형성되며 자신과 타인, 세상을 지각하고 해석하는 무의식적인 인지 도식은?", "answer": "내적 작동 모형 (Internal Working Model)", "explanation": "한 번 형성되면 성인기의 대인관계와 연인 관계에도 지속적인 영향을 미친다."}, {"id": 144, "cat": "상담이론과 실제", "sub": "행동주의", "title": "144. 프리맥의 원리", "passage": "발생 빈도가 높은 행동(좋아하는 행동)을 발생 빈도가 낮은 행동(하기 싫은 행동)을 증가시키기 위한 강화물로 사용하는 원리는?", "answer": "프리맥의 원리 (Premack's Principle)", "explanation": "예: '숙제(저빈도)를 다 하면 게임(고빈도)을 하게 해줄게'라고 적용한다."}, {"id": 145, "cat": "상담이론과 실제", "sub": "행동주의", "title": "145. 토큰 경제", "passage": "바람직한 행동을 할 때마다 상표(토큰, 스티커)를 주고, 나중에 내담자가 원하는 실제 보상(물건, 권리)으로 교환할 수 있게 하는 기법은?", "answer": "토큰 경제 (Token Economy)", "explanation": "조건강화의 원리를 이용한 것으로 주로 학교나 교정시설, 병동 등에서 집단적으로 사용된다."}, {"id": 146, "cat": "이상심리", "sub": "신경발달장애", "title": "146. 틱장애", "passage": "갑작스럽고 빠르며 반복적이고 비율동적인 운동이나 음성이 나타나며, 음성 틱과 운동 틱이 모두 1년 이상 나타날 때 진단되는 틱장애의 명칭은?", "answer": "투렛 장애 (Tourette's Disorder)", "explanation": "운동틱이나 음성틱 중 하나만 나타나면 '지속성(만성) 운동 또는 음성 틱장애'로 진단된다."}, {"id": 147, "cat": "상담이론과 실제", "sub": "단기상담", "title": "147. 위기개입의 특성", "passage": "위기개입 상담은 장기상담과 달리 과거의 상처 탐색보다 '이것'을 우선시하며, 상담자의 태도 또한 수동적 경청보다 '이것'이어야 한다.", "answer": "현재 증상 완화(안전 확보) / 지시적·적극적 태도", "explanation": "시간이 제한적이므로 현재 닥친 위기를 즉각 해소하고 원래 기능으로 회복시키는 데 초점을 둔다."}, {"id": 148, "cat": "진로상담", "sub": "진로장벽", "title": "148. 진로 신화", "passage": "내담자가 '나에게 완벽하게 맞는 오직 하나의 직업이 존재한다'거나 '진로 결정은 평생 한 번만 하는 것이다'라고 믿는 비합리적 신념을 무엇이라 하는가?", "answer": "진로 신화 (Career Myths)", "explanation": "진로 상담 초기에 진로 신화를 타파하여 진로 의사결정에 대한 부담감을 줄여야 한다."}, {"id": 149, "cat": "가족상담", "sub": "환상과 신화", "title": "149. 가족 신화", "passage": "가족 구성원 모두가 진실이라고 굳게 믿고 공유하는 암묵적인 규칙이나 왜곡된 신념(예: '우리 가족은 절대 화를 내지 않는 화목한 가족이다')을 뜻하는 용어는?", "answer": "가족 신화 (Family Myth)", "explanation": "가족 신화는 갈등을 덮어두고 피상적인 화목을 유지하게 하지만, 실제로는 개별성을 억압하고 병리를 유발한다."}, {"id": 150, "cat": "이상심리", "sub": "성격장애", "title": "150. C군 성격장애", "passage": "버림받는 것에 대한 과도한 두려움으로 인해 타인에게 매달리고, 스스로 결정을 내리지 못하며 과도하게 순종적인 성격장애의 명칭은?", "answer": "의존성 성격장애 (Dependent Personality Disorder)", "explanation": "자기 신뢰가 부족하여 타인에게 보호받으려는 욕구가 비정상적으로 강하다."}];

  let currentQuestionIndex = 0;
  
  // Timer variables
  let timerInterval;
  let timeRemaining = 90 * 60; // 90 minutes

  // Setup font size
  const range = document.getElementById('fontSizeRange');
  range.addEventListener('input', () => {
    document.documentElement.style.fontSize = range.value + 'px';
  });

  function startTimer() {
    clearInterval(timerInterval);
    timeRemaining = 90 * 60;
    updateTimerDisplay();
    document.getElementById('timerContainer').style.display = 'block';
    timerInterval = setInterval(() => {
      timeRemaining--;
      updateTimerDisplay();
      if(timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert("시험 시간이 종료되었습니다!");
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
    let s = (timeRemaining % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }

  function stopTimer() {
    clearInterval(timerInterval);
    document.getElementById('timerContainer').style.display = 'none';
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnStudyMode').className = 'mode-btn' + (mode === 'study' ? ' active' : '');
    document.getElementById('btnTestMode').className = 'mode-btn' + (mode === 'test' ? ' active' : '');
    
    if(mode === 'test') {
      currentQuestionIndex = 0;
      startTimer();
      renderTestMode();
    } else {
      stopTimer();
      renderStudyMode();
    }
  }

  function toggleAnswer(id) {
    const el = document.getElementById('ans-' + id);
    const btn = document.getElementById('btn-' + id);
    if(el.style.display === 'block') {
      el.style.display = 'none';
      btn.textContent = "정답 및 해설 보기";
      btn.style.background = "#2563eb";
    } else {
      el.style.display = 'block';
      btn.textContent = "정답 숨기기";
      btn.style.background = "#4b5563";
    }
  }

  function renderStudyMode() {
    const app = document.getElementById('app');
    let html = '';
    ITEMS.forEach((item, idx) => {
      html += `
        <div class="question-box">
          <h2 class="q-title">문항 ${item.id} (${item.cat}) - ${item.sub}</h2>
          <div class="label">제목:</div> <div class="text-content">${item.title || item.case_title}</div>
          <div class="label">지문:</div> <div class="text-content">${item.passage || item.case_text}</div>
          ${item.q ? `<div class="label">문제:</div> <div class="text-content">${item.q}</div>` : ''}
          
          <button class="show-answer-btn" id="btn-${item.id}" onclick="toggleAnswer('${item.id}')">정답 및 해설 보기</button>
          
          <div class="hidden-answer" id="ans-${item.id}">
            <div class="label">답변:</div> <div class="text-content answer-text">${item.answer || item.a}</div>
            <div class="label">해설:</div> <div class="text-content">${item.explanation || item.desc}</div>
          </div>
        </div>
      `;
    });
    app.innerHTML = html;
  }

  function renderTestMode() {
    const app = document.getElementById('app');
    const item = ITEMS[currentQuestionIndex];
    
    app.innerHTML = `
      <div class="question-box" style="min-height: 60vh; display: flex; flex-direction: column;">
        <h2 class="q-title">[실전 모의고사] 문항 ${item.id} / 150</h2>
        <div style="color:#aaa; margin-bottom:1rem;">영역: ${item.cat} - ${item.sub}</div>
        
        <div class="text-content" style="flex-grow:1; font-size:1.1rem; padding:1.5rem; background:#111;">
          <strong>[${item.title || item.case_title}]</strong><br/><br/>
          ${item.passage || item.case_text}<br/><br/>
          ${item.q ? `<strong>${item.q}</strong>` : ''}
        </div>
        
        <div style="margin-top: 1.5rem;">
          <div class="label">답안 작성 (가상의 OMR 답안지):</div>
          <textarea class="test-textarea" id="testInput" placeholder="여기에 터치하여 실제 시험처럼 서술형 답안을 작성해 보세요..."></textarea>
        </div>

        <div class="test-controls">
          <button class="nav-btn" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>◀ 이전</button>
          <button class="check-btn" onclick="checkTestAnswer()">정답 확인 (자가 채점)</button>
          <button class="nav-btn" onclick="nextQuestion()" ${currentQuestionIndex === ITEMS.length - 1 ? 'disabled' : ''}>다음 ▶</button>
        </div>

        <div class="hidden-answer" id="testResult" style="background:#1a1a1a; padding:1.5rem; border-radius:8px; border: 1px solid #facc15; margin-top:2rem;">
            <div class="label" style="color:#facc15;">[KICE 공인 모범 답안]</div> 
            <div class="text-content answer-text">${item.answer || item.a}</div>
            <div class="label">해설 및 채점 기준:</div> 
            <div class="text-content">${item.explanation || item.desc}</div>
        </div>
      </div>
    `;
  }

  function checkTestAnswer() {
    const res = document.getElementById('testResult');
    res.style.display = 'block';
    res.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function prevQuestion() {
    if(currentQuestionIndex > 0) {
      currentQuestionIndex--;
      renderTestMode();
    }
  }

  function nextQuestion() {
    if(currentQuestionIndex < ITEMS.length - 1) {
      currentQuestionIndex++;
      renderTestMode();
    }
  }

  // Initialize
  setMode('study');

</script>
</body>
</html>
