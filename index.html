<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2027학년도 11.28 임용고시 결전 - 55개 KICE 핵심키워드 4줄 정답 & 만점 템플릿 타이핑 마스터</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0a0f1d;
  --bg-card: #121929;
  --bg-card-header: #182238;
  --bg-passage: #0b1220;
  --border-kice: #22314d;
  --border-kice-focus: #38bdf8;
  --text-main: #f1f5f9;
  --text-sub: #94a3b8;
  --text-muted: #64748b;
  --accent-blue: #38bdf8;
  --accent-gold: #fbbf24;
  --accent-emerald: #10b981;
  --accent-rose: #f43f5e;
  --accent-purple: #c084fc;
  --font-scale: 1;
}

body.b4-paper-mode {
  --bg-main: #18191c;
  --bg-card: #e8e3d5;
  --bg-card-header: #dbd4c0;
  --bg-passage: #f3efe6;
  --border-kice: #8c826e;
  --border-kice-focus: #1e3a8a;
  --text-main: #111827;
  --text-sub: #374151;
  --text-muted: #4b5563;
  --accent-blue: #1e40af;
  --accent-gold: #b45309;
  --accent-emerald: #047857;
  --accent-rose: #b91c1c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 90px;
  user-select: text;
  transition: background-color 0.3s, color 0.3s;
}

.kice-exam-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 15, 29, 0.98);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid #1e3a5f;
  padding: 10px 24px;
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
}
body.b4-paper-mode .kice-exam-header {
  background: rgba(220, 215, 200, 0.98);
  border-bottom: 2px solid #8c826e;
}

.header-inner {
  max-width: 1560px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.kice-seal {
  background: linear-gradient(135deg, #d97706, #b45309);
  color: #fff;
  font-size: 0.78rem;
  font-weight: 900;
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  border: 1px solid #fbbf24;
}

.exam-main-title {
  font-size: 1.12rem;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.examinee-tag {
  color: #38bdf8;
  font-weight: 700;
  font-size: 0.85rem;
  background: rgba(56, 189, 248, 0.1);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(56, 189, 248, 0.3);
}
body.b4-paper-mode .examinee-tag {
  color: #1e3a8a;
  background: rgba(30, 58, 138, 0.1);
  border-color: #1e3a8a;
}

.timer-container {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #091322;
  border: 1px solid #1e3a5f;
  padding: 4px 12px;
  border-radius: 8px;
}
body.b4-paper-mode .timer-container {
  background: #fdfbf7;
  border-color: #8c826e;
}

.timer-label {
  font-size: 0.75rem;
  color: var(--text-sub);
  font-weight: 600;
}

.timer-digits {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--accent-gold);
  letter-spacing: 1px;
  min-width: 75px;
  text-align: center;
}
.timer-digits.warning {
  color: var(--accent-rose);
  animation: pulse-warn 1s infinite alternate;
}

@keyframes pulse-warn {
  from { opacity: 1; }
  to { opacity: 0.4; }
}

.btn-timer {
  background: #1e293b;
  border: 1px solid #334155;
  color: #cbd5e1;
  font-size: 0.72rem;
  padding: 3px 7px;
  border-radius: 4px;
  cursor: pointer;
}
body.b4-paper-mode .btn-timer {
  background: #e2dcd0;
  color: #1f2937;
  border-color: #9ca3af;
}

.wpm-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.1);
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.btn-asmr {
  background: #1e293b;
  border: 1px solid #334155;
  color: #cbd5e1;
  font-size: 0.75rem;
  padding: 5px 9px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn-asmr.on {
  background: rgba(56, 189, 248, 0.2);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

.font-scale-ctrl {
  display: flex;
  align-items: center;
  gap: 3px;
  background: #0d1525;
  padding: 2px 6px;
  border-radius: 6px;
  border: 1px solid var(--border-kice);
}
body.b4-paper-mode .font-scale-ctrl {
  background: #dbd4c0;
}
.btn-font-scale {
  background: transparent;
  border: none;
  color: var(--text-sub);
  font-size: 0.75rem;
  font-weight: 800;
  cursor: pointer;
  padding: 2px 5px;
}
.btn-font-scale:hover { color: var(--accent-blue); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.btn-kice {
  background: #131c2e;
  color: #e2e8f0;
  border: 1px solid #2a3a54;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
body.b4-paper-mode .btn-kice {
  background: #fdfbf7;
  color: #1f2937;
  border-color: #8c826e;
}
.btn-kice:hover {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}
.btn-kice.accent {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  border: none;
  color: #fff;
}

.round-selector-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #0d1525;
  border: 1px solid var(--border-kice);
  padding: 3px 8px;
  border-radius: 6px;
}
body.b4-paper-mode .round-selector-group {
  background: #dbd4c0;
}
.round-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-sub);
  font-size: 0.76rem;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.round-btn:hover { color: var(--accent-blue); }
.round-btn.active {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  color: #fff;
  border-color: #38bdf8;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
}

.btn-kice.danger {
  border-color: rgba(244, 63, 94, 0.4);
  color: #fda4af;
}
.btn-kice.danger:hover {
  background: rgba(244, 63, 94, 0.2);
  border-color: var(--accent-rose);
  color: var(--accent-rose);
}

.sub-bar {
  max-width: 1560px;
  margin: 12px auto 0;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.period-tabs {
  display: flex;
  gap: 6px;
  background: #0d1525;
  padding: 4px;
  border-radius: 8px;
  border: 1px solid var(--border-kice);
  flex-wrap: wrap;
}
body.b4-paper-mode .period-tabs {
  background: #dbd4c0;
}

.period-tab-btn {
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 800;
  border: none;
  cursor: pointer;
  background: transparent;
  color: var(--text-sub);
  transition: all 0.2s;
}
.period-tab-btn.active {
  background: linear-gradient(135deg, #1e3a8a, #0284c7);
  color: #fff;
  box-shadow: 0 2px 10px rgba(2, 132, 199, 0.45);
}
.period-tab-btn.highlight-tab {
  border: 1px solid rgba(251, 191, 36, 0.4);
  color: #fde68a;
}
.period-tab-btn.highlight-tab.active {
  background: linear-gradient(135deg, #d97706, #b45309);
  color: #fff;
  border-color: #fbbf24;
  box-shadow: 0 2px 12px rgba(245, 158, 11, 0.5);
}

/* 55선 세부 카테고리 필터 바 */
.kice55-filter-bar {
  max-width: 1560px;
  margin: 10px auto 0;
  padding: 10px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.k55-cat-btn {
  background: #101726;
  border: 1px solid var(--border-kice);
  color: var(--text-sub);
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
body.b4-paper-mode .k55-cat-btn {
  background: #e5ded0;
  border-color: #a39985;
}
.k55-cat-btn.active {
  background: rgba(56, 189, 248, 0.2);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}
.k55-search-input {
  margin-left: auto;
  background: #080d18;
  border: 1px solid var(--border-kice);
  color: var(--text-main);
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 0.85rem;
  min-width: 260px;
}
body.b4-paper-mode .k55-search-input {
  background: #faf8f3;
  color: #111827;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-btn {
  background: transparent;
  border: 1px solid var(--border-kice);
  color: var(--text-sub);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
}
.filter-btn.active {
  background: rgba(251, 191, 36, 0.2);
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  font-weight: 800;
}

.nav-strip {
  max-width: 1560px;
  margin: 8px auto 0;
  padding: 0 24px 6px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
}

.nav-pill {
  background: #101726;
  border: 1px solid var(--border-kice);
  color: var(--text-sub);
  padding: 4px 10px;
  border-radius: 5px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
body.b4-paper-mode .nav-pill {
  background: #e5ded0;
  border-color: #a39985;
}
.nav-pill:hover {
  border-color: var(--accent-blue);
  color: #fff;
}
.nav-pill.done {
  border-color: var(--accent-emerald);
  color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.08);
}
.nav-pill.bookmarked {
  border-color: var(--accent-gold);
  color: var(--accent-gold);
}

main {
  max-width: 1560px;
  margin: 14px auto 0;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.q-card {
  background: var(--bg-card);
  border: 1px solid var(--border-kice);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
  transition: all 0.2s;
}

.q-card-head {
  background: var(--bg-card-header);
  padding: 10px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-kice);
  flex-wrap: wrap;
  gap: 8px;
}

.q-num-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--accent-gold);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.bookmark-star {
  cursor: pointer;
  font-size: 1.15rem;
  color: #4b5563;
  transition: transform 0.2s, color 0.2s;
}
.bookmark-star.active {
  color: var(--accent-gold);
  transform: scale(1.15);
}

.type-pill {
  font-size: 0.72rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 4px;
}
.type-pill.fillin { background: rgba(192, 132, 252, 0.15); color: #d8b4fe; border: 1px solid #9333ea; }
.type-pill.essay { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid #0284c7; }
.type-pill.k55 { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid #f59e0b; }

.q-card-body {
  padding: 18px;
}

.q-question-text {
  font-size: calc(1.08rem * var(--font-scale));
  font-weight: 800;
  margin-bottom: 10px;
  line-height: 1.45;
  color: var(--text-main);
}

.concept-banner {
  background: rgba(56, 189, 248, 0.08);
  border-left: 4px solid var(--accent-blue);
  padding: 8px 14px;
  border-radius: 4px;
  font-size: calc(0.9rem * var(--font-scale));
  color: var(--text-sub);
  margin-bottom: 12px;
  font-weight: 600;
}

.passage-wrapper {
  background: var(--bg-passage);
  border: 1px solid var(--border-kice);
  border-left: 4px solid var(--accent-blue);
  border-radius: 6px;
  padding: 14px 18px;
  margin-bottom: 14px;
  font-size: calc(0.94rem * var(--font-scale));
  line-height: 1.75;
  white-space: pre-line;
}

.instructions-box {
  background: rgba(0, 0, 0, 0.2);
  border: 1px dashed var(--border-kice);
  border-radius: 6px;
  padding: 12px 18px;
  margin-bottom: 14px;
  font-size: calc(0.88rem * var(--font-scale));
  line-height: 1.6;
  white-space: pre-line;
}
body.b4-paper-mode .instructions-box {
  background: #eae5d7;
}
.instructions-box strong {
  color: var(--accent-gold);
}

/* 키워드 태그 */
.kw-tags-strip {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  align-items: center;
}
.kw-label-tag {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--accent-gold);
}
.kw-pill {
  font-size: calc(0.82rem * var(--font-scale));
  padding: 4px 10px;
  border-radius: 6px;
  background: #0f172a;
  border: 1px solid rgba(251, 191, 36, 0.35);
  color: #fde68a;
  font-weight: 700;
  transition: all 0.2s;
}
body.b4-paper-mode .kw-pill {
  background: #dbd4c0;
  color: #78350f;
  border-color: #b45309;
}
.kw-pill.detected {
  background: rgba(16, 185, 129, 0.25);
  border-color: var(--accent-emerald);
  color: #6ee7b7;
  font-weight: 900;
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.35);
}

/* ================= 1줄씩 손가락으로 보고 바로 따라치기 박스 ================= */
.line-by-line-box {
  background: #09101d;
  border: 1px solid #1e3a5f;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
body.b4-paper-mode .line-by-line-box {
  background: #f5f0e4;
  border-color: #8c826e;
}
.lbl-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-kice);
  font-size: 0.84rem;
  font-weight: 800;
  color: var(--accent-blue);
}
.lbl-row {
  margin-bottom: 12px;
}
.lbl-row:last-child {
  margin-bottom: 0;
}
.lbl-target-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: calc(1.02rem * var(--font-scale));
  font-weight: 600;
  letter-spacing: 0px;
  color: #fef08a;
  margin-bottom: 4px;
  padding: 8px 14px;
  background: rgba(251, 191, 36, 0.08);
  border: 1px solid rgba(251, 191, 36, 0.22);
  border-left: 3px solid var(--accent-gold);
  border-radius: 6px;
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  transition: filter 0.2s;
}
.lbl-target-line.masked-hint {
  filter: blur(7px);
  cursor: pointer;
}
.lbl-target-line.masked-hint:hover {
  filter: blur(0);
}
.kw-blank-slot {
  display: inline;
  background: rgba(56, 189, 248, 0.22);
  color: transparent;
  border-bottom: 2px dashed #38bdf8;
  border-radius: 3px;
  cursor: pointer;
  user-select: none;
  transition: all 0.18s;
}
.kw-blank-slot:hover,
.kw-blank-slot.revealed {
  color: #fef08a;
  background: rgba(251, 191, 36, 0.25);
  border-bottom: 2px solid var(--accent-gold);
}
.kw-blank-slot.solved {
  color: #6ee7b7;
  background: rgba(16, 185, 129, 0.28);
  border-bottom: 2px solid #10b981;
}
.broadcast-select {
  background: #131c2e;
  color: #fde68a;
  border: 1px solid rgba(251, 191, 36, 0.45);
  border-radius: 5px;
  padding: 4px 8px;
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  outline: none;
}
.btn-kw-blank-main {
  background: rgba(16, 185, 129, 0.16) !important;
  border: 1px solid #10b981 !important;
  color: #6ee7b7 !important;
  font-weight: 800 !important;
}
.btn-kw-blank-main.active {
  background: #10b981 !important;
  color: #051b11 !important;
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
}
body.b4-paper-mode .lbl-target-line {
  color: #78350f;
  background: rgba(180, 83, 9, 0.1);
}
.lbl-input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.lbl-input {
  flex: 1;
  background: #050a14;
  border: 1px solid #283a58;
  border-left: 3px solid var(--accent-blue);
  border-radius: 6px;
  padding: 8px 14px;
  color: #ffffff;
  font-size: calc(1.02rem * var(--font-scale));
  font-weight: 600;
  letter-spacing: 0px;
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  outline: none;
  transition: all 0.15s;
}
.lbl-input::placeholder {
  color: rgba(148, 163, 184, 0.28);
  font-weight: 600;
  letter-spacing: 0px;
}
body.b4-paper-mode .lbl-input {
  background: #ffffff;
  color: #111827;
  border-color: #9ca3af;
}
.lbl-input:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
}
.lbl-input.line-ok {
  border-color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.08);
}
.lbl-char-badge {
  font-size: 0.78rem;
  font-weight: 800;
  min-width: 95px;
  text-align: center;
  padding: 6px 8px;
  border-radius: 6px;
  background: #162033;
  color: #94a3b8;
  font-family: 'JetBrains Mono', monospace;
}
body.b4-paper-mode .lbl-char-badge {
  background: #dbd4c0;
  color: #374151;
}
.lbl-char-badge.ok {
  background: rgba(16, 185, 129, 0.2);
  color: var(--accent-emerald);
  border: 1px solid var(--accent-emerald);
}
.lbl-char-badge.over {
  background: rgba(244, 63, 94, 0.2);
  color: var(--accent-rose);
  border: 1px solid var(--accent-rose);
}

/* 족집게 퀴즈 & 핵심키워드 손가락 타이핑 박스 */
.cases8-box {
  background: linear-gradient(180deg, rgba(16, 185, 129, 0.07) 0%, rgba(15, 23, 42, 0.7) 100%);
  border: 1px solid rgba(16, 185, 129, 0.35);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 14px;
}
body.b4-paper-mode .cases8-box {
  background: #ede7d6;
  border-color: #047857;
}
.cases8-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(16, 185, 129, 0.25);
  font-size: 0.85rem;
  font-weight: 800;
  color: #34d399;
}
body.b4-paper-mode .cases8-header {
  color: #047857;
}
.cases8-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 12px;
}
@media (max-width: 960px) {
  .cases8-grid {
    grid-template-columns: 1fr;
  }
}
.case8-item {
  background: rgba(9, 14, 26, 0.85);
  border: 1px solid #1e293b;
  border-left: 3px solid var(--accent-gold);
  border-radius: 6px;
  padding: 7px 10px;
  transition: all 0.15s;
}
body.b4-paper-mode .case8-item {
  background: #f8f5ec;
  border-color: #b5ab96;
}
.case8-item.case-ok {
  border-color: var(--accent-emerald);
  border-left: 4px solid var(--accent-emerald);
  background: rgba(16, 185, 129, 0.11);
}
.case8-q-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-size: calc(0.82rem * var(--font-scale));
  color: #cbd5e1;
  margin-bottom: 5px;
  font-weight: 600;
}
body.b4-paper-mode .case8-q-row {
  color: #1f2937;
}
.case8-ans-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.case8-target {
  font-size: calc(0.86rem * var(--font-scale));
  font-weight: 800;
  color: #fef08a;
  background: rgba(251, 191, 36, 0.12);
  border: 1px solid rgba(251, 191, 36, 0.35);
  padding: 4px 8px;
  border-radius: 5px;
  white-space: nowrap;
  max-width: 52%;
  overflow: hidden;
  text-overflow: ellipsis;
}
body.b4-paper-mode .case8-target {
  color: #78350f;
  background: rgba(180, 83, 9, 0.12);
}
.case8-input {
  flex: 1;
  background: #050a14;
  border: 1px solid #283a58;
  border-radius: 5px;
  padding: 5px 10px;
  color: #fff;
  font-size: calc(0.86rem * var(--font-scale));
  font-weight: 700;
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  outline: none;
}
body.b4-paper-mode .case8-input {
  background: #fff;
  color: #111827;
  border-color: #9ca3af;
}
.case8-input:focus {
  border-color: var(--accent-blue);
}
.case8-input.match {
  border-color: var(--accent-emerald);
  color: #6ee7b7;
}

.quiz-typing-box {
  margin-top: 12px;
  padding: 12px 16px;
  background: rgba(56, 189, 248, 0.06);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 8px;
}
.quiz-q-text {
  font-size: calc(0.92rem * var(--font-scale));
  font-weight: 700;
  color: #e2e8f0;
  margin-bottom: 8px;
}
body.b4-paper-mode .quiz-q-text {
  color: #1f2937;
}
.quiz-a-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.quiz-target-badge {
  background: rgba(251, 191, 36, 0.18);
  border: 1px solid var(--accent-gold);
  color: #fef08a;
  font-weight: 800;
  font-size: calc(0.9rem * var(--font-scale));
  padding: 6px 12px;
  border-radius: 6px;
}
body.b4-paper-mode .quiz-target-badge {
  color: #78350f;
  background: rgba(180, 83, 9, 0.15);
}
.quiz-input {
  flex: 1;
  min-width: 220px;
  background: #050a14;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 7px 12px;
  color: #fff;
  font-size: calc(0.95rem * var(--font-scale));
  font-weight: 700;
}
body.b4-paper-mode .quiz-input {
  background: #fff;
  color: #111827;
}
.quiz-input.match {
  border-color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.15);
  color: #6ee7b7;
}

/* 좌우 2분할 실전 B4 답안지 */
.sheet-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: stretch;
}

@media (max-width: 1024px) {
  .sheet-grid {
    grid-template-columns: 1fr;
  }
}

.sheet-col {
  display: flex;
  flex-direction: column;
}

.sheet-col-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-sub);
}

.b4-typing-sheet {
  width: 100%;
  flex: 1;
  min-height: 170px;
  background-color: #070d18;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(56, 189, 248, 0.38) 40px);
  background-size: 100% 40px;
  background-attachment: local;
  border: 1px solid #1e3a5f;
  border-radius: 6px;
  padding: 0 16px;
  color: #f8fafc;
  font-size: calc(1.05rem * var(--font-scale));
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  line-height: 40px;
  resize: vertical;
  outline: none;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
  transition: border-color 0.2s, box-shadow 0.2s;
}
body.b4-paper-mode .b4-typing-sheet {
  background-color: #faf8f3;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(30, 58, 138, 0.4) 40px);
  border-color: #8c826e;
  color: #111827;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
}
.b4-typing-sheet:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
}
.b4-typing-sheet.error-overflow {
  border-color: var(--accent-rose) !important;
}

.line-status-chip {
  font-size: 0.75rem;
  font-weight: 700;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.chip-item {
  padding: 1px 6px;
  border-radius: 3px;
  background: #1e293b;
  color: #94a3b8;
}
body.b4-paper-mode .chip-item {
  background: #dbd4c0;
  color: #374151;
}
.chip-item.perfect {
  background: rgba(16, 185, 129, 0.2);
  color: var(--accent-emerald);
  border: 1px solid var(--accent-emerald);
}
.chip-item.overflow {
  background: rgba(244, 63, 94, 0.25);
  color: var(--accent-rose);
  border: 1px solid var(--accent-rose);
}

.b4-answer-sheet {
  background-color: #091322;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(251, 191, 36, 0.3) 40px);
  background-size: 100% 40px;
  background-attachment: local;
  border: 1px solid #1e3a5f;
  border-radius: 6px;
  padding: 0 16px;
  color: #fef08a;
  font-size: calc(1.05rem * var(--font-scale));
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  line-height: 40px;
  white-space: pre-line;
  flex: 1;
  user-select: text;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}
body.b4-paper-mode .b4-answer-sheet {
  background-color: #faf5eb;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(180, 83, 9, 0.35) 40px);
  border-color: #8c826e;
  color: #92400e;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
}
.b4-answer-sheet.masked {
  filter: blur(5px);
  user-select: none;
  cursor: pointer;
}

.btn-sheet-mini {
  background: #1e293b;
  border: 1px solid #334155;
  color: #94a3b8;
  font-size: 0.72rem;
  padding: 2px 7px;
  border-radius: 4px;
  cursor: pointer;
}
body.b4-paper-mode .btn-sheet-mini {
  background: #e2dcd0;
  color: #1f2937;
  border-color: #9ca3af;
}
.btn-sheet-mini:hover { background: #38bdf8; color: #000; }

.scoring-eval-bar {
  margin-top: 10px;
  padding: 8px 12px;
  background: #0d1422;
  border: 1px solid #1e293b;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
}
body.b4-paper-mode .scoring-eval-bar {
  background: #eae4d5;
  border-color: #8c826e;
}
.eval-score-text {
  font-weight: 800;
  color: var(--accent-gold);
}

#report-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-box {
  background: #131c2e;
  border: 2px solid #38bdf8;
  border-radius: 12px;
  max-width: 650px;
  width: 100%;
  padding: 24px;
  color: #f8fafc;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8);
}
.modal-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: #38bdf8;
  margin-bottom: 16px;
  border-bottom: 1px solid #22314d;
  padding-bottom: 10px;
}
.report-row {
  margin-bottom: 12px;
}
.report-bar-wrap {
  background: #0a0f1d;
  height: 12px;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 4px;
}
.report-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #0284c7, #10b981);
  width: 0%;
  transition: width 0.5s ease;
}

@media print {
  body { background: #fff !important; color: #000 !important; }
  .kice-exam-header, .sub-bar, .kice55-filter-bar, .nav-strip, .scoring-eval-bar, .header-actions, .btn-sheet-mini, #toast, #report-modal { display: none !important; }
  main { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
  .q-card { border: 2px solid #000 !important; box-shadow: none !important; margin-bottom: 20px !important; page-break-inside: avoid; }
  .q-card-head { background: #f0f0f0 !important; color: #000 !important; border-bottom: 1px solid #000 !important; }
  .b4-typing-sheet, .b4-answer-sheet { background: #fff !important; border: 1px solid #000 !important; color: #000 !important; }
}

#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #10b981;
  color: #fff;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 0.88rem;
  font-weight: 700;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  transform: translateY(10px);
  z-index: 9999;
}
#toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<header class="kice-exam-header">
  <div class="header-inner">
    <div class="brand-section">
      <span class="kice-seal">11.28 결전 마스터</span>
      <h1 class="exam-main-title">2027 임용 만점 템플릿 & 55개 KICE 핵심키워드 4줄 정답 타이핑</h1>
      <span class="examinee-tag">수험자: 변귀섭 대표님</span>
    </div>

    <div class="timer-container">
      <span class="timer-label">잔여 시간</span>
      <span class="timer-digits" id="timer-display">30:00</span>
      <button class="btn-timer" onclick="toggleTimer()" id="btn-timer-toggle">일시정지</button>
      <button class="btn-timer" onclick="resetTimer()">30분 리셋</button>
      <span class="wpm-badge" id="wpm-display">0 타/분</span>
      <button class="btn-asmr" id="btn-asmr" onclick="toggleASMR()">🔔 시험장 소리·멘트 OFF</button>
      <select class="broadcast-select" id="exam-broadcast-select" onchange="playSelectedBroadcast(this.value)">
        <option value="">📢 시험장 방송 멘트 선택...</option>
        <option value="START">🔔 [본령] 시험 시작 타종 & 방송 멘트</option>
        <option value="PRE5">🔔 [예비령] 시험 시작 5분 전 유의사항 멘트</option>
        <option value="WARN10">🔔 [예고령] 시험 종료 10분 전 점검 멘트</option>
        <option value="END">🔔 [종료령] 시험 종료 타종 & 제출 멘트</option>
        <option value="CHEER">🏆 [특별방송] 변귀섭 대표님 최종합격 멘트</option>
      </select>
    </div>

    <div class="font-scale-ctrl">
      <button class="btn-font-scale" onclick="adjustFont(-0.05)">A-</button>
      <span style="font-size:0.75rem; color:var(--text-muted);">글꼴</span>
      <button class="btn-font-scale" onclick="adjustFont(0.05)">A+</button>
    </div>

    <div class="round-selector-group">
      <span style="font-size:0.75rem; color:var(--accent-gold); font-weight:800; margin-right:2px;">오늘의 회독:</span>
      <button class="round-btn active" id="round-btn-1" onclick="switchPracticeRound(1)">1회독</button>
      <button class="round-btn" id="round-btn-2" onclick="switchPracticeRound(2)">2회독</button>
      <button class="round-btn" id="round-btn-3" onclick="switchPracticeRound(3)">3회독</button>
    </div>

    <div class="header-actions">
      <button class="btn-kice btn-kw-blank-main" onclick="toggleKeywordBlankMode()" id="btn-kw-blank">🎯 핵심키워드 빈칸 만들기</button>
      <button class="btn-kice" onclick="toggleCases8Mode()" id="btn-cases8-mode" style="border-color:#38bdf8; color:#38bdf8; font-weight:800;">⚡ 경우의 수 8개 ON</button>
      <button class="btn-kice" onclick="togglePaperMode()" id="btn-paper-mode">B4 시험지 모드</button>
      <button class="btn-kice" onclick="toggleAllMasks()" id="btn-toggle-all">백지연습(정답 가리기)</button>
      <button class="btn-kice" onclick="shuffleCurrentPeriod()" id="btn-shuffle">랜덤 셔플</button>
      <button class="btn-kice" onclick="openReportModal()">종합 성적표</button>
      <button class="btn-kice" onclick="window.print()">B4 인쇄</button>
      <button class="btn-kice danger" onclick="clearCurrentAnswers()">현재 탭 비우기</button>
      <button class="btn-kice danger" onclick="clearAllPracticeRoundAnswers()">★ 오늘 전체 지우기</button>
      <button class="btn-kice accent" onclick="exportAnswers()">답안 제출 (TXT)</button>
    </div>
  </div>
</header>

<div class="sub-bar">
  <div class="period-tabs">
    <button class="period-tab-btn highlight-tab active" id="tab-btn-KICE55" onclick="switchPeriod('KICE55')">🔥 11.28 결전: 55개 KICE 키워드 4줄 정답 (55선)</button>
    <button class="period-tab-btn highlight-tab" id="tab-btn-TEMPLATE" onclick="switchPeriod('TEMPLATE')">🏛️ 내 교육학 플랫폼(서론·이처럼·결론) & 만능틀 (6선)</button>
    <button class="period-tab-btn" id="tab-btn-PED" onclick="switchPeriod('PED')">1교시 교육학 실전 (16제)</button>
    <button class="period-tab-btn" id="tab-btn-A" onclick="switchPeriod('A')">2교시 전공 A형 실전 (12제)</button>
    <button class="period-tab-btn" id="tab-btn-B" onclick="switchPeriod('B')">3교시 전공 B형 실전 (11제)</button>
  </div>
  <div class="filter-group">
    <button class="filter-btn" id="btn-bookmark-filter" onclick="toggleBookmarkFilter()">북마크(★) 모아보기</button>
    <button class="filter-btn" onclick="exportWrongNotes()">단권화 노트 다운</button>
    <div class="status-badge">
      <span class="badge-count" id="progress-count" style="font-weight:900; color:var(--accent-emerald);">0 완료</span>
    </div>
  </div>
</div>

<!-- 55개 KICE 핵심키워드 전용 영역 필터 및 실시간 검색 -->
<div class="kice55-filter-bar" id="kice55-filter-bar">
  <button class="k55-cat-btn active" onclick="setK55Category('ALL', this)">전체 55선 (01~55)</button>
  <button class="k55-cat-btn" onclick="setK55Category('PED20', this)">1교시 교육학 20선 + 내 교육학 플랫폼 (01~20)</button>
  <button class="k55-cat-btn" style="border-color:#fbbf24; color:#fde047;" onclick="switchPeriod('TEMPLATE')">🏛️ 내 교육학 플랫폼(서론·이처럼·결론) 집중연습</button>
  <button class="k55-cat-btn" onclick="setK55Category('COUNSEL35', this)">2·3교시 전공상담 35선 (21~55)</button>
  <button class="k55-cat-btn" onclick="setK55Category('DSM-5-TR 감별진단', this)">DSM-5-TR 감별 (11선)</button>
  <button class="k55-cat-btn" onclick="setK55Category('심리검사', this)">심리검사 (4선)</button>
  <button class="k55-cat-btn" onclick="setK55Category('가족치료', this)">가족치료 (4선)</button>
  <button class="k55-cat-btn" onclick="setK55Category('상담이론', this)">상담이론·성격 (12선)</button>
  <button class="k55-cat-btn" onclick="setK55Category('진로·다문화·위기', this)">진로·다문화·위기·학폭 (4선)</button>
  <input type="text" class="k55-search-input" id="k55-search-input" placeholder="🔍 KICE 키워드·학자명·장애명 즉시 검색..." oninput="renderNav(); renderCards(); loadSavedAnswers();">
</div>

<div class="nav-strip" id="nav-strip"></div>

<main id="exam-cards-container"></main>

<div id="report-modal">
  <div class="modal-box">
    <div class="modal-title">🏆 2027학년도 11.28 임용 결전 종합 성취도 리포트</div>
    <div id="report-content"></div>
    <div style="text-align: right; margin-top: 20px;">
      <button class="btn-kice accent" onclick="closeReportModal()">확인 완료</button>
    </div>
  </div>
</div>

제가 대두되고 있다.", "blanks": ["미래 교육환경", "(대주제)", "화제가 대두되고 있다"]}, {"label": "본론 이처럼~", "text": "이처럼 교사가 교육방법에서 내재적 몰입을 쓰면 자기주도 수업 혁신이 실현된다.", "blanks": ["이처럼 교사가", "교육행정", "내재적 몰입"]}, {"label": "결론 공식", "text": "또한 학생들에게 든든한 버팀목이자 교육 안내자 및 성장 촉진자가 되어야 한다.", "blanks": ["든든한 버팀목", "교육 안내자", "성장 촉진자"]}]}, {"id": 21, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "강박장애(OCD) vs 강박성 성격장애(OCPD) 및 노출 및 반응방지(ERP)", "concept": "자아 이질적(강박장애) vs 자아 동질적(강박성 성격장애) 감별 및 강박행동 소거", "keywords": ["강박장애(OCD)", "강박성 성격장애(OCPD)", "자아 이질적", "노출 및 반응방지(ERP)"], "lines": ["내담자 진숙의 공식 진단명은 강박장애이며 진수는 강박성 성격장애이다.", "진숙은 자아 이질적 특성이며 진수는 완벽주의를 당연시하는 자아 동질적이다.", "진숙에게 적용할 행동 치료적 기법의 명칭은 노출 및 반응방지(ERP)이다.", "자극에 노출시킨 후 강박행동을 차단하여 불안이 자연 소거되도록 돕는다."], "quiz_q": "강박사고를 비합리적이고 고통스럽게 여기는 강박장애의 자아 특성과 대표적 행동치료 기법은?", "quiz_a": "자아 이질적, 노출 및 반응방지(ERP)", "line_blanks": [["강박장애", "강박성 성격장애"], ["자아 이질적", "자아 동질적"], ["노출 및 반응방지(ERP)"], ["강박행동을 차단", "자연 소거"]], "cases8": [{"q": "침투적 강박사고와 불안을 줄이려는 강박행동을 반복하는 장애", "a": "강박장애(OCD)"}, {"q": "전반적인 질서·완벽주의·통제에 집착하여 융통성이 없는 성격장애", "a": "강박성 성격장애(OCPD)"}, {"q": "강박장애 내담자가 증상을 비합리적으로 여겨 고통스러워하는 특성", "a": "자아 이질적(Ego-dystonic)"}, {"q": "강박성 성격장애 내담자가 완벽주의를 자신의 가치관으로 당연시하는 특성", "a": "자아 동질적(Ego-syntonic)"}, {"q": "두 장애를 임상적으로 감별하는 가장 결정적인 증상 유무 기준", "a": "진정한 강박사고와 강박행동의 유무"}, {"q": "강박장애를 치료하는 가장 효과적인 행동치료 기법의 공식 명칭", "a": "노출 및 반응방지(ERP)"}, {"q": "ERP에서 두려워하는 오염·불안 자극에 직접 직면하게 하는 요소", "a": "노출(Exposure)"}, {"q": "ERP에서 의례적인 강박행동을 하지 못하게 차단하여 불안을 낮추는 원리", "a": "반응방지 및 불안의 자연 소거(습관화)"}]}, {"id": 22, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "공황장애(클라크의 파국적 오해석) 및 내수용성 노출과 광장공포증", "concept": "사소한 신체 감각의 파국적 오해석 교정 및 내수용성 노출을 통한 둔감화", "keywords": ["파국적 오해석", "내수용성 노출", "광장공포증", "공황장애"], "lines": ["밑줄 친 반응의 공식 명칭은 신체 감각을 위험으로 여기는 파국적 오해석이다.", "무해한 생리적 각성을 파멸로 잘못 해석하여 극심한 공포가 악순환 증폭된다.", "신체 감각에 직접 직면하게 하는 행동 기법의 명칭은 내수용성 노출이다.", "즉각 탈출하기 어려운 장소를 지속적으로 회피하는 병명은 광장공포증이다."], "quiz_q": "공황장애 치료에서 의도적으로 과호흡이나 제자리 회전 등 신체 감각을 유발해 둔감화하는 기법은?", "quiz_a": "내수용성 노출", "line_blanks": [["파국적 오해석"], ["생리적 각성"], ["내수용성 노출"], ["광장공포증"]], "cases8": [{"q": "클라크(Clark) 인지모델에서 공황발작을 유발하는 결정적 인지 기제", "a": "파국적 오해석"}, {"q": "파국적 오해석의 대상이 되는 무해한 신체 반응(심장 두근거림·호흡 등)", "a": "정상적인 생리적 각성(신체 감각)"}, {"q": "내담자가 사소한 심장 박동을 심장마비나 죽음으로 해석해 증폭되는 현상", "a": "불안과 신체 감각의 악순환적 증폭"}, {"q": "공황장애 치료를 위해 의도적으로 과호흡·제자리 회전을 유발하는 기법", "a": "내수용성 노출(내부감각 노출)"}, {"q": "내수용성 노출을 통해 내담자가 체득하게 되는 치료적 깨달음", "a": "신체 감각이 무해하며 파국이 일어나지 않음을 확인(탈감작)"}, {"q": "도움받기 어렵거나 즉각 탈출하기 어려운 장소를 극도로 회피하는 장애", "a": "광장공포증"}, {"q": "광장공포증 진단을 위해 공포·회피해야 하는 최소 상황의 개수", "a": "2가지 이상의 상황(대중교통, 열린 공간, 밀폐 공간, 군중, 집 밖 외출)"}, {"q": "공황발작이 또 일어날까 봐 미리 두려워하며 일상을 위축시키는 불안", "a": "예기불안"}]}, {"id": 23, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "신체증상장애 vs 질병불안장애 감별 진단 및 확인 행동", "concept": "실제 고통스러운 신체증상 유무에 따른 감별 및 병원을 전전하는 확인 행동", "keywords": ["신체증상장애", "질병불안장애", "신체 통증 증상", "확인 행동"], "lines": ["내담자 훈이의 공식 진단명은 신체증상장애이며 병철은 질병불안장애이다.", "훈이는 실제로 일상생활에 지장을 주는 고통스러운 신체 통증 증상이 지속된다.", "병철은 뚜렷한 신체 증상이 없음에도 불치병에 걸렸다는 집착과 불안에 몰두한다.", "병철은 의사의 정상 소견에도 불구하고 여러 병원을 전전하는 확인 행동을 보인다."], "quiz_q": "뚜렷한 신체 증상이 없거나 경미함에도 중병에 걸렸다는 공포에 사로잡혀 병원을 전전하는 장애는?", "quiz_a": "질병불안장애", "line_blanks": [["신체증상장애", "질병불안장애"], ["신체 통증 증상"], ["불치병에 걸렸다는 집착과 불안"], ["확인 행동"]], "cases8": [{"q": "실제 고통스러운 신체 증상이 있고 이에 과도한 생각·불안을 쏟는 장애", "a": "신체증상장애"}, {"q": "뚜렷한 신체 증상이 없거나 경미함에도 중병에 걸렸다고 믿는 장애", "a": "질병불안장애"}, {"q": "신체증상장애와 질병불안장애를 구별하는 가장 핵심적인 감별 기준", "a": "실제 고통스러운 신체 증상의 유무"}, {"q": "질병불안장애 내담자가 의사의 정상 소견에도 여러 병원을 전전하는 행동", "a": "과도한 확인 행동(닥터 쇼핑)"}, {"q": "질병불안장애 중 불안이 너무 심해 병원 검진조차 극도로 피하는 하위 유형", "a": "진료 회피형"}, {"q": "질병불안장애 중 수시로 병원을 찾고 검사를 반복 요청하는 하위 유형", "a": "진료 추구형"}, {"q": "두 장애가 진단되기 위한 최소 증상 지속 기간 기준", "a": "6개월 이상"}, {"q": "신체증상장애 및 질병불안장애 내담자의 핵심 인지적 특징", "a": "신체 감각의 증폭 지각 및 질병에 대한 파국적 해석"}]}, {"id": 24, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "사회적(실용적) 의사소통장애 vs 자폐스펙트럼장애 감별 진단", "concept": "제한적이고 반복적인 행동 패턴(상동증) 유무 및 화용론적 언어 결함 감별", "keywords": ["사회적 의사소통장애", "자폐스펙트럼장애", "제한적이고 반복적인 행동", "화용론적"], "lines": ["학생 진호의 진단명은 사회적 의사소통장애이며 민우는 자폐스펙트럼장애이다.", "두 장애를 구별하는 결정적 감별점은 제한적이고 반복적인 행동 패턴의 유무이다.", "민우는 상동 행동과 집착을 동반하지만 진호는 제한적이고 반복적인 행동이 없다.", "진호는 사회적 맥락에 맞게 소통하는 화용론적 언어 사용 기능에서 결함을 보인다."], "quiz_q": "사회적 맥락에 맞는 화용론적 의사소통 결함은 있으나 제한적이고 반복적인 상동 행동이 없는 장애는?", "quiz_a": "사회적(실용적) 의사소통장애", "line_blanks": [["사회적 의사소통장애", "자폐스펙트럼장애"], ["제한적이고 반복적인 행동 패턴"], ["상동 행동"], ["화용론적 언어 사용"]], "cases8": [{"q": "상황과 맥락에 맞는 화용론적 언어 사용에만 지속적 결함을 보이는 장애", "a": "사회적(실용적) 의사소통장애"}, {"q": "사회적 의사소통 결함과 함께 제한적·반복적 행동 패턴을 보이는 장애", "a": "자폐스펙트럼장애"}, {"q": "두 장애를 임상적으로 감별하는 가장 결정적인 핵심 기준", "a": "제한적이고 반복적인 행동·흥미·활동 패턴의 유무"}, {"q": "사회적(실용적) 의사소통장애에서 결함이 나타나는 언어학적 영역", "a": "화용론적(Pragmatic) 언어 기능"}, {"q": "자폐스펙트럼장애에서 나타나는 상동증·동일성 고집·특수한 집착 총칭", "a": "제한적이고 반복적인 행동 패턴"}, {"q": "사회적 의사소통장애 내담자가 이해하기 어려워하는 비문자적 표현", "a": "은유, 유머, 관용구, 문맥 속 숨은 의미"}, {"q": "타인의 마음 상태(신념·의도·감정)를 추론하는 능력의 결함 명칭", "a": "마음이론(Theory of Mind) 결함"}, {"q": "사회적 의사소통장애 아동을 돕기 위한 대표적 상담 개입", "a": "사회적 기술 훈련 및 상황 이야기(Social Stories) 기법"}]}, {"id": 25, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "주의력결핍 과잉행동장애(ADHD) 만 12세 발병 기준 및 3대 하위 유형", "concept": "만 12세 이전 발병, 2개 이상 환경 기능 손상, 복합형 및 주의력 결핍 우세형 감별", "keywords": ["만 12세 이전", "2개 이상의 장면", "복합형", "주의력 결핍 우세형"], "lines": ["만 12세 이전에 발병하여 2개 이상의 장면에서 지속적인 기능 손상을 보인다.", "부주의와 과잉행동 및 충동성 기준을 모두 충족하는 복합형으로 진단한다.", "부주의 증상만 두드러지게 나타나는 유형은 주의력 결핍 우세형으로 감별한다.", "행동 수정 기법과 인지행동치료를 함께 적용하여 자기조절 능력을 강화한다."], "quiz_q": "DSM-5-TR에서 주의력결핍 과잉행동장애(ADHD)의 증상이 시작되어야 하는 공식 기준 연령은?", "quiz_a": "만 12세 이전", "line_blanks": [["만 12세 이전", "2개 이상의 장면"], ["복합형"], ["주의력 결핍 우세형"], ["행동 수정 기법", "인지행동치료"]], "cases8": [{"q": "DSM-5-TR에서 주의력결핍 과잉행동장애(ADHD) 증상 발병 기준 연령", "a": "만 12세 이전"}, {"q": "ADHD 진단을 위해 증상이 나타나야 하는 최소 환경(장면)의 수", "a": "2개 이상의 장면(예: 가정과 학교)"}, {"q": "부주의 기준(6개 이상)과 과잉행동·충동성 기준(6개 이상)을 모두 충족함", "a": "복합형"}, {"q": "과잉행동은 없으나 부주의와 산만함 증상만 6개월 이상 지속되는 유형", "a": "주의력 결핍 우세형"}, {"q": "부주의는 없으나 가만히 있지 못하고 끼어드는 증상만 두드러지는 유형", "a": "과잉행동-충동 우세형"}, {"q": "ADHD 아동의 바람직한 행동을 즉시 강화하고 문제행동을 줄이는 기법", "a": "토큰 강화(행동 수정 기법) 및 반응대가"}, {"q": "ADHD 아동이 행동하기 전에 '멈추고-생각하고-행동하기'를 익히는 기법", "a": "자기교시 훈련(인지행동치료)"}, {"q": "ADHD 진단 시 증상이 지속되어야 하는 최소 기간", "a": "6개월 이상"}]}, {"id": 26, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "적대적 반항장애(ODD) vs 품행장애(CD 아동기 발병형) 감별 진단", "concept": "타인의 권리 침해 및 규칙 위반 유무와 만 10세 이전 아동기 발병형의 반사회성 예후", "keywords": ["적대적 반항장애", "품행장애", "만 10세 이전 아동기 발병형", "부모 관리 훈련"], "lines": ["권위자에게 반항하지만 타인의 권리를 침해하지 않는 적대적 반항장애이다.", "타인의 권리와 규칙을 반복적으로 위반하며 공격성을 보이는 품행장애이다.", "만 10세 이전에 발병하는 아동기 발병형은 성인기 반사회성으로 쉽게 진행된다.", "친사회적 정서 결여를 조기에 선별하고 부모 관리 훈련과 행동치료를 쓴다."], "quiz_q": "품행장애 중 만 10세 이전에 발병하며 공격성이 높고 성인기 반사회성 성격장애로 진행될 위험이 높은 유형은?", "quiz_a": "아동기 발병형", "line_blanks": [["적대적 반항장애"], ["품행장애"], ["만 10세 이전", "아동기 발병형"], ["친사회적 정서 결여", "부모 관리 훈련"]], "cases8": [{"q": "권위자에게 논쟁·반항하고 화를 내지만 타인의 기본 권리는 침해하지 않음", "a": "적대적 반항장애(ODD)"}, {"q": "사람·동물 폭행, 재산 파괴, 절도 등 타인의 권리와 규범을 심각하게 위반함", "a": "품행장애(CD)"}, {"q": "적대적 반항장애와 품행장애를 감별하는 가장 결정적인 기준", "a": "타인의 기본적 권리 침해 및 사회적 규범 위반 여부"}, {"q": "품행장애 중 첫 증상이 만 10세 이전에 나타나며 예후가 나쁜 하위 유형", "a": "아동기 발병형"}, {"q": "품행장애 아동기 발병형이 성인기에 이르러 발전하기 쉬운 성격장애", "a": "반사회성 성격장애"}, {"q": "품행장애 중 죄책감·공감 결여 및 냉담하고 무정서를 보이는 명시자", "a": "제한된 친사회적 정서"}, {"q": "적대적 반항장애·품행장애 아동의 양육 방식을 교정하는 대표적 개입", "a": "부모 관리 훈련(PMT)"}, {"q": "적대적 반항장애의 3대 핵심 증상 범주", "a": "분노/과민한 기분, 논쟁적/반항적 행동, 보복성"}]}, {"id": 27, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "반응성 애착장애(RAD) vs 탈억제 사회관여 장애(DSED) 감별 진단", "concept": "영유아기 극심한 방임 후 정서적 위축(반응성) vs 낯선 성인 무경계 접근(탈억제)", "keywords": ["반응성 애착장애", "탈억제 사회관여 장애", "지속적인 방임", "1차 돌봄 환경"], "lines": ["고통 속에서도 위로를 구하지 않고 위축된 반응성 애착장애를 진단한다.", "낯선 성인에게 경계 없이 과도하게 다가가는 탈억제 사회관여 장애이다.", "두 장애 모두 영유아기 양육자의 지속적인 정서적 방임과 결핍에서 비롯된다.", "안정적인 1차 돌봄 환경을 구축하고 일관되고 안전한 치료적 애착을 맺는다."], "quiz_q": "영유아기 방임 후 낯선 성인에게 전혀 주저함이나 경계심 없이 과도하게 친밀하게 다가가는 장애는?", "quiz_a": "탈억제 사회관여 장애", "line_blanks": [["반응성 애착장애"], ["탈억제 사회관여 장애"], ["정서적 방임과 결핍"], ["1차 돌봄 환경", "치료적 애착"]], "cases8": [{"q": "고통스러운 상황에서도 애착 대상에게 위로를 구하지 않고 정서적으로 위축됨", "a": "반응성 애착장애(RAD)"}, {"q": "낯선 성인에게도 경계심 없이 과도하게 친밀하게 다가가고 따라가는 장애", "a": "탈억제 사회관여 장애(DSED)"}, {"q": "반응성 애착장애와 탈억제 사회관여 장애의 공통된 핵심 발병 원인", "a": "영유아기 극심한 사회적·정서적 방임(양육 결핍)"}, {"q": "두 장애를 감별하는 핵심 행동 방향(내재화 위축 vs 외현화 무경계)", "a": "애착 억제·위축(RAD) vs 낯선 성인 무분별 접근(DSED)"}, {"q": "반응성 애착장애의 증상이 시작되는 연령 기준", "a": "생후 9개월 이후 ~ 만 5세 이전"}, {"q": "탈억제 사회관여 장애가 진단되기 위한 최소 발달 연령 기준", "a": "발달 연령 최소 9개월 이상"}, {"q": "두 장애 아동을 돕기 위해 가장 최우선으로 조치해야 하는 환경 개입", "a": "안정적이고 일관된 1차 돌봄 환경 구축"}, {"q": "상담실 및 양육 환경에서 아동과 재형성해야 하는 핵심 관계", "a": "안전한 치료적 애착 관계 및 경계선 교육"}]}, {"id": 28, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "외상후 스트레스 장애(PTSD) vs 급성 스트레스 장애(ASD) 감별 진단", "concept": "침습·회피·인지기분·각성 4대 증상군 및 1개월 지속 기간 분기점과 EMDR 치료", "keywords": ["침습과 회피", "3일에서 1개월", "1개월 이상", "EMDR"], "lines": ["외상 사건을 재경험하는 침습과 고통스러운 기억을 회피하는 양상을 보인다.", "증상이 외상 후 3일에서 1개월 이내 지속되는 장애는 급성 스트레스 장애이다.", "핵심 증상이 1개월 이상 지속되어 기능 손상을 주는 외상후 스트레스 장애이다.", "안정화 기법과 안구운동 민감소실 및 재처리 치료(EMDR)로 회복을 돕는다."], "quiz_q": "급성 스트레스 장애(3일~1개월)와 외상후 스트레스 장애(1개월 이상)를 가르는 결정적 기간 기준은?", "quiz_a": "1개월", "line_blanks": [["침습", "회피"], ["3일에서 1개월", "급성 스트레스 장애"], ["1개월 이상", "외상후 스트레스 장애"], ["안구운동 민감소실 및 재처리 치료(EMDR)"]], "cases8": [{"q": "외상 사건이 악몽이나 플래시백으로 본인의 의지와 무관하게 떠오르는 증상", "a": "침습(재경험) 증상"}, {"q": "외상과 관련된 생각·감정·장소·사람을 필사적으로 피하려는 증상", "a": "회피 증상"}, {"q": "외상 사건 후 증상이 '3일 이상 ~ 1개월 이내' 지속될 때 내리는 진단명", "a": "급성 스트레스 장애(ASD)"}, {"q": "외상 사건 후 핵심 증상이 '1개월 이상' 지속될 때 내리는 진단명", "a": "외상후 스트레스 장애(PTSD)"}, {"q": "급성 스트레스 장애와 외상후 스트레스 장애를 가르는 결정적 기간 기준", "a": "1개월"}, {"q": "외상 기억을 떠올리며 양측성 안구운동을 통해 둔감화·재처리하는 치료법", "a": "안구운동 민감소실 및 재처리 치료(EMDR)"}, {"q": "외상 기억 직면 전에 내담자의 안전감과 정서 조절력을 먼저 확보하는 단계", "a": "안정화(Stabilization) 기법"}, {"q": "사소한 소리에도 깜짝 놀라고 항상 위험을 경계하며 잠들기 어려운 증상군", "a": "각성과 반응성의 현저한 변화(과각성)"}]}, {"id": 29, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "해리성 기억상실(해리성 둔주) vs 해리성 정체성 장애 및 인격 통합", "concept": "기억 상실 후 방황하는 해리성 둔주와 2개 이상의 하위 인격을 1개로 통합하는 치료", "keywords": ["해리성 기억상실", "해리성 정체성 장애", "해리성 둔주", "2개 이상의 인격"], "lines": ["내담자 민석의 진단명은 해리성 기억상실이며 지우는 해리성 정체성 장애이다.", "민석은 자신의 과거를 기억하지 못하고 방황하는 해리성 둔주를 동반한다.", "지우는 한 사람의 내면에 2개 이상의 구별되는 뚜렷한 하위 인격을 나타낸다.", "분리된 여러 하위 인격들을 조화롭게 화해시켜 1개의 온전한 자아로 통합한다."], "quiz_q": "해리성 기억상실 내담자가 외상 후 과거와 정체성을 잊은 채 예정에 없던 여행이나 방황을 하는 양상은?", "quiz_a": "해리성 둔주", "line_blanks": [["해리성 기억상실", "해리성 정체성 장애"], ["해리성 둔주"], ["2개 이상의 구별되는 뚜렷한 하위 인격"], ["1개의 온전한 자아로 통합"]], "cases8": [{"q": "충격적 사건 후 중요한 자서전적 정보를 기억하지 못하는 해리 장애", "a": "해리성 기억상실"}, {"q": "한 사람 안에 2개 이상의 구별되는 정체성(하위 인격)이 존재하는 장애", "a": "해리성 정체성 장애(DID)"}, {"q": "기억상실과 함께 정체성을 잊고 집을 떠나 목적 없이 배회·여행하는 양상", "a": "해리성 둔주(Dissociative Fugue)"}, {"q": "해리성 기억상실의 기억 손상이 뇌 손상이나 단순 건망증과 구별되는 특징", "a": "주로 외상적이거나 스트레스적인 자서전적 기억의 선택적 상실"}, {"q": "해리성 정체성 장애에서 인격 간 기억 공유가 안 되어 나타나는 현상", "a": "일상 사건과 외상 기억의 반복적 공백(기억 단절)"}, {"q": "해리성 정체성 장애의 가장 주된 발달적 원인으로 꼽히는 외상", "a": "아동기 만성적이고 심각한 신체적·성적 학대"}, {"q": "해리성 정체성 장애 치료의 궁극적인 최종 목표", "a": "분리된 하위 인격들을 1개의 온전한 자아로 통합"}, {"q": "해리성 장애 내담자의 하위 인격들을 다룰 때 상담자의 올바른 태도", "a": "모든 하위 인격의 존재와 기능을 공감적으로 수용하고 협력 유도"}]}, {"id": 30, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "경계선 성격장애 vs 의존성 성격장애 및 분열 방어기제와 DBT", "concept": "이상화와 평가절하를 오가는 분열 기제(경계선) vs 순종·굴종(의존성) 및 DBT", "keywords": ["경계선 성격장애", "의존성 성격장애", "분열 방어기제", "변증법적 행동치료(DBT)"], "lines": ["진희는 경계선 성격장애이며 수연은 의존성 성격장애로 각각 감별 진단한다.", "진희는 타인을 극단적 이상화와 평가절하로 분리하는 분열 방어기제를 쓴다.", "수연은 버림받지 않기 위해 타인에게 과도하게 굴종하고 수동적으로 순종한다.", "수용과 변화를 통합하여 정서 조절을 돕는 변증법적 행동치료(DBT)를 쓴다."], "quiz_q": "경계선 성격장애 내담자가 타인을 극단적 이상화와 극단적 평가절하의 양극단으로 나누는 방어기제는?", "quiz_a": "분열(분할)", "line_blanks": [["경계선 성격장애", "의존성 성격장애"], ["이상화와 평가절하", "분열 방어기제"], ["굴종", "순종"], ["변증법적 행동치료(DBT)"]], "cases8": [{"q": "버림받지 않으려 극단적 노력을 하고 정서·대인관계가 불안정한 성격장애", "a": "경계선 성격장애"}, {"q": "스스로 결정을 못 내리고 보살핌을 받기 위해 과도하게 순종하는 성격장애", "a": "의존성 성격장애"}, {"q": "경계선 성격장애 내담자가 타인을 극단적 이상화와 평가절하로 나누는 기제", "a": "분열(분할, Splitting) 방어기제"}, {"q": "관계 단절 직면 시 경계선(분노·자해) vs 의존성(굴종·새 관계 찾기) 차이", "a": "경계선은 격렬 3)"}, {"q": "재구성임상척도 중 규칙 위반과 반사회적 행동 경향을 측정하는 척도", "a": "반사회적 행동 척도(RC4)"}]}, {"id": 34, "part": "COUNSEL35", "domain": "심리검사", "title": "로샤 종합체계 경험균형(외향형) 및 D점수 스트레스 과부하", "concept": "인간운동반응(M)보다 유색반응(WSumC)이 높은 외향형 및 D점수 음수(-2) 과부하", "keywords": ["인간운동반응(M)", "유색반응(WSumC)", "외향형", "D점수 과부하"], "lines": ["인간운동반응(M)보다 유색반응(WSumC)이 높으므로 대처 유형은 외향형이다.", "외부의 정서적 자극에 민감하게 반응하고 행동 중심의 문제해결을 우선 시도한다.", "D점수가 음수인 상태는 내적 가용 자원보다 스트레스가 큰 과부하 상태이다.", "충동적 행동화와 통제력 상실을 방지하기 위해 스트레스를 줄이고 지지를 준다."], "quiz_q": "로샤 검사에서 가용 자원(EA)보다 경험 자극(es)이 훨씬 커서 D점수가 음수(-2)로 나타난 심리 상태는?", "quiz_a": "스트레스 과부하 상태", "line_blanks": [["인간운동반응(M)", "유색반응(WSumC)", "외향형"], ["행동 중심의 문제해결"], ["D점수가 음수", "과부하 상태"], ["통제력 상실"]], "cases8": [{"q": "로샤 종합체계에서 내면의 사고·상상·공상 활동을 반영하는 결정인", "a": "인간운동반응(M)"}, {"q": "로샤 종합체계에서 외부 환경과의 정서적 교류 및 감정 표출을 반영함", "a": "유색반응 가중치 합(WSumC)"}, {"q": "M보다 WSumC가 유의하게 높을 때(예: 2:6)의 경험균형(EB) 유형", "a": "외향형(Extratensive)"}, {"q": "외향형 내담자의 전형적인 문제해결 및 정서 반응 스타일", "a": "외부 정서 자극에 민감하고 시행착오적·행동 중심적 문제해결"}, {"q": "가용 자원(EA)과 경험 자극(es)의 차이를 통해 현재 스트레스 인내력을 봄", "a": "D점수"}, {"q": "D점수가 음수(예: D = -2)일 때 내담자가 처한 심리적 상태", "a": "내적 가용 자원보다 스트레스 자극이 훨씬 큰 스트레스 과부하 상태"}, {"q": "D점수 음수(-2) 상태에서 가장 우려되는 임상적 위험", "a": "정서적 통제력 상실 및 충동적 행동화"}, {"q": "상황적 스트레스를 배제하고 평소 기질적인 통제 용량을 보여주는 점수", "a": "수정 D점수(Adj D)"}]}, {"id": 35, "part": "COUNSEL35", "domain": "심리검사", "title": "웩슬러 지능검사 일반능력지수(GAI)·인지효능지수(CPI) 및 TCI 검사", "concept": "작업기억·처리속도 저하 시 순수 인지 잠재력인 일반능력지수(GAI) 확인 및 TCI 자율성·연대감", "keywords": ["일반능력지수(GAI)", "TCI", "자극추구와 위험회피", "자율성과 연대감"], "lines": ["불안과 주의력 저하로 작업기억과 처리속도가 낮아지면 일반능력지수(GAI)를 본다.", "TCI에서 자극추구가 높고 위험회피가 낮으면 강한 호기심과 충동성을 보인다.", "성숙도와 사회적 적응을 결정하는 핵심 성격 척도는 자율성과 연대감이다.", "자기 행동을 책임지는 자율성과 타인을 수용하는 연대감을 함께 길러준다."], "quiz_q": "웩슬러 지능검사에서 작업기억과 처리속도의 감점을 배제하고 순수한 고차적 인지 잠재력을 보는 지수는?", "quiz_a": "일반능력지수(GAI)", "line_blanks": [["작업기억과 처리속도", "일반능력지수(GAI)"], ["TCI", "자극추구", "위험회피"], ["자율성과 연대감"], ["자율성", "연대감"]], "cases8": [{"q": "웩슬러 지능검사(K-WISC-V)의 5대 기본 지수", "a": "언어이해, 시공간, 유동추론, 작업기억, 처리속도"}, {"q": "작업기억과 처리속도를 제외하고 고차적 추론 잠재력을 나타내는 지수", "a": "일반능력지수(GAI)"}, {"q": "작업기억과 처리속도를 묶어 주의집중 및 인지적 효율성을 보는 지수", "a": "인지효능지수(CPI)"}, {"q": "정서 불안이나 ADHD로 CPI가 낮아졌을 때 순수 지적 잠재력을 보는 지표", "a": "일반능력지수(GAI)"}, {"q": "TCI 기질 척도 중 새로운 자극에 끌리고 흥분과 보상을 추구하는 성향", "a": "자극추구(NS)"}, {"q": "TCI 기질 척도 중 위험과 처벌 단서에 민감하여 행동을 억제하는 성향", "a": "위험회피(HA)"}, {"q": "자극추구(NS)가 높고 위험회피(HA)가 낮을 때 나타나기 쉬운 행동 특성", "a": "강한 호기심과 높은 충동성 및 규칙 위반 위험"}, {"q": "TCI에서 성격 성숙도와 성격장애 유무를 판별하는 핵심 성격 2척도", "a": "자율성(SD)과 연대감(CO)"}]}, {"id": 36, "part": "COUNSEL35", "domain": "가족치료", "title": "보웬 다세대 가족치료 삼각관계·탈삼각화 및 자기분화", "concept": "부부 불안에 자녀를 끌어들이는 삼각관계 해체 및 상담자의 정서적 중립성과 탈삼각화", "keywords": ["삼각관계", "신체화 증상", "정서적 중립성", "탈삼각화"], "lines": ["부부 사이의 갈등에 자녀를 끌어들이는 가족 역동의 명칭은 삼각관계이다.", "자녀는 부모 사이의 불안을 흡수하여 복통이라는 신체화 증상을 나타낸다.", "상담자는 부모 어느 한쪽에도 치우치지 않고 객관적 정서적 중립성을 지킨다.", "자녀를 부모의 갈등에서 분리하여 자율성을 주는 개입 기법은 탈삼각화이다."], "quiz_q": "보웬 가족치료에서 부부 갈등에 얽힌 자녀를 분리하고 상담자가 정서적 중립성을 유지하는 핵심 개입은?", "quiz_a": "탈삼각화", "line_blanks": [["삼각관계"], ["신체화 증상"], ["정서적 중립성"], ["탈삼각화"]], "cases8": [{"q": "보웬 치료에서 두 사람(부부)의 불안을 낮추려 제3자(자녀)를 끌어들이는 역동", "a": "삼각관계(Triangulation)"}, {"q": "부모의 만성 불안을 흡수한 표적 자녀에게 나타나는 복통·두통 등 증상", "a": "신체화 증상 및 정서적 역기능"}, {"q": "보웬 치료에서 사고와 감정을 분리하고 타인의 불안에 휩쓸리지 않는 능력", "a": "자기분화(Differentiation of Self)"}, {"q": "삼각관계에 얽힌 자녀를 부모 갈등에서 분리하여 해방시키는 핵심 개입", "a": "탈삼각화(Detriangulation)"}, {"q": "탈삼각화를 위해 상담자가 부모 어느 쪽에도 치우치지 않고 유지하는 태도", "a": "정서적 중립성(탈삼각화된 위치)"}, {"q": "부모의 낮은 자기분화 수준이 자녀 세대로 대물림되는 보웬의 개념", "a": "다세대 전수 과정"}, {"q": "원가족의 미해결 애착 불안을 피하기 위해 물리적·정서적으로 단절하는 현상", "a": "정서적 단절"}, {"q": "3세대 이상의 가족 관계 패턴과 삼각관계를 도식화하여 분석하는 도구", "a": "가계도(Genogram)"}]}, {"id": 37, "part": "COUNSEL35", "domain": "가족치료", "title": "미누친 구조적 가족치료 밀착·유리 경계선 및 실연화(Enactment)", "concept": "밀착된 경계선과 유리된 경계선을 명확한 경계선으로 교정하기 위한 상담실 내 실연화", "keywords": ["밀착된 경계선", "유리된 경계선", "실연화(Enactment)", "명확한 경계선"], "lines": ["어머니와 아들은 밀착된 경계선이며 아버지는 가족과 유리된 경계선이다.", "상담실에서 실제 가족의 갈등 행동을 재연하게 하는 기법은 실연화이다.", "설명으로 듣는 대신 상호작용 패턴을 현장에서 있는 그대로 직접 관찰한다.", "역기능적 의사소통 구조를 교정하고 세대 간 명확한 경계선을 재형성한다."], "quiz_q": "미누친의 구조적 가족치료에서 상담실 안에서 가족의 갈등 대화를 지금-여기에서 직접 재연하게 하는 기법은?", "quiz_a": "실연화(Enactment)", "line_blanks": [["밀착된 경계선", "유리된 경계선"], ["실연화"], ["상호작용 패턴", "직접 관찰"], ["명확한 경계선"]], "cases8": [{"q": "미누친 가족치료에서 구성원 간 거리감이 전혀 없고 자율성이 침해된 경계", "a": "밀착된 경계선"}, {"q": "구성원 간 지나치게 무관심하고 정서적 지지와 소통이 단절된 경계", "a": "유리된 경계선(경직된 경계선)"}, {"q": "미누친 구조적 가족치료가 궁극적으로 형성하고자 하는 건강한 경계", "a": "명확한 경계선"}, {"q": "상담실 안에서 가족의 실제 갈등 대화를 지금-여기에서 직접 재연하게 함", "a": "실연화(Enactment)"}, {"q": "실연화 기법을 통해 상담자가 얻는 임상적 이점", "a": "설명으로 듣는 대신 역기능적 상호작용 패턴을 현장에서 직접 관찰·수정"}, {"q": "부모 중 한 명이 자녀와 밀착하여 다른 배우자에 대항하는 역기능적 하위체계", "a": "세대 간 연합(삼각화)"}, {"q": "상담자가 가족 특유의 정서와 의사소통 방식을 수용하며 신뢰를 쌓는 기법", "a": "합류하기(Joining)와 적응"}, {"q": "가족 내 권력 위계와 하위체계 경계를 재조직하는 핵심 개입 목표", "a": "가족 구조의 재구조화"}]}, {"id": 38, "part": "COUNSEL35", "domain": "가족치료", "title": "사티어 경험적 가족치료 역기능적 의사소통과 일치형 및 가족조각", "concept": "회유형·비난형·초이성형·산만형을 자기·타인·상황을 모두 존중하는 일치형으로 변화", "keywords": ["회유형과 초이성형", "일치형 의사소통", "자기와 타인 존중", "가족조각 기법"], "lines": ["자기를 무시하고 타인에게만 맞추는 회유형과 논리만 따지는 초이성형을 본다.", "가족 간 정서적 거리와 역동을 신체 자세와 공간 배치로 표현하는 가족조각이다.", "언어적 방어를 우회하여 가족 내 숨겨진 역동과 억압된 감정을 생생히 직면한다.", "자기와 타인 및 상황을 모두 존중하는 성숙한 일치형 의사소통으로 변화시킨다."], "quiz_q": "사티어 경험적 가족치료에서 자기, 타인, 상황의 3요소를 모두 균형 있게 존중하는 가장 건강한 의사소통 유형은?", "quiz_a": "일치형", "line_blanks": [["회유형", "초이성형"], ["가족조각"], ["언어적 방어를 우회", "억압된 감정"], ["일치형 의사소통"]], "cases8": [{"q": "사티어 의사소통 중 자기를 무시하고 무조건 타인 비위만 맞추는 유형", "a": "회유형"}, {"q": "타인을 무시하고 남을 탓하며 권위적으로 군림하려는 의사소통 유형", "a": "비난형"}, {"q": "자기와 타인의 감정을 모두 배제하고 오직 논리·규칙·상황만 따지는 유형", "a": "초이성형"}, {"q": "자기·타인·상황을 모두 무시하고 주제를 벗어나 산만하게 회피하는 유형", "a": "산만형"}, {"q": "자기, 타인, 상황의 3요소를 모두 존중하며 내적 감정과 외적 표현이 일치함", "a": "일치형 의사소통"}, {"q": "가족 간 정서적 거리와 권력 역동을 무언의 신체 자세와 공간 배치로 표현함", "a": "가족조각(Family Sculpting) 기법"}, {"q": "가족조각 기법이 언어적 상담에 비해 갖는 강력한 치료적 효과", "a": "언어적 방어를 우회하여 숨겨진 가족 역동과 감정을 생생히 직면"}, {"q": "사티어 경험적 가족치료의 가장 핵심적인 치료 목표", "a": "자아존중감(자기 가치감) 고양 및 일치형 소통 달성"}]}, {"id": 39, "part": "COUNSEL35", "domain": "가족치료", "title": "헤일리 전략적 가족치료 역설적 지시와 밀란 모델 순환적 질문", "concept": "증상 행동을 고의로 처방하여 통제력을 회복하는 역설적 지시와 관계 차이를 묻는 순환적 질문", "keywords": ["역설적 지시", "증상 처방", "긍정적 의미 부여", "순환적 질문"], "lines": ["문제 행동을 오히려 의도적으로 수행하게 처방하는 기법은 역설적 지시이다.", "가족의 저항을 무너뜨리고 증상이 스스로 통제 가능함을 깨닫게 하여 변화시킨다.", "문제 행동이 가족의 화합을 지키려는 선한 의도라고 재명명하여 비난을 줄인다.", "가족 구성원 간 관계의 차이와 상호작용 고리를 스스로 깨닫는 순환적 질문을 쓴다."], "quiz_q": "전략적 가족치료에서 내담자 가족의 저항을 다루기 위해 문제 증상을 일부러 계속하라고 지시하는 기법은?", "quiz_a": "역설적 지시(증상 처방)", "line_blanks": [["역설적 지시"], ["저항을 무너뜨리고", "통제 가능함"], ["선한 의도라고 재명명"], ["순환적 질문"]], "cases8": [{"q": "헤일리 전략적 치료에서 저항을 깨기 위해 문제 행동을 일부러 하라고 지시함", "a": "역설적 지시(증상 처방)"}, {"q": "역설적 지시를 통해 내담자와 가족이 깨닫게 되는 치료적 변화 원리", "a": "저항 무력화 및 증상이 스스로 통제 가능함을 자각"}, {"q": "문제 행동을 부정적 비난 대신 긍정적인 문맥과 의미로 다시 이름 붙임", "a": "재명명(재구조화, Reframing)"}, {"q": "밀란(Milan) 모델에서 자녀의 증상이 가족 화합을 지키려는 선한 의도라고 해석함", "a": "긍정적 의미 부여(긍정적 함축)"}, {"q": "밀란 모델에서 가족 구성원 간 관계의 차이와 상호작용 고리를 묻는 질문", "a": "순환적 질문"}, {"q": "순환적 질문이 가족의 인식을 어떻게 변화시키는가(직선적 vs 순환적)", "a": "개인을 탓하는 직선적 인과론에서 벗어나 상호작용의 순환적 고리를 자각"}, {"q": "헤일리가 중시한 가족 내 세대 간 지켜져야 할 구조적 질서", "a": "위계질서(Hierarchy)의 확립"}, {"q": "문제 증상을 없애기 위해 긍정적이지만 조금 힘든 과제를 부여하는 기법", "a": "시련 기법(Ordeal Therapy)"}]}, {"id": 40, "part": "COUNSEL35", "domain": "상담이론", "title": "빅터 프랑클 의미치료 탈숙고(Dereflection) 및 역설적 의도", "concept": "과잉 숙고 차단 및 외부의 가치로 주의를 돌리는 탈숙고와 예기불안을 깨는 역설적 의도", "keywords": ["탈숙고(Dereflection)", "불안 악순환 차단", "역설적 의도", "증상 통제"], "lines": ["증상에 대한 주의를 외부 가치로 돌리는 기법은 탈숙고(Dereflection)다.", "지나친 반성으로 생기는 불안 악순환을 차단하여 자발성을 되찾게 한다.", "두려워하는 증상을 스스로 의도하여 증상을 통제하는 기법은 역설적 의도이다.", "회피하려던 증상을 직면하게 함으로써 증상이 스스로 통제됨을 깨닫게 한다."], "quiz_q": "프랑클의 의미치료에서 증상에 대한 과잉 숙고를 차단하고 외부의 의미 있는 가치로 주의를 돌리는 기법은?", "quiz_a": "탈숙고(Dereflection)", "line_blanks": [["탈숙고(Dereflection)"], ["불안 악순환을 차단"], ["역설적 의도"], ["증상이 스스로 통제됨"]], "cases8": [{"q": "프랑클 의미치료에서 증상에 대한 과잉 주의를 외부의 의미 있는 가치로 돌림", "a": "탈숙고(Dereflection)"}, {"q": "탈숙고 기법이 차단하고자 하는 내담자의 병리적 집착 현상", "a": "과잉 숙고(지나친 자기 관찰)와 과잉 의도"}, {"q": "두려워하는 증상이 나타나기를 오히려 스스로 소망하고 의도하게 하는 기법", "a": "역설적 의도(Paradoxical Intention)"}, {"q": "역설적 의도 기법이 깨뜨리는 불안의 악순환 기제", "a": "예기불안의 악순환 차단"}, {"q": "역설적 의도를 사용할 때 내담자가 자기 문제와 거리를 두도록 돕는 태도", "a": "유머 감각과 자기초월(자기거리두기)"}, {"q": "삶의 의미와 목적을 찾지 못해 극심한 공허감과 무기력에 빠진 상태", "a": "실존적 공허(실존적 좌절)"}, {"q": "프랑클이 제시한 삶의 의미를 발견하는 3대 가치", "a": "창조적 가치, 경험적 가치, 태도적 가치"}, {"q": "피할 수 없는 고통과 시련 앞에서도 존엄한 태도를 선택해 찾는 최고 가치", "a": "태도적 가치"}]}, {"id": 41, "part": "COUNSEL35", "domain": "상담이론", "title": "아론 벡 인지치료 인지적 오류(이분법·재앙화) 및 하향 화살표 기법", "concept": "표면적 자동적 사고에서 연속 질문을 통해 기저의 핵심 신념을 파헤치는 하향 화살표 기법", "keywords": ["이분법적 사고", "재앙화", "하향 화살표 기법", "역기능적 신념"], "lines": ["사례의 1번 오류는 이분법적 사고이며 2번은 파국적 결과를 예상하는 재앙화다.", "핵심 신념을 체계적으로 탐색하기 위해 사용한 기법은 하향 화살표 기법이다.", "자동적 사고의 기저에 깔려 있는 역기능적 신념을 단계별로 파헤쳐 확인한다.", "만약 그 생각이 사실이라면 그것이 무엇을 의미하는지 질문하여 밝혀낸다."], "quiz_q": "표면적인 자동적 사고에 대해 '그것이 사실이라면 당신에게 어떤 의미인가요?'라고 물어 핵심 신념을 찾는 기법은?", "quiz_a": "하향 화살표 기법", "line_blanks": [["이분법적 사고", "재앙화"], ["하향 화살표 기법"], ["역기능적 신념"], ["무엇을 의미하는지 질문"]], "cases8": [{"q": "아론 벡의 인지적 오류 중 중간 지대 없이 성공 아니면 실패로만 나누는 오류", "a": "이분법적 사고(흑백논리)"}, {"q": "충분한 근거 없이 미래를 가장 최악의 파국적 결과로 단정 짓는 오류", "a": "재앙화(파국화)"}, {"q": "자신과 무관한 외부의 부정적 사건을 모두 자기 탓으로 연결 짓는 오류", "a": "개인화"}, {"q": "전체 맥락을 무시하고 부정적인 세부 단서 하나만 골라내어 전체를 판단함", "a": "선택적 추상화(정신적 여과)"}, {"q": "한두 번의 실패 경험을 바탕으로 모든 상황에 영원히 적용하는 오류", "a": "과잉일반화"}, {"q": "표면적 자동적 사고에서 연속 질문으로 기저의 핵심 신념을 파헤치는 기법", "a": "하향 화살표 기법"}, {"q": "하향 화살표 기법에서 상담자가 반복해서 던지는 핵심 질문 문장", "a": "만약 그 생각이 사실이라면, 그것이 당신에게 무엇을 의미하나요?"}, {"q": "자동적 사고와 핵심 신념 사이에 존재하는 조건부 규칙·가정·태도", "a": "중간 신념(역기능적 가정)"}]}, {"id": 42, "part": "COUNSEL35", "domain": "상담이론", "title": "엘리스 합리적 정서행동치료(REBT) 3대 논박 및 수치심 공격 연습", "concept": "논리적·실증적·실용적 논박을 통한 당위적 신념 해체 및 수치심 공격 연습", "keywords": ["REBT", "실증적 논박", "실용적 논박", "논리적 논박"], "lines": ["REBT에서 비합리적 신념을 뒷받침하는 객관적 사실 증거를 묻는 실증적 논박이다.", "신념을 고수하는 것이 실제 삶에 어떤 도움이 되는지 묻는 실용적 논박이다.", "전제와 결론 사이의 비논리적 비약과 모순을 지적하는 논리적 논박을 한다.", "타인의 시선에 대한 파국적 두려움을 깨뜨리는 수치심 공격 연습을 실천한다."], "quiz_q": "엘리스의 REBT에서 내담자의 비합리적 신념이 객관적 현실 증거와 사실에 부합하는지 따져 묻는 논박은?", "quiz_a": "실증적(경험적) 논박", "line_blanks": [["REBT", "실증적 논박"], ["실용적 논박"], ["논리적 논박"], ["수치심 공격 연습"]], "cases8": [{"q": "엘리스 REBT에서 내담자의 신념이 객관적 현실 증거에 부합하는지 묻는 논박", "a": "실증적(경험적) 논박"}, {"q": "그 신념을 고수하는 것이 실제 삶과 행복에 어떤 도움이 되는지 묻는 논박", "a": "실용적(기능적) 논박"}, {"q": "소망에서 당위로 넘어가는 비논리적 비약과 모순을 지적하는 논박", "a": "논리적 논박"}, {"q": "정서적 고통(C)을 직접 유발하는 핵심 원인이 사건(A)이 아닌 무엇인가", "a": "비합리적 신념(B, 당위적 요구)"}, {"q": "타인의 부정적 시선에도 파국이 일어나지 않음을 체험하는 행동적 기법", "a": "수치심 공격 연습(Shame-Attacking Exercises)"}, {"q": "비합리적 신념을 합리적 신념으로 바꾼 뒤 도달하는 새로운 정서·행동 효과", "a": "효과적인 새로운 철학 및 정서(E)"}, {"q": "실패나 거절을 겪어도 인간 전체의 가치는 평가절하되지 않는다는 수용", "a": "무조건적 자기수용(USA)"}, {"q": "불편하고 힘든 상황을 '견딜 수 없다'고 여기는 비합리적 신념 파생물", "a": "좌절 인내력 부족(LFT)"}]}, {"id": 43, "part": "COUNSEL35", "domain": "상담이론", "title": "수용전념치료(ACT) 인지적 탈융합 및 기꺼이 경험하기와 전념 행동", "concept": "생각과 자신을 분리하여 언어적 사건으로 관찰하는 인지적 탈융합과 가치 전념 행동", "keywords": ["ACT", "인지적 융합", "인지적 탈융합", "기꺼이 경험하기"], "lines": ["ACT에서 내담자가 생각과 자신을 동일시하는 인지적 융합에서 벗어나게 돕는다.", "생각은 단지 지나가는 언어적 사건일 뿐임을 깨닫는 인지적 탈융합을 쓴다.", "불안과 고통을 회피하지 않고 있는 그대로 품는 기꺼이 경험하기를 실천한다.", "자신이 소중히 여기는 가치를 명료화하고 구체적인 전념 행동을 이행한다."], "quiz_q": "수용전념치료(ACT)에서 부정적 생각과 현실의 동일시에서 벗어나 생각을 일시적 언어 사건으로 바라보는 기법은?", "quiz_a": "인지적 탈융합", "line_blanks": [["ACT", "인지적 융합"], ["인지적 탈융합"], ["기꺼이 경험하기"], ["가치를 명료화", "전념 행동"]], "cases8": [{"q": "수용전념치료(ACT)에서 부정적 생각과 실제 현실(자신)을 동일시하는 병리", "a": "인지적 융합"}, {"q": "생각을 사실이 아닌 단지 지나가는 언어적 사건으로 한 걸음 떨어져 봄", "a": "인지적 탈융합"}, {"q": "불쾌한 감정·기억·신체감각을 통제하고 도망치려다 삶이 좁아지는 병리", "a": "경험적 회피"}, {"q": "경험적 회피의 대안으로 불안과 고통을 판단 없이 있는 그대로 수용함", "a": "기꺼이 경험하기(수용, Acceptance)"}, {"q": "과거의 후회나 미래의 불안에서 벗어나 지금 이 순간에 주의를 기울임", "a": "현재 순간과의 접촉(마음챙김)"}, {"q": "생각과 감정이 일어나고 사라지는 배경으로서 변하지 않는 관찰자적 자기", "a": "맥락으로서의 자기(관찰하는 자기)"}, {"q": "자신이 삶에서 진정으로 소중히 여기는 삶의 방향을 분명히 세우는 과정", "a": "가치 명료화"}, {"q": "수용전념치료(ACT) 6가지 핵심 과정을 통해 궁극적으로 높이려는 목표", "a": "심리적 유연성 및 가치에 부합하는 전념 행동"}]}, {"id": 44, "part": "COUNSEL35", "domain": "상담이론", "title": "펄스 게슈탈트 상담 접촉경계혼란 반전(Retroflection) 및 빈의자 기법", "concept": "타인에게 향할 공격성을 자신에게 돌리는 반전과 양극성 통합을 위한 빈의자 기법", "keywords": ["반전", "빈의자 기법", "승리자와 패배자", "자기 통합"], "lines": ["원래 타인에게 하고 싶었던 행동을 자신에게 돌리는 접촉경계혼란은 반전이다.", "내면의 양극성을 대화시켜 해소하는 게슈탈트 상담 기법은 빈의자 기법이다.", "자신을 자책하는 승리자와 억압된 패배자가 서로 솔직하게 대면하게 한다.", "소외되었던 부정적 감정을 수용하고 온전한 자기 통합을 이루도록 돕는다."], "quiz_q": "게슈탈트 상담에서 타인에게 표출하고 싶었던 분노를 자기 자신에게 돌려 자해·자책하는 접촉경계혼란은?", "quiz_a": "반전(Retroflection)", "line_blanks": [["반전"], ["빈의자 기법"], ["승리자와 억압된 패배자"], ["자기 통합"]], "cases8": [{"q": "게슈탈트 접촉경계혼란 중 타인에게 향할 분노·공격성을 자신에게 돌림", "a": "반전(Retroflection)"}, {"q": "권위자의 가치관이나 규범을 비판적 소화 없이 통째로 삼켜 받아들임", "a": "내사(Introjection)"}, {"q": "자신의 억압된 욕구나 부정적 감정을 타인의 것으로 돌리는 현상", "a": "투사(Projection)"}, {"q": "자신과 타인 사이의 경계가 허물어져 독립적 자기를 잃고 매달리는 현상", "a": "융합(Confluence)"}, {"q": "감각과 감정이 의식에 닿는 순간 주제를 돌리거나 웃음으로 힘을 빼버림", "a": "편향(Deflection)"}, {"q": "내면의 양극성이나 미해결 과제를 두 의자에 앉혀 대화시키는 기법", "a": "빈의자 기법(Empty Chair Technique)"}, {"q": "빈의자 기법에서 내면의 도덕적 명령자 vs 억압된 욕망자의 대립 명칭", "a": "승리자(Topdog)와 패배자(Underdog)"}, {"q": "게슈탈트 상담을 통해 소외된 감정을 수용하고 이루고자 하는 최종 목표", "a": "미해결 과제 해소 및 온전한 자기 통합(알아차림과 접촉)"}]}, {"id": 45, "part": "COUNSEL35", "domain": "상담이론", "title": "글래서 현실치료 전행동(Total Behavior) 및 WDEP 자기평가 단계", "concept": "좋은 세계의 바람 탐색, 전행동 확인, 현재 행동의 유용성을 점검하는 자기평가와 계획", "keywords": ["좋은 세계", "전행동", "WDEP 자기평가", "실천 계획"], "lines": ["내담자의 좋은 세계에 담긴 구체적인 바람과 욕구를 탐색하도록 돕는다.", "자신의 바람을 채우기 위해 현재 무엇을 하고 있는지 전행동을 탐색한다.", "현실치료 WDEP 중 현재 행동이 바람 달성에 도움이 되는지 스스로 자기평가한다.", "자신이 직접 통제할 수 있는 구체적이고 실현 가능한 실천 계획을 세운다."], "quiz_q": "현실치료 WDEP 절차 중 현재 행동이 자신이 원하는 바람을 얻는 데 도움이 되는지 스스로 판단하게 하는 단계는?", "quiz_a": "자기평가(Evaluation) 단계", "line_blanks": [["좋은 세계", "바람과 욕구"], ["전행동"], ["WDEP", "자기평가"], ["실천 계획"]], "cases8": [{"q": "글래서 현실치료에서 내담자가 마음속에 소중히 간직한 욕구 충족 이미지", "a": "좋은 세계(질적 세계, Quality World)"}, {"q": "행동하기, 생각하기, 느끼기, 생리반응의 4요소가 통합된 행동 개념", "a": "전행동(Total Behavior)"}, {"q": "전행동 자동차 비유에서 운전자가 직접 방향을 바꿀 수 있는 앞바퀴 2개", "a": "활동하기(행동)와 생각하기"}, {"q": "현실치료 WDEP 절차 중 W(Want) 단계의 핵심 탐색 내용", "a": "바람, 욕구, 지각 탐색"}, {"q": "WDEP 절차 중 D(Doing) 단계의 핵심 탐색 내용", "a": "현재 하고 있는 전행동과 삶의 방향 탐색"}, {"q": "WDEP 중 현재 행동이 바람 달성에 도움이 되는지 스스로 판단하게 하는 핵심", "a": "자기평가(Evaluation) 단계"}, {"q": "WDEP 중 P(Plan) 단계에서 좋은 실천 계획의 조건(SAMIC3)", "a": "단순하고, 도달 가능하며, 측정 가능하고, 즉각적이며, 내담자가 통제 가능한 계획"}, {"q": "글래서 선택이론의 5대 기본 욕구", "a": "생존, 사랑과 소속, 힘(성취), 자유, 즐거움"}]}, {"id": 46, "part": "COUNSEL35", "domain": "상담이론", "title": "해결중심 단기상담(SFBT) 4대 질문 기법 (기적·예외·척도·대처질문)", "concept": "해결된 미래 상상(기적), 문제 없던 성공 순간(예외), 수치화(척도), 버텨온 강점(대처)", "keywords": ["SFBT", "기적질문", "예외질문", "척도질문과 대처질문"], "lines": ["SFBT에서 문제가 해결된 미래의 구체적 모습을 상상하는 기적질문을 사용한다.", "문제가 일어나지 않았던 성공 경험과 자원을 찾아내는 예외질문을 던진다.", "변화에 대한 확신과 현재 상태를 수치로 계량화하는 척도질문을 활용한다.", "극심한 절망 속에서도 지금까지 어떻게 버텨왔는지 묻는 대처질문을 한다."], "quiz_q": "해결중심 단기상담(SFBT)에서 극심한 절망 속에서도 파국에 이르지 않고 버텨온 생존 전략과 강점을 묻는 질문은?", "quiz_a": "대처질문", "line_blanks": [["SFBT", "기적질문"], ["예외질문"], ["척도질문"], ["대처질문"]], "cases8": [{"q": "해결중심 단기상담(SFBT)에서 밤사이 문제가 해결된 미래를 상상하게 함", "a": "기적질문"}, {"q": "문제가 일어나지 않았거나 덜 심각했던 과거의 성공 순간과 자원을 찾음", "a": "예외질문"}, {"q": "문제의 심각도나 해결 확신도를 0부터 10까지의 숫자로 표현하게 함", "a": "척도질문"}, {"q": "극심한 절망 속에서도 지금까지 어떻게 무너지지 않고 버텨왔는지 물음", "a": "대처질문"}, {"q": "변화가 일어난 후 주변 가족이나 친구가 무엇을 다르게 알아차릴지 물음", "a": "관계성 질문"}, {"q": "문제 원인을 몰라도 상담실에 오기 전 이미 일어난 긍정적 변화를 묻는 질문", "a": "상담 전 변화 질문"}, {"q": "자신의 문제를 인정하지만 아직 변화 동기는 부족해 함께 과제를 정하는 유형", "a": "불평형 내담자"}, {"q": "문제를 명확히 인식하고 해결을 위해 스스로 노력할 준비가 된 내담자 유형", "a": "고객형 내담자(방문형-불평형-고객형)"}]}, {"id": 47, "part": "COUNSEL35", "domain": "상담이론", "title": "설리반 대인관계 이론 3대 자아상(좋은-나·나쁜-나·나-아닌-나) 및 병렬적 왜곡", "concept": "극심한 공포로 의식에서 해리되는 나-아닌-나 자아상과 과거 대상을 현재에 투사하는 병렬적 왜곡", "keywords": ["좋은-나", "나쁜-나", "나-아닌-나(Not-me)", "병렬적 왜곡"], "lines": ["양육자의 칭찬과 수용 속에서 불안이 없는 긍정적인 좋은-나 자아상을 만든다.", "양육자의 비난과 거부로 인한 불안을 경험하며 나쁜-나 자아상을 갖는다.", "극심한 공포와 불안으로 인해 의식에서 해리되는 나-아닌-나(Not-me)가 된다.", "과거의 대인관계 경험을 현재 상대에게 투사하는 병렬적 왜곡을 교정한다."], "quiz_q": "설리반 이론에서 아동이 감당할 수 없는 극심한 공포를 겪을 때 의식에서 완전히 해리되는 자아상의 명칭은?", "quiz_a": "나-아닌-나(Not-me)", "line_blanks": [["좋은-나 자아상"], ["나쁜-나 자아상"], ["나-아닌-나(Not-me)"], ["병렬적 왜곡"]], "cases8": [{"q": "설리반 이론에서 양육자의 칭찬과 부드러운 돌봄 속에 형성되는 자아상", "a": "좋은-나(Good-me)"}, {"q": "양육자의 비난과 거부로 인해 불안과 긴장을 경험하며 형성되는 자아상", "a": "나쁜-나(Bad-me)"}, {"q": "감당할 수 없는 극심한 공포와 불안으로 의식에서 완전히 해리되는 자아상", "a": "나-아닌-나(Not-me)"}, {"q": "과거 중요 타인과의 왜곡된 관계 도식을 현재 대인관계에 그대로 투사함", "a": "병렬적 왜곡(Parataxic Distortion)"}, {"q": "불안을 방어하고 자존감을 보호하기 위해 대인관계에서 쓰는 무의식적 책략", "a": "안전작동(보안작동, Security Operations)"}, {"q": "상담자가 관계에 따뜻하게 참여하면서 동시에 객관적으로 관찰하는 역할", "a": "참여적 관찰자(Participant Observer)"}, {"q": "설리반이 정신병리와 성격 형성의 가장 핵심적인 동력으로 본 개념", "a": "대인관계에서의 불안 회피와 안전 추구"}, {"q": "전청소년기에 동성 친구와 맺는 깊은 정서적 교류와 친밀감의 효과", "a": "과거의 병렬적 왜곡 교정 및 건강한 자기가치감 회복"}]}, {"id": 48, "part": "COUNSEL35", "domain": "상담이론", "title": "머레이 욕구-압착 이론 알파 압착 vs 베타 압착 및 주제통각검사(TAT)", "concept": "객관적 현실 환경인 알파 압착과 주관적으로 지각되어 행동을 지배하는 베타 압착", "keywords": ["심리적 욕구와 압착", "알파 압착", "베타 압착", "주제통각검사(TAT)"], "lines": ["내담자의 내부에서 일어나는 심리적 욕구와 환경의 압착을 함께 분석한다.", "객관적으로 실재하는 물리적 현실 환경을 나타내는 알파 압착을 살핀다.", "내담자가 주관적으로 지각하여 실제 행동을 지배하는 베타 압착을 교정한다.", "주제통각검사(TAT)를 활용하여 무의식적 욕구와 환경의 상호작용을 파악해 본다."], "quiz_q": "머레이의 욕구-압착 이론에서 개인이 주관적으로 해석하고 지각하여 실제 행동을 직접 결정짓는 환경 압착은?", "quiz_a": "베타 압착", "line_blanks": [["심리적 욕구", "압착"], ["알파 압착"], ["베타 압착"], ["주제통각검사(TAT)"]], "cases8": [{"q": "머레이 이론에서 유기체 내부에서 특정 방향으로 행동을 일으키는 역동적 힘", "a": "욕구(Need)"}, {"q": "유기체의 행동에 영향을 미치는 외부 환경적 압박이나 유인가의 명칭", "a": "압착(압력, Press)"}, {"q": "외부 환경에 객관적으로 실재하는 물리적·현실적 환경 압착", "a": "알파 압착(Alpha Press)"}, {"q": "개인이 주관적으로 지각하고 해석하여 실제 행동을 직접 지배하는 환경 압착", "a": "베타 압착(Beta Press)"}, {"q": "상담에서 내담자의 부적응 행동을 이해하기 위해 더 중점적으로 다루는 압착", "a": "베타 압착"}, {"q": "개인의 내적 욕구와 환경적 압착이 상호작용하여 형성되는 행동 단위", "a": "주제(Thema)"}, {"q": "머레이가 욕구와 압착 및 성격 주제를 파악하기 위해 개발한 투사적 그림검사", "a": "주제통각검사(TAT)"}, {"q": "TAT 해석 시 내담자가 자신을 투사한 그림 속 중심인물을 일컫는 용어", "a": "주인공(Hero)"}]}, {"id": 49, "part": "COUNSEL35", "domain": "상담이론", "title": "융 분석심리학 페르소나 동일시 부작용과 그림자 통합(개성화)", "concept": "사회적 가면인 페르소나와의 과잉 동일시 극복 및 억압된 그림자 수용을 통한 개성화", "keywords": ["페르소나", "동일시 부작용", "그림자 자각", "개성화"], "lines": ["사회적 역할에 적응하기 위해 외부로 드러내는 가면인 페르소나를 쓴다.", "역할과 자신을 동일시하여 참된 자기를 잃어버리는 부작용을 늘 경계한다.", "자신이 인정하기 싫어 억압한 무의식의 어두운 측면인 그림자를 자각한다.", "어두운 그림자를 타인에게 투사하지 않고 온전히 수용하여 개성화를 이룬다."], "quiz_q": "융의 분석심리학에서 사회적 역할(페르소나)이 곧 진짜 자신이라고 착각하여 참된 자기를 상실하는 기제는?", "quiz_a": "페르소나와의 동일시", "line_blanks": [["페르소나"], ["동일시", "참된 자기를 잃어버리는 부작용"], ["그림자"], ["개성화"]], "cases8": [{"q": "융 분석심리학에서 사회적 요구와 역할에 적응하기 위해 쓰는 외적 가면", "a": "페르소나(Persona)"}, {"q": "사회적 역할과 가면이 곧 진짜 자신이라고 착각하여 참된 자기를 잃는 부작용", "a": "페르소나와의 동일시"}, {"q": "의식적 자아가 인정하기 싫어 무의식 속에 억압한 어두운 동물적 측면", "a": "그림자(Shadow)"}, {"q": "자신의 그림자를 인정하지 않을 때 대인관계에서 흔히 일어나는 방어 현상", "a": "타인에게 자신의 그림자를 투사하여 미워함"}, {"q": "남성 무의식 속의 여성적 측면과 여성 무의식 속의 남성적 측면", "a": "아니마(Anima)와 아니무스(Animus)"}, {"q": "의식과 무의식을 포괄하는 전체 정신의 중심이자 통합의 원형", "a": "자기(Self)"}, {"q": "페르소나·그림자·아니마 등 무의식의 요소들을 의식화하여 본래 자기가 되는 과정", "a": "개성화(Individuation, 자기실현)"}, {"q": "개성화 과정에서 억압된 그림자를 다룰 때 상담자의 핵심 개입", "a": "그림자를 투사하지 않고 자신의 일부로 직면·수용하여 통합하도록 조력"}]}, {"id": 50, "part": "COUNSEL35", "domain": "상담이론", "title": "교류분석(TA) 해리스 4대 생활자세 및 이고그램 어른 자아(A)", "concept": "자기긍정-타인부정 및 자기부정-타인긍정을 극복하고 자기긍정-타인긍정으로 변화", "keywords": ["교류분석(TA)", "자기긍정-타인부정", "자기긍정-타인긍정", "어른 자아(A)"], "lines": ["교류분석(TA)에서 타인을 탓하고 책임을 전가하는 자기긍정-타인부정 자세를 본다.", "무력감에 빠져 의존적인 태도를 취하는 자기부정-타인긍정 자세를 극복한다.", "상호 존중과 신뢰를 바탕으로 한 자기긍정-타인긍정 자세로 변화시킨다.", "상황을 객관적으로 분석하는 어른 자아(A)를 활성화하여 내적 균형을 회복한다."], "quiz_q": "교류분석(TA)에서 자신의 잘못은 인정하지 않고 모든 문제를 타인 탓으로 돌리며 상대를 무시·공격하는 생활자세는?", "quiz_a": "자기긍정-타인부정", "line_blanks": [["교류분석(TA)", "자기긍정-타인부정"], ["자기부정-타인긍정"], ["자기긍정-타인긍정"], ["어른 자아(A)"]], "cases8": [{"q": "해리스 4대 생활자세 중 남을 탓하고 공격하며 우월감에 차 있는 자세(I+U-)", "a": "자기긍정-타인부정"}, {"q": "자신을 무력하고 열등하다고 느끼며 타인에게 의존·위축되는 자세(I-U+)", "a": "자기부정-타인긍정"}, {"q": "자신과 타인을 모두 불신하고 희망을 포기해 버리는 극단적 부적응 자세(I-U-)", "a": "자기부정-타인부정"}, {"q": "자신과 타인의 가치를 모두 존중하고 신뢰하는 가장 건강한 생활자세(I+U+)", "a": "자기긍정-타인긍정"}, {"q": "이고그램 자아상태 중 규범·도덕을 따지며 비판하고 통제하는 부모 자아", "a": "비판적 어버이 자아(CP)"}, {"q": "현실의 객관적 자료를 수집하고 합리적·논리적으로 판단하는 자아상태", "a": "어른 자아(A)"}, {"q": "타인의 눈치를 보며 순응하거나 감정을 억누르는 어린이 자아상태", "a": "순응하는 어린이 자아(AC)"}, {"q": "어린 시절 부모의 금지령에 따라 무의식적으로 짜여진 삶의 각본을 고치는 목표", "a": "각본 분석 및 재결단(자율성 회복)"}]}, {"id": 51, "part": "COUNSEL35", "domain": "상담이론", "title": "랜드레스 아동중심 놀이치료 과정 인정(격려) 및 ACT 제한설정 3단계", "concept": "판단 없는 행동 추적, 노력과 과정 인정, 감정 인정(A)➔제한 전달(C)➔대안 제시(T)", "keywords": ["행동 추적", "과정 인정", "ACT 제한설정 3단계", "제한 전달과 대안"], "lines": ["아동이 놀이실에서 행하는 구체적인 행동을 판단 없이 말로 추적해 준다.", "결과를 평가하는 칭찬 대신 노력과 과정을 인정하여 자아존중감을 키운다.", "아동의 분노와 파괴 욕구를 먼저 충분히 수용하고 깊이 공감하며 인정한다.", "ACT 제한설정 3단계에 따라 한계를 명확히 알리고 안전한 대안을 제시한다."], "quiz_q": "랜드레스 아동중심 놀이치료의 ACT 제한설정 3단계를 순서대로 작성하면?", "quiz_a": "감정 인정(A), 제한 전달(C), 대안 제시(T)", "line_blanks": [["행동을 판단 없이 말로 추적"], ["노력과 과정을 인정"], ["수용하고 깊이 공감하며 인정"], ["ACT 제한설정 3단계", "대안을 제시"]], "cases8": [{"q": "랜드레스 놀이치료에서 아동의 행동을 판단 없이 있는 그대로 말로 읽어줌", "a": "행동 추적하기"}, {"q": "결과를 평가하는 칭찬 대신 아동의 노력과 시도 자체를 인정해 주는 기법", "a": "과정 인정(격려, 자존감 촉진 반응)"}, {"q": "과정 인정(격려)이 결과 중심 칭찬보다 아동에게 주는 치료적 효과", "a": "외적 평가에 의존하지 않는 내적 동기와 자아존중감 향상"}, {"q": "랜드레스 ACT 제한설정 1단계(A: Acknowledge the feeling)", "a": "아동의 감정과 욕구를 공감적으로 수용하고 인정하기"}, {"q": "랜드레스 ACT 제한설정 2단계(C: Communicate the limit)", "a": "지켜야 할 제한(한계)을 명확하고 단호하게 전달하기"}, {"q": "랜드레스 ACT 제한설정 3단계(T: Target acceptable alternatives)", "a": "욕구를 안전하게 표출할 수 있는 수용 가능한 대안 제시하기"}, {"q": "ACT 제한설정에서 제한의 대상이 되는 것(감정·욕구 vs 파괴적 행동)", "a": "모든 감정과 욕구는 수용하되, 위험하고 파괴적인 행동만 제한함"}, {"q": "아동에게 선택권을 부여하여 자기통제감과 책임감을 길러주는 기법", "a": "치료적 선택권 제공하기"}]}, {"id": 52, "part": "COUNSEL35", "domain": "진로·다문화·위기", "title": "갓프레드슨 제한-타협 이론 4단계 및 수퍼 확립기 3단계(수정-안정-발전)", "concept": "크기힘(1)➔성역할(2)➔사회적가치(3)➔내적자기(4), 타협 시 흥미 우선 포기, 수퍼 확립기 3단계", "keywords": ["제한 2단계 성역할", "제한 3단계 사회적 가치", "흥미 우선 포기", "확립기 3단계"], "lines": ["제한 2단계인 성역할 지향에 따라 성별에 맞지 않는 직업을 가장 먼저 배제한다.", "제한 3단계인 사회적 가치 지향에 따라 지위와 능력으로 수용 범위를 좁힌다.", "타협이 불가피할 때 흥미를 가장 먼저 포기하고 성역할을 끝까지 지킨다.", "수퍼의 확립기 3단계는 적합성을 검토하는 수정기와 안정기 및 발전기로 간다."], "quiz_q": "갓프레드슨 타협 시 가장 먼저 포기하는 요소와 수퍼의 확립기 3단계를 순서대로 쓰면?", "quiz_a": "흥미 포기 / 수정기, 안정기, 발전기", "line_blanks": [["제한 2단계", "성역할 지향"], ["제한 3단계", "사회적 가치 지향"], ["흥미를 가장 먼저 포기", "성역할을 끝까지 지킨다"], ["확립기 3단계", "수정기와 안정기 및 발전기"]], "cases8": [{"q": "갓프레드슨 제한 1단계(만 3~5세): 어른의 세계와 직업의 존재를 인식함", "a": "크기와 힘 지향"}, {"q": "갓프레드슨 제한 2단계(만 6~8세): 성별에 맞지 않는 직업을 배제함", "a": "성역할 지향"}, {"q": "갓프레드슨 제한 3단계(만 9~13세): 사회적 지위(명성)와 능력을 고려해 좁힘", "a": "사회적 가치 지향"}, {"q": "갓프레드슨 제한 4단계(만 14세 이후): 자신의 고유한 흥미·가치·적성을 탐색함", "a": "내적·고유한 자기 지향"}, {"q": "현실적 장벽으로 진로 타협이 불가피할 때 가장 먼저 포기하는 요소", "a": "흥미(내적 자기)"}, {"q": "타협 시 가장 마지막까지 포기하지 않고 끝까지 지키려는 핵심 요소", "a": "성역할(성정체성)"}, {"q": "수퍼(Super)의 진로발달 단계 중 확립기(만 25~44세)의 하위 3단계 순서", "a": "수정기(시행기) ➔ 안정기 ➔ 발전기"}, {"q": "확립기 중 선택한 직업이 자신에게 맞는지 검토하고 필요시 직무를 바꾸는 시기", "a": "수정기(시행기)"}]}, {"id": 53, "part": "COUNSEL35", "domain": "진로·다문화·위기", "title": "홀랜드 육각형 모델 5대 개념(분화도·계측성) 및 사비카스 CSI·진로적응도 4C", "concept": "일치성·일관성·분화도·정체감·계측성 및 사비카스 생애 주제와 관심·통제·호기심·자신감", "keywords": ["일치성과 분화도", "생애 직업 스타일 면담(CSI)", "진로적응도(4C)", "4대 차원"], "lines": ["내담자의 성격 유형과 작업 환경이 서로 얼마나 부합하는지 일치성을 본다.", "특정 흥미 유형의 점수가 뚜렷하게 구별되는 정도인 분화도를 확인한다.", "사비카스 생애 직업 스타일 면담(CSI)을 통해 파악하려는 핵심은 생애 주제이다.", "진로적응도(4C)를 구성하는 4대 차원은 관심과 통제 및 호기심과 자신감이다."], "quiz_q": "홀랜드 모델에서 특정 흥미 점수가 뚜렷히 구별되는 정도와 사비카스 4C 중 미래를 스스로 결정한다는 신념은?", "quiz_a": "분화도, 진로 통제", "line_blanks": [["일치성"], ["분화도"], ["생애 직업 스타일 면담(CSI)", "생애 주제"], ["진로적응도(4C)", "관심과 통제 및 호기심과 자신감"]], "cases8": [{"q": "홀랜드 모델에서 개인의 성격 유형과 직업 환경 유형이 부합하는 정도", "a": "일치성(Congruence)"}, {"q": "개인의 상위 흥미 코드 두 글자가 육각형에서 인접하여 심리적 공통점이 큼", "a": "일관성(Consistency)"}, {"q": "특정 흥미 유형 점수가 높고 나머지는 낮아 흥미 프로파일이 뚜렷한 정도", "a": "분화도(Differentiation)"}, {"q": "육각형 모델에서 흥미 유형과 환경 간 거리가 가까울수록 상관이 높다는 개념", "a": "계측성(Calculus)"}, {"q": "사비카스(Savickas)가 생애 직업 스타일 면담(CSI)을 통해 파악하려는 핵심", "a": "생애 주제(Life Theme)"}, {"q": "사비카스 진로적응도(4C)의 4대 핵심 차원 공식 명칭", "a": "관심(Concern), 통제(Control), 호기심(Curiosity), 자신감(Confidence)"}, {"q": "진로적응도 4C 중 미래 진로를 스스로 결정하고 책임질 수 있다는
