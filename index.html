<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>2027 임용(11.28) 전문상담 기출분석 & 55제 실전 앱</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1120;
    --surface: #111c33;
    --surface-2: #1a2744;
    --border: #2a3b5e;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --gold: #fbbf24;
    --danger: #f43f5e;
    --success: #10b981;
    --kw-bg: rgba(251, 191, 36, 0.22);
    --kw-text: #fde047;
    --pass-bg: #0f172a;
    --ans-bg: #06281e;
    --ans-border: #10b981;
    --exp-bg: #172038;
    --exp-border: #6366f1;
    --font-scale: 1;
  }
  [data-theme="light"] {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #cbd5e1;
    --text: #0f172a;
    --text-muted: #475569;
    --accent: #0284c7;
    --accent-2: #4f46e5;
    --gold: #b45309;
    --danger: #e11d48;
    --success: #059669;
    --kw-bg: #fef08a;
    --kw-text: #854d0e;
    --pass-bg: #f8fafc;
    --ans-bg: #ecfdf5;
    --ans-border: #10b981;
    --exp-bg: #eef2ff;
    --exp-border: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: calc(15px * var(--font-scale));
    overflow-x: hidden;
  }
  body { padding-bottom: 84px; }

  /* Sticky Top Header */
  .top-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 17, 32, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px 8px;
  }
  [data-theme="light"] .top-header {
    background: rgba(255, 255, 255, 0.95);
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    max-width: 820px;
    margin: 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .dday-badge {
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    color: #fff;
    font-weight: 900;
    font-size: 0.78rem;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(244,63,94,0.35);
  }
  .brand-title {
    font-weight: 900;
    font-size: 0.96rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-tools {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .icon-btn {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { transform: scale(0.95); }

  /* Progress strip */
  .prog-wrap {
    max-width: 820px;
    margin: 7px auto 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.76rem;
    color: var(--text-muted);
  }
  .prog-bar {
    flex: 1;
    height: 6px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, #10b981, #38bdf8);
    width: 0%;
    transition: width 0.25s ease;
  }

  /* Main Mode Tabs */
  .main-tabs {
    max-width: 820px;
    margin: 10px auto 0;
    padding: 0 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .main-tab {
    background: var(--surface);
    color: var(--text-muted);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 8px;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .main-tab.active {
    background: linear-gradient(135deg, #0284c7, #4f46e5);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.28);
  }

  /* Controls & Filters */
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 10px 12px 24px;
  }
  .filter-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 0 8px;
    scrollbar-width: none;
  }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip.active {
    background: var(--accent);
    color: #082f49;
    border-color: var(--accent);
  }
  .search-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .search-input {
    flex: 1;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 0.88rem;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .view-toggle {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 11px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Question Jump Bar in Card Mode */
  .jump-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 12px;
    margin-bottom: 10px;
    font-size: 0.82rem;
    font-weight: 700;
  }
  .jump-select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.8rem;
    max-width: 65%;
  }

  /* Study Card */
  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 15px 14px;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .rank-badge {
    background: var(--gold);
    color: #451a03;
    font-weight: 900;
    font-size: 0.78rem;
    padding: 2px 8px;
    border-radius: 6px;
  }
  [data-theme="light"] .rank-badge { background: #fde047; color: #713f12; }
  .tier-badge {
    font-weight: 800;
    font-size: 0.76rem;
    padding: 2px 8px;
    border-radius: 6px;
  }
  .tier-0 { background: rgba(244,63,94,0.2); color: #fb7185; border: 1px solid rgba(244,63,94,0.4); }
  .tier-1 { background: rgba(251,191,36,0.18); color: #fbbf24; border: 1px solid rgba(251,191,36,0.4); }
  .tier-2 { background: rgba(56,189,248,0.18); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); }
  [data-theme="light"] .tier-0 { background: #ffe4e6; color: #be123c; }
  [data-theme="light"] .tier-1 { background: #fef3c7; color: #b45309; }
  [data-theme="light"] .tier-2 { background: #e0f2fe; color: #0369a1; }

  .domain-tag {
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .years-tag {
    font-size: 0.73rem;
    font-weight: 700;
    color: var(--accent);
    background: rgba(56,189,248,0.1);
    padding: 2px 7px;
    border-radius: 6px;
  }
  .card-title {
    font-size: 1.04rem;
    font-weight: 900;
    line-height: 1.45;
    margin-bottom: 10px;
    color: var(--text);
  }

  /* Step Boxes: 1. Problem -> 2. Answer -> 3. Explanation */
  .step-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.78rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .problem-box {
    background: var(--pass-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 13px;
    margin-bottom: 11px;
  }
  .passage-text {
    font-size: 0.94rem;
    line-height: 1.75;
    white-space: pre-line;
    margin-bottom: 11px;
  }
  .asks-box {
    background: var(--surface);
    border-left: 3.5px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 9px 11px;
  }
  .asks-title {
    font-size: 0.8rem;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 5px;
  }
  .asks-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 0.89rem;
    font-weight: 600;
  }

  /* Toggle Buttons for Answer & Explanation */
  .step-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .reveal-btn {
    padding: 11px 10px;
    border-radius: 11px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .reveal-btn.ans-open {
    background: var(--success);
    color: #022c22;
    border-color: var(--success);
  }
  .reveal-btn.exp-open {
    background: var(--accent-2);
    color: #fff;
    border-color: var(--accent-2);
  }

  /* Answer Panel */
  .answer-panel {
    display: none;
    background: var(--ans-bg);
    border: 1.5px solid var(--ans-border);
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
    animation: fadeIn 0.18s ease;
  }
  .answer-panel.open { display: block; }
  .kw-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }
  .kw-chip {
    background: var(--kw-bg);
    color: var(--kw-text);
    font-size: 0.78rem;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .ans-lines {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .ans-line {
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.6;
    display: flex;
    gap: 8px;
  }
  [data-theme="light"] .ans-line { background: rgba(255,255,255,0.85); }
  .line-num {
    color: var(--success);
    font-weight: 900;
    flex-shrink: 0;
  }
  .hl {
    background: var(--kw-bg);
    color: var(--kw-text);
    padding: 0 3px;
    border-radius: 4px;
    font-weight: 800;
  }

  /* Explanation Panel */
  .exp-panel {
    display: none;
    background: var(--exp-bg);
    border: 1.5px solid var(--exp-border);
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
    animation: fadeIn 0.18s ease;
  }
  .exp-panel.open { display: block; }
  .trend-box {
    background: rgba(56,189,248,0.12);
    border-left: 3px solid var(--accent);
    padding: 8px 10px;
    border-radius: 0 8px 8px 0;
    font-size: 0.84rem;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .formula-box {
    background: rgba(251,191,36,0.14);
    border: 1px dashed var(--gold);
    border-radius: 9px;
    padding: 9px 11px;
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 10px;
    line-height: 1.55;
  }
  [data-theme="light"] .formula-box { background: #fefce8; color: #92400e; }
  .exp-text {
    font-size: 0.9rem;
    line-height: 1.72;
    color: var(--text);
  }

  /* Card Footer Check Buttons */
  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .status-btn {
    flex: 1;
    padding: 8px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .status-btn.marked { background: rgba(251,191,36,0.2); color: var(--gold); border-color: var(--gold); }
  .status-btn.done { background: rgba(16,185,129,0.2); color: var(--success); border-color: var(--success); }

  /* Full Exam Subtabs */
  .sub-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .sub-tab {
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 4px;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    text-align: center;
  }
  .sub-tab.active {
    background: var(--accent);
    color: #082f49;
    border-color: var(--accent);
  }

  /* Pedagogy HTML styling inside dark/light theme */
  .ped-prose p { margin-bottom: 10px; font-size: 0.92rem; line-height: 1.75; }
  .ped-rubric { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
  @media (min-width: 640px) { .ped-rubric { grid-template-columns: 1fr 1fr; } }
  .ped-rubric .rubric-col {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  .ped-rubric h4 { font-size: 0.88rem; color: var(--accent); margin-bottom: 5px; }
  .ped-rubric ul { padding-left: 16px; font-size: 0.84rem; }
  .ped-rubric li { margin-bottom: 3px; }
  .ped-ans-content { font-size: 0.9rem; line-height: 1.75; }
  .ped-ans-content .essay-sec, .ped-ans-content p { margin-bottom: 10px; }
  .ped-ans-content .kw, .ped-ans-content strong { color: var(--kw-text); }

  /* Fixed Bottom Thumb Bar (Mobile) */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 60;
    background: rgba(15, 23, 42, 0.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  [data-theme="light"] .bottom-bar { background: rgba(255, 255, 255, 0.97); }
  .bottom-inner {
    max-width: 820px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr 0.9fr 1.1fr;
    gap: 6px;
  }
  .b-btn {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 4px;
    font-size: 0.8rem;
    font-weight: 800;
    cursor: pointer;
    text-align: center;
  }
  .b-btn.primary { background: var(--accent); color: #082f49; border-color: var(--accent); }
  .b-btn:active { transform: scale(0.95); }

  .empty-state {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-muted);
    font-weight: 700;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* 3-tab main navigation */
  .main-tabs { grid-template-columns: repeat(3, 1fr) !important; gap: 6px !important; }
  .main-tab { padding: 9px 4px !important; font-size: 0.82rem !important; }

  /* Analysis Dashboard Styles */
  .an-hero {
    background: linear-gradient(135deg, rgba(2,132,199,0.22), rgba(79,70,229,0.22));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .an-hero h2 { font-size: 1.05rem; font-weight: 900; margin-bottom: 6px; color: var(--text); }
  .an-hero p { font-size: 0.84rem; color: var(--text-muted); line-height: 1.55; }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  @media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
  }
  .kpi-val { font-size: 1.25rem; font-weight: 900; color: var(--accent); line-height: 1.2; }
  .kpi-lbl { font-size: 0.74rem; color: var(--text-muted); margin-top: 4px; font-weight: 700; }
  .an-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .an-card h3 {
    font-size: 0.94rem;
    font-weight: 900;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 112px 1fr 56px;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 0.78rem;
  }
  .bar-row.yr-row { grid-template-columns: 52px 1fr 94px; }
  .bar-lbl { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track {
    height: 12px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #0284c7, #6366f1);
  }
  .bar-fill.hot { background: linear-gradient(90deg, #f43f5e, #fbbf24); }
  .bar-num { text-align: right; font-weight: 800; color: var(--text-muted); font-size: 0.74rem; }
  .kw-cloud { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .kw-pill {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text);
  }
  .kw-pill.accent { background: rgba(56,189,248,0.16); border-color: var(--accent); color: var(--accent); }
  .top10-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .top10-item:hover { border-color: var(--accent); }
  .top10-left { min-width: 0; }
  .top10-title { font-size: 0.84rem; font-weight: 800; color: var(--text); }
  .top10-sub { font-size: 0.73rem; color: var(--text-muted); margin-top: 2px; }
  .top10-go {
    flex-shrink: 0;
    background: var(--accent);
    color: #082f49;
    font-weight: 900;
    font-size: 0.74rem;
    padding: 4px 8px;
    border-radius: 8px;
  }
  .strat-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 640px) { .strat-grid { grid-template-columns: 1fr 1fr; } }
  .strat-box {
    background: var(--surface-2);
    border-left: 3px solid var(--gold);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.8rem;
    line-height: 1.55;
  }
  .strat-box strong { color: var(--gold); display: block; margin-bottom: 3px; }

  /* Interactive Self-Grading Answer Input inside 55 cards */
  .practice-box {
    margin-top: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
  }
  .practice-head {

ry": "이름은 비슷하지만 완전히 다른 두 장애입니다! '강박장애(OCD)'는 침습적인 강박사고 때문에 너무 괴로워하며('자아 이질적') 불안을 줄이려고 손 씻기·확인하기 같은 강박행동을 반복합니다. 반면 '강박성 성격장애(OCPD)'는 침습적 사고나 의례적 강박행동 없이 자신의 지나친 완벽주의·규칙 집착을 당연하고 옳은 것으로 여깁니다('자아 동조적'). 강박장애의 1순위 행동치료는 자극에 직면시키고 강박행동을 막는 '노출 및 반응방지(ERP)'입니다!", "lecture_point": "⚡ 시험장 1초 공식: [강박장애(OCD) = 강박사고·강박행동 + 자아 이질적(괴로워함) + 노출 및 반응방지(ERP)] vs [강박성 성격장애(OCPD) = 완벽주의·통제 + 자아 동조적(당연시함)]", "rank": 3}, {"id": 31, "part": "전공상담", "domain": "상담이론", "title": "아론 벡 인지치료 인지적 오류(이분법·재앙화) 및 하향 화살표 기법", "concept": "표면적 자동적 사고에서 연속 질문을 통해 기저의 핵심 신념을 파헤치는 하향 화살표 기법", "prob": 97, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [2022, 2023, 2025, 2026], "trend_note": "📊 실제 기출(2022년, 2023년, 2025년, 2026년 · 4회): 7개년 최빈출 부동의 핵심 영역으로 2027학년도 복합형 문항 출제가 확실시됩니다.", "passage": "중간고사에서 수학 점수가 떨어진 고등학생 E는 상담실에 와서 ㉠'1등급이 아니면 완전히 실패한 쓰레기 인생이에요'라고 말하며, ㉡'이번 시험을 망쳤으니 대학도 못 가고 내 인생은 영원히 끝장났어요'라고 통곡하였다. 상담자는 E의 표면적 생각 아래에 깔린 근본 신념을 찾기 위해 '만약 대학에 한 번에 못 간다면 그것이 E에게 어떤 의미인가요?'라고 단계적으로 질문을 이어 나갔다.", "asks": ["① 아론 벡의 인지적 오류 중 밑줄 친 ㉠과 ㉡에 해당하는 공식 명칭을 각각 서술하시오.", "② 상담자가 내담자의 핵심 신념을 체계적으로 탐색하기 위해 사용한 기법의 명칭을 서술하시오.", "③ 해당 기법이 표면적인 자동적 사고로부터 무엇을 단계별로 파헤치는지 서술하시오.", "④ 해당 기법을 적용할 때 상담자가 내담자에게 던지는 대표적인 핵심 질문 형식을 서술하시오."], "keywords": ["이분법적 사고", "재앙화", "하향 화살표 기법", "역기능적 신념"], "answer_lines": ["사례의 1번 오류는 이분법적 사고이며 2번은 파국적 결과를 예상하는 재앙화다.", "핵심 신념을 체계적으로 탐색하기 위해 사용한 기법은 하향 화살표 기법이다.", "자동적 사고의 기저에 깔려 있는 역기능적 신념을 단계별로 파헤쳐 확인한다.", "만약 그 생각이 사실이라면 그것이 무엇을 의미하는지 질문하여 밝혀낸다."], "lecture_summary": "아론 벡(Beck)의 인지치료에서 내담자의 우울·불안은 사건 자체 때문이 아니라 사건을 왜곡해서 해석하는 '인지적 오류'와 그 밑바닥에 깔린 뿌리 깊은 '핵심 신념(역기능적 도식)' 때문입니다! 시험 성적이 한 번 떨어진 것을 두고 '난 완전한 실패자 아니면 성공자야'라고 양극단으로 보면 '이분법적 사고(흑백논리)'이고, '이제 내 인생은 완전히 끝장났어'라고 파국을 단정하면 '재앙화'입니다. 표면적인 자동적 사고 아래 숨은 핵심 신념을 캐낼 때는 '만약 그것이 사실이라면 당신에게 어떤 의미인가요?'라고 연속 질문하는 '하향 화살표 기법'을 씁니다!", "lecture_point": "⚡ 시험장 1초 공식: 아론 벡 인지적 오류([이분법적 사고: 양극단 흑백논리]·[재앙화: 파국적 결과 단정]) + 핵심 신념 탐색 기법 = [하향 화살표 기법('만약 사실이라면 무슨 의미인가?')]!", "rank": 4}, {"id": 45, "part": "전공상담", "domain": "진로·다문화·위기", "title": "숀 셰이 CASE 모델 자살사정, 길리랜드 위기 6단계(안전계획서), 학폭법 제16·17조", "concept": "CASE 모델(제시➔최근➔과거➔즉각 사건), 지지제공(3단계)·참여유도(6단계), 제6호 출석정지", "prob": 97, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [2020, 2022, 2026], "trend_note": "📊 실제 기출(2020년, 2022년, 2026년 · 3회): 최근 평가원 핵심 출제 트렌드 영역으로 감별·응용 변형 출제 대비가 필수입니다.", "passage": "학교폭력 피해를 겪은 후 자살 암시 글을 올린 학생을 대상으로 전문상담교사가 숀 셰이(Shawn Shea)의 CASE 모델에 따라 제시 사건, 최근 사건, 과거 사건을 탐색한 뒤 마지막 4번째 영역을 사정하고 있다. 이어 길리랜드의 위기개입 6단계 중 마지막 단계를 적용해 위기 시 행동 지침을 문서로 작성하였으며, 학교폭력대책심의위원회는 가해학생에게 출석정지 처분을 내리는 동시에 피해학생에게 협박 문자를 보낸 보복행위에 대해 추가 처분을 의결하였다.", "asks": ["① 숀 셰이(Shawn Shea)의 CASE 자살 사정 모델 4단계 중 마지막 최종 단계의 명칭을 서술하시오.", "② 해당 최종 단계에서 상담자가 내담자에게 직접 구체적으로 질문하여 확인해야 할 내용을 서술하시오.", "③ 길리랜드의 위기개입 제6단계의 명칭과 내담자와 함께 작성하는 구체적 행동 지침 문서를 서술하시오.", "④ 학교폭력예방법 제17조에 따른 가해학생 '출석정지'의 호수와 보복행위 시 심의위원회의 조치 원칙을 서술하시오."], "keywords": ["숀 셰이 (Shawn Shea) CASE 모델", "즉각 사건", "제6단계 참여 유도", "제6호 출석정지"], "answer_lines": ["구체적 자살 사고를 평가하는 숀 셰이 (Shawn Shea) CASE 모델의 최종 단계는 즉각 사건이다.", "지금 여기 상담실 안에서 자살 충동을 느끼는지 직접 구체적으로 묻는다.", "길리랜드 위기개입 제6단계인 참여 유도 단계에서 안전계획서를 함께 작성한다.", "학폭 가해학생 출석정지는 제6호 조치이며 보복행위 시 처분을 가중 조치한다."], "lecture_summary": "위기상담 및 학교폭력예방법 최빈출 3종 세트입니다! 첫째, 숀 셰이(Shawn Shea)의 CASE 자살 사정 모델은 [①제시된 자살 사건 ➔ ②최근 자살 사건(지난 2개월) ➔ ③과거 자살 사건 ➔ ④즉각적 자살 사건(지금-여기 상담실 안에서의 자살 충동과 상담실 나간 직후 계획!)] 순서로 탐색합니다. 둘째, 길리랜드의 위기개입 6단계 중 마지막 6단계('참여 유도')에서는 자살 수단 제거와 비상연락망을 담은 '안전계획서'를 함께 작성합니다. 셋째, 학폭법 제17조 가해학생 조치 중 출석정지는 '제6호 조치'이며, 피해학생에게 보복행위를 하면 처분을 '가중 조치'합니다!", "lecture_point": "⚡ 시험장 1초 공식: 숀 셰이 CASE 모델 순서 = [제시 사건 ➔ 최근 사건 ➔ 과거 사건 ➔ 즉각 사건(지금-여기 상담실 내 자살 충동!)] + 길리랜드 6단계 = [참여 유도(안전계획서)] + 학폭 출석정지 = [제6호 조치!]", "rank": 5}, {"id": 26, "part": "전공상담", "domain": "가족치료", "title": "보웬 다세대 가족치료 삼각관계·탈삼각화 및 자기분화", "concept": "부부 불안에 자녀를 끌어들이는 삼각관계 해체 및 상담자의 정서적 중립성과 탈삼각화", "prob": 97, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [2022, 2024], "trend_note": "📊 실제 기출(2022년, 2024년 · 2회): 최근 2년간 미출제로 2027학년도 순환 주기 재출제 확률이 매우 높습니다.", "passage": "중학생 D는 매일 아침 원인을 알 수 없는 심한 복통을 호소하며 등교를 거부한다. 가족상담 결과, 평소 냉전 중이던 부모는 서로 직접 대화하지 않고 D의 학업과 건강 문제를 두고서만 대화를 나누거나 D에게 상대방의 흉을 보며 자기편이 되어달라고 요구하고 있었다.", "asks": ["① 부부 사이의 갈등과 불안을 줄이기 위해 자녀를 끌어들이는 가족 역동의 명칭을 서술하시오.", "② 해당 역동 속에서 자녀 D가 부모의 불안을 흡수하여 나타내는 임상적 증상을 서술하시오.", "③ 가족상담 과정에서 상담자가 부모에게 유지해야 할 핵심적인 치료적 태도를 서술하시오.", "④ 자녀를 부모의 갈등 고리에서 분리하여 자율성을 회복시키는 개입 기법의 명칭을 서술하시오."], "keywords": ["삼각관계", "신체화 증상", "정서적 중립성", "탈삼각화"], "answer_lines": ["부부 사이의 갈등에 자녀를 끌어들이는 가족 역동의 명칭은 삼각관계이다.", "자녀는 부모 사이의 불안을 흡수하여 복통이라는 신체화 증상을 나타낸다.", "상담자는 부모 어느 한쪽에도 치우치지 않고 객관적 정서적 중립성을 지킨다.", "자녀를 부모의 갈등에서 분리하여 자율성을 주는 개입 기법은 탈삼각화이다."], "lecture_summary": "보웬의 다세대 가족치료에서 자기분화가 낮은 부부는 두 사람 사이의 갈등과 불안을 견디지 못하고 가장 약한 자녀를 끌어들여 '삼각관계(Triangulation)'를 만듭니다! 부모의 불안을 고스란히 흡수한 자녀는 복통·등교거부 같은 증상을 보이게 됩니다. 이때 상담자는 부모 어느 편도 들지 않는 '정서적 중립성'을 철저히 지키면서 자녀를 부부 갈등 고리에서 빼내는 '탈삼각화'를 실행해야 합니다!", "lecture_point": "⚡ 시험장 1초 공식: 보웬 가족치료 = [부부 갈등에 자녀 개입 = 삼각관계] ➔ [자녀 불안 흡수·신체화] ➔ 상담자 태도 = [정서적 중립성 유지] + 개입 = [탈삼각화 & 자기분화 향상!]", "rank": 6}, {"id": 1, "part": "교육학", "domain": "교육과정", "title": "위긴스와 맥타이 백워드 설계 모형 3단계 (Wiggins & McTighe)", "concept": "1단계 바라는 결과 확인 ➔ 2단계 수락할 만한 증거 결정 ➔ 3단계 학습경험과 수업 계획", "prob": 96, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [], "trend_note": "📊 2027 교육학 0~1순위 적중 예측: 최근 6개년 미출제 공백기이자 2022 개정 교육과정 핵심 정책과 직결된 최유력 테마입니다.", "passage": "김 교사: 그동안 저는 교과서 단원 순서대로 진도를 끝내거나 재미있는 모둠 활동만 나열하는 데 급급했던 것 같아요.\n박 교사: 그럴 땐 역방향(Backward)으로 교육과정을 설계해 보세요. 먼저 성취기준을 분석해 학생이 삶에서 끝까지 가져갈 대개념을 세우고, 수업 활동을 짜기 전에 수행과제와 채점 기준표부터 먼저 결정하는 것이 핵심입니다.", "asks": ["① 1단계의 공식 명칭과 성취기준 분석을 통해 수립하는 핵심 요소를 서술하시오.", "② 2단계의 공식 명칭과 수업 계획에 앞서 먼저 설계해야 하는 평가 도구를 서술하시오.", "③ 3단계의 공식 명칭과 수업 활동을 조직하는 원리를 서술하시오.", "④ 이 모형이 평가를 수업보다 먼저 설계함으로써 극복하고자 하는 전통적 수업 설계의 2가지 오류를 서술하시오."], "keywords": ["1단계 바라는 결과 확인", "2단계 수락할 만한 증거", "3단계 학습경험과 수업", "영속적 이해"], "answer_lines": ["첫째, 백워드 설계 1단계 바라는 결과 확인은 성취기준을 분석해 영속적 이해를 세운다.", "둘째, 2단계 수락할 만한 증거 결정은 수업에 앞서 수행과제와 루브릭을 먼저 설계한다.", "셋째, 3단계 학습경험과 수업 계획은 평가 기준에 맞추어 수업 활동을 체계화한다.", "넷째, 평가를 수업보다 먼저 설계하여 진도 나가기와 활동 위주의 설계 오류를 극복한다.", "이를 통해 학생이 세부 사실을 잊은 후에도 삶에 오래 전이되는 깊은 이해에 도달한다.", "이처럼 교사가 교육과정에서 백워드 설계를 쓰면 미래형 교육 혁신이 실현된다."], "lecture_summary": "전통적 수업은 목표만 세우면 바로 '교과서 진도 나가기(수업 계획)'부터 짜느라 정작 평가와 수업이 따로 노는 문제가 있었습니다. 그래서 위긴스와 맥타이는 거꾸로(Backward) 1단계에서 '영속적 이해(핵심 대개념)'를 정한 뒤, 수업보다 앞서 2단계에서 '평가(수행과제·루브릭)'를 먼저 설계하고, 마지막 3단계에서 수업을 짜라고 주장했습니다!", "lecture_point": "⚡ 시험장 1초 공식: [1단계 바라는 결과 확인(영속적 이해)] ➔ [2단계 수락할 만한 증거 결정(평가·루브릭 먼저!)] ➔ [3단계 학습경험과 수업 계획] (진도 나가기·활동 위주 오류 극복!)", "rank": 7}, {"id": 4, "part": "교육학", "domain": "교육방법", "title": "플립드 러닝(거꾸로 수업) 수업 전·중·후 3단계 및 교사 역할", "concept": "수업 전 디딤영상 사전학습 ➔ 수업 중 협력적 문제해결·맞춤 비계 ➔ 수업 후 성찰일지", "prob": 96, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [], "trend_note": "📊 2027 교육학 0~1순위 적중 예측: 최근 6개년 미출제 공백기이자 2022 개정 교육과정 핵심 정책과 직결된 최유력 테마입니다.", "passage": "유 교사: 교실에서 개념 설명을 하느라 시간을 다 써서 정작 심화 탐구나 협력 활동을 할 시간이 전혀 없어요.\n홍 교사: 거꾸로 수업을 적용해 보세요. 수업 전에 학생들이 짧은 영상을 보고 기초 지식을 익혀 오게 하고, 교실 수업 시간에는 모둠별 프로젝트와 토의를 진행하면서 선생님은 모둠을 돌아다니며 맞춤형 도움을 주는 겁니다. 수업이 끝난 뒤에는 스스로 배움을 돌아보게 하고요.", "asks": ["① 수업 전 단계에서 학생이 수행하는 사전 학습 활동과 매체를 서술하시오.", "② 수업 중 단계에서 교실 안에서 이루어지는 학생 중심 학습 활동을 서술하시오.", "③ 수업 중 단계에서 교사가 수행해야 할 구체적인 조력 역할을 서술하시오.", "④ 수업 후 단계에서 학생이 작성하는 도구와 이를 통해 기르는 역량을 서술하시오."], "keywords": ["디딤영상 사전학습", "협력적 문제해결", "맞춤형 비계설정", "성찰일지(초인지·메타인지)"], "answer_lines": ["첫째, 수업 전 단계에서 학생은 교사가 제공한 온라인 디딤영상을 통해 기초 개념을 학습한다.", "둘째, 수업 중 단계에서는 전통적 강의를 배제하고 토의 토론과 협력 탐구를 진행한다.", "셋째, 교사는 모둠 활동을 순회하며 학생의 오개념을 교정하고 수준별 비계를 제공한다.", "넷째, 수업 후 단계에서는 성찰일지를 작성하여 자신의 사고 과정을 점검하고 초인지를 높인다.", "교실 수업을 지식 전달 공간에서 고차원적 사고력과 협력 역량을 기르는 장으로 전환한다.", "이처럼 교사가 교육방법에서 역진행 수업을 쓰면 신개념 수업 혁신이 실현된다."], "lecture_summary": "플립드 러닝(거꾸로 수업)은 '교실에서는 강의 듣고 집에서 혼자 어려운 숙제를 하던 전통 수업'을 완전히 뒤집었습니다! [수업 전] 집에서 짧은 디딤영상으로 기초 개념을 미리 보고 오고, [수업 중] 교실에서는 강의 없이 모둠 토의·협력 문제해결을 하며 교사는 순회 코칭(비계)을 하고, [수업 후] 성찰일지로 메타인지를 다집니다.", "lecture_point": "⚡ 시험장 1초 공식: [수업 전: 온라인 디딤영상 기초개념] ➔ [수업 중: 모둠 협력적 문제해결 + 교사의 순회 오개념 교정·맞춤 비계] ➔ [수업 후: 성찰일지·메타인지]", "rank": 8}, {"id": 7, "part": "교육학", "domain": "교육평가", "title": "비고츠키 근접발달영역(ZPD) 기반 역동적 평가 (3단계 측정)", "concept": "사전검사 ➔ 교수 개입(비계설정) ➔ 사후 재검사의 3단계 상호작용으로 잠재력 측정", "prob": 96, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [], "trend_note": "📊 2027 교육학 0~1순위 적중 예측: 최근 6개년 미출제 공백기이자 2022 개정 교육과정 핵심 정책과 직결된 최유력 테마입니다.", "passage": "전 교사: 지필고사 점수만으로는 똑같이 50점을 받은 두 학생 중 누가 조금만 도와주면 90점으로 도약할 잠재력이 있는지 알 수가 없어요.\n고 교사: 비고츠키 이론에 바탕을 둔 역동적 평가를 실시해 보세요. 1차 검사 후 교사가 평가 과정에서 직접 힌트와 단계적 발판을 제공하고 다시 검사함으로써, 현재 수준을 넘어 앞으로 성장할 수 있는 잠재적 발달 가능성을 측정하는 것입니다.", "asks": ["① 역동적 평가의 이론적 기반이 되는 비고츠키의 핵심 발달 개념과 그 의미를 서술하시오.", "② 일회성 정적 평가를 넘어 역동적 평가가 진행되는 3단계 측정 절차를 서술하시오.", "③ 평가 도중 교사의 개입 방식과 이를 통해 나타나는 평가-교수의 관계를 서술하시오.", "④ 역동적 평가를 통해 궁극적으로 파악하고자 하는 학습자의 특성을 서술하시오."], "keywords": ["근접발달영역(ZPD)", "역동적 평가 3단계", "평가와 교수의 유기적 통합", "잠재적 발달수준"], "answer_lines": ["첫째, 혼자 해결하는 실제적 발달과 도움받아 도달하는 잠재적 발달 간극인 ZPD를 주목한다.", "둘째, 결과만 재는 정적 평가를 넘어 사전검사와 중재 및 재검사의 3단계로 측정을 진행한다.", "셋째, 평가 도중 교사가 힌트와 비계설정을 제공하는 평가와 교수의 유기적 통합을 이룬다.", "넷째, 상호작용적 평가를 통해 학생의 숨겨진 학습 잠재력과 미래 성장 가능성을 진단한다.", "과거의 성취 서열화가 아니라 학생 한 명 한 명의 잠재력을 꽃피우는 맞춤형 지원을 제공한다.", "이처럼 교사가 교육평가에서 역동적 평가를 쓰면 전인적 성장 평가가 실현된다."], "lecture_summary": "전통적인 정적 평가는 시험 보는 동안 교사가 절대 힌트를 주지 않고 '현재 혼자 할 수 있는 수준'만 잽니다. 반면 비고츠키의 근접발달영역(ZPD)에 기반한 '역동적 평가'는 [사전검사 ➔ 중재(힌트·비계 제공) ➔ 재검사]를 통해 평가와 교수를 하나로 합쳐 학생의 '잠재적 발달 수준(미래 성장 가능성)'을 진단합니다!", "lecture_point": "⚡ 시험장 1초 공식: 역동적 평가 = [근접발달영역(ZPD: 실제적 발달~잠재적 발달 간극)] + [사전검사-중재(비계)-재검사 3단계] + [평가와 교수의 유기적 통합]", "rank": 9}, {"id": 9, "part": "교육학", "domain": "교육행정", "title": "세르지오바니(Sergiovanni) 도덕적 리더십과 학교 공동체 구축", "concept": "관료적 통제를 넘어 도덕적 권위와 전문적 책무성으로 교사를 자기지도자로 육성", "prob": 96, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [], "trend_note": "📊 2027 교육학 0~1순위 적중 예측: 최근 6개년 미출제 공백기이자 2022 개정 교육과정 핵심 정책과 직결된 최유력 테마입니다.", "passage": "차 교사: 새로 오신 교장선생님은 법규와 지시, 감독만 강조하시니 선생님들이 오히려 수동적으로 변하고 열정을 잃어가고 있어요.\n민 교사: 학교는 일반 관료 조직과 다릅니다. 세르지오바니가 강조했듯이 전문성과 도덕적 권위를 바탕으로 교사 한 분 한 분을 자율적인 리더로 존중하고, 교육적 사명감과 도덕적 가치를 공유하는 공동체를 만들어야 교사들의 자발적 헌신이 살아납니다.", "asks": ["① 도덕적 리더십이 지양하는 전통적 권위와 지향하는 핵심 권위 기반을 서술하시오.", "② 도덕적 리더십이 학교 구성원인 교사를 어떠한 존재로 성장시키는지 서술하시오.", "③ 공유된 도덕적 가치와 사명감을 바탕으로 구축하고자 하는 학교 조직의 모습을 서술하시오.", "④ 외적 통제 없이도 학교 혁신을 이끌어내는 교사들의 심리적 동력을 서술하시오."], "keywords": ["도덕적 리더십", "자기지도자(Self-leader)", "도덕적 공동체", "전문적 책무성"], "answer_lines": ["첫째, 도덕적 리더십은 지시와 통제의 관료적 권위를 탈피해 전문성과 도덕적 권위에 기반한다.", "둘째, 구성원을 수동적 피감독자가 아닌 학교 사명을 스스로 다하는 자기지도자로 육성한다.", "셋째, 공유된 도덕적 가치와 교육적 사명감을 바탕으로 신뢰와 돌봄의 학교 공동체를 구축한다.", "넷째, 외적 통제 없이도 교사들의 내적 동기와 자발적 헌신을 이끌어내 지속적 혁신을 이룬다.", "지도자는 군림하지 않고 교직원을 섬기는 서번트 리더십을 발휘해 민주적 문화를 세운다.", "이처럼 교사가 교육행정에서 도덕적 리더십을 쓰면 교사의 수석 역량이 증진된다."], "lecture_summary": "세르지오바니는 학교를 일반 회사처럼 명령과 규칙('관료적 권위')으로 통제하면 교사들은 시키는 것만 하는 수동적 존재가 된다고 보았습니다. 학교장은 '전문적·도덕적 권위'를 바탕으로 교사를 스스로 움직이는 '자기지도자(Self-leader)'로 세우고, 학교를 공유된 가치와 사명감으로 뭉친 '도덕적 학교 공동체'로 만들어야 합니다!", "lecture_point": "⚡ 시험장 1초 공식: 세르지오바니 도덕적 리더십 = [관료적 권위 탈피 ➔ 전문성·도덕적 권위] + [교사를 자기지도자로 육성] + [공유된 가치의 학교 공동체 구축 ➔ 내적 동기·자발적 헌신]", "rank": 10}, {"id": 43, "part": "전공상담", "domain": "진로·다문화·위기", "title": "홀랜드 육각형 모델 5대 개념(변별도·계측성) 및 사비카스 CSI·진로적응도 4C", "concept": "일치성·일관성·변별도(분화도)·정체감·계측성 및 사비카스 생애 주제와 관심·통제·호기심·자신감", "prob": 95, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [2021, 2022, 2023, 2024, 2025], "trend_note": "📊 실제 기출(2021년, 2022년, 2023년, 2024년, 2025년 · 5회): 7개년 최빈출 부동의 핵심 영역으로 2027학년도 복합형 문항 출제가 확실시됩니다.", "passage": "진로상담교사가 학생 P의 홀랜드 검사를 해석하며 P의 흥미 유형(예술형)과 희망 학과(회계학과-관습형)의 부합 정도를 살펴보고, 6개 유형 점수가 모두 비슷해 프로파일이 평평한 원인을 탐색하였다. 이어 사비카스의 생애 직업 스타일 면담(CSI)을 통해 어린 시절 존경하던 인물과 좋아하는 이야기를 물으며 P의 삶을 관통하는 핵심 주제를 찾고 진로적응도 4대 차원을 점검하였다.", "asks": ["① 홀랜드 이론에서 내담자의 성격 유형과 작업 환경이 서로 부합하는 정도를 뜻하는 개념을 서술하시오.", "② 특정 흥미 유형의 점수가 다른 유형과 뚜렷하게 구별되는 정도를 뜻하는 개념을 서술하시오.", "③ 사비카스의 생애 직업 스타일 면담(CSI)을 통해 궁극적으로 파악하려는 핵심 개념을 서술하시오.", "④ 사비카스의 진로적응도(4C)를 구성하는 4가지 핵심 차원의 명칭을 모두 서술하시오."], "keywords": ["일치성과 변별도(분화도)", "생애 직업 스타일 면담(CSI)", "진로적응도(4C)", "4대 차원"], "answer_lines": ["내담자의 성격 유형과 작업 환경이 서로 얼마나 부합하는지 일치성을 본다.", "특정 흥미 유형의 점수가 뚜렷하게 구별되는 정도인 변별도(분화도)를 확인한다.", "사비카스 생애 직업 스타일 면담(CSI)을 통해 파악하려는 핵심은 생애 주제이다.", "진로적응도(4C)를 구성하는 4대 차원은 관심과 통제 및 호기심과 자신감이다."], "lecture_summary": "홀랜드(Holland) 육각형 모델의 5대 진단 개념([일치성: 내 흥미와 직업 환경의 부합], [분화도: 가장 높은 점수와 낮은 점수의 차이 - 뚜렷함], [일관성: 인접한 유형끼리의 심리적 유사성], [계측성: 육각형 거리가 멀수록 상관이 낮다는 반비례 원리], [정체성: 목표의 명확성])과, 사비카스(Savickas) 구성주의 진로상담의 '생애 직업 스타일 면담(CSI: 존경하는 역할모델·애독서·좌우명 등을 통해 내 삶의 핵심인 생애 주제를 찾음)' 및 진로적응도 4C([관심·통제·호기심·자신감])를 한 번에 묶어 정복합니다!", "lecture_point": "⚡ 시험장 1초 공식: 홀랜드 [일치성(사람-환경 부합)·분화도(프로파일 뚜렷함)·계측성(거리 반비례)] / 사비카스 CSI 핵심 = [생애 주제] + 진로적응도 4C = [관심·통제·호기심·자신감!]", "rank": 11}, {"id": 27, "part": "전공상담", "domain": "가족치료", "title": "미누친 구조적 가족치료 밀착·유리 경계선 및 실연화(Enactment)", "concept": "밀착된 경계선과 유리된 경계선을 명확한 경계선으로 교정하기 위한 상담실 내 실연화", "prob": 95, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [2022, 2023, 2024, 2026], "trend_note": "📊 실제 기출(2022년, 2023년, 2024년, 2026년 · 4회): 7개년 최빈출 부동의 핵심 영역으로 2027학년도 복합형 문항 출제가 확실시됩니다.", "passage": "상담실에 온 어머니는 고등학생 아들의 사소한 감정까지 자신이 대신 대변하며 과도하게 간섭하는 반면, 아버지는 팔짱을 낀 채 '집안일은 엄마랑 알아서 해라'라며 대화에 전혀 참여하지 않는다. 상담자는 어머니에게 '어머니, 지금 이 자리에서 아버지께 아들의 진로 문제를 직접 말씀해 보시겠어요?'라고 요청하였다.", "asks": ["① 미누친의 구조적 가족치료 관점에서 어머니-아들 간 경계선과 아버지-가족 간 경계선의 명칭을 각각 서술하시오.", "② 상담자가 상담실 안에서 실제 가족의 갈등 상호작용을 직접 재연하게 한 기법의 명칭을 서술하시오.", "③ 설명으로 듣는 대신 해당 기법을 사용할 때 얻을 수 있는 치료적 이점을 서술하시오.", "④ 구조적 가족치료를 통해 궁극적으로 달성해야 할 가족 구조의 변화 목표를 서술하시오."], "keywords": ["밀착된 경계선", "유리된 경계선", "실연화(Enactment)", "명확한 경계선"], "answer_lines": ["어머니와 아들은 밀착된 경계선이며 아버지는 가족과 유리된 경계선이다.", "상담실에서 실제 가족의 갈등 행동을 재연하게 하는 기법은 실연화이다.", "설명으로 듣는 대신 상호작용 패턴을 현장에서 있는 그대로 직접 관찰한다.", "역기능적 의사소통 구조를 교정하고 세대 간 명확한 경계선을 재형성한다."], "lecture_summary": "미누친의 구조적 가족치료는 가족 하위체계 사이의 '경계선(Boundary)'을 고치는 치료입니다! 엄마와 아들이 껌딱지처럼 붙어 서로의 영역을 침범하면 '밀착된 경계선'이고, 아빠가 투명인간처럼 무관심하게 동떨어져 있으면 '유리된 경계선'입니다. 상담자는 가족에게 말로만 설명하게 하지 않고 상담실 그 자리에서 평소 싸우던 대화를 직접 해보게 하는 '실연화(Enactment)'를 통해 역기능적 구조를 눈으로 관찰하고 '명확한 경계선'으로 재구조화합니다!", "lecture_point": "⚡ 시험장 1초 공식: 미누친 경계선 = [밀착된 경계선(과도한 개입) vs 유리된 경계선(무관심·소원) ➔ 목표: 명확한 경계선] + 상담실 내 갈등 직접 재연 기법 = [실연화(Enactment)!]", "rank": 12}, {"id": 52, "part": "전공상담", "domain": "진로·다문화·위기", "title": "상담윤리(이중관계·사전동의) 및 키치너(Kitchener) 윤리적 의사결정 5원칙", "concept": "자율성·무해성·선행·정의·충실성 5대 윤리 원칙과 이중관계 회피 및 사전동의(Informed Consent)", "prob": 95, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [2020, 2025, 2026], "trend_note": "📊 실제 기출(2020년, 2025년, 2026년 · 3회): 최근 평가원 핵심 출제 트렌드 영역으로 감별·응용 변형 출제 대비가 필수입니다.", "passage": "전문상담교사 박 교사는 평소 친분이 두터운 이웃 학부모로부터 자녀의 개인상담을 부탁받고 고민에 빠졌다. 또한 다른 고위험군 내담자와의 초기 면접에서 상담의 진행 방식과 비밀보장의 범위 및 예외 사안 등을 충분히 설명하지 않은 채 바로 상담에 들어갔다가 추후 보호자 통보 과정에서 큰 갈등을 겪었다.", "asks": ["① 상담 시작 전 비밀보장의 범위와 예외 사안 등을 충분히 안내하고 동의를 받는 절차를 서술하시오.", "② 박 교사가 친분이 있는 이웃 자녀를 상담할 때 발생할 수 있는 윤리적 문제의 명칭을 서술하시오.", "③ 윤리적 갈등을 판단할 때 활용하는 키치너(Kitchener)의 5대 윤리 원칙을 모두 서술하시오.", "④ 위 원칙 중 내담자의 안전과 관련해 가장 우선적으로 고려해야 하는 원칙을 서술하시오."], "keywords": ["사전동의", "이중관계 회피", "키치너 5대 윤리 원칙", "무해성과 선행"], "answer_lines": ["상담 시작 전 비밀보장과 한계 및 절차를 설명해 동의를 얻는 것은 사전동의다.", "상담자의 객관성을 흐리고 착취 위험을 높이는 다중(이중)관계는 엄격히 피한다.", "키치너 윤리 원칙은 자율성, 무해성, 선행, 정의, 충실성의 5가지로 구성된다.", "윤리적 딜레마가 발생하면 해를 입히지 않는 무해성 원칙을 최우선으로 고려한다."], "lecture_summary": "상담윤리 문제는 실제 2024 A1에도 나왔듯이 '키치너의 5대 윤리 원칙'과 '이중관계/사전동의'가 단골입니다! 5원칙은 [자율성(스스로 결정) · 무해성(절대 해 끼치지 않기 — 1순위!) · 선행(도움 주기) · 정의(공정) · 충실성(약속·신뢰 지키기)]입니다. 또한 학교에서 교사-학생 관계와 상담자-내담자 관계가 겹치거나, 학부모 지인 등을 상담할 때는 '이중관계' 위험을 경계하고 반드시 사전동의와 수퍼비전을 받아야 합니다!", "lecture_point": "⚡ 시험장 1초 공식: 키치너 5원칙 = [자율성 · 무해성(최우선!) · 선행 · 정의 · 충실성] + [사전동의(비밀보장 예외 안내)] + [이중관계 회피(불가피 시 경계 설정·수퍼비전!)]", "rank": 13}, {"id": 15, "part": "전공상담", "domain": "DSM-5-TR 감별진단", "title": "주의력결핍 과잉행동장애(ADHD) 만 12세 발병 기준 및 3대 하위 유형", "concept": "만 12세 이전 발병, 2개 이상 환경 기능 손상, 복합형 및 주의력 결핍 우세형 감별", "prob": 95, "tier": "0순위", "tier_label": "🔥 0순위 최유력", "past_years": [2022, 2024], "trend_note": "📊 실제 기출(2022년, 2024년 · 2회): 최근 2년간 미출제로 2027학년도 순환 주기 재출제 확률이 매우 높습니다.", "passage": "중학생 내담자 B는 초등학교 3학년(만 9세) 때부터 학교 수업 시간과 가정에서 모두 준비물을 상습적으로 잃어버리고 과제를 끝내지 못할 뿐만 아니라, 수업 중 자리를 이탈하고 질문이 끝나기 전에 불쑥 대답하는 행동을 지속적으로 보이고 있다. 반면 여학생 C는 과잉행동은 없으나 수업 s": ["불안과 주의력 저하로 작업기억과 처리속도가 낮아지면 일반능력지수(GAI)를 본다.", "TCI에서 자극추구가 높고 위험회피가 낮으면 강한 호기심과 충동성을 보인다.", "성숙도와 사회적 적응을 결정하는 핵심 성격 척도는 자율성과 연대감이다.", "자기 행동을 책임지는 자율성과 타인을 수용하는 연대감을 함께 길러준다."], "lecture_summary": "웩슬러 지능검사(K-WISC-V / K-WAIS-IV)에서 우울·불안이나 ADHD 때문에 '작업기억'과 '처리속도'(즉, 인지효능지수 CPI)가 뚝 떨어지면 전체 IQ(FSIQ)가 실제보다 낮게 나옵니다. 이때는 언어이해와 시공간/유동추론만 묶어 순수 추론 잠재력을 보여주는 '일반능력지수(GAI)'로 해석해야 합니다! 함께 출제되는 TCI 검사에서는 기질 척도(자극추구↑·위험회피↓ = 충동성)가 미성숙해도 성격 척도인 '자율성'과 '연대감'을 키워주면 건강하게 적응할 수 있습니다.", "lecture_point": "⚡ 시험장 1초 공식: 웩슬러 작업기억·처리속도 저하 시 = [일반능력지수(GAI)로 순수 잠재력 확인!] / TCI 기질 [자극추구↑·위험회피↓ = 충동·비행] ➔ 성숙도를 결정하는 핵심 성격 = [자율성과 연대감!]", "rank": 18}, {"id": 8, "part": "교육학", "domain": "교육평가", "title": "다차원 수행평가 루브릭(분석적 vs 총체적)과 메이거 행동적 목표", "concept": "평가 준거·성취 수준·척도 기술어 3대 요소와 사전 공유를 통한 메타인지 및 신뢰도 제고", "prob": 92, "tier": "1순위", "tier_label": "⭐ 1순위 핵심적중", "past_years": [2026], "trend_note": "📊 실제 기출(2026년 · 1회): 최근 평가원 핵심 출제 트렌드 영역으로 감별·응용 변형 출제 대비가 필수입니다.", "passage": "하 교사: 서술형·프로젝트 수행평가를 할 때마다 채점 기준이 모호해 학생들의 이의 제기가 많고 구체적인 피드백을 주기도 어렵습니다.\n우 교사: 다차원 채점기준표(루브릭)를 세 가지 필수 요소를 갖추어 정교하게 개발해 보세요. 특히 세부 영역별로 강약점을 진단할 수 있는 유형을 선택해 과제 부여 시 학생들에게 미리 공개하고, 수업 목표 역시 메이거의 3요소에 맞춰 명확히 진술하면 평가의 신뢰도가 높아집니다.", "asks": ["① 수행평가 채점기준표인 루브릭(Rubric)을 구성하는 3대 핵심 요소를 서술하시오.", "② 세부 영역별 강약점을 진단하여 맞춤형 피드백을 제공하는 루브릭 유형과 장점을 서술하시오.", "③ 루브릭을 평가 실시 전에 학생에게 사전 공유해야 하는 교육적 이유를 서술하시오.", "④ 메이거(Mager)의 행동적 수업목표 진술에 포함되어야 할 3가지 요소를 서술하시오."], "keywords": ["루브릭 3대 구성 요소", "평가준거·성취수준·척도기술어", "분석적 루브릭", "메이거 3요소"], "answer_lines": ["첫째, 수행평가 루브릭은 평가 준거와 성취 수준 및 구체적인 척도 기술어 3요소로 구성된다.", "둘째, 세부 영역별 강약점을 진단하여 맞춤형 피드백을 제공하는 분석적 루브릭을 활용한다.", "셋째, 평가 실시 전에 루브릭을 사전 공유하여 도달 목표를 알리고 자기조절학습을 돕는다.", "넷째, 메이거의 목표 진술에 따라 조건, 도착점 행동, 수락 기준 3요소를 명확히 제시한다.", "채점자의 주관적 편향을 줄여 채점 신뢰도와 타당도를 확보하고 공정한 평가를 구현한다.", "이처럼 교사가 교육평가에서 분석적 루브릭을 쓰면 전인적 성장 평가가 실현된다."], "lecture_summary": "수행평가에서 교사의 주관적 채점 논란을 없애주는 무기가 바로 다차원 채점기준표인 '루브릭(Rubric)'입니다! 루브릭은 [평가 준거 + 성취 수준 + 척도 기술어] 3요소로 구성되며, 세부 항목별로 점수와 피드백을 주는 '분석적 루브릭'을 과제 시작 전에 미리 학생에게 공개(사전 공유 ."], "keywords": ["경계선 성격장애", "의존성 성격장애", "분열(Splitting) 방어기제", "변증법적 행동치료(DBT)"], "answer_lines": ["진희는 경계선 성격장애이며 수연은 의존성 성격장애로 각각 감별 진단한다.", "진희는 타인을 극단적 이상화와 평가절하로 분리하는 분열 방어기제를 쓴다.", "수연은 버림받지 않기 위해 타인에게 과도하게 굴종하고 수동적으로 순종한다.", "수용과 변화를 통합하여 정서 조절을 돕는 변증법적 행동치료(DBT)를 쓴다."], "lecture_summary": "둘 다 '버림받는 것(유기 불안)'을 가장 두려워하지만 반응 방식이 정반대입니다! '경계선 성격장애'는 버림받을 것 같으면 극심한 분노·자해·공허감을 터뜨리며 상대를 천사('극단적 이상화')로 봤다가 악마('평가절하')로 보는 '분열(Splitting)' 방어기제를 씁니다. 반면 '의존성 성격장애'는 버림받지 않으려고 상대에게 무조건 매달리고 순종·굴종합니다. 경계선 성격장애의 1순위 치료는 마샤 리네한의 '변증법적 행동치료(DBT)'입니다!", "lecture_point": "⚡ 시험장 1초 공식: 유기 불안 대처 = [경계선 성격장애: 분노·자해 + 분열(이상화·평가절하) + 변증법적 행동치료(DBT)] vs [의존성 성격장애: 매달림·과도한 굴종·순종]", "rank": 26}, {"id": 32, "part": "전공상담", "domain": "상담이론", "title": "엘리스 합리적 정서행동치료(REBT) 3대 논박 및 수치심 공격 연습", "concept": "논리적·실증적·실용적 논박을 통한 당위적 신념 해체 및 수치심 공격 연습", "prob": 91, "tier": "1순위", "tier_label": "⭐ 1순위 핵심적중", "past_years": [2021], "trend_note": "📊 실제 기출(2021년 · 1회): 최근 2년간 미출제로 2027학년도 순환 주기 재출제 확률이 매우 높습니다.", "passage": "실수를 절대 해서는 안 된다는 비합리적 신념을 가진 내담자에게 상담자가 세 가지 방식으로 논박을 시도하였다. 첫째, '모든 사람이 단 한 번도 실수하지 않는다는 객관적 증거가 있나요?', 둘째, '그 생각을 계속 붙잡고 있는 것이 시험 준비에 실제로 도움이 되나요?', 셋째, '발표를 한 번 실수했다고 해서 당신이 무가치한 인간이라는 결론이 논리적으로 성립하나요?' 이어 상담자는 타인의 시선에 대한 두려움을 줄이기 위해 지하철에서 큰 소리로 정거장 이름을 외쳐보는 행동 과제를 부여하였다.", "asks": ["① 첫 번째 질문과 같이 객관적 사실과 증거에 부합하는지 묻는 논박 유형의 명칭을 서술하시오.", "② 두 번째 질문과 같이 신념이 실제 삶에 도움이 되는지 유용성을 묻는 논박 유형의 명칭을 서술하시오.", "③ 세 번째 질문과 같이 전제와 결론 사이의 비약과 모순을 지적하는 논박 유형의 명칭을 서술하시오.", "④ 타인의 부정적 시선에 대한 파국적 두려움을 깨뜨리기 위해 부여한 행동 기법의 명칭을 서술하시오."], "keywords": ["합리적 정서행동치료(REBT)", "실증적 논박", "실용적 논박", "논리적 논박"], "answer_lines": ["REBT에서 비합리적 신념을 뒷받침하는 객관적 사실 증거를 묻는 실증적 논박이다.", "신념을 고수하는 것이 실제 삶에 어떤 도움이 되는지 묻는 실용적 논박이다.", "전제와 결론 사이의 비논리적 비약과 모순을 지적하는 논리적 논박을 한다.", "타인의 시선에 대한 파국적 두려움을 깨뜨리는 수치심 공격 연습을 실천한다."], "lecture_summary": "엘리스(Ellis)의 합리적 정서행동치료(REBT)에서는 내담자의 당위적·비합리적 신념(iB)을 깨부수기 위해 3가지 논박(Disputation)을 구사합니다! ① '그 생각이 객관적 사실과 증거에 부합하나요?'라고 물으면 '실증적(경험적) 논박', ② '그 생각을 고집하는 게 당신의 기분과 목표 달성에 실제 도움이 되나요?'라고 물으면 '실용적(기능적) 논박', ③ '시험 한 번 망쳤다고 인간 전체가 무가치하다는 게 논리적으로 말이 되나요?'라고 물으면 '논리적 논박'입니다! 그리고 남들의 시선 두려움을 행동으로 깨기 위해 일부러 우스꽝스러운 행동을 해보는 '수치심 공격 연습'을 씁니다.", "lecture_point": "⚡ 시험장 1초 공식: REBT 3대 논박 = [실증적 논박(객관적 사실·증거)] + [실용적 논박(실제적 도움·유용성)] + [논리적 논박(전제-결론 비약·모순)] + 행동 기법 = [수치심 공격 연습!]", "rank": 27}, {"id": 51, "part": "전공상담", "domain": "상담이론", "title": "얄롬(Yalom) 집단상담 11대 치료적 요인 & 집단 저항(독점자·중도탈락) 개입", "concept": "보편성·희망 고취·이타심·응집력 등 치료적 요인 및 문제 집단원(독점·침묵·탈락)의 지금-여기 개입", "prob": 90, "tier": "1순위", "tier_label": "⭐ 1순위 핵심적중", "past_years": [2020, 2021, 2022, 2024, 2025, 2026], "trend_note": "📊 실제 기출(2020년, 2021년, 2022년, 2024년, 2025년, 2026년 · 6회): 7개년 최빈출 부동의 핵심 영역으로 2027학년도 복합형 문항 출제가 확실시됩니다.", "passage": "고등학교 자기성장 집단상담 초기 회기에서 한 학생이 '나만 가정 형편이 어렵고 부모님과 싸우는 줄 알았는데 친구들도 비슷한 아픔이 있다는 걸 알고 마음이 놓였다'고 말했다. 한편 3회기 중 다른 학생 A가 계속 자기 이야기만 20분째 독점하자, 침묵하던 학생 B가 갑자기 '지루해서 나가고 싶다'며 중도 탈락 의사를 밝혔다.", "asks": ["① 첫 번째 학생이 경험한 얄롬(Yalom)의 집단상담 치료적 요인의 명칭을 서술하시오.", "② 집단상담에서 개인상담의 치료적 동맹에 해당하는 가장 핵심적인 치료적 요인을 서술하시오.", "③ 자기 이야기만 독점하는 학생 A와 저항하는 학생 B를 대하는 '지금-여기' 개입 원칙을 서술하시오.", "④ 집단원의 중도 탈락을 예방하기 위해 집단 시작 전 실시해야 할 절차를 서술하시오."], "keywords": ["보편성", "집단 응집력", "지금-여기 과정 점검", "중도 탈락 예방"], "answer_lines": ["나만 힘든 게 아니라 타인도 같은 고통을 겪는다는 깨달음은 보편성 요인이다.", "집단 내 소속감과 신뢰를 형성하여 변화의 토대가 되는 핵심은 집단 응집력이다.", "독점자나 저항 집단원에게는 비난 대신 지금-여기 대인관계 영향을 피드백한다.", "중도 탈락을 막기 위해 사전 오리엔테이션으로 규범을 세우고 갈등을 탐색한다."], "lecture_summary": "개인상담은 1:1이지만 집단상담은 '작은 사회(사회적 소우주)'입니다! 얄롬이 꼽은 핵심 치료적 요인은 '나만 이상한 줄 알았는데 다들 그렇구나!(보편성)', '내가 남을 도울 수 있구나!(이타심)', 그리고 개인상담의 라포에 해당하는 '집단 응집력'입니다. 만약 집단 중에 말을 독점하거나 중간에 나가겠다고(중도탈락) 버티면, 그 사람을 혼내지 말고 '지금-여기에서 집단원들이 어떻게 느끼는지'를 집단 과정으로 다루어야 합니다!", "lecture_point": "⚡ 시험장 1초 공식: 얄롬 핵심 요인 = [보편성(나만 그런 게 아니구나) · 집단 응집력(소속·신뢰) · 이타심] / 집단 저항 대처 = [개인 비난 금지 ➔ 지금-여기 과정(Process) 탐색!]", "rank": 28}, {"id": 46, "part": "전공상담", "domain": "DSM-5-TR 감별진단", "title": "주요우울장애 vs 지속성 우울장애(기분부전장애) & 양극성 I·II형 장애 감별", "concept": "2주 이상 심한 우울(주요우울) vs 2년(아동·청소년 1년) 만성 우울(지속성) 및 조증(I형)·경조증(II형) 감별", "prob": 90, "tier": "1순위", "tier_label": "⭐ 1순위 핵심적중", "past_years": [2024, 2025, 2026], "trend_note": "📊 실제 기출(2024년, 2025년, 2026년 · 3회): 최근 평가원 핵심 출제 트렌드 영역으로 감별·응용 변형 출제 대비가 필수입니다.", "passage": "[내담자 서연] 고등학교 1학년 서연이는 중학교 2학년 때부터 약 2년간 늘 가라앉은 기분과 피로감을 안고 지내왔으나, 최근 3주 전부터는 잠을 거의 자지 않고 밤새 여러 동아리 기획안을 쓰며 말수가 폭발적으로 늘고 평소보다 과도하게 들뜬 상태를 5일간 유지하였다. 다만 이로 인해 학교생활이 파탄 나거나 입원할 정도는 아니었다.", "asks": ["① 내담자 서연이 아동·청소년기 기준 1년 이상 보여온 만성 우울의 공식 진단명과 기간 기준을 서술하시오.", "② 급성으로 나타나는 주요우울장애의 최소 지속 기간 및 핵심 증상을 서술하시오.", "③ 최근 5일간 나타난 들뜬 상태의 명칭과 이에 따라 최종 감별되는 공식 진단명을 서술하시오.", "④ 만약 현저한 사회적·직업적 기능 손상이나 입원을 요하는 삽화가 1회라도 있었다면 내려지는 진단명을 서술하시오."], "keywords": ["주요우울장애", "지속성 우울장애", "양극성 II형 장애", "경조증 삽화"], "answer_lines": ["지속성 우울장애는 아동 및 청소년 기준 1년 이상 만성적인 우울 기분이 이어진다.", "주요우울장애는 최소 2주 이상 우울 기분과 흥미 상실 및 자살 사고가 온다.", "과거에 4일 이상 지속된 경조증 삽화가 있었다면 양극성 II형 장애로 감별한다.", "완전한 조증 삽화를 한 번이라도 경험했다면 양극성 I형 장애로 공식 진단한다."], "lecture_summary": "우울·양극성 장애 감별은 '기간'과 '삽화의 강도'가 핵심입니다! 성인 2년(아동·청소년 1년) 이상 은근하고 만성적으로 우울하면 '지속성 우울장애'이고, 최소 2주 이상 급격히 무너지면 '주요우울장애'입니다. 여기에 기분이 붕 뜨는 삽화가 섞이면 반드시 양극성을 감별해야 하는데, 일주일 이상 기능 손상·입원 수준이면 '조증 삽화(양극성 I형)', 4일 이상 들뜨지만 입원·정신증까지는 아니면 '경조증 삽화(양극성 II형)'로 나눕니다!", "lecture_point": "⚡ 시험장 1초 공식: [2주 심한 우울 = 주요우울장애] / [아동·청소년 1년 만성 = 지속성 우울장애] / [조증 = 양극성 I형] vs [4일 이상 경조증 + 우울 = 양극성 II형!]", "rank": 29}, {"id": 18, "part": "전공상담", "domain": "DSM-5-TR 감별진단", "title": "외상후 스트레스 장애(PTSD) vs 급성 스트레스 장애(ASD) 감별 진단", "concept": "침습·회피·인지기분·각성 4대 증상군 및 1개월 지속 기간 분기점과 EMDR 치료", "prob": 90, "tier": "1순위", "tier_label": "⭐ 1순위 핵심적중", "past_years": [2024], "trend_note": "📊 실제 기출(2024년 · 1회): 최근 2년간 미출제로 2027학년도 순환 주기 재출제 확률이 매우 높습니다.", "passage": "대형 교통사고를 함께 겪은 두 학생이 상담실에 찾아왔다. 두 학생 모두 사고 장면이 불쑥 떠오르는 침습 증상과 차를 타지 못하는 회피 증상을 호소하고 있다. 학생 A는 사고 발생 후 2주째 해당 증상을 겪고 있으며, 학생 B는 사고 발생 후 3개월이 지난 현재까지도 증상이 지속되어 등교하지 못하고 있다.", "asks": ["① 두 학생이 공통적으로 겪고 있는 외상 관련 핵심 증상 2가지를 서술하시오.", "② 증상이 외상 후 3일에서 1개월 이내에 해당하는 학생 A의 공식 진단명을 서술하시오.", "③ 핵심 증상이 1개월 이상 지속되고 있는 학생 B의 공식 진단명을 서술하시오.", "④ 외상 피해 학생의 심리적 회복을 위해 적용할 초기 개입과 정-타인긍정", "어른 자아(A)"], "answer_lines": ["교류분석(TA)에서 타인을 탓하고 책임을 전가하는 자기긍정-타인부정 자세를 본다.", "무력감에 빠져 의존적인 태도를 취하는 자기부정-타인긍정 자세를 극복한다.", "상호 존중과 신뢰를 바탕으로 한 자기긍정-타인긍정 자세로 변화시킨다.", "상황을 객관적으로 분석하는 어른 자아(A)를 활성화하여 내적 균형을 회복한다."], "lecture_summary": "번(Berne)과 해리스(Harris)의 교류분석(TA)에서 어린 시절 결정된 4가지 생활자세 중 타인을 비난하고 책임을 떠넘기는 독선적 태도는 '자기긍정-타인부정(I+U-)'이고, 남들과 비교해 나는 못났다고 위축·우울해지는 태도는 '자기부정-타인긍정(I-U+)'입니다. 상담을 통해 나와 타인을 모두 신뢰하는 건강한 '자기긍정-타인긍정(I+U+)'으로 바꾸고, 이고그램(자아상태)에서 지금-여기의 상황을 합리적·객관적으로 판단하는 '어른 자아(A)'를 활성화해야 합니다!", "lecture_point": "⚡ 시험장 1초 공식: 해리스 4대 생활자세([자기긍정-타인부정: 남 탓·공격] / [자기부정-타인긍정: 우울·위축] ➔ 목표: [자기긍정-타인긍정]) + 합리적 현실 판단 = [어른 자아(A) 활성화!]", "rank": 38}, {"id": 5, "part": "교육학", "domain": "교육방법", "title": "콜린스(Collins) 인지적 도제 교수법 6단계와 점진적 비계철회(Fading)", "concept": "전문가의 사고 과정 가시화 및 모델링➔코칭➔비계설정➔명료화➔반성➔탐색 6단계", "prob": 86, "tier": "2순위", "tier_label": "📌 2순위 필출감별", "past_years": [2025], "trend_note": "📊 실제 기출(2025년 · 1회): 최근 평가원 핵심 출제 트렌드 영역으로 감별·응용 변형 출제 대비가 필수입니다.", "passage": "문 교사: 글쓰기나 수학 문제해결처럼 전문가의 머릿속에서 일어나는 내면의 사고 과정을 학생들에게 어떻게 가르쳐야 할지 막막해요.\n양 교사: 인지적 도제 방법을 써 보세요. 먼저 선생님의 사고 과정을 소리 내어 시범 보이고 조언과 발판을 제공한 뒤, 학생 스스로 자신의 사고를 말로 표현하고 전문가의 과정과 비교해 성찰하며 새로운 문제를 독자적으로 해결하게 하는 겁니다. 학생 실력이 늘면 선생님의 도움은 서서히 줄여나가고요.", "asks": ["① 인지적 도제 교수법이 전문가의 내재적 사고 과정을 학생에게 가르치는 핵심 원리를 서술하시오.", "② 6단계 중 교사가 주도적으로 지원하는 전반부 3단계의 명칭과 역할을 서술하시오.", "③ 6단계 중 학생이 주도적으로 수행하는 후반부 3단계의 명칭과 역할을 서술하시오.", "④ 학생의 수행 능력이 향상됨에 따라 교사의 지원 강도를 조절하는 원리를 서술하시오."], "keywords": ["사고 과정 가시화", "인지적 도제 6단계", "명료화·반성·탐색", "점진적 비계철회(Fading)"], "answer_lines": ["첫째, 인지적 도제 교수법은 전문가의 내재적 사고 과정을 가시화하여 관찰하고 모방하게 돕는다.", "둘째, 교사 주도의 전반부 3단계는 시범을 보이는 모델링과 코칭 및 비계설정으로 진행한다.", "셋째, 학생 주도의 후반부 3단계는 지식을 언어화하는 명료화와 반성 및 탐색으로 이어진다.", "넷째, 학생의 수행 능력이 향상됨에 따라 교사의 도움을 점진적으로 줄이는 비계철회(Fading)를 쓴다.", "단순 기능 모방을 넘어 학습자가 스스로 고차적 문제해결을 수행하는 자율적 주체로 자란다.", "이처럼 교사가 교육방법에서 인지적 도제를 쓰면 신개념 수업 혁신이 실현된다."], "lecture_summary": "옛날 대장장이 스승 밑에서 제자가 기술을 배우듯, 전문가의 머릿속에 있는 보이지 않는 고등 사고 과정을 밖으로 꺼내어(가시화) 배우게 하는 것이 콜린스의 '인지적 도제 교수법'입니다! 전반부 3단계(모델링-코  무기력한 학생 J에게 네 가지 질문을 던졌다. (가) '오늘 밤 자는 동안 기적이 일어나 고민하던 문제가 모두 해결되었다면, 내일 아침 무엇을 보고 알 수 있을까요?' (나) '지난 한 달 중 친구들과 다투지 않고 즐겁게 지냈던 날은 언제였나요?' (다) '가장 힘들 때를 0점, 기적이 일어난 상태를 10점이라 할 때 지금은 몇 점인가요?' (라) '그렇게 고통스러운 상황에서도 포기하지 않고 오늘 상담실까지 걸어올 수 있었던 힘은 무엇인가요?'", "asks": ["① (가)와 같이 문제가 해결된 미래의 구체적 모습을 상상하게 하는 질문 기법의 명칭을 서술하시오.", "② (나)와 같이 문제가 일어나지 않았던 성공 경험과 자원을 찾아내는 질문 기법의 명칭을 서술하시오.", "③ (다)와 같이 현재 상태와 변화 확신을 수치로 계량화하는 질문 기법의 명칭을 서술하시오.", "④ (라)와 같이 극심한 절망 속에서도 지금까지 어떻게 버텨왔는지 묻는 질문 기법의 명칭을 서술하시오."], "keywords": ["해결중심 단기상담(SFBT)", "기적질문", "예외질문", "척도질문과 대처질문"], "answer_lines": ["SFBT에서 문제가 해결된 미래의 구체적 모습을 상상하는 기적질문을 사용한다.", "문제가 일어나지 않았던 성공 경험과 자원을 찾아내는 예외질문을 던진다.", "변화에 대한 확신과 현재 상태를 수치로 계량화하는 척도질문을 활용한다.", "극심한 절망 속에서도 지금까지 어떻게 버텨왔는지 묻는 대처질문을 한다."], "lecture_summary": "해결중심 단기상담(SFBT, 드세이저 & 김인수)은 문제의 원인을 파헤치지 않고 오직 '내담자가 가진 강점과 해결책'에만 집중하는 4대 마법 질문을 씁니다! ① 밤사이 기적이 일어나 문제가 다 해결됐다면 내일 아침 무엇이 달라져 있을까? = '기적질문'(목표 설정), ② 최근에 그 문제가 일어나지 않았거나 조금이라도 덜했던 적은 언제인가? = '예외질문'(성공 경험·자원 발굴), ③ 0점부터 10점 중 지금 몇 점인가? = '척도질문', ④ 그렇게 힘든데도 어떻게 지금까지 무너지지 않고 버텨왔는가? = '대처질문'입니다!", "lecture_point": "⚡ 시험장 1초 공식: 해결중심 4대 질문 = [기적질문(해결된 미래 상상·목표)] + [예외질문(문제가 없었던 성공 경험 발굴)] + [척도질문(0~10점 수치화)] + [대처질문(절망 속 버텨온 힘!)]", "rank": 41}, {"id": 24, "part": "전공상담", "domain": "심리검사", "title": "로샤 종합체계 경험균형(외향형) 및 D점수 스트레스 과부하", "concept": "인간운동반응(M)보다 유색반응(WSumC)이 높은 외향형 및 D점수 음수(-2) 과부하", "prob": 85, "tier": "2순위", "tier_label": "📌 2순위 필출감별", "past_years": [2026], "trend_note": "📊 실제 기출(2026년 · 1회): 최근 평가원 핵심 출제 트렌드 영역으로 감별·응용 변형 출제 대비가 필수입니다.", "passage": "최근 학업 실패와 교우 관계 갈등으로 극심한 불안을 호소하는 고등학생 E의 로샤 종합체계 구조요약표를 분석한 결과, 경험균형(EB)에서 인간운동반응(M)은 2개, 가중치 색채반응 합(WSumC)은 6.5로 나타났으며, 스트레스 통제 지표인 D점수는 -3, 수정 D점수(Adj D)는 -2로 산출되었다.", "asks": ["① 인간운동반응(M)과 유색반응(WSumC)의 비율에 따른 내담자 E의 대처 유형 명칭을 서술하시오.", "② 해당 대처 유형을 지닌 사람이 스트레스 상황에서 보이는 정서 반응 및 문제해결 방식을 서술하시오.", "③ D점수가 음수(-)로 나타난 상태가 의미하는 내적 자원과 스트레스 간의 역동을 서술하시오.", "④ 이러한 프로파일을 보이는 내담자에게 우선적으로 제공해야 할 상담 개입 방향을 서술하시오."], "keywords": ["인간운동반응(M)", "유색반응(WSumC)", "외향형", "D점수 과부하"], "answer_lines": ["인간운동반응(M)보다 유색반응(WSumC)이 높으므로 대처 유형은 외향형이다.", "외부의 정서적 자극에 민감하게 반응하고 행동 중심의 문제해결을 우선 시도한다.", "D점수가 음수인 상태는 내적 가용 자원보다 스트레스가 큰 과부하 상태이다.", "충동적 행동화와 통제력 상실을 방지하기 위해 스트레스를 줄이고 지지를 준다."], "lecture_summary": "로샤(Rorschach) 종합체계(Exner)에서 시험에 무조건 나오는 두 가지 공식입니다! 첫째, 경험균형(EB = M : WSumC)에서 인간운동반응(M, 내적 심사숙고)보다 유색반응(WSumC, 정서·행동 표출)이 더 크면 감정에 솔직하고 행동으로 먼저 부딪히는 '외향형(Extratensive)'입니다. 둘째, D점수(및 Adj D)가 음수(-)라는 것은 내가 가진 내적 대처 자원(EA)보다 현재 쏟아지는 스트레스 자극(es)이 훨씬 커서 터지기 직전인 '심리적 과부하 상태'를 뜻합니다!", "lecture_point": "⚡ 시험장 1초 공식: 로샤 경험균형 [M < WSumC = 외향형(정서·행동 중심 대처)] vs [M > WSumC = 내향형(사고 중심)] / [D점수 < 0 (음수) = 가용 자원보다 스트레스가 큰 심리적 과부하 상태!]", "rank": 42}, {"id": 17, "part": "전공상담", "domain": "DSM-5-TR 감별진단", "title": "반응성 애착장애(RAD) vs 탈억제 사회관여 장애(DSED) 감별 진단", "concept": "영유아기 극심한 방임 후 정서적 위축(반응성) vs 낯선 성인 무경계 접근(탈억제)", "prob": 85, "tier": "2순위", "tier_label": "📌 2순위 필출감별", "past_years": [], "trend_note": "📊 2027 전공상담 1~2순위 적중 예측: 최근 기출 공백기로 2027학년도 DSM-5-TR 감별 및 최신 상담기법 복합형 출제 유력 주제입니다.", "passage": "영아원 시설에서 잦은 보육자 교체와 심각한 정서적 방임을 겪은 두 아동이 입양 후 상담실에 의뢰되었다. 아동 A는 넘어져 피가 나고 고통스러운 상황에서도 양육자에게 전혀 위로를 구하지 않고 무표정하게 위축되어 있으며, 아동 B는 공원에서 처음 본 낯선 성인에게도 아무런 주저함 없이 안기고 손을 잡고 따라가려 한다.", "asks": ["① 고통 속에서도 위로를 구하지 않고 정서적으로 위축된 아동 A의 공식 진단명을 서술하시오.", "② 낯선 성인에게 경계 없이 과도하게 다가가는 아동 B의 공식 진단명을 서술하시오.", "③ 두 장애가 공통적으로 발생하게 된 발달 초기의 병인론적 원인을 서술하시오.", "④ 두 아동의 회복을 위해 가장 우선적으로 구축해야 할 환경 및 치료적 개입을 서술하시오."], "keywords": ["반응성 애착장애(RAD)", "탈억제 사회관여 장애(DSED)", "지속적인 정서적 방임", "1차 돌봄 환경"], "answer_lines": ["고통 속에서도 위로를 구하지 않고 위축된 반응성 애착장애를 진단한다.", "낯선 성인에게 경계 없이 과도하게 다가가는 탈억제 사회관여 장애이다.", "두 장애 모두 영유아기 양육자의 지속적인 정서적 방임과 결핍에서 비롯된다.", "안정적인 1차 돌봄 환경을 구축하고 일관되고 안전한 치료적 애착을 맺는다."], "lecture_summary": "영유아기에 양육자로부터 심각한 방임·학대·잦은 양육자 교체를 겪은 아이들에게서 나타나는 두 가지 정반대 애착 장애입니다! 힘들고 슬플 때도 아무에게도 다가가지 않고 정서적으로 꽁꽁 얼어붙어 위축되면 '반응성 애착장애(RAD, 내재화)'이고, 반대로 처음 본 낯선 어른에게도 아무 경계심 없이 안기고 따라가면 '탈억제 사회관여 장애(DSED, 외현화)'입니다!", "lecture_point": "⚡ 시험장 1초 공식: 공통 원인 = [영유아기 심각한 정서적 방임·결핍] ➔ [반응성 애착장애(RAD 적 자기상이 형성되었고, 감당할 수 없는 폭력과 공포를 겪은 기억은 의식에서 완전히 분리되어 악몽으로만 나타났다. 이후 이 학생은 자신을 따뜻하게 대하는 담임교사에게도 과거 폭력적이었던 아버지의 모습을 그대로 투사하여 교사가 자신을 해칠 것이라며 적대적으로 반응하고 있다.", "asks": ["① 양육자의 칭찬과 수용 속에서 불안이 없을 때 형성되는 자아상의 명칭을 서술하시오.", "② 양육자의 비난과 거부로 인해 불안을 경험할 때 형성되는 자아상의 명칭을 서술하시오.", "③ 극심한 공포와 불안으로 인해 의식에서 해리되는 무의식적 자아상의 명칭을 서술하시오.", "④ 과거 대인관계 경험을 현재 상대에게 투사하여 관계를 왜곡하는 현상의 명칭을 서술하시오."], "keywords": ["좋은-나", "나쁜-나", "나-아닌-나(Not-me)", "병렬적 왜곡"], "answer_lines": ["양육자의 칭찬과 수용 속에서 불안이 없는 긍정적인 좋은-나 자아상을 만든다.", "양육자의 비난과 거부로 인한 불안을 경험하며 나쁜-나 자아상을 갖는다.", "극심한 공포와 불안으로 인해 의식에서 해리되는 나-아닌-나(Not-me)가 된다.", "과거의 대인관계 경험을 현재 상대에게 투사하는 병렬적 왜곡을 교정한다."], "lecture_summary": "설리반(Sullivan)의 대인관계 이론에서 유아는 엄마(양육자)가 주는 불안의 정도에 따라 3가지 자아상(자기체계)을 만듭니다! 엄마가 다정하게 칭찬해 불안을 안 느끼면 '좋은-나(Good-Me)', 엄마가 화내고 비난해 불안을 느끼면 '나쁜-나(Bad-Me)', 그리고 학대처럼 감당 못 할 공포와 극심한 불안을 겪으면 아예 무의식으로 해리시켜 버리는 '나-아닌-나(Not-Me)'가 됩니다. 또한 과거 중요 타인에게 겪은 관계 패턴을 현재의 상담자나 친구에게 그대로 덮어씌워 왜곡하는 현상을 '병렬적 왜곡(Parataxic Distortion, 전이의 대인관계 버전)'이라고 합니다!", "lecture_point": "⚡ 시험장 1초 공식: 설리반 3대 자아상 = [좋은-나(불안 없음·수용)] / [나쁜-나(비난·불안 증가)] / [나-아닌-나(극심한 공포·무의식 해리!)] + 과거 관계 투사 왜곡 = [병렬적 왜곡!]", "rank": 49}, {"id": 47, "part": "전공상담", "domain": "DSM-5-TR 감별진단", "title": "신경성 식욕부진증 vs 신경성 폭식증 감별 진단 및 인지행동치료", "concept": "현저한 저체중(식욕부진증) vs 정상 체중 이상이면서 폭식 후 부적절한 보상 행동 반복(폭식증)", "prob": 82, "tier": "2순위", "tier_label": "📌 2순위 필출감별", "past_years": [2020, 2024], "trend_note": "📊 실제 기출(2020년, 2024년 · 2회): 최근 2년간 미출제로 2027학년도 순환 주기 재출제 확률이 매우 높습니다.", "passage": "[학생 가영] 키 164cm에 몸무게 38kg으로 심각한 저체중임에도 거울을 보며 '내가 너무 뚱뚱하다'고 말하며 하루 300kcal만 섭취한다.\n[학생 나영] 키 162cm에 몸무게 54kg의 정상 체중이지만, 스트레스를 받을 때마다 일주일에 2~3회씩 2시간 안에 엄청난 양의 음식을 통제력을 잃고 폭식한 뒤 죄책감에 화장실에서 손가락을 넣어 구토하는 행동을 5개월째 반복하고 있다.", "asks": ["① 사례의 학생 가영의 DSM-5-TR 공식 진단명과 핵심 신체 지표를 서술하시오.", "② 학생 나영의 DSM-5-TR 공식 진단명과 폭식 후 반복하는 행동의 명칭을 서술하시오.", "③ 가영과 나영 두 장애를 임상적으로 구별하는 가장 결정적인 감별 기준을 서술하시오.", "④ 섭식장애 학생의 회복을 위한 인지행동적 개입 방향을 서술하시오."], "keywords": ["신경성 식욕부진증", "신경성 폭식증", "현저한 저체중", "부적절한 보상 행동"], "answer_lines": ["신경성 식욕부진증 const PED_EXAM = {"passageHtml": "<p style=\"color:#4b5563; font-size:0.88rem; margin-bottom:14px;\"><em>[상황] ○○고등학교는 새 학기 교육과정 개편과 수업·평가 혁신을 앞두고 교과 대표 교사 4인이 모여 ‘학생 주도적 성장을 이끄는 미래형 학교 교육’을 주제로 학교 운영 방향을 논의하고 있다.</em></p>\n    <p><strong>김 교사(교육과정):</strong> 선생님들, 작년에 제가 운영했던 1학년 수업을 돌아보니 솔직히 반성할 점이 많았습니다. 학기 초에 교육목표는 거창하게 세워놓고 막상 수업을 시작하자 교과서 진도를 학기 말까지 끝내는 데 급급했거든요. 또 어떤 단원에서는 학생들이 좋아할 만한 모둠 체험 활동을 여러 개 나열해 진행하긴 했는데, 정작 수업이 끝나고 나니 학생들이 무엇을 깊이 이해했는지 연결이 잘 안 되더군요. 그래서 다음 학기에는 설계 순서를 완전히 반대로 바꾸어 보려고 합니다. 먼저 성취기준을 분석해 학생들이 세부적인 암기 사실을 다 잊어버린 후에도 삶에 오래 남아 새로운 상황에 전이되는 핵심 대개념을 설정한 다음, 수업 활동을 짜기 전에 학생들이 이해에 도달했음을 입증할 수행과제와 채점 기준표부터 먼저 결정할 계획입니다. 아울러 우리 학교만의 특색 있는 교육과정을 개발하기에 앞서, 목표를 바로 정하기보다 우리 학교가 처한 안팎의 교육 여건부터 정밀하게 진단하려 합니다. 학부모의 기대와 지역사회 특성, 사회문화적 변화 같은 외부 환경은 물론이고 우리 학교 학생들의 적성과 교사들의 전문성, 학교의 물적 시설 같은 내부 여건까지 꼼꼼히 따져본 뒤에야 비로소 현장에 맞는 목표를 세울 수 있다고 생각합니다.</p>\n    <p><strong>이 교사(교육방법):</strong> 김 선생님 말씀에 깊이 공감합니다. 저 역시 교실에서 개념 설명을 하느라 시간을 다 써버려 정작 심화 탐구와 토의를 할 시간이 부족했던 것이 늘 고민이었습니다. 그래서 다음 학기에는 수업의 흐름을 거꾸로 뒤집어 운영해 보려고 합니다. 수업 전에는 학생들이 집에서 제가 제작한 짧은 온라인 영상을 보며 기초 개념을 미리 익혀 오게 하고, 교실 수업 시간에는 일방적인 강의를 전면 배제한 채 모둠별 토의와 프로젝트 협력 문제해결을 진행하면서 제가 모둠을 순회하며 오개념을 교정해 주고 수준별 도움을 주려 합니다. 그리고 수업이 끝난 뒤에는 학생들이 스스로 배움의 과정을 돌아보는 성찰 일지를 쓰게 할 생각입니다. 한편 온라인 영상과 학습 자료를 만들 때도 주의할 점이 많더군요. 예전에는 시선을 끌려고 화려한 애니메이션과 배경 효과, 그리고 화면에 적힌 글과 똑같은 내레이션을 중복해서 넣었더니 오히려 학생들이 산만해지고 핵심을 기억하지 못했습니다. 학습자의 작동기억 용량은 제한되어 있으니 불필요한 설계로 생기는 인지적 부담은 과감히 줄여, 확보된 여유 자원이 장기기억 속 스키마를 형성하는 데 집중 투입되도록 해야겠습니다. 다만 이미 기초가 탄탄한 숙련된 학생들에게는 초보자용으로 만든 친절하고 상세한 안내를 똑같이 제공하면 오히려 학습을 방해하는 역효과가 날 수 있으니 이 점도 세심하게 조절하겠습니다.</p>\n    <p><strong>박 교사(교육평가):</strong> 두 분의 수업 변화에 발맞춰 평가 방식도 근본적으로 바뀌어야 합니다. 지금까지의 지필고사는 평가 도중 교사가 일절 개입하지 않고 학생이 지금 혼자서 해낼 수 있는 현재 수준만 재는 데 그쳤습니다. 그러다 보니 똑같이 50점을 받은 두 학생 중 누가 조금만 도와주면 90점으로 도약할 수 있는 잠재력을 지녔는지 알 수가 없더군요. 앞으로는 학생이 혼자 해결하는 수준과 교사의 도움을 받아 도달할 수 있는 수준 사이의 간극에 주목하려 합니다. 1차 검사를 실시한 뒤 평가 도중에 교사가 직접 힌트와 단계적 발판을 제공하고 다시 검사함으로써, 평가와 교수가 분리되지 않고 하나로 통합되어 학생의 미래 성장 가능성을 진단하는 평가를 도입해 보겠습니다. 또한 서술형 수행평가를 할 때도 단순히 총점 하나만 매겨 통보하니 학생들이 자신이 무엇을 잘했고 무엇이 부족한지 전혀 모르더군요. 그래서 평가 준거와 성취 수준, 그리고 각 수준별 수행 특징을 구체적으로 서술한 척도 기술어를 갖춘 다차원 채점기준표를 만들되, 총점만 주는 방식이 아니라 세부 영역별 강약점을 따로 진단해 맞춤형 피드백을 줄 수 있는 형태로 개발하려 합니다. 무엇보다 이 채점기준표를 채점할 때만 쓰지 않고 과제를 부여하기 전에 학생들에게 미리 공개하여, 학생 스스로 목표를 확인하고 자기조절학습을 하도록 이끌 계획입니다.</p>\n    <p><strong>최 교사(교육행정):</strong> 세 분 선생님의 열정이 학교 현장에서 꽃을 피우려면 학교장의 리더십과 행정 문화가 뒷받침되어야 합니다. 그동안 우리 학교는 법규와 지침에 따른 지시·감독 같은 관료적 권위에 지나치게 의존하다 보니 선생님들이 시키는 업무만 처리하는 수동적 태도에 머물렀습니다. 이제 교장은 군림하는 통제자가 아니라 교육적 전문성과 도덕적 권위를 바탕으로 선생님 한 분 한 분이 학교의 사명을 스스로 이끌어가는 자율적 리더로 성장하도록 세워주어야 합니다. 구성원들이 공유된 도덕적 가치와 사명감으로 뭉친 공동체가 될 때, 외적인 통제 없이도 선생님들의 자발적 헌신이 살아나기 때문입니다. 물론 현실적으로 학교 제도가 요구하는 공식적 역할과 기대가 선생님 개인이 지닌 고유의 인성이나 욕구 성향과 부딪혀 역할 갈등이 생기는 경우도 많습니다. 이때 관리자는 한쪽만 일방적으로 강요하기보다 조직의 목표 달성과 교사 개인의 욕구 충족이 조화를 이룰 수 있도록 상황에 맞게 유연하게 절충하고 조율하는 지도성을 발휘해야 할 것입니다.</p>", "rubricHtml": "<div class=\"rubric-col\">\n        <h4>① 교육과정 [4점]</h4>\n        <ul>\n          <li>역방향 설계 모형의 1단계 명칭과 핵심 목표</li>\n          <li>평가를 먼저 설계해 극복하려는 2가지 설계 오류</li>\n          <li>학교중심 교육과정 개발 시 제1단계 명칭</li>\n          <li>제1단계에서 분석할 외적·내적 요인 각 2가지</li>\n        </ul>\n      </div>\n      <div class=\"rubric-col\">\n        <h4>② 교육방법 [4점]</h4>\n        <ul>\n          <li>역진행 수업의 수업 전·중·후 3단계 활동</li>\n          <li>비효율적 교수 설계로 발생하는 부하 명칭</li>\n          <li>장기기억 스키마 형성에 투입되는 부하 명칭</li>\n          <li>숙련자에게 상세 안내가 방해가 되는 현상 명칭</li>\n        </ul>\n      </div>\n      <div class=\"rubric-col\">\n        <h4>③ 교육평가 [4점]</h4>\n        <ul>\n          <li>평가 기반 발달 간극의 명칭과 3단계 측정 절차</li>\n          <li>평가-교수 통합을 통해 파악하려는 궁극적 목적</li>\n          <li>세부 영역별 진단 채점기준표 명칭과 3대 구성 요소</li>\n          <li>채점기준표를 평가 전에 사전 공유해야 하는 이유</li>\n        </ul>\n      </div>\n      <div class=\"rubric-col\">\n        <h4>④ 교육행정 [4점]</h4>\n        <ul>\n          <li>학교장이 지향할 지도성 명칭과 기반 권위</li>\n          <li>이 지도성이 교사를 어떤 존재로 키우는지</li>\n          <li>공식적 역할 기대 차원과 개인적 욕구 차원 명칭</li>\n          <li>역할 갈등 시 요구되는 관리자의 지도성 유형</li>\n        </ul>", "answerHtml": "<div class=\"kice-title\">20점 만점 모범 논술 답안지 (B4 줄노트)</div>\n    </div>\n    <div class=\"kice-meta\">\n      <div>예상 득점: 20.0 / 20.0점</div>\n      <div>초록 밑줄: 내 플랫폼 | 노랑 음영: 채점 키워드</div>\n    </div>\n  </div>\n\n  <div class=\"b4-sheet-box\" id=\"model-essay-box\">\n    <p><span class=\"essay-sec-tag\">[서론]</span>\n      <span class=\"plat\">최근 급변하는 미래 교육환경 속에서 학생 주도적 성장을 이끄는 미래형 학교 교육에 대한 화제가 대두되고 있다.</span>\n      <span class=\"plat\">이러한 패러다임에 맞춰 교사는 단편적 지식 전달이 아닌 역량을 함양해야 한다.</span>\n      <span class=\"plat\">여기에서는 제시문에 나온 교사들의 대화를 통해 학생 주도적 성장 방안을 살펴본다.</span>\n      <span class=\"plat\">교육과정, 교육방법, 교육평가, 교육행정의 4가지 측면에서 논하고자 한다.</span>\n    </p>\n    <p><span class=\"essay-sec-tag\">[본론 1: 교육과정]</span>\n      첫째, 교육과정에서 <span class=\"kw\">백워드 설계 모형</span> 1단계는 <span class=\"kw\">바라는 결과 확인</span>으로 성취기준을 분석해 <span class=\"kw\">영속적 이해(Big Idea)</span>를 설정한다.\n      수업 활동보다 수행과제와 루브릭을 먼저 설계함으로써 <span class=\"kw\">진도 나가기 오류</span>와 <span class=\"kw\">활동 위주의 오류</span>를 극복한다.\n      또한 <span class=\"kw\">학교중심 교육과정 개발(SBCD)</span>에서는 내외적 교육 여건을 진단하는 <span class=\"kw\">상황분석</span>을 가장 먼저 수행한다.\n      이때 외적 요인으로 학부모의 요구와 지역사회 특성을, 내적 요인으로 학생의 적성과 교사의 전문성을 점검한다.\n      <span class=\"plat\">이처럼 교사가 교육과정에서 백워드 설계와 상황분석을 쓰면 미래형 교육 혁신이 실현된다.</span>\n    </p>\n    <p><span class=\"essay-sec-tag\">[본론 2: 교육방법]</span>\n      둘째, 교육방법에서 <span class=\"kw\">플립드 러닝(거꾸로 수업)</span>은 수업 전 <span class=\"kw\">디딤영상 사전학습</span>, 수업 중 <span class=\"kw\">협력적 문제해결</span> 및 순회 비계, 수업 후 <span class=\"kw\">성찰일지(초인지)</span>로 전개된다.\n      수업 자료 설계 시 불필요한 애니메이션과 중복 정보를 제거하여 <span class=\"kw\">외재적 인지부하</span>를 최소화한다.\n      확보된 여유 인지 자원은 <span class=\"kw\">본질적 인지부하</span>에 집중 투입하여 학습자의 장기기억 <span class=\"kw\">스키마 형성</span>을 촉진한다.\n      아울러 초보자에게 유익한 상세 안내가 숙련자에게 오히려 방해가 되는 <span class=\"kw\">전문성 역전 효과</span>를 예방한다.\n      <span class=\"plat\">이처럼 교사가 교육방법에서 역진행 수업과 인지부하 관리를 쓰면 신개념 수업 혁신이 실현된다.</span>\n    </p>\n    <p><span class=\"essay-sec-tag\">[본론 3: 교육평가]</span>\n      셋째, 교육평가에서 비고츠키의 <span const STORE_KEY = 'kice_2027_mobile_v1';
let state = {
  mode: 'top55',
  examPart: 'ped',
  filter: 'all',
  search: '',
  viewMode: 'card', // 'card' | 'list'
  cardIdx: 0,
  done: {},
  bookmark: {},
  theme: 'dark',
  fontScale: 1
};

try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  state = { ...state, ...saved };
} catch(e) {}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      done: state.done,
      bookmark: state.bookmark,
      theme: state.theme,
      fontScale: state.fontScale,
      cardIdx: state.cardIdx,
      viewMode: state.viewMode
    }));
  } catch(e) {}
}

// D-Day calculation (Exam: 2026-11-28)
function updateDDay() {
  const today = new Date();
  const exam = new Date(2026, 10, 28); // Nov 28, 2026
  const diff = Math.ceil((exam - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
  const el = document.getElementById('ddayBadge');
  if (diff > 0) el.textContent = `11.28 D-${diff}`;
  else if (diff === 0) el.textContent = `11.28 D-DAY 🔥`;
  else el.textContent = `2027 임용`;
}

function applyPrefs() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.setProperty('--font-scale', state.fontScale);
  document.getElementById('themeBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
  document.getElementById('viewToggleBtn').textContent = state.viewMode === 'card' ? '📋 전체보기' : '📱 1문제씩';
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyPrefs();
  saveState();
}

function changeFont(delta) {
  state.fontScale = Math.min(1.32, Math.max(0.84, +(state.fontScale + delta).toFixed(2)));
  applyPrefs();
  saveState();
}

function updateProgress() {
  const doneCount = Object.values(state.done).filter(Boolean).length;
  const pct = Math.round((doneCount / TOP55.length) * 100);
  document.getElementById('progText').textContent = `암기완료 ${doneCount} / ${TOP55.length} (${pct}%)`;
  document.getElementById('progFill').style.width = pct + '%';
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightKws(text, kws) {
  let out = escHtml(text);
  if (!kws || !kws.length) return out;
  const sorted = [...kws].filter(Boolean).sort((a,b) => b.length - a.length);
  for (const kw of sorted) {
    const safe = escHtml(kw).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(safe, 'g'), `<span class="hl">${escHtml(kw)}</span>`);
  }
  return out;
}

function getFilteredList() {
  const q = state.search.trim().toLowerCase();
  return TOP55.filter(item => {
    if (state.filter === '0순위' && item.tier !== '0순위') return false;
    if (state.filter === '1순위' && item.tier !== '1순위') return false;
    if (state.filter === '2순위' && item.tier !== '2순위') return false;
    if (state.filter === '교육학' && item.part !== '교육학') return false;
    if (state.filter === '전공상담' && item.part !== '전공상담') return false;
    if (state.filter === 'bookmark' && !state.bookmark[item.id]) return false;
    if (state.filter === 'undone' && state.done[item.id]) return false;
    if (q) {
      const hay = (item.title + ' ' + item.domain + ' ' + item.concept + ' ' + (item.keywords||[]).join(' ') + ' ' + item.passage).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderCardHtml(item) {
  const tierClass = item.tier === '0순위' ? 'tier-0' : (item.tier === '1순위' ? 'tier-1' : 'tier-2');

  const kwsHtml = (item.keywords || []).map(k => `<span class="kw-chip"># ${escHtml(k)}</span>`).join('');

    <div class="ans-line">
      <span class="line-num">${i+1}줄</span>
      <span>${highlightKws(ln, item.keywords)}</span>
    </div>
  `).join('');
  const isMark = !!state.bookmark[item.id];
  const isDone = !!state.done[item.id];

  return `
    <article class="card" id="card-${item.id}">
      <div class="card-meta">
        <span class="rank-badge">#${item.rank}위</span>
        <span class="tier-badge ${tierClass}">${item.tier_label} · ${item.prob}%</span>
        <span class="domain-tag">${escHtml(item.part)} · ${escHtml(item.domain)}</span>

      </div>
      <h2 class="card-title">${escHtml(item.title)}</h2>

      <!-- STEP 1: PROBLEM -->
      <div class="problem-box">
        <div class="step-label" style="color:var(--accent);">📄 STEP 1. 실전 문제</div>
        <div class="passage-text">${escHtml(item.passage)}</div>
        <div class="asks-box">
          <div class="asks-title">&lt;작성 방법&gt;</div>
          <ul class="asks-list">${asksHtml}</ul>
        </div>
      </div>

      <!-- SELF-GRADING PRACTICE BOX -->
      <div class="practice-box">
        <div class="practice-head">
          <span>✍️ B4 답안지 실전 연습 (키워드 자동 자가채점)</span>
          <span id="charcnt-${item.id}" style="color:var(--text-muted);">0자</span>
        </div>
        <textarea class="practice-ta" id="ta-${item.id}" placeholder="핵심 KICE 공인 키워드를 포함해 직접 4줄 답안을 작성해 보세요..." oninput="onPracticeInput(${item.id})">${escHtml((state.drafts && state.drafts[item.id]) || '')}</textarea>
        <div class="practice-bar">
          <button class="grade-btn" onclick="gradeDraft(${item.id})">🎯 키워드 즉시 채점</button>
          <span style="font-size:0.73rem;color:var(--text-muted);">권장: 줄당 38~45자 · 4줄 약 160~180자</span>
        </div>
        <div class="grade-result" id="grade-res-${item.id}"></div>
      </div>

      <!-- TOGGLE BUTTONS -->
      <div class="step-actions">
        <button class="reveal-btn" id="btn-ans-${item.id}" onclick="togglePanel(${item.id}, 'ans')">✅ STEP 2. 정답 보기</button>
        <button class="reveal-btn" id="btn-exp-${item.id}" onclick="togglePanel(${item.id}, 'exp')">💡 STEP 3. 해설 보기</button>
      </div>

      <!-- STEP 2: ANSWER -->
      <div class="answer-panel" id="panel-ans-${item.id}">
        <div class="step-label" style="color:var(--success);">✅ KICE 만점 정답 (B4 1줄 38~45자 규격)</div>
        <div class="kw-row">${kwsHtml}</div>
        <div class="ans-lines">${linesHtml}</div>
      </div>

      <!-- STEP 3: EXPLANATION -->
      <div class="exp-panel" id="panel-exp-${item.id}">
        <div class="step-label" style="color:var(--accent-2);">💡 기출 적중 근거 & 핵심 해설</div>
        <div class="trend-box">${escHtml(item.trend_note)}</div>
        <div class="formula-box">${escHtml(item.lecture_point || item.concept)}</div>
        <div class="exp-text">${escHtml(item.lecture_summary)}</div>

      <div class="card-foot">
        <button class="status-btn ${isMark ? 'marked' : ''}" onclick="toggleBookmark(${item.id})">${isMark ? '🔖 북마크됨' : '🔖 다시보기 체크'}</button>
        <button class="status-btn ${isDone ? 'done' : ''}" onclick="toggleDone(${item.id})">${isDone ? '✔ 암기 완료!' : '⬜ 암기 완료 체크'}</button>
      </div>
    </article>
  `;
}

function renderTop55() {
  const list = getFilteredList();
  const container = document.getElementById('top55Container');
  const jumpBar = document.getElementById('jumpBar');
  const bottomBar = document.getElementById('bottomBar');

  if (!list.length) {
    jumpBar.style.display = 'none';
    bottomBar.style.display = 'none';
    container.innerHTML = `<div class="empty-state">조건에 맞는 문항이 없습니다.<br>다른 필터나 검색어를 선택해 주세요.</div>`;
    return;
  }

  if (state.cardIdx >= list.length) state.cardIdx = 0;
  if (state.cardIdx < 0) state.cardIdx = list.length - 1;

  if (state.viewMode === 'card') {
    jumpBar.style.display = 'flex';
    bottomBar.style.display = 'block';
    const cur = list[state.cardIdx];
    document.getElementById('posLabel').textContent = `${state.cardIdx + 1} / ${list.length}`;
    const sel = document.getElementById('jumpSelect');
    sel.innerHTML = list.map((x, i) => `<option value="${i}" ${i===state.cardIdx?'selected':''}>#${x.rank}위 (${x.prob}%) ${x.title.slice(0,22)}</option>`).join('');
    container.innerHTML = renderCardHtml(cur);
    document.getElementById('bMarkBtn').textContent = state.bookmark[cur.id] ? '🔖됨' : '🔖';
  } else {
    jumpBar.style.display = 'none';
    bottomBar.style.display = 'none';
    container.innerHTML = list.map(renderCardHtml).join('');
  }
}

function togglePanel(id, kind) {
  const panel = document.getElementById(`panel-${kind}-${id}`);
  const btn = document.getElementById(`btn-${kind}-${id}`);
  if (!panel || !btn) return;
  const open = panel.classList.toggle('open');
  if (kind === 'ans') {
    btn.classList.toggle('ans-open', open);
    btn.textContent = open ? '✅ 정답 닫기' : '✅ STEP 2. 정답 보기';
  } else {
    btn.classList.toggle('exp-open', open);
    btn.textContent = open ? '💡 해설 닫기' : '💡 STEP 3. 해설 보기';
  }
}

function toggleCurrentPanel(kind) {
  const list = getFilteredList();
  if (!list.length) return;
  const cur = list[state.cardIdx];
  if (cur) togglePanel(cur.id, kind);
}

function toggleBookmark(id) {
  state.bookmark[id] = !state.bookmark[id];
  saveState();
  renderTop55();
}

function toggleCurrentMark() {
  const list = getFilteredList();
  if (!list.length) return;
  toggleBookmark(list[state.cardIdx].id);
}

function toggleDone(id) {
  state.done[id] = !state.done[id];
  saveState();
  updateProgress();
  renderTop55();
}

function moveCard(delta) {
  const list = getFilteredList();
  if (!list.length) return;
  state.cardIdx = (state.cardIdx + delta + list.length) % list.length;
  saveState();
  renderTop55();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpTo(val) {
  state.cardIdx = parseInt(val, 10) || 0;
  saveState();
  renderTop55();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setFilter(f) {
  state.filter = f;
  state.cardIdx = 0;
  document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.toggle('active', c.dataset.f === f));
  renderTop55();
}

function onSearch() {
  state.search = document.getElementById('searchInput').value;
  state.cardIdx = 0;
  renderTop55();
}

function toggleViewMode() {
  state.viewMode = state.viewMode === 'card' ? 'list' : 'card';
  applyPrefs();
  saveState();
  renderTop55();
}

/* ===== MODE 2: 3-PERIOD FULL EXAM ===== */

  state.mode = m;
  document.getElementById('tabTop55').classList.toggle('active', m === 'top55');

  document.getElementById('secTop55').style.display = m === 'top55' ? 'block' : 'none';

  if (m === 'exam') renderExamPart();
  else renderTop55();
}

function switchExamPart(p) {

            ③ 교육평가: 비고츠키 ZPD 역동적 평가(사전검사-교수적 중재-사후검사) + 분석적 루브릭(평가준거·성취수준·척도기술어·사전공개)<br><br>
            ④ 교육행정: 세르지오바니 도덕적 리더십(도덕적 권위·학교 공동체) + 겟젤스-구바 사회체계(규범적 차원·개인적 차원·절충형 지도성)
          </div>
        </div>
      </article>
    `;
    return;
  }

  const list = state.examPart === 'A' ? EXAM_A : EXAM_B;
  const label = state.examPart === 'A' ? '2교시 전공 A형' : '3교시 전공 B형';
  c.innerHTML = list.map((q, idx) => {
    const uid = `${state.examPart}_${idx}`;
    const asksHtml = (q.asks || []).map(a => `<li>○ ${escHtml(a)}</li>`).join('');
    const kwsHtml = (q.kws || []).map(k => `<span class="kw-chip"># ${escHtml(k)}</span>`).join('');
    const linesHtml = (q.ans || q.answer || []).map((ln, i) => `
      <div class="ans-line">
        <span class="line-num">${i+1}줄</span>
        <span>${highlightKws(ln, q.kws)}</span>
      </div>
    `).join('');

    return `
      <article class="card">
        <div class="card-meta">
          <span class="rank-badge">${label} ${q.num}번</span>
          <span class="tier-badge tier-0">${escHtml(q.type)} · ${q.score}점</span>
          <span class="domain-tag">힌트 ZERO 초장문 실전형</span>
        </div>
        <h2 class="card-title">${escHtml(q.lead)}</h2>

        <div class="problem-box">
          <div class="step-label" style="color:var(--accent);">📄 STEP 1. 실전 사례 지문</div>
          <div class="passage-text">${escHtml(q.passage)}</div>
          ${asksHtml ? `<div class="asks-box"><div class="asks-title">&lt;작성 방법&gt;</div><ul class="asks-list">${asksHtml}</ul></div>` : ''}
        </div>

        <div class="step-actions">
          <button class="reveal-btn" id="btn-exans-${uid}" onclick="toggleExamBox('${uid}','ans')">✅ STEP 2. 정답 보기</button>
          <button class="reveal-btn" id="btn-exexp-${uid}" onclick="toggleExamBox('${uid}','exp')">💡 STEP 3. 채점 키워드 해설</button>
        </div>

        <div class="answer-panel" id="panel-exans-${uid}">
          <div class="step-label" style="color:var(--success);">✅ B4 답안지 만점 모범답안</div>
          <div class="ans-lines">${linesHtml}</div>
        </div>

        <div class="exp-panel" id="panel-exexp-${uid}">
          <div class="step-label" style="color:var(--accent-2);">💡 KICE 필수 채점 키워드 & 출제 의도</div>
          <div class="kw-row">${kwsHtml}</div>
          <div class="exp-text">본 문항은 2020~2026 평가원 복합형 출제 패턴(2~3개 이론 융합)을 100% 반영한 힌트 ZERO 실전 문항입니다. 위 필수 채점 키워드를 빠짐없이 포함하여 줄당 38~45자 이내로 간결하게 서술하면 만점(${q.score}점)을 획득할 수 있습니다.</div>
        </div>
      </article>
    `;
  }).join('');
}

// Touch swipe support in mobile card mode
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  if (state.mode !== 'top55' || state.viewMode !== 'card') return;
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (state.mode !== 'top55' || state.viewMode !== 'card') return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) moveCard(1);
    else moveCard(-1);
  }
}, { passive: true });


if (!state.drafts) state.drafts = {};

function onPracticeInput(id) {
  const ta = document.getElementById('ta-' + id);
  const cnt = document.getElementById('charcnt-' + id);
  if (!ta) return;
  const val = ta.value;
  if (cnt) cnt.textContent = val.length + '자';
  if (!state.drafts) state.drafts = {};
  state.drafts[id] = val;
  try {
    const prev = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    prev.drafts = state.drafts;
    localStorage.setItem(STORE_KEY, JSON.stringify(prev));
  } catch(e) {}
}

function gradeDraft(id) {
  const item = TOP55.find(x => x.id === id);
  const ta = document.getElementById('ta-' + id);
  const box = document.getElementById('grade-res-' + id);
  if (!item || !ta || !box) return;
  const text = (ta.value || '').replace(/\s+/g, '').toLowerCase();
  const kws = item.keywords || [];
  let hits = 0;
  const chips = kws.map(kw => {
    const norm = kw.replace(/\([^)]*\)/g, '').replace(/\s+/g, '').toLowerCase();
    const parts = norm.split(/[·,/]/).filter(p => p.length >= 2);
    const matched = text.includes(norm) || (parts.length > 0 && parts.some(p => text.includes(p)));
    if (matched) hits++;
    return `<span class="g-chip ${matched ? 'g-hit' : 'g-miss'}">${matched ? '✔ ' : '✘ '}${escHtml(kw)}</span>`;
  }).join('');
  const pct = kws.length ? Math.round((hits / kws.length) * 100) : 0;
  const msg = pct === 100 ? '🏆 완벽! KICE 만점 키워드 100% 적중!' : (pct >= 60 ? '👍 우수! 누락된 빨강 키워드를 보완하세요.' : '📌 STEP 2 정답을 확인하고 핵심 키워드를 암기하세요.');
  box.innerHTML = `<div style="font-weight:900;margin-bottom:5px;">채점 결과: <span style="color:var(--accent);">${hits} / ${kws.length} (${pct}%)</span> — ${msg}</div><div>${chips}</div>`;
  box.classList.add('open');
}

function jumpToQuestionById(id) {
  state.filter = 'all';
  state.search = '';
  const si = document.getElementById('searchInput');
  if (si) si.value = '';
  document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.toggle('active', c.dataset.f === 'all'));
  const idx = TOP55.findIndex(x => x.id === id);
  state.cardIdx = idx >= 0 ? idx : 0;
  state.viewMode = 'card';
  applyPrefs();
  switchMode('top55');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Override switchMode to support 3 tabs: analysis | top55 | exam
const _origSwitchMode = switchMode;
switchMode = function(mode) {
  state.mode = mode;
  document.getElementById('tabAnalysis').classList.toggle('active', mode === 'analysis');
  document.getElementById('tabTop55').classList.toggle('active', mode === 'top55');
  document.getElementById('tabExam').classList.toggle('active', mode === 'exam');
  document.getElementById('secAnalysis').style.display = mode === 'analysis' ? 'block' : 'none';
  document.getElementById('secTop55').style.display = mode === 'top55' ? 'block' : 'none';
  document.getElementById('secExam').style.display = mode === 'exam' ? 'block' : 'none';
  document.getElementById('bottomBar').style.display = (mode === 'top55' && state.viewMode === 'card') ? 'block' : 'none';
  if (mode === 'analysis') renderAnalysis();
  else if (mode === 'exam') renderExam();
  else renderTop55();
};
