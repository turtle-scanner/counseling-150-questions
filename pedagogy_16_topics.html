<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 KICE 임용고시 교육학 논술 4대 영역 16대 핵심 주제 마스터 (인쇄 및 웹 뷰)</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #090d16;
  --bg-card: #151e2e;
  --bg-input: #0f1624;
  --border-card: #23324a;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --gold: #f59e0b;
  --gold-bg: rgba(245, 158, 11, 0.12);
  --emerald: #10b981;
  --emerald-bg: rgba(16, 185, 129, 0.12);
  --sky: #38bdf8;
  --sky-bg: rgba(56, 189, 248, 0.12);
  --rose: #f43f5e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: 'Noto Sans KR', sans-serif;
  line-height: 1.6;
  padding-bottom: 80px;
}

/* Header */
.top-header {
  background: rgba(15, 22, 36, 0.95);
  border-bottom: 1px solid var(--border-card);
  padding: 20px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.header-container {
  max-width: 1300px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}
.header-title-box h1 {
  font-size: 1.35rem;
  font-weight: 800;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-title-box p {
  font-size: 0.85rem;
  color: var(--text-sub);
  margin-top: 4px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Buttons */
.btn {
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-print {
  background: var(--gold);
  color: #000;
}
.btn-print:hover {
  background: #d97706;
  transform: translateY(-1px);
}
.btn-blind {
  background: #1e293b;
  border-color: #334155;
  color: #f8fafc;
}
.btn-blind.active {
  background: var(--rose);
  border-color: var(--rose);
  color: #fff;
}

/* Filter Nav */
.filter-nav {
  max-width: 1300px;
  margin: 18px auto 0;
  padding: 0 24px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}
.tab-btn {
  background: #111827;
  border: 1px solid var(--border-card);
  color: var(--text-sub);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn.active, .tab-btn:hover {
  background: var(--sky-bg);
  border-color: var(--sky);
  color: var(--sky);
}

/* Content Container */
.main-container {
  max-width: 1300px;
  margin: 24px auto 0;
  padding: 0 24px;
}

/* Domain Section */
.domain-section {
  margin-bottom: 40px;
}
.domain-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border-card);
  margin-bottom: 20px;
}
.domain-badge {
  background: var(--sky);
  color: #000;
  font-size: 0.85rem;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 20px;
}
.domain-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: #fff;
}

/* Cards Grid */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}
@media (min-width: 1100px) {
  .cards-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Topic Card */
.topic-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}
.topic-card:hover {
  border-color: #3b82f6;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.card-num {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 800;
  color: var(--gold);
  font-size: 0.95rem;
}
.card-title-text {
  font-size: 1.05rem;
  font-weight: 800;
  color: #fff;
  line-height: 1.4;
}
.card-concept {
  font-size: 0.84rem;
  color: var(--sky);
  background: var(--sky-bg);
  padding: 6px 10px;
  border-radius: 6px;
  border-left: 3px solid var(--sky);
  margin-top: 4px;
}

/* Sub-questions Box */
.sub-q-box {
  background: #090d16;
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 0.85rem;
}
.sub-q-header {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sub-q-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sub-q-list li {
  color: #e2e8f0;
  line-height: 1.5;
  display: flex;
  gap: 6px;
}
.sub-q-list li span.q-num {
  color: var(--sky);
  font-weight: 700;
}

/* Keyword Tags */
.kw-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.kw-tag {
  background: rgba(56, 189, 248, 0.1);
  color: var(--sky);
  border: 1px solid rgba(56, 189, 248, 0.25);
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.78rem;
  font-weight: 600;
}

/* Model Answer Box */
.ans-box {
  background: #0b1524;
  border: 1px solid #1e3a5f;
  border-left: 3px solid var(--emerald);
  border-radius: 8px;
  padding: 12px 14px;
}
.ans-header {
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--emerald);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ans-lines {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 0.88rem;
  line-height: 1.6;
  color: #f1f5f9;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ans-line-item {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dashed rgba(255,255,255,0.06);
  padding-bottom: 3px;
}

/* Rubric Box */
.rubric-box {
  background: rgba(245, 158, 11, 0.05);
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.8rem;
}
.rubric-header {
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 6px;
}
.rubric-items {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: #cbd5e1;
}

/* Blind Mode */
body.blind-mode .ans-lines,
body.blind-mode .kw-tag {
  filter: blur(5px);
  user-select: none;
  transition: filter 0.2s;
}
body.blind-mode .ans-lines:hover,
body.blind-mode .kw-tag:hover {
  filter: blur(0);
}

/* ================= PRINT CSS OPTIMIZATION ================= */
@media print {
  @page {
    size: A4 portrait;
    margin: 12mm 10mm;
  }
  body {
    background: #fff !important;
    color: #000 !important;
    font-size: 9.5pt;
    line-height: 1.4;
    padding-bottom: 0;
  }
  .top-header, .filter-nav, .btn, .no-print {
    display: none !important;
  }
  .main-container {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .domain-section {
    page-break-before: always;
    margin-bottom: 20px !important;
  }
  .domain-section:first-child {
    page-break-before: avoid;
  }
  .domain-header {
    border-bottom: 2px solid #000 !important;
    padding-bottom: 6px !important;
    margin-bottom: 12px !important;
  }
  .domain-badge {
    background: #000 !important;
    color: #fff !important;
    font-size: 8pt;
    padding: 2px 8px;
  }
  .domain-title {
    color: #000 !important;
    font-size: 13pt;
  }
  .cards-grid {
    grid-template-columns: 1fr !important;
    gap: 14px !important;
  }
  .topic-card {
    background: #fff !important;
    border: 1px solid #333 !important;
    color: #000 !important;
    padding: 12px 14px !important;
    box-shadow: none !important;
    page-break-inside: avoid !important;
    margin-bottom: 10px !important;
  }
  .card-num {
    color: #000 !important;
    font-size: 9pt;
  }
  .card-title-text {
    color: #000 !important;
    font-size: 11pt;
  }
  .card-concept {
    background: #f1f5f9 !important;
    color: #000 !important;
    border-left: 3px solid #333 !important;
    font-size: 8.5pt;
    padding: 4px 6px;
  }
  .sub-q-box {
    background: #f8fafc !important;
    border: 1px solid #cbd5e1 !important;
    padding: 8px 10px !important;
    font-size: 8.5pt !important;
  }
  .sub-q-header {
    color: #000 !important;
  }
  .sub-q-list li {
    color: #111 !important;
  }
  .kw-tag {
    background: #f1f5f9 !important;
    color: #000 !important;
    border: 1px solid #cbd5e1 !important;
    font-size: 8pt !important;
  }
  .ans-box {
    background: #fafafa !important;
    border: 1px solid #666 !important;
    border-left: 3px solid #000 !important;
    padding: 8px 10px !important;
  }
  .ans-header {
    color: #000 !important;
    font-size: 8.5pt;
  }
  .ans-lines {
    color: #000 !important;
    font-size: 9pt;
    line-height: 1.45;
  }
  .ans-line-item {
    border-bottom: 1px solid #ddd !important;
  }
  .rubric-box {
    background: #fff !important;
    border: 1px dashed #666 !important;
    padding: 6px 8px !important;
    font-size: 8pt !important;
  }
  .rubric-header {
    color: #000 !important;
  }
  .rubric-items {
    color: #222 !important;
  }
  body.blind-mode .ans-lines,
  body.blind-mode .kw-tag {
    filter: none !important;
  }
}
</style>
</head>
<body>

<header class="top-header">
  <div class="header-container">
    <div class="header-title-box">
      <h1>🎓 2027 KICE 임용고시 교육학 논술 16대 핵심 주제 마스터</h1>
      <p>4대 영역(교육과정·교육방법·교육평가·교육행정) 영역별 4개씩 16대 필수 주제 및 B4 38-45자 실전 모범답안</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-blind" id="blind-toggle" onclick="toggleBlindMode()">🙈 블라인드 암기 모드</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ A4 인쇄하기</button>
    </div>
  </div>
</header>

<nav class="filter-nav">
  <button class="tab-btn active" onclick="filterDomain('all')">전체 16대 주제 보기</button>
  <button class="tab-btn" onclick="filterDomain('교육과정')">Ⅰ. 교육과정 (4선)</button>
  <button class="tab-btn" onclick="filterDomain('교육방법')">Ⅱ. 교육방법 (4선)</button>
  <button class="tab-btn" onclick="filterDomain('교육평가')">Ⅲ. 교육평가 (4선)</button>
  <button class="tab-btn" onclick="filterDomain('교육행정')">Ⅳ. 교육행정 (4선)</button>
</nav>

<main class="main-container" id="content-container">
</main>

<script>
const topics = [{"domain":"교육과정","num":1,"title":"위긴스 & 맥타이 백워드 설계 모형 2.0 (Wiggins & McTighe)","concept":"2022 개정 깊이 있는 학습을 위한 영속적 이해(Big Idea)와 평가 중심 단원 설계","sub_questions":["백워드 설계 모형에서 핵심 목표로 설정하는 '영속적 이해(Big Idea)'의 개념 서술 [1점]","영속적 이해의 6대 측면(설명, 해석, 적용, 관점, 공감, 자기인식) 중 3가지 이상의 공식 정의 제시 [1점]","목표 설정을 위해 개발하는 '본질적 질문(Essential Questions)'의 특징 및 기능 서술 [1점]","3단계 '학습 경험 및 교수 계획'을 안내하는 WHERETO 원리의 장점 1가지 제시 [1점]"],"keywords":["영속적 이해(Big Idea)","이해의 6대 측면","본질적 질문","WHERETO 원리"],"model_answer":["영속적 이해는 세부 지식을 망각한 뒤에도 지속되는 핵심적인 원리이다. (38자)","학습자가 새로운 낯선 상황과 실제 삶의 맥락에 전이할 수 있어야 한다. (39자)","학생이 자신의 언어로 정당화하고 다각적 관점에서 통찰하도록 유도한다. (38자)","본질적 질문을 던져 탐구를 촉발하고 웨어투 원리로 학습 경험을 조직한다. (42자)"],"rubric":["영속적 이해(Big Idea)의 개념(세부 사실 망각 후에도 지속되는 대개념, 전이 가치 높은 원리) 명시: 1점","이해의 6대 측면(설명, 해석, 적용, 관점, 공감, 자기인식) 중 3가지 이상 명시 및 정의: 1점","본질적 질문의 특징(정답이 하나로 정해지지 않음, 지속적 탐구 촉발, 핵심 아이디어 도달) 서술: 1점","WHERETO 원리에 따른 체계적 학습 경험 조직 및 학생 중심 단원 설계 장점 제시: 1점"]},{"domain":"교육과정","num":2,"title":"타바(Taba) 교사 중심 귀납적 교육과정 개발 모형","concept":"교사의 교육과정 문해력 증진 및 현장 요구에 기초한 단원 개발(아래로부터의 상향식 접근)","sub_questions":["타바 모형의 핵심적 특징인 '교사 중심 귀납적 접근'의 개념 및 의의 서술 [1점]","교육과정 개발 7단계(요구 진단부터 평가까지)의 체계적 흐름 설명 [1점]","시험적 단원 개발 및 검증을 통한 현장 적합성 확보 기제 서술 [1점]","국가 수준 교육과정의 한계를 극복하고 교사의 교육과정 자율성을 높이는 방안 제시 [1점]"],"keywords":["귀납적 모형","교사 중심 단원 개발","요구 진단 7단계","현장 적합성"],"model_answer":["타바 모형은 교사가 수업 현장의 요구를 직접 진단하여 단원을 개발한다. (40자)","단원을 먼저 개발하여 검증한 뒤 전체 교육과정으로 체계화하는 방식이다. (41자)","현장 교사의 참여로 교육과정 실행도를 높이고 교육적 적합성을 확보한다. (41자)","요구 진단에서 평가까지 체계적 절차를 거쳐 교사의 전문성을 신장한다. (40자)"],"rubric":["하향식이 아닌 교사가 직접 학생 요구를 바탕으로 개발하는 귀납적 특징 서술: 1점","요구 진단, 목표 설정, 내용 선정-조직, 학습경험 선정-조직, 평가 7단계 설명: 1점","시험적 단원 개발 및 현장 적용 검증을 통한 실효성 확보 기제 서술: 1점","교사의 교육과정 문해력 신장 및 학교 맥락 맞춤형 실행도 제고 방안 제시: 1점"]},{"domain":"교육과정","num":3,"title":"아이즈너(Eisner) 예술적 교육과정 개발 모형","concept":"행동목표 비판, 교육적 상상력, 참 평가, 교육적 감식안과 교육비평을 통한 질적 개선","sub_questions":["타일러의 행동적 목표 진술을 비판하고 제시한 문제해결 목표와 표현적 결과의 개념 서술 [1점]","교육내용을 학생들에게 의미 있는 학습 기회로 변형하는 '교육적 상상력'의 기능 설명 [1점]","실생활 과제 해결 능력을 평가하는 '참 평가(Authentic Assessment)'의 특징 서술 [1점]","학생 성취의 미묘한 질적 차이를 감지하는 '교육적 감식안'과 이를 공적으로 표현하는 '교육비평'의 개념 및 교사의 자질 제시 [1점]"],"keywords":["문제해결 목표·표현적 결과","교육적 상상력","참 평가(Authentic Assessment)","교육적 감식안 및 교육비평"],"model_answer":["타일러의 행동목표를 비판하고 문제해결 목표와 표현적 결과를 새롭게 제안한다. (42자)","교육적 상상력을 발휘하여 교육내용을 학생에게 의미 있는 형태로 재구성한다. (41자)","실생활 맥락에서 학습자의 질적 성취를 종합 측정하는 참 평가를 강조한다. (40자)","교사는 미묘한 차이를 감식하는 안목과 이를 언어로 표현하는 교육비평을 편다. (42자)"],"rubric":["정답이 정해지지 않은 문제해결 목표 및 활동 중 자연스럽게 형성되는 표현적 결과 개념 명시: 1점","교과 내용을 학생의 흥미와 발달에 적합한 학습 기회로 전환하는 교육적 상상력 기능 설명: 1점","실제적 삶의 상황에서 학생이 지닌 역량을 직접 관찰하여 평가하는 참 평가 특징 서술: 1점","미묘한 질적 차이를 분별하는 사적 안목인 감식안과 이를 공론화하는 비평의 개념 및 역할 제시: 1점"]},{"domain":"교육과정","num":4,"title":"파이나(Pinar) 실존적 재개념주의 쿠레레(Currere) 모형","concept":"교육과정의 어원적 의미 회복과 개인의 실존적 자아 성찰(자서전적 방법 4단계)","sub_questions":["전통적 교육과정과 대비되는 쿠레레(Currere)의 실존적 개념 서술 [1점]","자서전적 방법 4단계(소환 ➔ 전진 ➔ 분석 ➔ 종합)의 구체적 활동 제시 [1점]","외부에서 강요된 타자화된 지식에서 벗어나 학습자의 내면적 자유를 획득하는 기제 설명 [1점]","교사와 학생이 삶의 의미를 능동적으로 재구성하는 자아성찰적 교육 방안 제시 [1점]"],"keywords":["쿠레레(Currere)","자서전적 방법","소환·전진·분석·종합","실존적 해방"],"model_answer":["쿠레레 모형은 학습자가 자신의 생생한 교육적 경험을 스스로 반성하고 의미화한다. (44자)","과거의 경험을 회상하는 소환과 미래를 상상하는 전진을 통해 삶을 종합 조망한다. (43자)","현재와 과거 미래를 분석하여 자신의 고정관념과 인식을 비판적으로 본다. (41자)","이를 종합하여 내면적 자유를 얻고 자기 주도적 삶의 주체로 거듭난다. (39자)"],"rubric":["교수요목이 아닌 학습자가 살아가는 개인적·생생한 삶의 체험으로서의 쿠레레 정의: 1점","소환(과거 회상), 전진(미래 상상), 분석(현재와 관계 분석), 종합(의미 통합) 4단계 제시: 1점","외부 규율적 지식의 맹목적 수용을 비판하고 실존적 주체성을 확립하는 기제 서술: 1점","성찰적 글쓰기나 대화를 통해 삶과 앎을 통합하는 교육적 실천 방안 제시: 1점"]},{"domain":"교육방법","num":5,"title":"플립드 러닝(Flipped Learning, 역진행 수업) 3단계","concept":"교실 공간을 지식 전달에서 학생 중심 협력 탐구 및 즉각적 피드백의 장으로 혁신","sub_questions":["플립드 러닝 '수업 전(Pre-class)' 단계에서 디딤영상의 핵심 기능 서술 [1점]","플립드 러닝 '수업 중(In-class)' 단계에서 이루어지는 고차원적 협력 탐구 형태 제시 [1점]","수업 중 학생의 오개념을 교정하고 촉진하는 교사의 개별 맞춤 비계 및 피드백 역할 설명 [1점]","플립드 러닝 '수업 후(Post-class)' 단계에서 성찰일지를 활용한 메타인지 신장 효과 제시 [1점]"],"keywords":["디딤영상(사전학습)","고차원적 협력 탐구","개별 맞춤 비계","성찰일지(메타인지)"],"model_answer":["수업 전에 핵심 개념이 담긴 디딤영상을 시청하여 기초 지식을 미리 익힌다. (42자)","수업 중에는 고차원적 협력 탐구 활동을 수행하고 교사는 맞춤형 비계를 준다. (43자)","수업 후에는 성찰일지를 작성하여 학습 내용을 확인하고 후속 과제를 한다. (41자)","교실을 지식 전달 공간에서 학생 간 상호작용과 협력적 문제해결로 전환한다. (42자)"],"rubric":["수업 전 디딤영상 시청을 통한 기초 지식 및 개념 개별 사전 습득 기능 서술: 1점","수업 중 토의-토론, 문제해결, 프로젝트 등 고차원적 협력 탐구 활동 형태 제시: 1점","순회 지도를 통한 오개념 진단, 개별 맞춤형 비계 제공 및 즉각적 피드백 역할 설명: 1점","수업 후 성찰일지 작성을 통한 자신의 학습 과정 반성 및 메타인지 신장 효과 제시: 1점"]},{"domain":"교육방법","num":6,"title":"스웰러(Sweller) 인지부하 이론","concept":"작동기억의 인지적 한계를 극복하고 장기기억 스키마 형성을 극대화하는 교수 설계","sub_questions":["인지부하의 3가지 유형(내재적 부하, 외재적 부하, 본질적 부하)의 개념 구분 [1점]","교수 설계 상에서 외재적 인지부하를 최소화하기 위한 구체적 설계 원리 2가지 제시 [1점]","학습자의 스키마(지식구조) 형성을 촉진하는 본질적 인지부하 활용 방안 서술 [1점]","학습자의 사전 지식 수준에 따라 교수 효과가 역전되는 전문성 역전 효과 설명 [1점]"],"keywords":["내재적·외재적·본질적 부하","외재적 부하 최소화","스키마 형성 촉진","전문성 역전 효과"],"model_answer":["내재적 부하는 학습 내용 자체의 난이도이며 과제 요소를 분할해 줄인다. (41자)","외재적 부하는 부적절한 교수 설계로 발생하므로 불필요한 자극을 없앤다. (41자)","본질적 부하는 스키마 형성에 투입되는 노력이므로 이를 적극 촉진한다. (40자)","작업기억의 용량 한계를 고려하여 정보를 체계적으로 조직화해 장기기억으로 전이한다. (45자)"],"rubric":["내재적(과제 자체 복잡성), 외재적(교수 방식 비효율성), 본질적(스키마 형성 노력) 개념 구분: 1점","근접성 원리, 양식 원리, 중복 원리 배제 등 외재적 부하 감축 설계 원리 제시: 1점","충분한 연습과 유의미한 정보 조직화로 장기기억 스키마 형성 촉진 방안 서술: 1점","초보자에게 유리한 비계가 숙련자에게는 외재적 부하가 되는 전문성 역전 설명: 1점"]},{"domain":"교육방법","num":7,"title":"콜린스(Collins) 인지적 도제 교수법","concept":"전문가의 고차원적 사고 전략과 문제해결 과정을 가시화하여 학습자에게 전수","sub_questions":["전통적 도제제도와 구별되는 인지적 도제의 핵심 개념(사고의 가시화) 서술 [1점]","교수 절차 6단계(모델링 ➔ 코칭 ➔ 비계설정 ➔ 명료화 ➔ 반성 ➔ 탐색) 흐름 설명 [1점]","비계설정(Scaffolding)을 점진적으로 철회(Fading)하는 교육적 원리 제시 [1점]","실제적 맥락의 협력 학습 환경에서 학생의 자율적 문제해결력(탐색) 신장 방안 서술 [1점]"],"keywords":["사고 과정 가시화","모델링·코칭·비계설정","명료화·반성·탐색","점진적 비계철회(Fading)"],"model_answer":["전문가의 내면화된 사고 과정을 시각적으로 보여주는 모델링을 실시한다. (41자)","학생이 과제를 수행할 때 교사가 조언을 주고 맞춤형 비계를 제공한다. (39자)","학생 스스로 자신의 인지적 지식을 명료화하고 전문가의 전략과 비교하며 반성한다. (44자)","점진적으로 비계를 제거하여 학생이 스스로 새로운 문제를 탐색하게 한다. (41자)"],"rubric":["인지적 도제의 핵심인 외면화되지 않은 전문가의 인지적·메타인지적 사고 전략 가시화 명시: 1점","모델링, 코칭, 비계설정, 명료화, 반성, 탐색의 6단계 교수-학습 단계 제시: 1점","학생의 문제해결력이 신장됨에 따라 교사의 조력을 서서히 줄이는 Fading 원리 서술: 1점","실제적 맥락에서 학습자가 스스로 가설을 세우고 새로운 문제를 탐색하는 독립성 유도: 1점"]},{"domain":"교육방법","num":8,"title":"메지로우(Mezirow) 변혁적 학습 이론","concept":"기존의 무비판적 전제와 신념을 성찰하고 더 포용적인 관점의 프레임으로 전환","sub_questions":["학습을 촉발하는 계기가 되는 '혼란스러운 딜레마(Disorienting Dilemma)'의 기능 설명 [1점]","단순한 내용 반성을 넘어선 '비판적 전제 성찰(Premise Reflection)'의 개념 서술 [1점]","타인과의 합리적 담화를 통한 '관점의 전환(Perspective Transformation)' 기제 설명 [1점]","변혁된 새로운 관점을 실제 삶의 행위로 통합하고 실천하는 교육적 지도 방안 제시 [1점]"],"keywords":["혼란스러운 딜레마","비판적 전제 성찰","관점 전환","실천적 통합"],"model_answer":["기존의 신념체계로 해결할 수 없는 혼란스러운 딜레마를 겪으면서 학습이 시작된다. (43자)","자신이 당연하게 여겼던 무비판적인 왜곡된 전제와 가치관을 비판적으로 성찰한다. (43자)","타인과의 대화를 통해 편견을 극복하고 더 포용적인 관점으로 전환한다. (40자)","새롭게 획득한 관점을 실제 삶과 학습 활동에 적극 적용하여 변화한다. (40자)"],"rubric":["기존의 준거틀로 해결되지 않는 인지적 갈등인 혼란스러운 딜레마의 촉발 기능 서술: 1점","자신이 당연시해온 근본적 신념이나 전제 자체에 의문을 제기하는 전제 성찰 명시: 1점","대화와 숙의를 통해 왜곡된 관점을 개방적·포용적 관점으로 재구성하는 변혁 기제 설명: 1점","새로운 관점에 부합하는 역할을 탐색하고 실제 학교생활에서 실천하도록 지원하는 방안 제시: 1점"]},{"domain":"교육평가","num":9,"title":"비고츠키(Vygotsky) ZPD 기반 역동적 평가","concept":"결과 중심 정적 평가를 탈피하여 학습자의 잠재력 측정 및 평가와 교수의 유기적 통합","sub_questions":["정적 평가와 구별되는 역동적 평가의 '잠재적 발달수준' 측정 원리 서술 [1점]","평가 도중 교사의 힌트와 조력이 제공되는 '평가와 교수의 통합' 기제 설명 [1점]","최소한의 조력부터 점진적으로 투입하고 자립 시 비계를 철회하는 Fading 원리 제시 [1점]","개별 학생의 근접발달영역(ZPD)에 맞춘 맞춤형 수업 설계와의 연계 방안 서술 [1점]"],"keywords":["잠재적 발달수준","평가-교수 통합","점진적 비계 및 철회(Fading)","ZPD 맞춤형 지원"],"model_answer":["역동적 평가는 학습자의 현재 발달수준과 잠재적 발달수준을 함께 진단한다. (40자)","평가와 교수 과정을 하나로 통합하여 수업 진행 중에 지속적으로 실시한다. (41자)","문제를 해결할 때 점진적 힌트를 투입하고 자립 시 비계를 서서히 철회한다. (42자)","학생이 미래에 도달할 수 있는 학습 잠재력을 확인하여 맞춤형으로 돕는다. (41자)"],"rubric":["혼자 해결 가능한 수준뿐 아니라 조력을 통해 도달할 수 있는 잠재력 동시 측정 서술: 1점","평가 중에 교수가 즉각적으로 개입되어 발달을 촉진하는 평가-교수 통합 원리 명시: 1점","점진적 힌트 투입 및 학생의 자기주도적 문제해결력 신장 시 비계 철회(Fading) 제시: 1점","측정된 ZPD를 바탕으로 후속 수업에서 개별화된 비계를 체계적으로 설계하는 연계 방안 서술: 1점"]},{"domain":"교육평가","num":10,"title":"루브릭(Rubric, 수행평가 다차원 채점기준표)","concept":"과정중심 수행평가의 채점 객관성과 신뢰도를 확보하고 학생의 자기조절학습 지원","sub_questions":["루브릭의 3대 핵심 구성 요소(평가 준거, 성취 수준, 척도 기술어)의 조작적 정의 제시 [1점]","총체적 루브릭(Holistic) 대비 function renderTopics(filter) {
  const container = document.getElementById('content-container');
  container.innerHTML = '';

  const domains = ['교육과정', '교육방법', '교육평가', '교육행정'];

  domains.forEach(d => {
    if (filter !== 'all' && filter !== d) return;

    const domainTopics = topics.filter(t => t.domain === d);
    if (domainTopics.length === 0) return;

    const section = document.createElement('section');
    section.className = 'domain-section';
    section.id = 'domain-' + d;

    let cardsHtml = '';
    domainTopics.forEach(t => {
      const qListHtml = t.sub_questions.map((q, idx) => 
        '<li><span class="q-num">Q' + (idx + 1) + '.</span> <span>' + q + '</span></li>'
      ).join('');

      const kwHtml = t.keywords.map(kw => 
        '<span class="kw-tag">' + kw + '</span>'
      ).join('');

      const ansHtml = t.model_answer.map(line => 
        '<div class="ans-line-item"><span>' + line + '</span></div>'
      ).join('');

      const rubricHtml = t.rubric.map(r => 
        '<div>✓ ' + r + '</div>'
      ).join('');

      cardsHtml += 
        '<div class="topic-card">' +
          '<div class="card-top">' +
            '<div>' +
              '<div class="card-num">TOPIC ' + String(t.num).padStart(2, '0') + '</div>' +
              '<div class="card-title-text">' + t.title + '</div>' +
            '</div>' +
            '<span class="domain-badge">' + t.domain + '</span>' +
          '</div>' +
          '<div class="card-concept">📌 <strong>출제 논점:</strong> ' + t.concept + '</div>' +
          '<div class="sub-q-box">' +
            '<div class="sub-q-header">📋 [세부 질문 4개 / 4점 만점 구조]</div>' +
            '<ul class="sub-q-list">' + qListHtml + '</ul>' +
          '</div>' +
          '<div class="kw-tags">' + kwHtml + '</div>' +
          '<div class="ans-box">' +
            '<div class="ans-header">' +
              '<span>🏆 B4 답안지 4줄 공식 모범답안 (줄당 38-45자)</span>' +
              '<span style="font-size:0.75rem; color:#94a3b8;">4점 만점</span>' +
            '</div>' +
            '<div class="ans-lines">' + ansHtml + '</div>' +
          '</div>' +
          '<div class="rubric-box">' +
            '<div class="rubric-header">⚖️ [KICE 4점 만점 공식 채점 기준표]</div>' +
            '<div class="rubric-items">' + rubricHtml + '</div>' +
          '</div>' +
        '</div>';
    });

    section.innerHTML = 
      '<div class="domain-header">' +
        '<span class="domain-badge">' + d + '</span>' +
        '<h2 class="domain-title">' + d + ' 영역 핵심 4대 테마</h2>' +
      '</div>' +
      '<div class="cards-grid">' + cardsHtml + '</div>';

    container.appendChild(section);
  });
}

function filterDomain(domain) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.innerText.includes(domain) || (domain === 'all' && btn.innerText.includes('전체'))) {
      btn.classList.add('active');
    }
  });
  renderTopics(domain);
}

function toggleBlindMode() {
  document.body.classList.toggle('blind-mode');
  const btn = document.getElementById('blind-toggle');
  if (document.body.classList.contains('blind-mode')) {
    btn.classList.add('active');
    btn.innerText = '👀 정답 보기 모드';
  } else {
    btn.classList.remove('active');
    btn.innerText = '🙈 블라인드 암기 모드';
  }
}

// Initial render
window.addEventListener('DOMContentLoaded', () => {
  renderTopics('all');
});
</script>
</body>
</html>
