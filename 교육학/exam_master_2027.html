<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>2027학년도 11.28 임용고시 결전 - 55개 KICE 핵심키워드 4줄 정답 & 만점 템플릿 타이핑 마스터</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0a0f1d;
  --bg-card: #121929;
  --bg-card-header: #182238;
  --bg-passage: #0b1220;
  --border-kice: #22314d;
  --border-kice-focus: #38bdf8;
  --text-main: #f1f5f9;
  --text-sub: #94a3b8;
  --text-muted: #64748b;
  --accent-blue: #38bdf8;
  --accent-gold: #fbbf24;
  --accent-emerald: #10b981;
  --accent-rose: #f43f5e;
  --accent-purple: #c084fc;
  --font-scale: 1;
}

body.b4-paper-mode {
  --bg-main: #18191c;
  --bg-card: #e8e3d5;
  --bg-card-header: #dbd4c0;
  --bg-passage: #f3efe6;
  --border-kice: #8c826e;
  --border-kice-focus: #1e3a8a;
  --text-main: #111827;
  --text-sub: #374151;
  --text-muted: #4b5563;
  --accent-blue: #1e40af;
  --accent-gold: #b45309;
  --accent-emerald: #047857;
  --accent-rose: #b91c1c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 90px;
  user-select: text;
  transition: background-color 0.3s, color 0.3s;
}

.kice-exam-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 15, 29, 0.98);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid #1e3a5f;
  padding: 10px 24px;
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
}
body.b4-paper-mode .kice-exam-header {
  background: rgba(220, 215, 200, 0.98);
  border-bottom: 2px solid #8c826e;
}

.header-inner {
  max-width: 1560px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.kice-seal {
  background: linear-gradient(135deg, #d97706, #b45309);
  color: #fff;
  font-size: 0.78rem;
  font-weight: 900;
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  border: 1px solid #fbbf24;
}

.exam-main-title {
  font-size: 1.12rem;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.examinee-tag {
  color: #38bdf8;
  font-weight: 700;
  font-size: 0.85rem;
  background: rgba(56, 189, 248, 0.1);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(56, 189, 248, 0.3);
}
body.b4-paper-mode .examinee-tag {
  color: #1e3a8a;
  background: rgba(30, 58, 138, 0.1);
  border-color: #1e3a8a;
}

.timer-container {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #091322;
  border: 1px solid #1e3a5f;
  padding: 4px 12px;
  border-radius: 8px;
}
body.b4-paper-mode .timer-container {
  background: #fdfbf7;
  border-color: #8c826e;
}

.timer-label {
  font-size: 0.75rem;
  color: var(--text-sub);
  font-weight: 600;
}

.timer-digits {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--accent-gold);
  letter-spacing: 1px;
  min-width: 75px;
  text-align: center;
}
.timer-digits.warning {
  color: var(--accent-rose);
  animation: pulse-warn 1s infinite alternate;
}

@keyframes pulse-warn {
  from { opacity: 1; }
  to { opacity: 0.4; }
}

.btn-timer {
  background: #1e293b;
  border: 1px solid #334155;
  color: #cbd5e1;
  font-size: 0.72rem;
  padding: 3px 7px;
  border-radius: 4px;
  cursor: pointer;
}
body.b4-paper-mode .btn-timer {
  background: #e2dcd0;
  color: #1f2937;
  border-color: #9ca3af;
}

.wpm-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.1);
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.btn-asmr {
  background: #1e293b;
  border: 1px solid #334155;
  color: #cbd5e1;
  font-size: 0.75rem;
  padding: 5px 9px;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn-asmr.on {
  background: rgba(56, 189, 248, 0.2);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

.font-scale-ctrl {
  display: flex;
  align-items: center;
  gap: 3px;
  background: #0d1525;
  padding: 2px 6px;
  border-radius: 6px;
  border: 1px solid var(--border-kice);
}
body.b4-paper-mode .font-scale-ctrl {
  background: #dbd4c0;
}
.btn-font-scale {
  background: transparent;
  border: none;
  color: var(--text-sub);
  font-size: 0.75rem;
  font-weight: 800;
  cursor: pointer;
  padding: 2px 5px;
}
.btn-font-scale:hover { color: var(--accent-blue); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.btn-kice {
  background: #131c2e;
  color: #e2e8f0;
  border: 1px solid #2a3a54;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
body.b4-paper-mode .btn-kice {
  background: #fdfbf7;
  color: #1f2937;
  border-color: #8c826e;
}
.btn-kice:hover {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}
.btn-kice.accent {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  border: none;
  color: #fff;
}

.round-selector-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #0d1525;
  border: 1px solid var(--border-kice);
  padding: 3px 8px;
  border-radius: 6px;
}
body.b4-paper-mode .round-selector-group {
  background: #dbd4c0;
}
.round-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-sub);
  font-size: 0.76rem;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.round-btn:hover { color: var(--accent-blue); }
.round-btn.active {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  color: #fff;
  border-color: #38bdf8;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
}

.btn-kice.danger {
  border-color: rgba(244, 63, 94, 0.4);
  color: #fda4af;
}
.btn-kice.danger:hover {
  background: rgba(244, 63, 94, 0.2);
  border-color: var(--accent-rose);
  color: var(--accent-rose);
}

.sub-bar {
  max-width: 1560px;
  margin: 12px auto 0;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.period-tabs {
  display: flex;
  gap: 6px;
  background: #0d1525;
  padding: 4px;
  border-radius: 8px;
  border: 1px solid var(--border-kice);
  flex-wrap: wrap;
}
body.b4-paper-mode .period-tabs {
  background: #dbd4c0;
}

.period-tab-btn {
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 800;
  border: none;
  cursor: pointer;
  background: transparent;
  color: var(--text-sub);
  transition: all 0.2s;
}
.period-tab-btn.active {
  background: linear-gradient(135deg, #1e3a8a, #0284c7);
  color: #fff;
  box-shadow: 0 2px 10px rgba(2, 132, 199, 0.45);
}
.period-tab-btn.highlight-tab {
  border: 1px solid rgba(251, 191, 36, 0.4);
  color: #fde68a;
}
.period-tab-btn.highlight-tab.active {
  background: linear-gradient(135deg, #d97706, #b45309);
  color: #fff;
  border-color: #fbbf24;
  box-shadow: 0 2px 12px rgba(245, 158, 11, 0.5);
}

/* 55선 세부 카테고리 필터 바 */
.kice55-filter-bar {
  max-width: 1560px;
  margin: 10px auto 0;
  padding: 10px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.k55-cat-btn {
  background: #101726;
  border: 1px solid var(--border-kice);
  color: var(--text-sub);
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
body.b4-paper-mode .k55-cat-btn {
  background: #e5ded0;
  border-color: #a39985;
}
.k55-cat-btn.active {
  background: rgba(56, 189, 248, 0.2);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}
.k55-search-input {
  margin-left: auto;
  background: #080d18;
  border: 1px solid var(--border-kice);
  color: var(--text-main);
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 0.85rem;
  min-width: 260px;
}
body.b4-paper-mode .k55-search-input {
  background: #faf8f3;
  color: #111827;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-btn {
  background: transparent;
  border: 1px solid var(--border-kice);
  color: var(--text-sub);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
}
.filter-btn.active {
  background: rgba(251, 191, 36, 0.2);
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  font-weight: 800;
}

.nav-strip {
  max-width: 1560px;
  margin: 8px auto 0;
  padding: 0 24px 6px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
}

.nav-pill {
  background: #101726;
  border: 1px solid var(--border-kice);
  color: var(--text-sub);
  padding: 4px 10px;
  border-radius: 5px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
body.b4-paper-mode .nav-pill {
  background: #e5ded0;
  border-color: #a39985;
}
.nav-pill:hover {
  border-color: var(--accent-blue);
  color: #fff;
}
.nav-pill.done {
  border-color: var(--accent-emerald);
  color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.08);
}
.nav-pill.bookmarked {
  border-color: var(--accent-gold);
  color: var(--accent-gold);
}

main {
  max-width: 1560px;
  margin: 14px auto 0;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.q-card {
  background: var(--bg-card);
  border: 1px solid var(--border-kice);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
  transition: all 0.2s;
}

.q-card-head {
  background: var(--bg-card-header);
  padding: 10px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-kice);
  flex-wrap: wrap;
  gap: 8px;
}

.q-num-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--accent-gold);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.bookmark-star {
  cursor: pointer;
  font-size: 1.15rem;
  color: #4b5563;
  transition: transform 0.2s, color 0.2s;
}
.bookmark-star.active {
  color: var(--accent-gold);
  transform: scale(1.15);
}

.type-pill {
  font-size: 0.72rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 4px;
}
.type-pill.fillin { background: rgba(192, 132, 252, 0.15); color: #d8b4fe; border: 1px solid #9333ea; }
.type-pill.essay { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid #0284c7; }
.type-pill.k55 { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid #f59e0b; }

.q-card-body {
  padding: 18px;
}

.q-question-text {
  font-size: calc(1.08rem * var(--font-scale));
  font-weight: 800;
  margin-bottom: 10px;
  line-height: 1.45;
  color: var(--text-main);
}

.concept-banner {
  background: rgba(56, 189, 248, 0.08);
  border-left: 4px solid var(--accent-blue);
  padding: 8px 14px;
  border-radius: 4px;
  font-size: calc(0.9rem * var(--font-scale));
  color: var(--text-sub);
  margin-bottom: 12px;
  font-weight: 600;
}

.passage-wrapper {
  background: var(--bg-passage);
  border: 1px solid var(--border-kice);
  border-left: 4px solid var(--accent-blue);
  border-radius: 6px;
  padding: 14px 18px;
  margin-bottom: 14px;
  font-size: calc(0.94rem * var(--font-scale));
  line-height: 1.75;
  white-space: pre-line;
}

.instructions-box {
  background: rgba(0, 0, 0, 0.2);
  border: 1px dashed var(--border-kice);
  border-radius: 6px;
  padding: 12px 18px;
  margin-bottom: 14px;
  font-size: calc(0.88rem * var(--font-scale));
  line-height: 1.6;
  white-space: pre-line;
}
body.b4-paper-mode .instructions-box {
  background: #eae5d7;
}
.instructions-box strong {
  color: var(--accent-gold);
}

/* 키워드 태그 */
.kw-tags-strip {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  align-items: center;
}
.kw-label-tag {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--accent-gold);
}
.kw-pill {
  font-size: calc(0.82rem * var(--font-scale));
  padding: 4px 10px;
  border-radius: 6px;
  background: #0f172a;
  border: 1px solid rgba(251, 191, 36, 0.35);
  color: #fde68a;
  font-weight: 700;
  transition: all 0.2s;
}
body.b4-paper-mode .kw-pill {
  background: #dbd4c0;
  color: #78350f;
  border-color: #b45309;
}
.kw-pill.detected {
  background: rgba(16, 185, 129, 0.25);
  border-color: var(--accent-emerald);
  color: #6ee7b7;
  font-weight: 900;
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.35);
}

/* ================= 1줄씩 손가락으로 보고 바로 따라치기 박스 ================= */
.line-by-line-box {
  background: #09101d;
  border: 1px solid #1e3a5f;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
body.b4-paper-mode .line-by-line-box {
  background: #f5f0e4;
  border-color: #8c826e;
}
.lbl-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-kice);
  font-size: 0.84rem;
  font-weight: 800;
  color: var(--accent-blue);
}
.lbl-row {
  margin-bottom: 12px;
}
.lbl-row:last-child {
  margin-bottom: 0;
}
.lbl-target-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: calc(1.02rem * var(--font-scale));
  font-weight: 700;
  color: #fef08a;
  margin-bottom: 5px;
  padding: 4px 8px;
  background: rgba(251, 191, 36, 0.08);
  border-left: 3px solid var(--accent-gold);
  border-radius: 4px;
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  transition: filter 0.2s;
}
.lbl-target-line.masked-hint {
  filter: blur(7px);
  cursor: pointer;
}
.lbl-target-line.masked-hint:hover {
  filter: blur(0);
}
body.b4-paper-mode .lbl-target-line {
  color: #78350f;
  background: rgba(180, 83, 9, 0.1);
}
.lbl-input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.lbl-input {
  flex: 1;
  background: #050a14;
  border: 1px solid #283a58;
  border-radius: 6px;
  padding: 9px 14px;
  color: #ffffff;
  font-size: calc(1.02rem * var(--font-scale));
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  outline: none;
  transition: all 0.15s;
}
body.b4-paper-mode .lbl-input {
  background: #ffffff;
  color: #111827;
  border-color: #9ca3af;
}
.lbl-input:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
}
.lbl-input.line-ok {
  border-color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.08);
}
.lbl-char-badge {
  font-size: 0.78rem;
  font-weight: 800;
  min-width: 95px;
  text-align: center;
  padding: 6px 8px;
  border-radius: 6px;
  background: #162033;
  color: #94a3b8;
  font-family: 'JetBrains Mono', monospace;
}
body.b4-paper-mode .lbl-char-badge {
  background: #dbd4c0;
  color: #374151;
}
.lbl-char-badge.ok {
  background: rgba(16, 185, 129, 0.2);
  color: var(--accent-emerald);
  border: 1px solid var(--accent-emerald);
}
.lbl-char-badge.over {
  background: rgba(244, 63, 94, 0.2);
  color: var(--accent-rose);
  border: 1px solid var(--accent-rose);
}

/* 족집게 퀴즈 & 핵심키워드 손가락 타이핑 박스 */
.quiz-typing-box {
  margin-top: 12px;
  padding: 12px 16px;
  background: rgba(56, 189, 248, 0.06);
  border: 1px solid rgba(56, 189, 248, 0.3);
  border-radius: 8px;
}
.quiz-q-text {
  font-size: calc(0.92rem * var(--font-scale));
  font-weight: 700;
  color: #e2e8f0;
  margin-bottom: 8px;
}
body.b4-paper-mode .quiz-q-text {
  color: #1f2937;
}
.quiz-a-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.quiz-target-badge {
  background: rgba(251, 191, 36, 0.18);
  border: 1px solid var(--accent-gold);
  color: #fef08a;
  font-weight: 800;
  font-size: calc(0.9rem * var(--font-scale));
  padding: 6px 12px;
  border-radius: 6px;
}
body.b4-paper-mode .quiz-target-badge {
  color: #78350f;
  background: rgba(180, 83, 9, 0.15);
}
.quiz-input {
  flex: 1;
  min-width: 220px;
  background: #050a14;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 7px 12px;
  color: #fff;
  font-size: calc(0.95rem * var(--font-scale));
  font-weight: 700;
}
body.b4-paper-mode .quiz-input {
  background: #fff;
  color: #111827;
}
.quiz-input.match {
  border-color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.15);
  color: #6ee7b7;
}

/* 좌우 2분할 실전 B4 답안지 */
.sheet-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: stretch;
}

@media (max-width: 1024px) {
  .sheet-grid {
    grid-template-columns: 1fr;
  }
}

.sheet-col {
  display: flex;
  flex-direction: column;
}

.sheet-col-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-sub);
}

.b4-typing-sheet {
  width: 100%;
  flex: 1;
  min-height: 170px;
  background-color: #070d18;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(56, 189, 248, 0.38) 40px);
  background-size: 100% 40px;
  background-attachment: local;
  border: 1px solid #1e3a5f;
  border-radius: 6px;
  padding: 0 16px;
  color: #f8fafc;
  font-size: calc(1.05rem * var(--font-scale));
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  line-height: 40px;
  resize: vertical;
  outline: none;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
  transition: border-color 0.2s, box-shadow 0.2s;
}
body.b4-paper-mode .b4-typing-sheet {
  background-color: #faf8f3;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(30, 58, 138, 0.4) 40px);
  border-color: #8c826e;
  color: #111827;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
}
.b4-typing-sheet:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
}
.b4-typing-sheet.error-overflow {
  border-color: var(--accent-rose) !important;
}

.line-status-chip {
  font-size: 0.75rem;
  font-weight: 700;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.chip-item {
  padding: 1px 6px;
  border-radius: 3px;
  background: #1e293b;
  color: #94a3b8;
}
body.b4-paper-mode .chip-item {
  background: #dbd4c0;
  color: #374151;
}
.chip-item.perfect {
  background: rgba(16, 185, 129, 0.2);
  color: var(--accent-emerald);
  border: 1px solid var(--accent-emerald);
}
.chip-item.overflow {
  background: rgba(244, 63, 94, 0.25);
  color: var(--accent-rose);
  border: 1px solid var(--accent-rose);
}

.b4-answer-sheet {
  background-color: #091322;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(251, 191, 36, 0.3) 40px);
  background-size: 100% 40px;
  background-attachment: local;
  border: 1px solid #1e3a5f;
  border-radius: 6px;
  padding: 0 16px;
  color: #fef08a;
  font-size: calc(1.05rem * var(--font-scale));
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  line-height: 40px;
  white-space: pre-line;
  flex: 1;
  user-select: text;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}
body.b4-paper-mode .b4-answer-sheet {
  background-color: #faf5eb;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(180, 83, 9, 0.35) 40px);
  border-color: #8c826e;
  color: #92400e;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
}
.b4-answer-sheet.masked {
  filter: blur(5px);
  user-select: none;
  cursor: pointer;
}

.btn-sheet-mini {
  background: #1e293b;
  border: 1px solid #334155;
  color: #94a3b8;
  font-size: 0.72rem;
  padding: 2px 7px;
  border-radius: 4px;
  cursor: pointer;
}
body.b4-paper-mode .btn-sheet-mini {
  background: #e2dcd0;
  color: #1f2937;
  border-color: #9ca3af;
}
.btn-sheet-mini:hover { background: #38bdf8; color: #000; }

.scoring-eval-bar {
  margin-top: 10px;
  padding: 8px 12px;
  background: #0d1422;
  border: 1px solid #1e293b;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
}
body.b4-paper-mode .scoring-eval-bar {
  background: #eae4d5;
  border-color: #8c826e;
}
.eval-score-text {
  font-weight: 800;
  color: var(--accent-gold);
}

#report-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-box {
  background: #131c2e;
  border: 2px solid #38bdf8;
  border-radius: 12px;
  max-width: 650px;
  width: 100%;
  padding: 24px;
  color: #f8fafc;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8);
}
.modal-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: #38bdf8;
  margin-bottom: 16px;
  border-bottom: 1px solid #22314d;
  padding-bottom: 10px;
}
.report-row {
  margin-bottom: 12px;
}
.report-bar-wrap {
  background: #0a0f1d;
  height: 12px;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 4px;
}
.report-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #0284c7, #10b981);
  width: 0%;
  transition: width 0.5s ease;
}

@media print {
  body { background: #fff !important; color: #000 !important; }
  .kice-exam-header, .sub-bar, .kice55-filter-bar, .nav-strip, .scoring-eval-bar, .header-actions, .btn-sheet-mini, #toast, #report-modal { display: none !important; }
  main { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
  .q-card { border: 2px solid #000 !important; box-shadow: none !important; margin-bottom: 20px !important; page-break-inside: avoid; }
  .q-card-head { background: #f0f0f0 !important; color: #000 !important; border-bottom: 1px solid #000 !important; }
  .b4-typing-sheet, .b4-answer-sheet { background: #fff !important; border: 1px solid #000 !important; color: #000 !important; }
}

#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #10b981;
  color: #fff;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 0.88rem;
  font-weight: 700;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  transform: translateY(10px);
  z-index: 9999;
}
#toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<header class="kice-exam-header">
  <div class="header-inner">
    <div class="brand-section">
      <span class="kice-seal">11.28 결전 마스터</span>
      <h1 class="exam-main-title">2027 임용 만점 템플릿 & 55개 KICE 핵심키워드 4줄 정답 타이핑</h1>
      <span class="examinee-tag">수험자: 변귀섭 대표님</span>
    </div>

    <div class="timer-container">
      <span class="timer-label">잔여 시간</span>
      <span class="timer-digits" id="timer-display">30:00</span>
      <button class="btn-timer" onclick="toggleTimer()" id="btn-timer-toggle">일시정지</button>
      <button class="btn-timer" onclick="resetTimer()">30분 리셋</button>
      <span class="wpm-badge" id="wpm-display">0 타/분</span>
      <button class="btn-asmr" id="btn-asmr" onclick="toggleASMR()">연필소리 OFF</button>
    </div>

    <div class="font-scale-ctrl">
      <button class="btn-font-scale" onclick="adjustFont(-0.05)">A-</button>
      <span style="font-size:0.75rem; color:var(--text-muted);">글꼴</span>
      <button class="btn-font-scale" onclick="adjustFont(0.05)">A+</button>
    </div>

    <div class="round-selector-group">
      <span style="font-size:0.75rem; color:var(--accent-gold); font-weight:800; margin-right:2px;">오늘의 회독:</span>
      <button class="round-btn active" id="round-btn-1" onclick="switchPracticeRound(1)">1회독</button>
      <button class="round-btn" id="round-btn-2" onclick="switchPracticeRound(2)">2회독</button>
      <button class="round-btn" id="round-btn-3" onclick="switchPracticeRound(3)">3회독</button>
    </div>

    <div class="header-actions">
      <button class="btn-kice" onclick="togglePaperMode()" id="btn-paper-mode">B4 시험지 모드</button>
      <button class="btn-kice" onclick="toggleAllMasks()" id="btn-toggle-all">모범답안 가리기</button>
      <button class="btn-kice" onclick="shuffleCurrentPeriod()" id="btn-shuffle">랜덤 셔플</button>
      <button class="btn-kice" onclick="openReportModal()">종합 성적표</button>
      <button class="btn-kice" onclick="window.print()">B4 인쇄</button>
      <button class="btn-kice danger" onclick="clearCurrentAnswers()">현재 탭 비우기</button>
      <button class="btn-kice danger" onclick="clearAllPracticeRoundAnswers()">★ 오늘 전체 지우기</button>
      <button class="btn-kice accent" onclick="exportAnswers()">답안 제출 (TXT)</button>
    </div>
  </div>
</header>

<div class="sub-bar">
  <div class="period-tabs">
    <button class="period-tab-btn highlight-tab active" id="tab-btn-KICE55" onclick="switchPeriod('KICE55')">🔥 11.28 결전: 55개 KICE 키워드 4줄 정답 (55선)</button>
    <button class="period-tab-btn highlight-tab" id="tab-btn-TEMPLATE" onclick="switchPeriod('TEMPLATE')">🎯 임용 만점 4줄 만능 템플릿 (4선)</button>
    <button class="period-tab-btn" id="tab-btn-PED" onclick="switchPeriod('PED')">1교시 교육학 실전 (16제)</button>
    <button class="period-tab-btn" id="tab-btn-A" onclick="switchPeriod('A')">2교시 전공 A형 실전 (12제)</button>
    <button class="period-tab-btn" id="tab-btn-B" onclick="switchPeriod('B')">3교시 전공 B형 실전 (11제)</button>
  </div>
  <div class="filter-group">
    <button class="filter-btn" id="btn-bookmark-filter" onclick="toggleBookmarkFilter()">북마크(★) 모아보기</button>
    <button class="filter-btn" onclick="exportWrongNotes()">단권화 노트 다운</button>
    <div class="status-badge">
      <span class="badge-count" id="progress-count" style="font-weight:900; color:var(--accent-emerald);">0 완료</span>
    </div>
  </div>
</div>

<!-- 55개 KICE 핵심키워드 전용 영역 필터 및 실시간 검색 -->
<div class="kice55-filter-bar" id="kice55-filter-bar">

  <button class="k55-cat-btn" onclick="setK55Category('심리검사', this)">심리검사 (4선)</button>
  <button class="k55-cat-btn" onclick="setK55Category('가족치료', this)">가족치료 (4선)</button>
  <button class="k55-cat-btn" onclick="setK55Category('상담이론', this)">상담이론·성격 (12선)</button>
  <button class="k55-cat-btn" onclick="setK55Category('진로·다문화·위기', this)">진로·다문화·위기·학폭 (4선)</button>
  <input type="text" class="k55-search-input" id="k55-search-input" placeholder="🔍 KICE 키워드·학자명·장애명 즉시 검색..." oninput="renderNav(); renderCards(); loadSavedAnswers();">

<div class="nav-strip" id="nav-strip"></div>

<main id="exam-cards-container"></main>

    <div id="report-content"></div>
    <div style="text-align: right; margin-top: 20px;">
      <button class="btn-kice accent" onclick="closeReportModal()">확인 완료</button>
    </div>
  </div>
</div>

<script>
const dataKICE55 = [{"id": 1, "part": "PED20", "domain": "교육과정 ★0순위", "title": "위긴스와 맥타이 백워드 설계 모형 3단계 (Wiggins & McTighe)", "concept": "1단계 바라는 결과 확인 ➔ 2단계 수락할 만한 증거 결정 ➔ 3단계 학습경험과 수업 계획", "keywords": ["1단계 바라는 결과 확인", "2단계 수락할 만한 증거", "3단계 학습경험과 수업", "영속적 이해"], "lines": ["1단계 바라는 결과 확인은 성취기준을 분석해 영속적 이해와 목표를 세운다.", "2단계 수락할 만한 증거 결정은 수업에 앞서 수행과제와 루브릭을 먼저 짠다.", "3단계 학습경험과 수업 계획은 평가 기준에 맞추어 수업 활동을 체계화한다.", "평가를 수업보다 먼저 설계하여 진도 나가기와 활동 위주의 오류를 극복한다."], "quiz_q": "백워드 설계에서 세부 사실을 잊은 후에도 삶에 오래 남아 전이되는 핵심 대개념은?", "quiz_a": "영속적 이해"}, {"id": 2, "part": "PED20", "domain": "교육과정 ★0순위", "title": "백워드 설계 영속적 이해의 6대 측면 및 WHERETO 수업 원리", "concept": "설명·해석·적용·관점·공감·자기지식 6측면과 본질적 질문 및 WHERETO 원리", "keywords": ["6대 측면", "설명·해석·적용", "관점·공감·자기지식", "WHERETO 원리"], "lines": ["이해의 6대 측면 중 설명은 원리 입증이고 해석은 의미 부여며 적용은 활용이다.", "관점은 비판적 안목이고 공감은 타인 수용이며 자기지식은 자신의 한계 성찰이다.", "본질적 질문은 정답이 열린 개방형 질문으로 학생의 지속적인 탐구를 촉진한다.", "WHERETO 원리는 목표 안내와 흥미 유발 및 탐구와 반성으로 학습을 조직한다."], "quiz_q": "영속적 이해의 6대 측면 중 자신의 무지와 편견 및 이해의 한계를 스스로 성찰하는 측면은?", "quiz_a": "자기지식(자기인식)"}, {"id": 3, "part": "PED20", "domain": "교육과정 ★0순위", "title": "워커(Walker) 자연주의적(숙의) 교육과정 개발 모형 3단계", "concept": "대지(강령) ➔ 숙의(Deliberation) ➔ 설계(Design)의 실제적·기술적 개발 모형", "keywords": ["대지(강령)", "숙의(Deliberation)", "설계(Design)", "기술적 모형"], "lines": ["현장 교사들의 다양한 교육적 관점과 철학적 신념을 공유하는 대지 단계를 거친다.", "제시된 교육 대안들의 장단점을 치열하게 토론하고 합의를 이끄는 숙의를 거친다.", "숙의 과정에서 합의된 최선의 대안을 바탕으로 구체적인 교육 프로그램을 설계한다.", "일방적 처방이 아닌 실제 현장의 민주적 참여를 반영하여 현장 적합성을 높인다."], "quiz_q": "워커의 자연주의적 모형에서 여러 대안의 장단점을 토론하고 논쟁하여 최선의 합의를 도출하는 2단계는?", "quiz_a": "숙의 단계"}, {"id": 4, "part": "PED20", "domain": "교육과정", "title": "스킬벡(Skilbeck) 학교중심 교육과정 개발 모형(SBCD)과 상황분석", "concept": "내적 요인(학생·교사·시설)과 외적 요인(학부모·지역사회) 상황분석 출발 5단계", "keywords": ["상황분석", "외적 요인", "내적 요인", "SBCD"], "lines": ["학교가 처한 내외적 교육 여건을 정밀 진단하는 상황분석에서 개발을 시작한다.", "외적 요인으로 학부모의 요구와 지역사회 특성 및 사회문화적 변화를 분석한다.", "내적 요인으로 학생의 적성과 교사의 전문성 및 학교의 물적 시설을 점검한다.", "상황분석 결과를 토대로 목표를 설정하고 학교 특색에 맞는 SBCD를 구축한다."], "quiz_q": "스킬벡의 학교중심 교육과정 개발 모형(SBCD)에서 목표 설정 이전에 가장 먼저 수행하는 1단계는?", "quiz_a": "상황분석"}, {"id": 5, "part": "PED20", "domain": "교육과정", "title": "타바(Taba) 교사 중심 귀납적 교육과정 개발 모형", "concept": "학습자 요구 진단에서 출발하여 현장 교사가 시험적 단원을 먼저 개발하는 상향식 모형", "keywords": ["학습자 요구 진단", "귀납적(상향식) 모형", "시험적 단원 검증", "현장 적합성"], "lines": ["현장 교사가 수업의 주체가 되어 학생의 학습 요구를 직접 진단하며 출발한다.", "구체적인 교수학습 시험 단원을 먼저 설계하여 실제 교실 현장에서 검증한다.", "검증된 단원을 바탕으로 전체 교육과정으로 일반화하는 상향식 귀납 모형이다.", "국가 교육과정의 획일성을 극복하고 학교 실정에 부합하는 현장 적합성을 높인다."], "quiz_q": "타일러의 연역적 모형과 구별되는 타바 귀납적 교육과정 개발 모형의 1단계 출발점은?", "quiz_a": "학습자의 요구 진단"}, {"id": 6, "part": "PED20", "domain": "교육과정", "title": "아이즈너(Eisner) 예술적 교육과정 모형과 영 교육과정·표현적 결과", "concept": "영 교육과정 점검, 표현적 결과 중시, 교육적 감식안과 교육비평을 통한 질적 평가", "keywords": ["영 교육과정", "표현적 결과", "교육적 감식안", "교육비평"], "lines": ["영 교육과정은 공식 교육과정에서 배제되어 학생이 배울 기회를 잃은 영역이다.", "표현적 결과는 사전 목표 없이 활동 도중이나 후에 형성되는 창의적 산출물이다.", "교육적 감식안은 학생 성취의 미묘한 질적 차이를 감지하는 전문가적 안목이다.", "교육비평은 감식안으로 포착한 교육적 가치를 언어로 공적 표현하는 활동이다."], "quiz_q": "학교에서 공식적으로 가르치지 않아 학생이 학습할 기회를 박탈당한 교육과정의 명칭은?", "quiz_a": "영 교육과정(Null Curriculum)"}, {"id": 7, "part": "PED20", "domain": "교육과정", "title": "파이나(Pinar) 실존적 재개념주의 쿠레레(Currere) 자서전적 방법 4단계", "concept": "회귀(소환) ➔ 전진 ➔ 분석 ➔ 종합의 4단계 성찰을 통한 학습자의 실존적 주체성 회복", "keywords": ["쿠레레(Currere)", "자서전적 방법 4단계", "회귀·전진·분석·종합", "실존적 주체성"], "lines": ["쿠레레(Currere)는 학습자가 생생한 교육 경험을 성찰하여 의미를 찾는다.", "자서전적 4단계는 과거 경험을 회상하는 회귀와 미래를 상상하는 전진으로 간다.", "이어서 과거와 현재 및 미래를 객관적으로 분석한 뒤 통합하는 종합에 이른다.", "외부에서 강요된 지식에서 벗어나 학습자의 내면적 자유와 주체성을 회복한다."], "quiz_q": "파이나(Pinar)의 쿠레레(Currere) 모형에서 제시한 자서전적 성찰 방법 4단계를 순서대로 쓰면?", "quiz_a": "회귀(소환), 전진, 분석, 종합"}, {"id": 8, "part": "PED20", "domain": "교육방법 ★0순위", "title": "플립드 러닝(거꾸로 수업) 수업 전·중·후 3단계 및 교사 역할", "concept": "수업 전 디딤영상 사전학습 ➔ 수업 중 협력적 문제해결·맞춤 비계 ➔ 수업 후 성찰일지", "keywords": ["디딤영상 사전학습", "협력적 문제해결", "맞춤형 비계설정", "성찰일지(메타인지)"], "lines": ["수업 전 단계에서 학생은 온라인 디딤영상을 시청하며 기초 개념을 미리 익힌다.", "수업 중 단계에서는 강의를 배제하고 모둠별 토의와 협력적 문제해결을 수행한다.", "교사는 모둠 활동을 순회 지도하며 오개념을 교정하고 맞춤형 비계를 제공한다.", "수업 후 단계에서는 성찰일지를 작성하여 학습 과정을 점검하고 메타인지를 높인다."], "quiz_q": "플립드 러닝에서 수업 전에 학생이 집에서 기초 개념을 자기주도 학습하도록 제공하는 영상은?", "quiz_a": "디딤영상"}, {"id": 9, "part": "PED20", "domain": "교육방법", "title": "조나센(Jonassen) 구성주의 학습환경(CLEs) 모형과 3대 교수 지원", "concept": "비구조화된 실제적 문제 중심 맥락에 관련 사례·인지적 도구·모델링·코칭·비계 제공", "keywords": ["CLEs", "실제적 문제 맥락", "관련 사례와 인지 도구", "모델링·코칭·비계설정"], "lines": ["학생의 호기심을 자극하는 비구조화된 실제적 문제를 CLEs의 중심에 둔다.", "과거의 유사 경험을 보충하는 관련 사례와 고차적 사고를 돕는 인지 도구를 준다.", "교사는 사고 과정을 보여주는 모델링과 동기를 북돋는 코칭 및 비계를 제공한다.", "동료 학습자와의 사회적 협상을 통해 지식을 자기주도적으로 구성하도록 돕는다."], "quiz_q": "조나센의 구성주의 학습환경(CLEs) 모형에서 학습자를 돕기 위해 교사가 제공하는 3대 지원 활동은?", "quiz_a": "모델링, 코칭, 비계설정"}, {"id": 10, "part": "PED20", "domain": "교육방법", "title": "콜린스(Collins) 인지적 도제 교수법 6단계와 점진적 비계철회(Fading)", "concept": "전문가의 사고 과정 가시화 및 모델링➔코칭➔비계설정➔명료화➔반성➔탐색 6단계", "keywords": ["사고 과정 가시화", "6단계", "명료화·반성·탐색", "점진적 비계철회(Fading)"], "lines": ["인지적 도제 6단계는 전문가의 사고 과정을 가시화하여 관찰하고 모방하게 돕는다.", "전문가의 시범인 모델링과 조언을 주는 코칭 및 비계설정의 순서로 진행한다.", "지식을 언어화하는 명료화와 성찰하는 반성을 거쳐 독자적인 탐색에 도달한다.", "학생의 수행 능력이 향상됨에 따라 교사의 도움을 줄이는 Fading을 적용한다."], "quiz_q": "인지적 도제 교수법 6단계 중 학습자가 배운 지식과 사고 과정을 자신의 언어로 표현하는 단계는?", "quiz_a": "명료화(Articulation)"}, {"id": 11, "part": "PED20", "domain": "교육방법", "title": "메지로우(Mezirow) 변혁적 학습 이론과 렌줄리(Renzulli) 심화학습", "concept": "혼란스러운 딜레마 ➔ 비판적 전제 성찰 ➔ 합리적 담화 ➔ 관점 전환 및 렌줄리 3단계", "keywords": ["혼란스러운 딜레마", "비판적 전제 성찰", "합리적 담화와 관점 전환", "렌줄리 3단계 심화학습"], "lines": ["기존 신념으로 해결되지 않는 혼란스러운 딜레마를 마주하며 학습이 촉발된다.", "자신이 당연시해 온 고정관념과 가정을 의심하는 비판적 전제 성찰을 수행한다.", "타인과의 개방적이고 합리적인 담화를 거쳐 편협한 의미관점의 전환을 이룬다.", "렌줄리 3단계 심화학습은 일반 탐색과 집단 훈련을 거쳐 실제 문제를 연구한다."], "quiz_q": "메지로우의 변혁적 학습에서 자신이 무비판적으로 수용해 온 근본 가정과 편견을 검토하는 과정은?", "quiz_a": "비판적 전제 성찰(비판적 반성)"}, {"id": 12, "part": "PED20", "domain": "교육방법", "title": "켈러(Keller) ARCS 동기설계 모형과 스웰러(Sweller) 인지부하 이론", "concept": "주의·관련성·자신감·만족감 4요소 및 외재적 인지부하 최소화와 전문성 역전 효과 예방", "keywords": ["ARCS 4요소", "주의·관련성·자신감·만족감", "외재적 인지부하 최소화", "전문성 역전 효과"], "lines": ["켈러의 ARCS 모형은 주의집중과 관련성 및 자신감과 만족감 4요소로 구성된다.", "비효율적 교수 설계로 발생하는 외재적 인지부하를 줄여 작동기억 한계를 돕는다.", "여유 인지 자원을 본질적 부하에 집중 투입하여 장기기억 스키마 형성을 돕는다.", "초보자에게 유익한 안내가 숙련자에게는 방해가 되는 전문성 역전을 예방한다."], "quiz_q": "스웰러의 인지부하 이론에서 초보자에게 효과적인 상세 안내가 숙련자에게는 오히려 방해가 되는 현상은?", "quiz_a": "전문성 역전 효과"}, {"id": 13, "part": "PED20", "domain": "교육평가 ★0순위", "title": "비고츠키 근접발달영역(ZPD) 기반 역동적 평가 (3단계 측정)", "concept": "사전검사 ➔ 교수 개입(비계설정) ➔ 사후 재검사의 3단계 상호작용으로 잠재력 측정", "keywords": ["ZPD", "3단계", "평가와 교수의 유기적 통합", "잠재적 발달수준"], "lines": ["혼자 해결하는 실제적 발달과 도움받아 도달하는 잠재적 발달 간극인 ZPD를 본다.", "결과만 재는 정적 평가를 넘어 사전검사와 중재 및 재검사의 3단계를 거친다.", "평가 도중 교사가 힌트와 비계설정을 제공하는 평가와 교수의 유기적 통합이다.", "상호작용적 평가를 통해 학생의 숨겨진 학습 잠재력과 미래 성장 가능성을 본다."], "quiz_q": "정적 평가와 달리 [사전검사 ➔ 비계 중재 ➔ 사후 재검사]의 3단계로 잠재적 발달수준을 측정하는 평가는?", "quiz_a": "역동적 평가"}, {"id": 14, "part": "PED20", "domain": "교육평가 ★0순위", "title": "성장참조평가(2회 측정 향상도) vs 능력참조평가 및 성취평가제", "concept": "사전 대비 사후 향상도를 재는 성장참조평가와 잠재 능력 발휘도를 재는 능력참조평가", "keywords": ["2번 측정", "성장참조평가", "능력참조평가", "준거참조평가"], "lines": ["수업 전 사전 수준과 수업 후 도달 수준을 2번 측정하여 향상도를 평가한다.", "타인과의 서열 경쟁을 벗어나 개별적 향상도를 측정하는 성장참조평가를 쓴다.", "자신의 잠재적 능력에 비추어 최선을 다했는가를 살피는 능력참조평가를 쓴다.", "성취기준 도달 여부를 확인하는 준거참조평가와 연계하여 자아효능감을 키운다."], "quiz_q": "수업 시작 전 초기 성취수준과 수업 후 최종 성취수준을 비교하여 향상도를 측정하는 평가 유형은?", "quiz_a": "성장참조평가"}, {"id": 15, "part": "PED20", "domain": "교육평가 ★0순위", "title": "다차원 수행평가 루브릭(분석적 vs 총체적)과 메이거 행동적 목표", "concept": "평가 준거·성취 수준·척도 기술어 3대 요소와 사전 공유를 통한 메타인지 및 신뢰도 제고", "keywords": ["3대 구성 요소", "평가준거·성취수준·척도기술어", "분석적 루브릭", "메이거 3요소"], "lines": ["루브릭의 3대 구성 요소는 평가 준거와 성취 수준 및 구체적인 척도 기술어다.", "분석적 루브릭은 세부 영역별 강약점을 진단하여 학생 맞춤형 피드백을 준다.", "평가 전에 루브릭을 사전 공유하여 도달할 목표를 알리고 자기조절학습을 돕는다.", "메이거의 3요소 진술에 따라 조건과 도착점 행동 및 수락 기준을 명확히 적는다."], "quiz_q": "루브릭을 구성하는 3대 핵심 요소를 공식 명칭으로 쓰면?", "quiz_a": "평가 준거, 성취 수준, 척도 기술어"}, {"id": 16, "part": "PED20", "domain": "교육평가", "title": "형성평가 교정 피드백 3요소와 스크리븐(Scriven) 탈목표 평가", "concept": "목표안내(Feed-Up)·현재점검(Feed-Back)·개선경로(Feed-Forward) 및 부수적 효과 평가", "keywords": ["피드업·피드백·피드포워드", "서술형 교정 피드백", "탈목표 평가", "부수적 효과 검증"], "lines": ["피드업으로 목표를 안내하고 피드백으로 성취를 점검하며 피드포워드로 이끈다.", "단순 점수 통보를 지양하고 오개념 교정과 개선 방향을 담은 서술형으로 준다.", "스크리븐의 탈목표 평가는 의도된 목표에 얽매이지 않고 실제 나타난 효과를 본다.", "프로그램이 산출한 의도하지 않은 긍정적 및 부정적 부수 효과까지 종합 판정한다."], "quiz_q": "프로그램의 의도된 목표에 구속되지 않고 의도하지 않은 부수적 효과까지 종합 평가하는 모형은?", "quiz_a": "탈목표 평가 모형"}, {"id": 17, "part": "PED20", "domain": "교육행정 ★0순위", "title": "세르지오바니(Sergiovanni) 도덕적 리더십과 학교 공동체 구축", "concept": "관료적 통제를 넘어 도덕적 권위와 전문적 책무성으로 교사를 자기지도자로 육성", "keywords": ["도덕적 리더십", "자기지도자(Self-leader)", "도덕적 공동체", "전문적 책무성"], "lines": ["지시와 통제의 관료적 권위를 벗어나 전문성과 도덕성을 바탕으로 지도한다.", "구성원을 수동적 추종자가 아닌 주체적인 자기지도자로 키우는 리더십이다.", "공유된 도덕적 가치와 교육적 사명감을 바탕으로 학교 공동체를 구축한다.", "외적 통제 없이도 교사들의 내적 동기와 자발적인 헌신을 이끌어내 혁신한다."], "quiz_q": "세르지오바니 이론에서 도덕성과 전문성을 바탕으로 교사를 자기지도자로 성장시키는 지도성은?", "quiz_a": "도덕적 리더십"}, {"id": 18, "part": "PED20", "domain": "교육행정 ★0순위", "title": "겟젤스와 구바(Getzels & Guba) 사회체계 모형 (규범적 vs 개인적 차원)", "concept": "제도·역할·기대(규범적 차원)와 개인·인성·욕구성향(개인적 차원)의 조화 및 거래적 지도성", "keywords": ["규범적 차원", "개인적 차원", "역할 갈등", "거래적 지도성"], "lines": ["규범적 차원은 학교라는 제도와 그 제도가 부여하는 공식적 역할과 기대이다.", "개인적 차원은 학교 조직 내 개인과 고유한 인성 및 심리적 욕구 성향이다.", "사회적 행동은 규범적 역할 기대와 개인적 욕구 성향의 상호작용으로 일어난다.", "관리자는 상황에 따라 규범과 개인을 조화시키는 거래적 지도성을 발휘한다."], "quiz_q": "겟젤스와 구바의 사회체계 모형에서 사회적 행동을 결정하는 2대 차원의 공식 명칭은?", "quiz_a": "규범적 차원, 개인적 차원"}, {"id": 19, "part": "PED20", "domain": "교육행정", "title": "호이와 타터(Hoy & Tarter) 참여적 의사결정 모형 (수용 영역)", "concept": "관련성 검증과 전문성 검증을 통해 수용 영역을 판별하고 신뢰도에 따라 참여 결정", "keywords": ["수용 영역", "관련성 검증", "전문성 검증", "신뢰도와 참여 유형"], "lines": ["수용 영역은 교사가 행정적 결정을 의문 없이 무비판적으로 받아들이는 범위다.", "수용 영역을 판별하는 핵심 기준은 이해관계인 관련성과 지식인 전문성이다.", "사안이 수용 영역 밖에 있을 때는 교사를 의사결정 과정에 적극 참여시킨다.", "교사의 조직 목표 헌신도인 신뢰도를 평가하여 민주적 합의나 자문을 택한다."], "quiz_q": "호이와 타터 모형에서 사안이 교사의 수용 영역 밖인지 판별하는 2대 검증 기준은?", "quiz_a": "관련성 검증, 전문성 검증"}, {"id": 20, "part": "PED20", "domain": "교육행정", "title": "민츠버그 전문적 관료제·이완결합체제 및 임상장학·동료장학(PLC)", "concept": "교사 간 단절(이완결합)을 극복하기 위한 전문적 학습공동체(PLC)와 임상·동료장학", "keywords": ["전문적 관료제", "이완결합체제", "임상장학 3단계", "PLC"], "lines": ["학교는 교사의 수업 자율성이 높은 전문적 관료제이자 유연한 이완결합체제다.", "교사 간 고립과 단절을 극복하기 위해 전문적 학습공동체(PLC)를 구축한다.", "임상장학은 계획 협의와 수업 관찰 및 피드백 협의의 3단계로 수업을 돕는다.", "동료장학은 동료 교사 간 수업을 공개하고 협의하며 교수 전문성을 함께 나눈다."], "quiz_q": "교사의 수업 개선을 위해 [계획 협의 ➔ 수업 관찰 ➔ 피드백 협의] 3단계로 진행되는 장학은?", "quiz_a": "임상장학"}, {"id": 21, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "강박장애(OCD) vs 강박성 성격장애(OCPD) 및 노출 및 반응방지(ERP)", "concept": "자아 이질적(강박장애) vs 자아 동질적(강박성 성격장애) 감별 및 강박행동 소거", "keywords": ["강박장애(OCD)", "강박성 성격장애(OCPD)", "자아 이질적", "노출 및 반응방지(ERP)"], "lines": ["내담자 진숙의 공식 진단명은 강박장애이며 진수는 강박성 성격장애이다.", "진숙은 자아 이질적 특성이며 진수는 완벽주의를 당연시하는 자아 동질적이다.", "진숙에게 적용할 행동 치료적 기법의 명칭은 노출 및 반응방지(ERP)이다.", "자극에 노출시킨 후 강박행동을 차단하여 불안이 자연 소거되도록 돕는다."], "quiz_q": "강박사고를 비합리적이고 고통스럽게 여기는 강박장애의 자아 특성과 대표적 행동치료 기법은?", "quiz_a": "자아 이질적, 노출 및 반응방지(ERP)"}, {"id": 22, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "공황장애(클라크의 파국적 오해석) 및 내수용성 노출과 광장공포증", "concept": "사소한 신체 감각의 파국적 오해석 교정 및 내수용성 노출을 통한 둔감화", "keywords": ["파국적 오해석", "내수용성 노출", "광장공포증", "공황장애"], "lines": ["밑줄 친 반응의 공식 명칭은 신체 감각을 위험으로 여기는 파국적 오해석이다.", "무해한 생리적 각성을 파멸로 잘못 해석하여 극심한 공포가 악순환 증폭된다.", "신체 감각에 직접 직면하게 하는 행동 기법의 명칭은 내수용성 노출이다.", "즉각 탈출하기 어려운 장소를 지속적으로 회피하는 병명은 광장공포증이다."], "quiz_q": "공황장애 치료에서 의도적으로 과호흡이나 제자리 회전 등 신체 감각을 유발해 둔감화하는 기법은?", "quiz_a": "내수용성 노출"}, {"id": 23, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "신체증상장애 vs 질병불안장애 감별 진단 및 확인 행동", "concept": "실제 고통스러운 신체증상 유무에 따른 감별 및 병원을 전전하는 확인 행동", "keywords": ["신체증상장애", "질병불안장애", "신체 통증 증상", "확인 행동"], "lines": ["내담자 훈이의 공식 진단명은 신체증상장애이며 병철은 질병불안장애이다.", "훈이는 실제로 일상생활에 지장을 주는 고통스러운 신체 통증 증상이 지속된다.", "병철은 뚜렷한 신체 증상이 없음에도 불치병에 걸렸다는 집착과 불안에 몰두한다.", "병철은 의사의 정상 소견에도 불구하고 여러 병원을 전전하는 확인 행동을 보인다."], "quiz_q": "뚜렷한 신체 증상이 없거나 경미함에도 중병에 걸렸다는 공포에 사로잡혀 병원을 전전하는 장애는?", "quiz_a": "질병불안장애"}, {"id": 24, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "사회적(실용적) 의사소통장애 vs 자폐스펙트럼장애 감별 진단", "concept": "제한적이고 반복적인 행동 패턴(상동증) 유무 및 화용론적 언어 결함 감별", "keywords": ["사회적 의사소통장애", "자폐스펙트럼장애", "제한적이고 반복적인 행동", "화용론적"], "lines": ["학생 진호의 진단명은 사회적 의사소통장애이며 민우는 자폐스펙트럼장애이다.", "두 장애를 구별하는 결정적 감별점은 제한적이고 반복적인 행동 패턴의 유무이다.", "민우는 상동 행동과 집착을 동반하지만 진호는 제한적이고 반복적인 행동이 없다.", "진호는 사회적 맥락에 맞게 소통하는 화용론적 언어 사용 기능에서 결함을 보인다."], "quiz_q": "사회적 맥락에 맞는 화용론적 의사소통 결함은 있으나 제한적이고 반복적인 상동 행동이 없는 장애는?", "quiz_a": "사회적(실용적) 의사소통장애"}, {"id": 25, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "주의력결핍 과잉행동장애(ADHD) 만 12세 발병 기준 및 3대 하위 유형", "concept": "만 12세 이전 발병, 2개 이상 환경 기능 손상, 복합형 및 주의력 결핍 우세형 감별", "keywords": ["만 12세 이전", "2개 이상의 장면", "복합형", "주의력 결핍 우세형"], "lines": ["만 12세 이전에 발병하여 2개 이상의 장면에서 지속적인 기능 손상을 보인다.", "부주의와 과잉행동 및 충동성 기준을 모두 충족하는 복합형으로 진단한다.", "부주의 증상만 두드러지게 나타나는 유형은 주의력 결핍 우세형으로 감별한다.", "행동 수정 기법과 인지행동치료를 함께 적용하여 자기조절 능력을 강화한다."], "quiz_q": "DSM-5-TR에서 주의력결핍 과잉행동장애(ADHD)의 증상이 시작되어야 하는 공식 기준 연령은?", "quiz_a": "만 12세 이전"}, {"id": 26, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "적대적 반항장애(ODD) vs 품행장애(CD 아동기 발병형) 감별 진단", "concept": "타인의 권리 침해 및 규칙 위반 유무와 만 10세 이전 아동기 발병형의 반사회성 예후", "keywords": ["적대적 반항장애", "품행장애", "만 10세 이전 아동기 발병형", "부모 관리 훈련"], "lines": ["권위자에게 반항하지만 타인의 권리를 침해하지 않는 적대적 반항장애이다.", "타인의 권리와 규칙을 반복적으로 위반하며 공격성을 보이는 품행장애이다.", "만 10세 이전에 발병하는 아동기 발병형은 성인기 반사회성으로 쉽게 진행된다.", "친사회적 정서 결여를 조기에 선별하고 부모 관리 훈련과 행동치료를 쓴다."], "quiz_q": "품행장애 중 만 10세 이전에 발병하며 공격성이 높고 성인기 반사회성 성격장애로 진행될 위험이 높은 유형은?", "quiz_a": "아동기 발병형"}, {"id": 27, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "반응성 애착장애(RAD) vs 탈억제 사회관여 장애(DSED) 감별 진단", "concept": "영유아기 극심한 방임 후 정서적 위축(반응성) vs 낯선 성인 무경계 접근(탈억제)", "keywords": ["반응성 애착장애", "탈억제 사회관여 장애", "지속적인 방임", "1차 돌봄 환경"], "lines": ["고통 속에서도 위로를 구하지 않고 위축된 반응성 애착장애를 진단한다.", "낯선 성인에게 경계 없이 과도하게 다가가는 탈억제 사회관여 장애이다.", "두 장애 모두 영유아기 양육자의 지속적인 정서적 방임과 결핍에서 비롯된다.", "안정적인 1차 돌봄 환경을 구축하고 일관되고 안전한 치료적 애착을 맺는다."], "quiz_q": "영유아기 방임 후 낯선 성인에게 전혀 주저함이나 경계심 없이 과도하게 친밀하게 다가가는 장애는?", "quiz_a": "탈억제 사회관여 장애"}, {"id": 28, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "외상후 스트레스 장애(PTSD) vs 급성 스트레스 장애(ASD) 감별 진단", "concept": "침습·회피·인지기분·각성 4대 증상군 및 1개월 지속 기간 분기점과 EMDR 치료", "keywords": ["침습과 회피", "3일에서 1개월", "1개월 이상", "EMDR"], "lines": ["외상 사건을 재경험하는 침습과 고통스러운 기억을 회피하는 양상을 보인다.", "증상이 외상 후 3일에서 1개월 이내 지속되는 장애는 급성 스트레스 장애이다.", "핵심 증상이 1개월 이상 지속되어 기능 손상을 주는 외상후 스트레스 장애이다.", "안정화 기법과 안구운동 민감소실 및 재처리 치료(EMDR)로 회복을 돕는다."], "quiz_q": "급성 스트레스 장애(3일~1개월)와 외상후 스트레스 장애(1개월 이상)를 가르는 결정적 기간 기준은?", "quiz_a": "1개월"}, {"id": 29, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "해리성 기억상실(해리성 둔주) vs 해리성 정체성 장애 및 인격 통합", "concept": "기억 상실 후 방황하는 해리성 둔주와 2개 이상의 하위 인격을 1개로 통합하는 치료", "keywords": ["해리성 기억상실", "해리성 정체성 장애", "해리성 둔주", "2개 이상의 인격"], "lines": ["내담자 민석의 진단명은 해리성 기억상실이며 지우는 해리성 정체성 장애이다.", "민석은 자신의 과거를 기억하지 못하고 방황하는 해리성 둔주를 동반한다.", "지우는 한 사람의 내면에 2개 이상의 구별되는 뚜렷한 하위 인격을 나타낸다.", "분리된 여러 하위 인격들을 조화롭게 화해시켜 1개의 온전한 자아로 통합한다."], "quiz_q": "해리성 기억상실 내담자가 외상 후 과거와 정체성을 잊은 채 예정에 없던 여행이나 방황을 하는 양상은?", "quiz_a": "해리성 둔주"}, {"id": 30, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "경계선 성격장애 vs 의존성 성격장애 및 분열 방어기제와 DBT", "concept": "이상화와 평가절하를 오가는 분열 기제(경계선) vs 순종·굴종(의존성) 및 DBT", "keywords": ["경계선 성격장애", "의존성 성격장애", "분열 방어기제", "변증법적 행동치료(DBT)"], "lines": ["진희는 경계선 성격장애이며 수연은 의존성 성격장애로 각각 감별 진단한다.", "진희는 타인을 극단적 이상화와 평가절하로 분리하는 분열 방어기제를 쓴다.", "수연은 버림받지 않기 위해 타인에게 과도하게 굴종하고 수동적으로 순종한다.", "수용과 변화를 통합하여 정서 조절을 돕는 변증법적 행동치료(DBT)를 쓴다."], "quiz_q": "경계선 성격장애 내담자가 타인을 극단적 이상화와 극단적 평가절하의 양극단으로 나누는 방어기제는?", "quiz_a": "분열(분할)"}, {"id": 31, "part": "COUNSEL35", "domain": "DSM-5-TR 감별진단", "title": "조현성 성격장애 vs 회피성 성격장애 감별 진단", "concept": "타인과의 친밀감 욕구 결여·무관심(조현성) vs 친밀감 갈망·거절 공포(회피성)", "keywords": ["조현성 성격장애", "회피성 성격장애", "친밀감 욕구 결여", "부정적 평가 두려움"], "lines": ["내담자 철수는 조현성 성격장애이며 영희는 회피성 성격장애로 감별한다.", "철수는 친밀한 관계에 대한 욕구가 전혀 없고 칭찬이나 비난에 무관심하다.", "영희는 친밀한 관계를 간절히 원하지만 거절과 비판이 두려워 관계를 피한다.", "영희의 부정적 평가 두려움을 낮추고 단계적인 사회적 기술 훈련을 실시한다."], "quiz_q": "사회적 고립을 보이지만 회피성 성격장애와 달리 친밀한 관계 형성 욕구 자체가 전혀 없는 성격장애는?", "quiz_a": "조현성 성격장애"}, {"id": 32, "part": "COUNSEL35", "domain": "심리검사", "title": "MMPI-2-RF 자살/죽음 사고 척도(SUI) 및 비밀보장 예외 위기개입", "concept": "SUI 고위험 상승 시 즉각적 자살 실행 위험 평가 및 비밀보장 예외 학부모·병원 연계", "keywords": ["자살/죽음 사고 척도(SUI)", "T점수 82점", "비밀보장의 예외", "위기관리위원회"], "lines": ["즉각적인 생명 위협을 나타내는 척도는 자살/죽음 사고 척도(SUI)이다.", "T점수 82점은 구체적인 자살 사고와 자살 실행 위험성이 극도로 임박함을 뜻한다.", "자살 위기는 비밀보장의 예외 사안이므로 보호자에게 사실을 즉각 통보한다.", "위기관리위원회를 소집하고 전문 의료기관으로 긴급 연계하여 안전을 지킨다."], "quiz_q": "MMPI-2-RF에서 즉각적인 자살 충동과 죽음 사고를 측정하여 최우선 위기개입을 요하는 척도는?", "quiz_a": "자살/죽음 사고 척도(SUI)"}, {"id": 33, "part": "COUNSEL35", "domain": "심리검사", "title": "MMPI-2-RF 상위차원(EID·THD·BXD) 및 재구성임상척도(RCd·RC1·RC3)", "concept": "정서적 내재화·사고 역기능·행동적 외현화 및 의기소침(RCd)·신체증상(RC1)·냉소(RC3)", "keywords": ["EID·THD·BXD", "의기소침 척도(RCd)", "사고 역기능(THD)", "행동적 외현화(BXD)"], "lines": ["상위차원 척도는 정서적 내재화(EID)와 사고 역기능(THD) 및 BXD가 있다.", "의기소침 척도(RCd)는 전반적인 정서적 불편감과 절망감 및 무기력을 잰다.", "사고 역기능 척도(THD)는 망상과 환각 등 와해된 정신증적 사고를 측정한다.", "행동적 외현화 척도(BXD)는 충동 조절 실패와 물질 남용 및 행동화를 잰다."], "quiz_q": "MMPI-2-RF 재구성임상척도 중 전반적인 사기 저하, 절망감, 정서적 불편감을 측정하는 척도는?", "quiz_a": "의기소침 척도(RCd)"}, {"id": 34, "part": "COUNSEL35", "domain": "심리검사", "title": "로샤 종합체계 경험균형(외향형) 및 D점수 스트레스 과부하", "concept": "인간운동반응(M)보다 유색반응(WSumC)이 높은 외향형 및 D점수 음수(-2) 과부하", "keywords": ["인간운동반응(M)", "유색반응(WSumC)", "외향형", "D점수 과부하"], "lines": ["인간운동반응(M)보다 유색반응(WSumC)이 높으므로 대처 유형은 외향형이다.", "외부의 정서적 자극에 민감하게 반응하고 행동 중심의 문제해결을 우선 시도한다.", "D점수가 음수인 상태는 내적 가용 자원보다 스트레스가 큰 과부하 상태이다.", "충동적 행동화와 통제력 상실을 방지하기 위해 스트레스를 줄이고 지지를 준다."], "quiz_q": "로샤 검사에서 가용 자원(EA)보다 경험 자극(es)이 훨씬 커서 D점수가 음수(-2)로 나타난 심리 상태는?", "quiz_a": "스트레스 과부하 상태"}, {"id": 35, "part": "COUNSEL35", "domain": "심리검사", "title": "웩슬러 지능검사 일반능력지수(GAI)·인지효능지수(CPI) 및 TCI 검사", "concept": "작업기억·처리속도 저하 시 순수 인지 잠재력인 일반능력지수(GAI) 확인 및 TCI 자율성·연대감", "keywords": ["일반능력지수(GAI)", "TCI", "자극추구와 위험회피", "자율성과 연대감"], "lines": ["불안과 주의력 저하로 작업기억과 처리속도가 낮아지면 일반능력지수(GAI)를 본다.", "TCI에서 자극추구가 높고 위험회피가 낮으면 강한 호기심과 충동성을 보인다.", "성숙도와 사회적 적응을 결정하는 핵심 성격 척도는 자율성과 연대감이다.", "자기 행동을 책임지는 자율성과 타인을 수용하는 연대감을 함께 길러준다."], "quiz_q": "웩슬러 지능검사에서 작업기억과 처리속도의 감점을 배제하고 순수한 고차적 인지 잠재력을 보는 지수는?", "quiz_a": "일반능력지수(GAI)"}, {"id": 36, "part": "COUNSEL35", "domain": "가족치료", "title": "보웬 다세대 가족치료 삼각관계·탈삼각화 및 자기분화", "concept": "부부 불안에 자녀를 끌어들이는 삼각관계 해체 및 상담자의 정서적 중립성과 탈삼각화", "keywords": ["삼각관계", "신체화 증상", "정서적 중립성", "탈삼각화"], "lines": ["부부 사이의 갈등에 자녀를 끌어들이는 가족 역동의 명칭은 삼각관계이다.", "자녀는 부모 사이의 불안을 흡수하여 복통이라는 신체화 증상을 나타낸다.", "상담자는 부모 어느 한쪽에도 치우치지 않고 객관적 정서적 중립성을 지킨다.", "자녀를 부모의 갈등에서 분리하여 자율성을 주는 개입 기법은 탈삼각화이다."], "quiz_q": "보웬 가족치료에서 부부 갈등에 얽힌 자녀를 분리하고 상담자가 정서적 중립성을 유지하는 핵심 개입은?", "quiz_a": "탈삼각화"}, {"id": 37, "part": "COUNSEL35", "domain": "가족치료", "title": "미누친 구조적 가족치료 밀착·유리 경계선 및 실연화(Enactment)", "concept": "밀착된 경계선과 유리된 경계선을 명확한 경계선으로 교정하기 위한 상담실 내 실연화", "keywords": ["밀착된 경계선", "유리된 경계선", "실연화(Enactment)", "명확한 경계선"], "lines": ["어머니와 아들은 밀착된 경계선이며 아버지는 가족과 유리된 경계선이다.", "상담실에서 실제 가족의 갈등 행동을 재연하게 하는 기법은 실연화이다.", "설명으로 듣는 대신 상호작용 패턴을 현장에서 있는 그대로 직접 관찰한다.", "역기능적 의사소통 구조를 교정하고 세대 간 명확한 경계선을 재형성한다."], "quiz_q": "미누친의 구조적 가족치료에서 상담실 안에서 가족의 갈등 대화를 지금-여기에서 직접 재연하게 하는 기법은?", "quiz_a": "실연화(Enactment)"}, {"id": 38, "part": "COUNSEL35", "domain": "가족치료", "title": "사티어 경험적 가족치료 역기능적 의사소통과 일치형 및 가족조각", "concept": "회유형·비난형·초이성형·산만형을 자기·타인·상황을 모두 존중하는 일치형으로 변화", "keywords": ["회유형과 초이성형", "일치형 의사소통", "자기와 타인 존중", "가족조각 기법"], "lines": ["자기를 무시하고 타인에게만 맞추는 회유형과 논리만 따지는 초이성형을 본다.", "가족 간 정서적 거리와 역동을 신체 자세와 공간 배치로 표현하는 가족조각이다.", "언어적 방어를 우회하여 가족 내 숨겨진 역동과 억압된 감정을 생생히 직면한다.", "자기와 타인 및 상황을 모두 존중하는 성숙한 일치형 의사소통으로 변화시킨다."], "quiz_q": "사티어 경험적 가족치료에서 자기, 타인, 상황의 3요소를 모두 균형 있게 존중하는 가장 건강한 의사소통 유형은?", "quiz_a": "일치형"}, {"id": 39, "part": "COUNSEL35", "domain": "가족치료", "title": "헤일리 전략적 가족치료 역설적 지시와 밀란 모델 순환적 질문", "concept": "증상 행동을 고의로 처방하여 통제력을 회복하는 역설적 지시와 관계 차이를 묻는 순환적 질문", "keywords": ["역설적 지시", "증상 처방", "긍정적 의미 부여", "순환적 질문"], "lines": ["문제 행동을 오히려 의도적으로 수행하게 처방하는 기법은 역설적 지시이다.", "가족의 저항을 무너뜨리고 증상이 스스로 통제 가능함을 깨닫게 하여 변화시킨다.", "문제 행동이 가족의 화합을 지키려는 선한 의도라고 재명명하여 비난을 줄인다.", "가족 구성원 간 관계의 차이와 상호작용 고리를 스스로 깨닫는 순환적 질문을 쓴다."], "quiz_q": "전략적 가족치료에서 내담자 가족의 저항을 다루기 위해 문제 증상을 일부러 계속하라고 지시하는 기법은?", "quiz_a": "역설적 지시(증상 처방)"}, {"id": 40, "part": "COUNSEL35", "domain": "상담이론", "title": "빅터 프랑클 의미치료 탈숙고(Dereflection) 및 역설적 의도", "concept": "과잉 숙고 차단 및 외부의 가치로 주의를 돌리는 탈숙고와 예기불안을 깨는 역설적 의도", "keywords": ["탈숙고(Dereflection)", "불안 악순환 차단", "역설적 의도", "증상 통제"], "lines": ["증상에 대한 주의를 외부 가치로 돌리는 기법은 탈숙고(Dereflection)다.", "지나친 반성으로 생기는 불안 악순환을 차단하여 자발성을 되찾게 한다.", "두려워하는 증상을 스스로 의도하여 증상을 통제하는 기법은 역설적 의도이다.", "회피하려던 증상을 직면하게 함으로써 증상이 스스로 통제됨을 깨닫게 한다."], "quiz_q": "프랑클의 의미치료에서 증상에 대한 과잉 숙고를 차단하고 외부의 의미 있는 가치로 주의를 돌리는 기법은?", "quiz_a": "탈숙고(Dereflection)"}, {"id": 41, "part": "COUNSEL35", "domain": "상담이론", "title": "아론 벡 인지치료 인지적 오류(이분법·재앙화) 및 하향 화살표 기법", "concept": "표면적 자동적 사고에서 연속 질문을 통해 기저의 핵심 신념을 파헤치는 하향 화살표 기법", "keywords": ["이분법적 사고", "재앙화", "하향 화살표 기법", "역기능적 신념"], "lines": ["사례의 1번 오류는 이분법적 사고이며 2번은 파국적 결과를 예상하는 재앙화다.", "핵심 신념을 체계적으로 탐색하기 위해 사용한 기법은 하향 화살표 기법이다.", "자동적 사고의 기저에 깔려 있는 역기능적 신념을 단계별로 파헤쳐 확인한다.", "만약 그 생각이 사실이라면 그것이 무엇을 의미하는지 질문하여 밝혀낸다."], "quiz_q": "표면적인 자동적 사고에 대해 '그것이 사실이라면 당신에게 어떤 의미인가요?'라고 물어 핵심 신념을 찾는 기법은?", "quiz_a": "하향 화살표 기법"}, {"id": 42, "part": "COUNSEL35", "domain": "상담이론", "title": "엘리스 합리적 정서행동치료(REBT) 3대 논박 및 수치심 공격 연습", "concept": "논리적·실증적·실용적 논박을 통한 당위적 신념 해체 및 수치심 공격 연습", "keywords": ["REBT", "실증적 논박", "실용적 논박", "논리적 논박"], "lines": ["REBT에서 비합리적 신념을 뒷받침하는 객관적 사실 증거를 묻는 실증적 논박이다.", "신념을 고수하는 것이 실제 삶에 어떤 도움이 되는지 묻는 실용적 논박이다.", "전제와 결론 사이의 비논리적 비약과 모순을 지적하는 논리적 논박을 한다.", "타인의 시선에 대한 파국적 두려움을 깨뜨리는 수치심 공격 연습을 실천한다."], "quiz_q": "엘리스의 REBT에서 내담자의 비합리적 신념이 객관적 현실 증거와 사실에 부합하는지 따져 묻는 논박은?", "quiz_a": "실증적(경험적) 논박"}, {"id": 43, "part": "COUNSEL35", "domain": "상담이론", "title": "수용전념치료(ACT) 인지적 탈융합 및 기꺼이 경험하기와 전념 행동", "concept": "생각과 자신을 분리하여 언어적 사건으로 관찰하는 인지적 탈융합과 가치 전념 행동", "keywords": ["ACT", "인지적 융합", "인지적 탈융합", "기꺼이 경험하기"], "lines": ["ACT에서 내담자가 생각과 자신을 동일시하는 인지적 융합에서 벗어나게 돕는다.", "생각은 단지 지나가는 언어적 사건일 뿐임을 깨닫는 인지적 탈융합을 쓴다.", "불안과 고통을 회피하지 않고 있는 그대로 품는 기꺼이 경험하기를 실천한다.", "자신이 소중히 여기는 가치를 명료화하고 구체적인 전념 행동을 이행한다."], "quiz_q": "수용전념치료(ACT)에서 부정적 생각과 현실의 동일시에서 벗어나 생각을 일시적 언어 사건으로 바라보는 기법은?", "quiz_a": "인지적 탈융합"}, {"id": 44, "part": "COUNSEL35", "domain": "상담이론", "title": "펄스 게슈탈트 상담 접촉경계혼란 반전(Retroflection) 및 빈의자 기법", "concept": "타인에게 향할 공격성을 자신에게 돌리는 반전과 양극성 통합을 위한 빈의자 기법", "keywords": ["반전", "빈의자 기법", "승리자와 패배자", "자기 통합"], "lines": ["원래 타인에게 하고 싶었던 행동을 자신에게 돌리는 접촉경계혼란은 반전이다.", "내면의 양극성을 대화시켜 해소하는 게슈탈트 상담 기법은 빈의자 기법이다.", "자신을 자책하는 승리자와 억압된 패배자가 서로 솔직하게 대면하게 한다.", "소외되었던 부정적 감정을 수용하고 온전한 자기 통합을 이루도록 돕는다."], "quiz_q": "게슈탈트 상담에서 타인에게 표출하고 싶었던 분노를 자기 자신에게 돌려 자해·자책하는 접촉경계혼란은?", "quiz_a": "반전(Retroflection)"}, {"id": 45, "part": "COUNSEL35", "domain": "상담이론", "title": "글래서 현실치료 전행동(Total Behavior) 및 WDEP 자기평가 단계", "concept": "좋은 세계의 바람 탐색, 전행동 확인, 현재 행동의 유용성을 점검하는 자기평가와 계획", "keywords": ["좋은 세계", "전행동", "WDEP 자기평가", "실천 계획"], "lines": ["내담자의 좋은 세계에 담긴 구체적인 바람과 욕구를 탐색하도록 돕는다.", "자신의 바람을 채우기 위해 현재 무엇을 하고 있는지 전행동을 탐색한다.", "현실치료 WDEP 중 현재 행동이 바람 달성에 도움이 되는지 스스로 자기평가한다.", "자신이 직접 통제할 수 있는 구체적이고 실현 가능한 실천 계획을 세운다."], "quiz_q": "현실치료 WDEP 절차 중 현재 행동이 자신이 원하는 바람을 얻는 데 도움이 되는지 스스로 판단하게 하는 단계는?", "quiz_a": "자기평가(Evaluation) 단계"}, {"id": 46, "part": "COUNSEL35", "domain": "상담이론", "title": "해결중심 단기상담(SFBT) 4대 질문 기법 (기적·예외·척도·대처질문)", "concept": "해결된 미래 상상(기적), 문제 없던 성공 순간(예외), 수치화(척도), 버텨온 강점(대처)", "keywords": ["SFBT", "기적질문", "예외질문", "척도질문과 대처질문"], "lines": ["SFBT에서 문제가 해결된 미래의 구체적 모습을 상상하는 기적질문을 사용한다.", "문제가 일어나지 않았던 성공 경험과 자원을 찾아내는 예외질문을 던진다.", "변화에 대한 확신과 현재 상태를 수치로 계량화하는 척도질문을 활용한다.", "극심한 절망 속에서도 지금까지 어떻게 버텨왔는지 묻는 대처질문을 한다."], "quiz_q": "해결중심 단기상담(SFBT)에서 극심한 절망 속에서도 파국에 이르지 않고 버텨온 생존 전략과 강점을 묻는 질문은?", "quiz_a": "대처질문"}, {"id": 47, "part": "COUNSEL35", "domain": "상담이론", "title": "설리반 대인관계 이론 3대 자아상(좋은-나·나쁜-나·나-아닌-나) 및 병렬적 왜곡", "concept": "극심한 공포로 의식에서 해리되는 나-아닌-나 자아상과 과거 대상을 현재에 투사하는 병렬적 왜곡", "keywords": ["좋은-나", "나쁜-나", "나-아닌-나(Not-me)", "병렬적 왜곡"], "lines": ["양육자의 칭찬과 수용 속에서 불안이 없는 긍정적인 좋은-나 자아상을 만든다.", "양육자의 비난과 거부로 인한 불안을 경험하며 나쁜-나 자아상을 갖는다.", "극심한 공포와 불안으로 인해 의식에서 해리되는 나-아닌-나(Not-me)가 된다.", "과거의 대인관계 경험을 현재 상대에게 투사하는 병렬적 왜곡을 교정한다."], "quiz_q": "설리반 이론에서 아동이 감당할 수 없는 극심한 공포를 겪을 때 의식에서 완전히 해리되는 자아상의 명칭은?", "quiz_a": "나-아닌-나(Not-me)"}, {"id": 48, "part": "COUNSEL35", "domain": "상담이론", "title": "머레이 욕구-압착 이론 알파 압착 vs 베타 압착 및 주제통각검사(TAT)", "concept": "객관적 현실 환경인 알파 압착과 주관적으로 지각되어 행동을 지배하는 베타 압착", "keywords": ["심리적 욕구와 압착", "알파 압착", "베타 압착", "주제통각검사(TAT)"], "lines": ["내담자의 내부에서 일어나는 심리적 욕구와 환경의 압착을 함께 분석한다.", "객관적으로 실재하는 물리적 현실 환경을 나타내는 알파 압착을 살핀다.", "내담자가 주관적으로 지각하여 실제 행동을 지배하는 베타 압착을 교정한다.", "주제통각검사(TAT)를 활용하여 무의식적 욕구와 환경의 상호작용을 파악해 본다."], "quiz_q": "머레이의 욕구-압착 이론에서 개인이 주관적으로 해석하고 지각하여 실제 행동을 직접 결정짓는 환경 압착은?", "quiz_a": "베타 압착"}, {"id": 49, "part": "COUNSEL35", "domain": "상담이론", "title": "융 분석심리학 페르소나 동일시 부작용과 그림자 통합(개성화)", "concept": "사회적 가면인 페르소나와의 과잉 동일시 극복 및 억압된 그림자 수용을 통한 개성화", "keywords": ["페르소나", "동일시 부작용", "그림자 자각", "개성화"], "lines": ["사회적 역할에 적응하기 위해 외부로 드러내는 가면인 페르소나를 쓴다.", "역할과 자신을 동일시하여 참된 자기를 잃어버리는 부작용을 늘 경계한다.", "자신이 인정하기 싫어 억압한 무의식의 어두운 측면인 그림자를 자각한다.", "어두운 그림자를 타인에게 투사하지 않고 온전히 수용하여 개성화를 이룬다."], "quiz_q": "융의 분석심리학에서 사회적 역할(페르소나)이 곧 진짜 자신이라고 착각하여 참된 자기를 상실하는 기제는?", "quiz_a": "페르소나와의 동일시"}, {"id": 50, "part": "COUNSEL35", "domain": "상담이론", "title": "교류분석(TA) 해리스 4대 생활자세 및 이고그램 어른 자아(A)", "concept": "자기긍정-타인부정 및 자기부정-타인긍정을 극복하고 자기긍정-타인긍정으로 변화", "keywords": ["교류분석(TA)", "자기긍정-타인부정", "자기긍정-타인긍정", "어른 자아(A)"], "lines": ["교류분석(TA)에서 타인을 탓하고 책임을 전가하는 자기긍정-타인부정 자세를 본다.", "무력감에 빠져 의존적인 태도를 취하는 자기부정-타인긍정 자세를 극복한다.", "상호 존중과 신뢰를 바탕으로 한 자기긍정-타인긍정 자세로 변화시킨다.", "상황을 객관적으로 분석하는 어른 자아(A)를 활성화하여 내적 균형을 회복한다."], "quiz_q": "교류분석(TA)에서 자신의 잘못은 인정하지 않고 모든 문제를 타인 탓으로 돌리며 상대를 무시·공격하는 생활자세는?", "quiz_a": "자기긍정-타인부정"}, {"id": 51, "part": "COUNSEL35", "domain": "상담이론", "title": "랜드레스 아동중심 놀이치료 과정 인정(격려) 및 ACT 제한설정 3단계", "concept": "판단 없는 행동 추적, 노력과 과정 인정, 감정 인정(A)➔제한 전달(C)➔대안 제시(T)", "keywords": ["행동 추적", "과정 인정", "ACT 제한설정 3단계", "제한 전달과 대안"], "lines": ["아동이 놀이실에서 행하는 구체적인 행동을 판단 없이 말로 추적해 준다.", "결과를 평가하는 칭찬 대신 노력과 과정을 인정하여 자아존중감을 키운다.", "아동의 분노와 파괴 욕구를 먼저 충분히 수용하고 깊이 공감하며 인정한다.", "ACT 제한설정 3단계에 따라 한계를 명확히 알리고 안전한 대안을 제시한다."], "q const dataA = [{"id": "A1", "num": 1, "type": "기입형", "score": 2, "title": "다음은 전문상담교사와 교육실습생의 대화이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "교육실습생: 선생님, 오늘 지도해 주신 주제통각검사(TAT) 사례를 보면서 투사 검사가 내담자의 성격을 어떻게 파악하는지 깊이 이해하게 되었습니다. 그림 카드를 보고 이야기를 지어낼 때 내담자의 내면이 그대로 반영되는 것 같습니다.\n\n전문상담교사: 맞습니다. 투사 검사에서 주인공의 행동을 분석할 때는 내담자 내부에서 특정한 방향으로 행동을 유발하고 이끄는 유기체 내부의 역동적인 힘인 (  ㉠  )을(를) 먼저 파악해야 합니다. 성취, 친애, 지배 등 다양한 형태로 나타나지요.\n\n교육실습생: 그렇군요. 그런데 주인공을 둘러싼 외부 환경에서도 주인공의 목표 달성을 돕거나 방해하는 여러 힘들이 작동하고 있었습니다.\n\n전문상담교사: 정확한 관찰입니다. 외부 환경에 실재하거나 개인이 주관적으로 지각하여 유기체의 행동에 영향을 미치는 환경적 압박이나 유인가를 (  ㉡  )(이)라고 부릅니다. 개인의 내적 (  ㉠  )과(와) 환경적 (  ㉡  )이(가) 상호작용하여 내담자 고유의 성격 주제가 형성되는 것입니다.", "instructions": "", "answer": "㉠: 욕구\n㉡: 압력"}, {"id": "A2", "num": 2, "type": "기입형", "score": 2, "title": "다음은 전문상담교사가 작성한 상담 사례 일지와 수퍼비전 협의록의 일부이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "[상담 사례 일지]\n내담자는 과거 주양육자로부터 극심한 정서적 학대와 거부를 경험한 이후, 감당할 수 없는 공포가 밀려올 때마다 \"내 몸에서 낯선 괴물이 튀어나오는 것 같다\"며 심각한 해리 증상을 호소한다. 이러한 경험은 자아체계가 정상적으로 통합하지 못하고 의식 밖으로 추방한 가장 기괴하고 위협적인 자기상인 (  ㉠  )의 상태로 기능하고 있다.\n\n[수퍼비전 협의록]\n수퍼바이저: 내담자가 (  ㉠  )의 불안을 표출할 때 상담자가 과도하게 동일시되거나 위축되어서는 곤란합니다. 상담자는 내담자의 정서적 소용돌이에 따뜻하게 공감하면서도, 한편으로는 전문가로서 객관적 거리를 유지하며 상호작용의 패턴을 명료하게 분석해야 합니다.\n\n전문상담교사: 네, 상담실 안에서 온전한 인간적 관계를 맺으며 치료적 상호작용에 적극 참여하되, 동시에 한 걸음 물러나 상호작용의 의미를 객관적으로 관찰하고 평가하는 (  ㉡  )의 치료적 역할을 철저히 견지하도록 하겠습니다.", "instructions": "", "answer": "㉠: 나 아닌 나\n㉡: 참여적 관찰자"}, {"id": "A3", "num": 3, "type": "기입형", "score": 2, "title": "다음은 전문상담교사가 학급 또래관계 증진을 위해 계획한 집단상담 프로그램 안내문의 일부이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "[대인관계 소통 모델에 기초한 집단상담 운영 계획]\n원활한 의사소통과 진솔한 인간관계를 형성하기 위해서는 대인관계 마음의 창을 체계적으로 확장해야 합니다.\n\n1. 자신도 알고 있고 상대방에게도 널리 알려져 있어 자유롭고 개방적인 상호작용이 일어나는 (  ㉠  )을(를) 넓히는 것이 집단의 궁극적 목표입니다.\n2. 타인은 관찰하여 알고 있으나 정작 자기 자신은 미처 깨닫지 못하고 있는 (  ㉡  )의 경우, 동료 집단원들로부터 진솔한 피드백을 수용함으로써 점차 축소시킬 수 있습니다.\n3. 따라서 집단원은 적극적인 '자기개방'을 통해 비밀 영역을 줄이고, 동료들의 '피드백 수용'을 통해 (  ㉡  )을(를) 줄임으로써 (  ㉠  )을(를) 극대화해야 합니다.", "instructions": "", "answer": "㉠: 개방 영역\n㉡: 맹목 영역"}, {"id": "A4", "num": 4, "type": "기입형", "score": 2, "title": "다음은 전문상담교사의 사례 회의록 일부이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "전문상담교사: 학교 부적응 학생들의 대인관계 생활양식을 교류분석적 관점에서 검토해 보았습니다.\n\n동료교사: 학생 A는 타인을 신뢰하지 못하고 자신이 항상 옳다는 우월감에 차 있어 교우들을 무시하는 반면, 학생 B는 매사에 \"나는 부족하고 쓸모없지만 다른 친구들은 다 대단하다\"며 과도하게 위축되어 굴종하는 태도를 보입니다.\n\n전문상담교사: 학생 B의 상태는 (  ㉡  )의 생활자세에 머물러 있는 전형적인 양상입니다. 우리가 상담을 통해 최종적으로 이끌어내야 하는 가장 성숙하고 생산적인 심리적 태도는 자신도 가치 있고 존중받아야 하며 타인 역시 고유한 존엄성을 지니고 있음을 인정하는 (  ㉠  )의 생활자세입니다.", "instructions": "", "answer": "㉠: 자기긍정-타인긍정\n㉡: 자기부정-타인긍정"}, {"id": "A5", "num": 5, "type": "서술형", "score": 4, "title": "다음은 전문상담교사가 작성한 두 학생의 상담 기록이다. 작성 방법에 따라 서술하시오.", "content": "[진숙 상담 기록]\n중학교 2학년 진숙는 손에 눈에 보이지 않는 세균이 묻어 가족들이 병에 걸려 죽을지도 모른다는 불합리한 생각이 쉴 새 없이 떠올라 극심한 불안을 호소한다. 학생 스스로도 이러한 생각이 지극히 터무니없고 비합리적임을 명백히 알고 있어 너무나 고통스러워하며, 이 고통스러운 생각에서 벗어나기 위해 하루에도 수십 번씩 손에 피가 날 정도로 비누칠을 30분 이상 반복하고 있다.\n\n[진수 상담 기록]\n고등학교 1학년 진수는 자신의 책상 위 학용품이 일직선으로 정렬되지 않거나 학급 청소 규칙이 1mm라도 어긋나면 극도의 분노를 표출하며 급우들을 맹비난한다. 진수는 \"규칙과 질서를 완벽하게 지키는 것은 인간으로서 당연한 정의이자 도리인데, 친구들이 나태해서 이를 지키지 않는다\"고 굳게 확신하고 있으며, 자신의 행동에 어떠한 문제의식이나 주관적 고통도 느끼지 않고 있다.", "instructions": "<작성 방법>\n○ 지문에 나타난 진숙와 진수의 호소 문제를 바탕으로 각각의 공식 진단명을 제시할 것.\n○ 두 학생의 증상이 자아와 맺는 관계적 특성(자아와의 일치 여부)을 대비하여 각각 서술할 것.\n○ 진숙의 반복 행동을 소거하기 위해 적용할 수 있는 대표적 행동치료 기법의 명칭을 쓰고, 그 구체적 개입 절차를 서술할 것.", "answer": "내담자 진숙의 공식 진단명은 강박장애이며 진수는 강박성 성격장애이다.\n진숙은 자아 이질적 특성이며 진수는 완벽주의를 당연시하는 자아 동질적이다.\n진숙에게 적용할 행동 치료적 기법의 정식 명칭은 노출 및 반응방지이다.\n자극에 노출시킨 후 강박행동을 차단하여 불안이 자연 소거되도록 돕는다."}, {"id": "A6", "num": 6, "type": "서술형", "score": 4, "title": "다음은 결석이 잦고 정서적 위기를 겪고 있는 고등학생 C의 심리검사 결과표 및 면담 기록이다. 작성 방법에 따라 서술하시오.", "content": "[MMPI-2-RF 주요 척도 프로파일 수치]\n- 무응답(CNS): 0점\n- 과소보고 척도(L-r / K-r): T = 42 / T = 38\n- 과대보고 척도(F-r): T = 68 (Help-seeking 상태)\n- 정서적/내재화 문제 척도(EID): T = 74\n- 의기소침 척도(RCd): T = 76\n- 자살/죽음 사고 척도(SUI): T = 82\n- 사고부전 척도(THD): T = 48\n- 행동화부전 척도(BXD): T = 50\n\n[면담 기록]\n전문상담교사가 학생 C의 사물함을 정리하던 중 \"더 이상 살아갈 힘이 없다. 내일 아침이 오지 않았으면 좋겠다\"라고 적힌 메모가 발견되었으며, 팔목 안쪽에서 얕은 주저흔이 관찰되었다.", "instructions": "<작성 방법>\n○ 검사 결과표에서 가장 즉각적인 생명 위협을 시사하는 척도 기호와 그 점수가 의미하는 임상적 위기 수준을 제시할 것.\n○ 해당 검사 결과와 면담 상황에 근거하여 전문상담교사가 학교 현장에서 즉각 시행해야 할 비밀보장 예외에 따른 위기 대응 조치 2가지를 서술할 것.", "answer": "즉각적인 생명 위협을 나타내는 척도의 공식 명칭은 자살 죽음사고 척도이다.\nT점수 82점은 구체적인 자살 사고와 실행 위험성이 극도로 임박함을 뜻한다.\n자살 위기는 비밀보장의 예외 사안이므로 보호자에게 사실을 즉각 통보한다.\n위기관리위원회를 소집하고 전문 의료기관으로 긴급 연계하여 안전을 지킨다."}, {"id": "A7", "num": 7, "type": "서술형", "score": 4, "title": "다음은 가족 갈등으로 인해 학교 부적응을 겪고 있는 중학생 D의 가족상담 축어록이다. 작성 방법에 따라 서술하시오.", "content": "상담자: 어머님, 최근 가정 내에서 남편분과의 관계는 어떠신가요?\n어머니: 남편과는 대화가 아예 단절되었어요. 얼굴만 보면 숨이 막히고 싸우게 되니까, 남편과 부딪힐 때마다 저는 딸아이 방에 들어가서 아빠가 얼마나 무책임하고 이기적인 사람인지 하소연을 하죠. 딸아이도 \"엄마, 아빠는 정말 나쁜 사람이야\"라며 제 편을 들어줘요.\n상담자: D는 그런 어머니의 이야기를 들을 때 어떤 반응을 보이나요?\n어머니: 처음에는 제 이야기를 잘 들어주더니, 얼마 전부터는 학교 갈 시간만 되면 원인 모를 심한 복통과 어지럼증을 호소하며 등교를 거부하고 있어요. 남편은 \"네가 애를 망쳐놨다\"고 소리치고, 저는 남편 탓을 하며 더 크게 싸우게 됩니다.", "instructions": "<작성 방법>\n○ 부부 갈등의 불안을 해소하기 위해 자녀를 개입시키는 가족 역동의 공식 명칭을 쓰고, 이 역동이 자녀의 증상 형성에 미친 기제를 서술할 것.\n○ 상담실 내에서 이 불안 구조를 해체하기 위해 상담자가 견지해야 할 치료적 태도 1가지와, 자녀를 갈등에서 해방시키는 개입 기법의 명칭을 제시할 것.", "answer": "부부 사이의 갈등에 자녀를 끌어들이는 가족 역동의 명칭은 삼각관계이다.\n자녀는 부모 사이의 불안을 흡수하여 복통이라는 신체화 증상을 나타낸다.\n상담자는 부모 어느 한쪽에도 치우치지 않고 객관적 정서적 중립성을 지킨다.\n자녀를 부모의 갈등에서 분리하여 자율성을 주는 개입 기법은 탈삼각화이다."}, {"id": "A8", "num": 8, "type": "서술형", "score": 4, "title": "다음은 모의고사 성적이 하락한 고등학생 E와의 상담 대화 내용이다. 작성 방법에 따라 서술하시오.", "content": "학생 E: 선생님, 이번 9월 모의고사에서 수학 1등급을 놓치고 2등급을 받았어요. 제 인생은 이제 완전히 끝장났어요.\n상담자: 1등급을 받지 못해서 상심이 크군요. 그런데 2등급을 받은 것이 왜 인생이 완전히 끝장난 것일까요?\n학생 E: ㉠ 1등급을 받지 못했다면 그건 완벽한 실패와 다름없잖아요. ㉡ 이번에 1등급을 놓쳤으니 저는 앞으로 어떤 대학도 가지 못하고 결국 인생의 낙오자가 될 거예요.\n상담자: 만약 그 생각이 사실이라고 가정해 봅시다. 당신이 2등급을 받아 원하는 대학에 가지 못한다는 것은 당신에게 궁극적으로 어떤 의미가 되나요?\n학생 E: 음... 그것은 제가 아무런 가치도 없는 무능한 인간이라는 뜻이에요.", "instructions": "<작성 방법>\n○ 밑줄 친 ㉠과 ㉡에 나타난 인지적 왜곡(인지적 오류)의 공식 명칭을 각각 쓰시오.\n○ 상담자가 학생의 표면적인 자동적 사고에서 출발하여 내면 깊숙이 자리 잡은 핵심 신념을 탐색하기 위해 사용한 질문 기법의 명칭을 제시할 것.\n○ 해당 기법을 적용할 때 상담자가 사용하는 표준적인 수직적 탐색 질문의 핵심 형식을 1가지 서술할 것.", "answer": "밑줄 친 ㉠은 이분법적 사고이며 ㉡은 파국적 결과를 예상하는 재앙화이다.\n핵심 신념을 체계적으로 탐색하기 위해 사용한 기법은 하향 화살표 기법이다.\n자동적 사고의 기저에 깔려 있는 역기능적 신념을 단계별로 파헤쳐 확인한다.\n만약 그 생각이 사실이라면 그것이 무엇을 의미하는지 질문하여 밝혀낸다."}, {"id": "A9", "num": 9, "type": "서술형", "score": 4, "title": "다음은 진로 장벽에 부딪혀 혼란을 겪고 있는 고등학생 F의 진로상담 일지이다. 작성 방법에 따라 서술하시오.", "content": "[진로상담 일지]\n고등학교 2학년 남학생 F는 어려서부터 웹툰 작가와 일러스트레이터가 되고 싶다는 뚜렷한 흥미를 품고 있었다. 그러나 학년이 올라가면서 \"웹툰 작가는 수입이 불안정하고 사회적 대우가 낮다\"는 부모님의 강력한 반대에 부딪혔다. 또한 남성으로서 안정적인 가정을 꾸려야 한다는 성역할 기대감과 높은 연봉을 보장하는 직업을 가져야 한다는 현실적 압박이 가중되자, 자신의 오랜 흥미 분야를 포기하고 컴퓨터 공학 계열로 진로를 수정해야 할지 심각한 내적 갈등을 겪고 있다.", "instructions": "<작성 방법 및 출제 조건>\n<작성 방법>\n○ 개인이 성장 과정에서 수용 불가능한 진로 대안들을 점차 배제해 나가는 발달적 과정의 명칭을 쓰고, 남성성과 여성성에 기초하여 직업을 제한하는 제2단계의 공식 명칭을 제시할 것.\n○ 현실적 제약에 직면했을 때 자신의 이상적 진로 포부를 현실과 조율하여 좁히는 현상의 명칭을 쓸 것.\n○ 개인이 타협을 진행할 때 포기하게 되는 3대 차원(성역할, 사회적 지위/위세, 흥미)의 우선순위를 가장 먼저 포기하는 영역부터 가장 끝까지 고수하는 영역 순으로 나열할 것.", "answer": "진로 대안을 줄여나가는 과정은 제한이며 제2단계는 성역할 지향 단계이다.\n수용 가능한 진로 대안을 현실에 맞추어 조율하는 과정의 명칭은 타협이다.\n타협 시 흥미를 가장 먼저 포기하고 사회적 지위를 그다음으로 포기한다.\n자신의 성정체성과 직결되는 성역할은 마지막까지 포기하지 않고 지킨다."}, {"id": "A10", "num": 10, "type": "서술형", "score": 4, "title": "다음은 SNS에 자살 암시 글을 게시하여 위기상담실로 인계된 고등학생 G와의 초기 면담 기록이다. 작성 방법에 따라 서술하시오.", "content": "[위기 사정 면담 기록]\n전문상담교사는 학생 G의 즉각적인 생명 안전을 확인하기 위해 체계적인 자살 사정 프로토콜을 가동하였다.\n\n상담교사는 먼저 학생이 오늘 아침 위기상담실로 오게 된 직접적인 촉발 요인인 SNS 게시글 작성 경위를 파악하였다. 이어서 지난 48시간 동안 구체적인 자살 계획이나 치명적인 자살 수단을 탐색한 사실이 있는지 점검하였다. 이후 지난 2개월간 내담자가 겪었던 우울감과 절망감의 파동을 확인한 후, 과거 평생 동안 시도했던 자살 시도력과 자해 경험을 면밀히 사정하였다. 마지막으로 바로 지금, 이 상담실 문을 나서는 순간 자살을 실행에 옮기려는 즉각적인 충동이 존재하는지 확인하였다.", "instructions": "<작성 방법>\n○ 지문에 적용된 시계열적 자살 사정 면담 모델의 공식 명칭을 영문 약자 또는 한글로 제시할 것.\n○ 해당 모델에서 자살 위험을 사정하기 위해 순차적으로 탐색하는 4대 시간대별 사건 단계를 공식 명칭으로 순서대로 나열할 것.\n○ 해당 사정 모델의 최종 단계에서 상담자가 반드시 확인해야 하는 즉각적 위험 사정 질문의 핵심 내용을 1가지 서술할 것.", "answer": "구체적 자살 사고를 체계적으로 평가하는 모델은 숀 셰이 CASE 모델이다.\n탐색 순서는 제시 사건 최근 사건 과거 사건 즉각 사건 순으로 진행된다.\n최종 단계인 즉각 사건에서는 상담실을 나선 직후의 자살 계획을 확인한다.\n지금 여기 상담실 안에서 자살 충동을 느끼는지 직접 구체적으로 묻는다."}, {"id": "A11", "num": 11, "type": "서술형", "score": 4, "title": "다음은 학교폭력 사안 처리 결과 통지서와 전문상담교사의 피해학생 지원 일지이다. 작성 방법에 따라 서술하시오.", "content": "[학교폭력대책심의위원회 조치 결정 통지서]\n가해학생 H는 교내 화장실에서 피해학생 I를 지속적으로 폭행하고 금품을 갈취하여 중대한 신체적·정신적 피해를 입혔다. 심의 결과 가해학생 H에게 출석정지 처분을 부과하기로 결정하였다.\n\n[피해학생 지원 일지]\n사안 접수 후 가해학생 H는 피해학생 I에게 \"학폭위에 신고하면 가만두지 않겠다\"며 협박 문자를 전송하는 2차 가해를 자행하였다. 피해학생 I는 극심한 보복 두려움으로 등교를 거부하고 불면증을 겪고 있어, 학교장은 심의위원회의 최종 조치 결정 전 피해학생에 대한 긴급한 보호조치를 즉각 시행하였다.", "instructions": "<작성 방법>\n○ 학교폭력예방법 제17조 제1항에 규정된 가해학생 조치 중 지문에 부과된 '출석정지'의 공식 호수(기호)를 쓰시오.\n○ 가해학생이 신고나 진술을 이유로 피해학생에게 보복행위를 한 경우, 심의위원회가 조치를 결정할 때 적용해야 하는 법적 가중 처분 기준을 서술할 것.\n○ 학교폭력예방법 제16조 제1항에 근거하여 심의위원회 개최 전 학교의 장이 피해학생을 긴급하게 보호하기 위해 시행할 수 있는 조치를 1가지 서술할 것.", "answer": "학교폭력 가해학생에게 부과된 출석정지 조치의 정식 명칭은 제6호 조치이다.\n가해학생이 피해학생에게 보복행위를 한 경우 심의위원회는 처분을 가중 조치한다.\n학교의 장은 피해학생 보호를 위해 전문 상담과 심리치료를 긴급 지원한다.\n2차 피해 방지를 위해 가해학생과의 즉시 분리 조치를 엄격히 시행한다."}, {"id": "A12", "num": 12, "type": "서술형", "score": 4, "title": "다음은 숨이 막히는 증상으로 등교에 곤란을 겪고 있는 고등학생 J와의 상담 축어록이다. 작성 방법에 따라 서술하시오.", "content": "학생 J: 아침에 만원 지하철을 타고 오는데 갑자기 가슴이 터질 듯이 두근거리고 숨이 가빠왔어요. 손발이 저리면서 어지러웠는데, ㉠ \"이러다 심장마비가 와서 여기서 쓰러져 죽겠구나\"라는 생각이 들며 미칠 것 같은 공포가 덮쳤어요.\n상담자: 신체 증상이 나타났을 때 곧바로 죽음에 이를 것이라는 극단적인 공포로 이어졌군요. 병원 검사 결과는 어떠했나요?\n학생 J: 심장내과와 신경과에서 정밀 검사를 받았는데 신체적으로는 아무런 이상이 없대요. 하지만 언제 또 그 증상이 나타나 쓰러질지 몰라 두려워요. 특히 지하철이나 영화관, 만원 버스처럼 사람이 많고 즉시 빠져나오기 힘든 장소는 아예 갈 수가 없어요.\n상담자: 신체 감각을 위험 신호로 오해하는 악순환을 끊어야 합니다. 다음 회기에는 상담실에서 좁은 빨대로 빠르게 호흡하거나 제자리에서 빙글빙글 도는 활동을 통해, 두근거림과 어지러움 같은 신체 감각 자체를 직접 경험하면서 그 감각이 결코 죽음이나 파멸을 초래하지 않는다는 것을 확인해 볼 것입니다.", "instructions": "<작성 방법>\n○ 밑줄 친 ㉠에 나타난 인지적 반응의 공식 명칭을 쓰고, 내담자의 신체 감각이 극심한 공포로 증폭되는 인지모델의 작동 기제를 서술할 것.\n○ 상담자가 내담자의 신체 감각 공포를 둔감화하기 위해 제안한 행동적 치료 기법의 공식 명칭을 쓸 것.\n○ 내담자가 공황 발작의 위협과 함께 즉각 탈출하기 어렵거나 도움을 받기 어려운 장소 2곳 이상을 회피하는 양상을 진단할 수 있는 공식 병명을 제시할 것.", "answer": "밑줄 친 ㉠의 공식 명칭은 신체 감각을 위험으로 여기는 파국적 오해석이다.\n무해한 생리적 각성을 파멸로 잘못 해석하여 극심한 공포가 악순환 증폭된다.\n신체 감각에 직접 직면하게 하는 행동 기법의 명칭은 내수용성 노출이다.\n즉각 탈출하기 어려운 장소를 지속적으로 회피하는 병명은 광장공포증이다."}];
const dataB = [{"id": "B1", "num": 1, "type": "기입형", "score": 2, "title": "다음은 진로상담교사와 동료 교사의 대화이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "동료 교사: 홀랜드 육각형 모델에서 성격 유형 코드 간의 관계를 분석할 때 어떤 기준을 보아야 하나요?\n\n진로상담교사: 육각형 기하학적 모델에서 유형 간의 거리는 심리적 유사성과 밀접한 관련이 있습니다. 육각형 상에서 서로 인접한 유형(예: R과 I)은 상관관계가 높고, 대각선 반대편에 위치한 유형(예: R과 S)은 상관관계가 낮다는 기하학적 거리 비례 원리를 (  ㉠  )(이)라고 합니다.\n\n동료 교사: 그렇군요. 그럼 검사 결과에서 첫 번째 코드와 두 번째 코드가 육각형에서 인접해 있을 때 성격적 안정성이 높다고 보는 개념은 무엇인가요?\n\n진로상담교사: 네, 3자리 코드 중 첫 두 글자가 육각형 상에서 서로 가까이 인접해 있을수록 내적 조화를 이루고 있음을 뜻하는 개념은 (  ㉡  )(이)라고 부릅니다.", "instructions": "", "answer": "㉠: 계측성\n㉡: 일관성"}, {"id": "B2", "num": 2, "type": "기입형", "score": 2, "title": "다음은 분석심리학적 성격 구조에 관한 전문상담교사의 사례 연구 발표문 일부이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "인간은 사회적 존재로서 타인과의 원만한 관계를 맺고 사회적 규범과 역할 기대에 적응하기 위해 외부 세계에 보여주는 외적 인격, 즉 사회적 가면인 (  ㉠  )을(를) 발달시킵니다. 이는 사회생활을 유지하는 데 필수적인 적응적 기능을 수행합니다.\n\n그러나 개인이 자신의 진정한 자아를 잊어버리고 오직 이 사회적 가면이 곧 자기 자신이라고 착각하는 (  ㉡  )의 함정에 빠지게 되면, 내면의 참된 욕구와 무의식이 억압되어 심각한 자아 소외와 신경증적 갈등을 겪게 됩니다. 따라서 상담자는 내담자가 (  ㉠  )의 순기능을 유지하되, 무의식의 어두운 측면인 그림자를 통합하여 참된 자기를 실현하도록 도와야 합니다.", "instructions": "", "answer": "㉠: 페르소나\n㉡: 동일시"}, {"id": "B3", "num": 3, "type": "서술형", "score": 4, "title": "다음은 보건실에서 자주 의뢰되는 두 학생의 면담 일지이다. 작성 방법에 따라 서술하시오.", "content": "[훈이 면담 일지]\n중학교 3학년 훈이는 매일 아침 극심한 복통과 어지럼증, 전신 근육통을 호소한다. 여러 종합병원에서 내시경과 정밀 MRI 검사를 받았으나 의학적으로 설명 가능한 신체 질환은 발견되지 않았다. 그럼에도 학생은 실제 고통스러운 신체 통증을 지속적으로 경험하고 있으며, 온종일 자신의 통증에만 과도하게 몰두하여 학업을 전혀 수행하지 못하고 있다.\n\n[병철 면담 일지]\n고등학교 1학년 병철는 현재 뚜렷한 신체 통증이나 신체적 증상은 전혀 없다. 그러나 팔에 사소한 모기 물린 자국이나 미열만 있어도 \"림프종이나 불치병에 걸린 것이 틀림없다\"며 극심한 공포에 휩싸인다. 의사가 아무런 이상이 없다고 안심시켜도 믿지 못하고, 일주일 동안 대학병원 4곳을 돌며 검사를 요구하는 이른바 '닥터 쇼핑'을 반복하고 있다.", "instructions": "<작성 방법>\n○ 훈이와 병철의 호소 문제를 바탕으로 각각의 공식 진단명을 제시할 것.\n○ 두 학생의 증상에서 나타나는 '실제 신체적 증상의 존재 여부'를 대비하여 서술할 것.\n○ 병철가 보이는 질병 공포와 관련된 행동적 특징(예: 확인 및 회피 행동)을 지문과 연계하여 1가지 서술할 것.", "answer": "내담자 훈이의 공식 진단명은 신체증상장애이며 병철은 질병불안장애이다.\n훈이는 실제로 일상생활에 지장을 주는 고통스러운 신체 통증 증상이 지속된다.\n병철은 뚜렷한 신체 증상이 없음에도 불치병에 걸렸다는 집착과 불안에 몰두한다.\n병철은 의사의 정상 소견에도 불구하고 여러 병원을 전전하는 확인 행동을 보인다."}, {"id": "B4", "num": 4, "type": "서술형", "score": 4, "title": "다음은 대인 의사소통에 심각한 어려움을 보이는 두 학생에 대한 발달 평가 기록이다. 작성 방법에 따라 서술하시오.", "content": "[진호 발달 기록]\n초등학교 6학년 진호는 대화할 때 상대방의 말에 적절히 차례를 지켜 대답하지 못하고 맥락에 맞지 않는 말만 늘어놓는다. 또한 \"손이 발이 되도록 빌었다\"와 같은 관용어나 비유, 반어법을 전혀 이해하지 못하고 글자 그대로 받아들여 오해를 일으킨다. 그러나 특정한 물건에 대한 과도한 집착이나 손털기, 몸 흔들기 같은 반복적인 상동 행동은 전혀 관찰되지 않는다.\n\n[민우 발달 기록]\n중학교 1학년 민우는 진호와 마찬가지로 언어의 화용론적 기능과 사회적 맥락 파악에 심각한 결함을 보인다. 그런데 민우는 이에 더하여 손가락을 꼬거나 제자리에서 도는 상동증적 행동을 반복하며, 전국의 지하철 노선표 암기에만 하루 종일 병적으로 집착하고 일과표가 1분만 바뀌어도 극심한 분노 발작을 일으킨다.", "instructions": "<작성 방법>\n○ 진호와 민우의 임상 양상을 바탕으로 각각의 공식 진단명을 제시할 것.\n○ 두 장애를 감별하는 가장 결정적인 DSM-5-TR 진단 기준상의 차이점(증상 영역 유무)을 명시할 것.\n○ 진호가 나타내는 의사소통 결함의 핵심 영역(언어 사용 규칙 차원)을 전문 용어로 서술할 것.", "answer": "학생 진호의 진단명은 사회적 실용적 의사소통장애이며 민우는 자폐스펙트럼장애이다.\n두 장애를 구별하는 결정적 감별점은 제한적이고 반복적인 행동 패턴의 유무이다.\n민우는 상동 행동과 집착을 동반하지만 진호는 제한적이고 반복적인 행동이 없다.\n진호는 사회적 맥락에 맞게 소통하는 화용론적 언어 사용 기능에서 결함을 보인다."}, {"id": "B5", "num": 5, "type": "서술형", "score": 4, "title": "다음은 지속적인 무기력과 심리적 붕괴 위기를 호소하는 고등학생 E의 로샤 종합체계 검사 구조요약표의 일부이다. 작성 방법에 따라 서술하시오.", "content": "[로샤 종합체계 구조요약표 주요 변인]\n- 반응 수(R): 23\n- 람다(Lambda): 0.21\n- 경험균형(EB): M : WSumC = 1 : 6.5\n- 경험실제(EA): 7.5\n- 경험자극(es): 11.5\n- D 점수: -2\n- 조정 D 점수(Adj D): -1\n- 조직화 활동(Zf): 12, W:D:Dd = 8:13:2\n- 형태질(X+% / WDA%): 72% / 75%", "instructions": "<작성 방법>\n○ 경험균형(EB) 수치를 바탕으로 내담자의 문제해결 및 스트레스 대처 유형을 공식 명칭으로 제시하고, 그 심리적 특성을 서술할 것.\n○ D 점수(-2)가 시사하는 내담자의 현재 심리적 자원 및 스트레스 상태를 공식 용어로 서술할 것.\n○ 이 내담자를 상담할 때 상담 초기에 우선적으로 투입해야 할 위기 개입적 방향을 1가지 제시할 것.", "answer": "인간운동반응(M)보다 유색반응(WSumC)이 높으므로 대처 유형은 외향형이다.\n외부의 정서적 자극에 민감하게 반응하고 행동 중심의 문제해결을 우선 시도한다.\nD점수가 음수인 상태는 내적 가용 자원보다 스트레스가 큰 과부하 상태이다.\n정서적 통제력 상실을 방지하기 위해 스트레스를 줄이고 지지를 제공한다."}, {"id": "B6", "num": 6, "type": "서술형", "score": 4, "title": "다음은 충동적인 일탈 행동으로 의뢰된 중학생 F의 TCI(기질 및 성격검사) 결과표이다. 작성 방법에 따라 서술하시오.", "content": "[TCI 척도별 백분위 프로파일]\n1. 기질 차원\n- 자극 추구 (Novelty Seeking, NS): 89 백분위 (매우 높음)\n- 위험 회피 (Harm Avoidance, HA): 12 백분위 (매우 낮음)\n- 사회적 보상의존성 (Reward Dependence, RD): 32 백분위 (낮음)\n- 인내력 (Persistence, P): 25 백분위 (낮음)\n\n2. 성격 차원\n- 자율성 (Self-Directedness, SD): 18 백분위 (매우 낮음)\n- 연대감 (Cooperativeness, CO): 21 백분위 (낮음)\n- 자기초월 (Self-Transcendence, ST): 55 백분위 (보통)", "instructions": "<작성 방법>\n○ 기질 차원의 '자극 추구(NS 고)'와 '위험 회피(HA 저)' 조합이 내담자의 행동 양식에 미치는 임상적 특징을 서술할 것.\n○ 성격 차원에서 한 개인의 성숙도와 사회적 적응 수준을 결정하는 2대 핵심 척도의 명칭을 제시할 것.\n○ 내담자의 성격 척도(SD 저, CO 저) 결과를 바탕으로 상담자가 장기적으로 증진시켜야 할 치료적 목표를 서술할 것.", "answer": "자극추구가 높고 위험회피가 낮으면 강한 호기심과 높은 충동성을 보인다.\n잠재적 위험에 대한 조심성이 결여되어 비행이나 규칙 위반 행동을 쉽게 일으킨다.\n성숙도와 사회적 적응을 결정하는 핵심 성격 척도는 자율성과 연대감이다.\n자기 행동을 책임지는 자율성과 타인을 존중하는 연대감을 함께 기른다."}, {"id": "B7", "num": 7, "type": "서술형", "score": 4, "title": "다음은 증상 완화를 위해 서로 다른 기법을 적용한 두 상담 사례이다. 작성 방법에 따라 서술하시오.", "content": "[사례 1]\n고등학생 G는 임원 선거 연설을 앞두고 무대에 설 때 손이 떨릴까 봐 극심한 예기불안을 겪고 있다. 학생은 발표 순간 자신의 손가락과 심장박동에 온 신경을 집중하고 있었다. 이에 상담자는 떨림 증상에 쏠린 과도한 주의를 차단하고, 자신이 전하고자 하는 연설의 참된 가치와 학급 친구들에게 봉사하겠다는 본래의 의미 있는 목표로 관심을 전향하도록 지도하였다.\n\n[사례 2]\n매일 밤 사소한 집안일로 격렬하게 다투는 부부 내담자에게 상담자는 다음과 같이 개입하였다. \"두 분은 오늘부터 다음 상담 회기까지 매일 밤 9시부터 9시 20분까지 거실에 마주 앉아 일부러 가장 격렬하게 큰 소리로 다투십시오. 20분이 지나면 싸움을 즉시 멈추어야 합니다.\" 부부는 당황하였으나 지시를 따르는 과정에서 싸움이 스스로 조절 가능함을 깨달았다.", "instructions": "<작성 방법>\n○ [사례 1]에서 상담자가 적용한 의미치료의 핵심 치료 기법 명칭을 공식 명칭으로 쓰고, 그 치료적 작동 기제를 서술할 것.\n○ [사례 2]에서 상담자가 적용한 전략적 치료 기법의 공식 명칭을 쓸 것.\n○ [사례 2]의 기법이 내담자의 변화를 이끌어내는 심리적 메커니즘을 서술할 것.", "answer": "증상에 대한 주의를 외부 가치로 돌리는 기법은 탈숙고(Dereflection)다.\n지나친 반성으로 생기는 불안 악순환을 차단하여 자발성을 되찾게 한다.\n두려워하는 증상을 스스로 의도하여 증상을 통제하는 기법은 역설적 의도이다.\n회피하려던 증상을 직면하게 함으로써 증상이 스스로 통제됨을 깨닫게 한다."}, {"id": "B8", "num": 8, "type": "서술형", "score": 4, "title": "다음은 가족 구조의 역동을 다루는 가족상담 사례이다. 작성 방법에 따라 서술하시오.", "content": "[가족상담 관찰 일지]\n상담자는 부모-자녀 간의 상호작용을 관찰하였다. 어머니는 고등학생 아들의 가방 검사는 물론 일기장까지 매일 검사하며 아들의 사생활에 경계 없이 침범하고 있었고, 아들은 어머니의 기분에 따라 자신의 감정이 좌우되는 밀착된 모습을 보였다. 반면 아버지는 이러한 갈등에 전혀 관여하지 않고 차가운 침묵으로 일관하며 가족 구성원들과 정서적으로 완전히 차단되어 있었다.\n\n상담자는 이 가족의 경계선 문제를 다루기 위해, 상담실 안에서 어머니와 아들이 최근 갈등을 빚었던 학원 문제에 대해 평소 집에서 하던 방식 그대로 지금 여기서 직접 대화를 나누어보도록 요청하였다.", "instructions": "<작성 방법>\n○ 건강한 가족이 갖추어야 할 하위체계 간 공식 경계선의 명칭을 쓰고, 지문의 어머니-아들과 아버지에게서 각각 나타나는 병리적 경계선의 명칭을 제시할 것.\n○ 상담실 내에서 가족 갈등 장면을 실제로 직접 재연하도록 요구한 치료 기법의 공식 명칭을 쓸 것.\n○ 해당 기법을 통해 상담자가 가족 구조를 파악하고 개입할 수 있는 치료적 효과를 1가지 서술할 것.", "answer": "어머니와 아들은 밀착된 경계선이며 아버지는 가족과 유리된 경계선이다.\n상담실에서 실제 가족의 갈등 행동을 재연하게 하는 기법은 실연화이다.\n설명으로 듣는 대신 상호작용 패턴을 현장에서 있는 그대로 직접 관찰한다.\n역기능적 의사소통 구조를 교정하고 세대 간 명확한 경계선을 재형성한다."}, {"id": "B9", "num": 9, "type": "서술형", "score": 4, "title": "다음은 자해 행동을 보이는 중학생 H의 상담 축어록이다. 작성 방법에 따라 서술하시오.", "content": "학생 H: 부모님이 저를 무시하고 억압할 때마다 너무 화가 나고 미칠 것 같아요. 하지만 부모님께는 화를 낼 수가 없어요.\n상담자: 부모님을 향한 그 강한 분노와 공격성을 어떻게 처리하나요?\n학생 H: 그 분노가 차오르면 제 방으로 들어가서 제 허벅지를 칼로 긋거나 손등을 피가 날 때까지 물어뜯어요. 저를 아프게 해야 마음이 가라앉아요.\n상담자: 다른 사람에게 표현해야 할 에너지를 자신에게로 돌려 공격하고 있군요. 다음 시간에는 맞은편에 빈 의자를 두고, 한쪽에는 '부모님께 분노하는 나'를, 다른 쪽에는 '자신을 처벌하는 나'를 앉혀 두 자아가 직접 대화를 나누며 내면의 갈등을 다루어보겠습니다.", "instructions": "<작성 방법>\n○ 타인에게 표현해야 할 정서적 에너지를 자신에게로 돌려 자해하는 접촉경계혼란의 공식 명칭을 쓸 것.\n○ 상담자가 제안한 빈 의자를 활용한 게슈탈트 대표 기법의 명칭을 제시할 것.\n○ 해당 기법을 통해 내담자가 달성해야 하는 궁극적인 치료적 목표(자아 통합 측면)를 서술할 것.", "answer": "원래 타인에게 하고 싶었던 행동을 자신에게 돌리는 접촉경계혼란은 반전이다.\n내면의 양극성을 대화시켜 해소하는 게슈탈트 상담 기법은 빈의자 기법이다.\n자신을 자책하는 승리자와 억압된 패배자가 서로 솔직하게 대면하게 한다.\n소외되었던 부정적 감정을 수용하고 온전한 자기 통합을 이루도록 돕는다."}, {"id": "B10", "num": 10, "type": "서술형", "score": 4, "title": "다음은 진로 적응에 어려움을 겪는 고등학생 I에 대한 진로상담 일지이다. 작성 방법에 따라 서술하시오.", "content": "[생애설계 진로상담 일지]\n상담자는 내담자의 생애 주제를 탐색하기 위해 진로 이야기 면담을 진행하였다.\n\n상담자는 내담자에게 다음과 같은 질문들을 순차적으로 던졌다.\n1. \"어린 시절 가장 존경하거나 닮고 싶었던 역할모델 3명은 누구입니까?\"\n2. \"평소 가장 즐겨 읽는 잡지나 즐겨 시청하는 텔레비전 프로그램은 무엇입니까?\"\n3. \"가장 기억에 남는 좋아하는 책이나 영화의 줄거리는 무엇입니까?\"\n4. \"어린 시절의 가장 초기의 기억 3가지는 무엇입니까?\"\n\n이를 통해 내담자가 자신의 생애 이야기를 능동적으로 재구성하고, 다가올 미래의 직업적 전환에 유연하게 대처할 수 있는 진로적응도를 구축하도록 안내하였다.", "instructions": "<작성 방법>\n○ 지문에 적용된 사비카스의 생애 직업 스타일 면담(CSI)에서 위의 질문들을 통해 파악하고자 하는 핵심 개념의 명칭을 쓸 것.\n○ 진로적응도를 구성하는 4대 차원(4C)의 공식 명칭을 3가지 이상 제시할 것.\n○ 4대 차원 중 내담자가 자신의 진로 미래를 스스로 결정하고 통제할 수 있다는 신념을 뜻하는 차원의 명칭을 제시할 것.", "answer": "생애 직업 스타일 면담을 통하여 파악하려는 핵심 개념은 생애 주제이다.\n진로적응도를 구성하는 핵심 4대 차원은 관심 통제 호기심 자신감이다.\n미래 진로를 스스로 결정하고 책임질 수 있다고 믿는 차원은 통제이다.\n진로 발달 과업에 주도적으로 대처하며 내담자의 적응 역량을 극대화한다."}, {"id": "B11", "num": 11, "type": "서술형", "score": 4, "title": "다음은 급성 외상 스트레스를 겪는 학생 J에 대한 학교 위기개입 기록이다. 작성 방법에 따라 서술하시오.", "content": "[위기개입 면담 기록]\n친한 친구의 갑작스러운 사망 소식을 접하고 호흡곤란과 패닉 상태에 빠진 학생 J가 상담실로 급히 후송되었다.\n\n상담교사는 즉시 학생의 안전을 확보하고 정서적 쇼크를 완화하기 위해 개입하였다. 학생의 공포와 충격을 온전히 경청하고 수용하며 따뜻한 심리적 지지를 전달하여 신뢰 관계를 구축하였다. 이후 학생이 실행할 수 있는 현실적 대처 방안들을 모색하고 단기 행동 계획을 수립하였다.\n\n면담 종료 직전, 상담교사는 학생이 상담실을 나선 후에도 안전을 유지할 수 있도록 구체적인 이행 서약이 포함된 안전계획서를 함께 작성하고, 학생이 스스로 실천하겠다는 명확한 동의를 표명하도록 참여를 이끌어냈다.", "instructions": "<작성 방법>\n○ 지문에 적용된 길리랜드의 위기개입 6단계 중 학생에게 온전한 경청과 수용을 전달한 제3단계의 공식 명칭을 쓸 것.\n○ 면담 마무리 단계에서 안전계획서를 작성하고 내담자의 구체적 실천 서약을 이끌어낸 제6단계의 공식 명칭을 쓸 것.\n○ 위기개입 시 안전계획서에 반드시 포함되어야 하는 핵심 구성 요소 2가지를 서술할 것.", "answer": "정서적 안정을 형성하는 제3단계는 지지를 제공하는 지지 제공 단계이다.\n구체적 행동을 약속하는 제6단계는 참여를 이끌어내는 참여 유도 단계이다.\n자살 위험을 차단하기 위해 위기 시 연락할 비상 연락망을 명확히 적는다.\n위험 수단에 대한 접근을 차단하고 구체적 대처 지침인 안전계획서를 쓴다."}];

let currentPeriod = 'KICE55';
let currentK55Cat = 'ALL';
let allMasked = false;
let isPaperMode = false;
let isBlankMode = false;
let showOnlyBookmarks = false;
let isShuffled = false;
let currentFontScale = 1.0;
let bookmarks = JSON.parse(localStorage.getItem('kice_bookmarks') || '{}');

let totalTypedChars = 0;
let typingStartTime = null;
let timerSeconds = 30 * 60;
let timerInterval = null;
let isTimerRunning = true;

let audioCtx = null;
let noiseNode = null;
let isAsmrOn = false;

function playSuccessChime() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
  } catch(e) {}
}

function toggleASMR() {
  if (!isAsmrOn) startASMR();
  else stopASMR();
}

function startASMR() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.015;
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    noiseNode.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    noiseNode.connect(filter);
    filter.connect(audioCtx.destination);
    noiseNode.start();
    isAsmrOn = true;
    const btn = document.getElementById('btn-asmr');
    btn.textContent = '연필소리 ON';
    btn.classList.add('on');
    showToast('시험장 집중 화이트 노이즈(연필소리)가 시작되었습니다.');
  } catch(e) {
    showToast('오디오를 재생할 수 없습니다.');
  }
}

function stopASMR() {
  if (noiseNode) {
    noiseNode.stop();
    noiseNode.disconnect();
  }
  isAsmrOn = false;
  const btn = document.getElementById('btn-asmr');
  btn.textContent = '연필소리 OFF';
  btn.classList.remove('on');
}

function speakAnswer(text) {
  if (!('speechSynthesis' in window)) {
    showToast('이 브라우저는 음성 낭독을 지원하지 않습니다.');
    return;
  }
  window.speechSynthesis.cancel();
  const clean = text.replace(/\n/g, ' ').replace(/[㉠㉡㉢]/g, '');
  const uttr = new SpeechSynthesisUtterance(clean);
  uttr.lang = 'ko-KR';
  uttr.rate = 0.95;
  window.speechSynthesis.speak(uttr);
  showToast('KICE 모범답안 음성 낭독을 시작합니다.');
}

function adjustFont(delta) {
  currentFontScale = Math.max(0.85, Math.min(1.35, currentFontScale + delta));
  document.documentElement.style.setProperty('--font-scale', currentFontScale);
  showToast(`글꼴 크기: ${Math.round(currentFontScale * 100)}%`);
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) {
      timerSeconds--;
      updateTimerUI();
    } else {
      clearInterval(timerInterval);
      alert("종료 시각입니다! 작성하신 답안지를 최종 점검해 주세요.");
    }
  }, 1000);
}

function updateTimerUI() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const el = document.getElementById('timer-display');
  el.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  el.classList.toggle('warning', timerSeconds < 300);
}

function toggleTimer() {
  const btn = document.getElementById('btn-timer-toggle');
  if (isTimerRunning) {
    clearInterval(timerInterval);
    isTimerRunning = false;
    btn.textContent = '계속';
  } else {
    startTimer();
    isTimerRunning = true;
    btn.textContent = '일시정지';
  }
}

function resetTimer() {
  timerSeconds = 30 * 60;
  updateTimerUI();
  if (!isTimerRunning) {
    startTimer();
    isTimerRunning = true;
    document.getElementById('btn-timer-toggle').textContent = '일시정지';
  }
}

function togglePaperMode() {
  isPaperMode = !isPaperMode;
  document.body.classList.toggle('b4-paper-mode', isPaperMode);
  document.getElementById('btn-paper-mode').textContent = isPaperMode ? 'CBT 다크 모드' : 'B4 시험지 모드';
}

function toggleBookmarkFilter() {
  showOnlyBookmarks = !showOnlyBookmarks;
  document.getElementById('btn-bookmark-filter').classList.toggle('active', showOnlyBookmarks);
  renderCards();
  loadSavedAnswers();
}

function toggleBookmark(key) {
  bookmarks[key] = !bookmarks[key];
  localStorage.setItem('kice_bookmarks', JSON.stringify(bookmarks));
  renderNav();
  renderCards();
  loadSavedAnswers();
  showToast(bookmarks[key] ? '북마크에 추가되었습니다.' : '북마크가 해제되었습니다.');
}

function shuffleCurrentPeriod() {
  isShuffled = !isShuffled;
  document.getElementById('btn-shuffle').textContent = isShuffled ? '원래 순서로' : '랜덤 셔플';
  renderNav();
  renderCards();
  loadSavedAnswers();
  showToast(isShuffled ? '문항이 무작위로 셔플되었습니다.' : '정상 순서로 복원되었습니다.');
}

let currentRound = parseInt(localStorage.getItem('kice_current_round') || '1', 10);

function getRoundKeyPrefix() {
  return `kice_r${currentRound}_`;
}

function switchPracticeRound(roundNum) {
  currentRound = roundNum;
  localStorage.setItem('kice_current_round', currentRound);
  for (let r = 1; r <= 3; r++) {
    const el = document.getElementById('round-btn-' + r);
    if (el) el.classList.toggle('active', r === currentRound);
  }
  renderNav();
  renderCards();
  loadSavedAnswers();
  updateProgress();
  showToast(`[오늘의 ${currentRound}회독] 답안지로 전환되었습니다.`);
}

function setK55Category(cat, btnEl) {
  currentK55Cat = cat;
  document.querySelectorAll('.k55-cat-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  renderNav();
  renderCards();
  loadSavedAnswers();
  updateProgress();
}

function clearCurrentAnswers() {
  if (!confirm(`현재 탭의 작성 답안을 모두 지우고 새로 연습하시겠습니까?`)) return;
  const items = getList();
  const prefix = getRoundKeyPrefix();
  items.forEach(q => {
    const key = currentPeriod + q.num;
    localStorage.removeItem(prefix + key);
    localStorage.removeItem(prefix + key + '_quiz');
    for (let i = 0; i < 6; i++) {
      localStorage.removeItem(prefix + key + '_L' + i);
    }
  });
  renderNav();
  renderCards();
  updateProgress();
  showToast(`현재 탭 답안이 깨끗하게 초기화되었습니다.`);
}

function clearAllPracticeRoundAnswers() {
  const msg = `정말 [오늘의 ${currentRound}회독] 전체 답안지를 깨끗하게 비우고 새로 시작하시겠습니까?`;
  if (!confirm(msg)) return;
  const prefix = getRoundKeyPrefix();
  const keysToRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(prefix)) keysToRemove.push(k);
  }
  keysToRemove.forEach(k => localStorage.removeItem(k));
  renderNav();
  renderCards();
  loadSavedAnswers();
  updateProgress();
  resetTimer();
  showToast(`[오늘의 ${currentRound}회독] 전과목 답안지가 1초 만에 백지 초기화되었습니다!`);
}

function switchPeriod(p) {
  currentPeriod = p;

  document.getElementById('btn-shuffle').textContent = '랜덤 셔플';
  ['KICE55', 'TEMPLATE', 'PED', 'A', 'B'].forEach(tabId => {
    const btn = document.getElementById('tab-btn-' + tabId);
    if (btn) btn.classList.toggle('active', tabId === p);
  });
  const filterBar = document.getElementById('kice55-filter-bar');
  if (filterBar) filterBar.style.display = (p === 'KICE55') ? 'flex' : 'none';
  renderNav();
  renderCards();
