<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027학년도 공립 중등학교교사 임용후보자 선정경쟁시험 - 전문상담 초실전 CBT 고사장</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0a0f1d;
  --bg-card: #121929;
  --bg-card-header: #182238;
  --bg-passage: #0b1220;
  --border-kice: #22314d;
  --border-kice-focus: #38bdf8;
  --text-main: #f1f5f9;
  --text-sub: #94a3b8;
  --text-muted: #64748b;
  --accent-blue: #38bdf8;
  --accent-gold: #fbbf24;
  --accent-emerald: #10b981;
  --accent-rose: #f43f5e;
  --accent-purple: #c084fc;
}

/* B4 시험지 종이 질감 모드 변수 */
body.b4-paper-mode {
  --bg-main: #18191c;
  --bg-card: #e8e3d5;
  --bg-card-header: #dbd4c0;
  --bg-passage: #f3efe6;
  --border-kice: #8c826e;
  --border-kice-focus: #1e3a8a;
  --text-main: #111827;
  --text-sub: #374151;
  --text-muted: #4b5563;
  --accent-blue: #1e40af;
  --accent-gold: #b45309;
  --accent-emerald: #047857;
  --accent-rose: #b91c1c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: 90px;
  user-select: text;
  transition: background-color 0.3s, color 0.3s;
}

/* ================= KICE 실전 고사장 상단 헤더 ================= */
.kice-exam-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 15, 29, 0.98);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid #1e3a5f;
  padding: 10px 24px;
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
}
body.b4-paper-mode .kice-exam-header {
  background: rgba(220, 215, 200, 0.98);
  border-bottom: 2px solid #8c826e;
}

.header-inner {
  max-width: 1460px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 12px;
}

.kice-seal {
  background: linear-gradient(135deg, #1e3a8a, #0284c7);
  color: #fff;
  font-size: 0.75rem;
  font-weight: 900;
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 1px;
  border: 1px solid #38bdf8;
}

.exam-main-title {
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.examinee-tag {
  color: #38bdf8;
  font-weight: 700;
  font-size: 0.88rem;
  background: rgba(56, 189, 248, 0.1);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid rgba(56, 189, 248, 0.3);
}
body.b4-paper-mode .examinee-tag {
  color: #1e3a8a;
  background: rgba(30, 58, 138, 0.1);
  border-color: #1e3a8a;
}

/* 90분 실전 스톱워치 타이머 */
.timer-container {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #091322;
  border: 1px solid #1e3a5f;
  padding: 5px 12px;
  border-radius: 8px;
}
body.b4-paper-mode .timer-container {
  background: #fdfbf7;
  border-color: #8c826e;
}

.timer-label {
  font-size: 0.78rem;
  color: var(--text-sub);
  font-weight: 600;
}

.timer-digits {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--accent-gold);
  letter-spacing: 1px;
  min-width: 90px;
  text-align: center;
}

.timer-digits.warning {
  color: var(--accent-rose);
  animation: pulse-warn 1s infinite alternate;
}

@keyframes pulse-warn {
  from { opacity: 1; }
  to { opacity: 0.4; }
}

.btn-timer {
  background: #1e293b;
  border: 1px solid #334155;
  color: #cbd5e1;
  font-size: 0.72rem;
  padding: 3px 7px;
  border-radius: 4px;
  cursor: pointer;
}
body.b4-paper-mode .btn-timer {
  background: #e2dcd0;
  color: #1f2937;
  border-color: #9ca3af;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-kice {
  background: #131c2e;
  color: #e2e8f0;
  border: 1px solid #2a3a54;
  padding: 5px 11px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
body.b4-paper-mode .btn-kice {
  background: #fdfbf7;
  color: #1f2937;
  border-color: #8c826e;
}
.btn-kice:hover {
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}
.btn-kice.accent {
  background: linear-gradient(135deg, #0284c7, #2563eb);
  border: none;
  color: #fff;
}

/* ================= 탭 & 컨트롤 바 ================= */
.sub-bar {
  max-width: 1460px;
  margin: 12px auto 0;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.period-tabs {
  display: flex;
  gap: 6px;
  background: #0d1525;
  padding: 4px;
  border-radius: 8px;
  border: 1px solid var(--border-kice);
}
body.b4-paper-mode .period-tabs {
  background: #dbd4c0;
}

.period-tab-btn {
  padding: 6px 15px;
  border-radius: 6px;
  font-size: 0.88rem;
  font-weight: 800;
  border: none;
  cursor: pointer;
  background: transparent;
  color: var(--text-sub);
  transition: all 0.2s;
}

.period-tab-btn.active {
  background: #1e3a8a;
  color: #fff;
  box-shadow: 0 2px 8px rgba(30, 58, 138, 0.5);
}

.status-badge {
  font-size: 0.85rem;
  color: var(--text-sub);
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge-count {
  background: #091322;
  border: 1px solid #1e3a5f;
  color: var(--accent-gold);
  padding: 3px 10px;
  border-radius: 999px;
  font-weight: 800;
}
body.b4-paper-mode .badge-count {
  background: #fdfbf7;
  border-color: #8c826e;
}

/* 네비게이션 띠 */
.nav-strip {
  max-width: 1460px;
  margin: 10px auto 0;
  padding: 0 24px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
}

.nav-pill {
  background: #101726;
  border: 1px solid var(--border-kice);
  color: var(--text-sub);
  padding: 4px 10px;
  border-radius: 5px;
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
body.b4-paper-mode .nav-pill {
  background: #e5ded0;
  border-color: #a39985;
}
.nav-pill:hover {
  border-color: var(--accent-blue);
  color: #fff;
}
.nav-pill.done {
  border-color: var(--accent-emerald);
  color: var(--accent-emerald);
  background: rgba(16, 185, 129, 0.08);
}

/* ================= 문항 카드 ================= */
main {
  max-width: 1460px;
  margin: 16px auto 0;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.q-card {
  background: var(--bg-card);
  border: 1px solid var(--border-kice);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
  transition: all 0.2s;
}

.q-card-head {
  background: var(--bg-card-header);
  padding: 10px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-kice);
}

.q-num-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--accent-gold);
  display: flex;
  align-items: center;
  gap: 10px;
}

.type-pill {
  font-size: 0.72rem;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
}
.type-pill.fillin { background: rgba(192, 132, 252, 0.15); color: #d8b4fe; border: 1px solid #9333ea; }
.type-pill.essay { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid #0284c7; }

.q-score-tag {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
}

.q-card-body {
  padding: 18px;
}

.q-question-text {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 14px;
  line-height: 1.5;
  font-family: 'Nanum Myeongjo', serif;
}

/* 지문 박스 */
.passage-wrapper {
  background: var(--bg-passage);
  border: 1px solid var(--border-kice);
  border-left: 4px solid var(--accent-blue);
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 16px;
  font-size: 0.95rem;
  line-height: 1.8;
  white-space: pre-line;
  font-family: 'Noto Sans KR', sans-serif;
}

.instructions-box {
  background: rgba(0, 0, 0, 0.2);
  border: 1px dashed var(--border-kice);
  border-radius: 6px;
  padding: 12px 18px;
  margin-bottom: 18px;
  font-size: 0.88rem;
  line-height: 1.6;
  white-space: pre-line;
}
body.b4-paper-mode .instructions-box {
  background: #eae5d7;
}
.instructions-box strong {
  color: var(--accent-gold);
}

/* ================= 좌우 2분할 실전 B4 답안지 워크스페이스 ================= */
.sheet-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: stretch;
}

@media (max-width: 1024px) {
  .sheet-grid {
    grid-template-columns: 1fr;
  }
}

.sheet-col {
  display: flex;
  flex-direction: column;
}

.sheet-col-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-sub);
}

/* 왼쪽: 수험생 B4 실전 4줄 답안지 (정밀 40px 밑줄) */
.b4-typing-sheet {
  width: 100%;
  flex: 1;
  min-height: 170px;
  background-color: #070d18;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(56, 189, 248, 0.38) 40px);
  background-size: 100% 40px;
  background-attachment: local;
  border: 1px solid #1e3a5f;
  border-radius: 6px;
  padding: 0 16px;
  color: #f8fafc;
  font-size: 1.05rem;
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  line-height: 40px;
  resize: vertical;
  outline: none;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
  transition: border-color 0.2s, box-shadow 0.2s;
}
body.b4-paper-mode .b4-typing-sheet {
  background-color: #faf8f3;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(30, 58, 138, 0.4) 40px);
  border-color: #8c826e;
  color: #111827;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
}

.b4-typing-sheet:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
}

/* 줄별 글자 수 실시간 가이드 칩 */
.line-status-chip {
  font-size: 0.75rem;
  font-weight: 700;
  display: inline-flex;
  gap: 8px;
  align-items: center;
}
.chip-item {
  padding: 1px 6px;
  border-radius: 3px;
  background: #1e293b;
  color: #94a3b8;
}
body.b4-paper-mode .chip-item {
  background: #dbd4c0;
  color: #374151;
}
.chip-item.perfect {
  background: rgba(16, 185, 129, 0.2);
  color: var(--accent-emerald);
  border: 1px solid var(--accent-emerald);
}

/* 오른쪽: KICE 공인 100% 모범답안 */
.b4-answer-sheet {
  background-color: #091322;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(251, 191, 36, 0.3) 40px);
  background-size: 100% 40px;
  background-attachment: local;
  border: 1px solid #1e3a5f;
  border-radius: 6px;
  padding: 0 16px;
  color: #fef08a;
  font-size: 1.05rem;
  font-family: 'JetBrains Mono', 'Noto Sans KR', monospace;
  line-height: 40px;
  white-space: pre-line;
  flex: 1;
  user-select: text;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}
body.b4-paper-mode .b4-answer-sheet {
  background-color: #faf5eb;
  background-image: linear-gradient(to bottom, transparent 39px, rgba(180, 83, 9, 0.35) 40px);
  border-color: #8c826e;
  color: #92400e;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.15);
}

.b4-answer-sheet.masked {
  filter: blur(5px);
  user-select: none;
  cursor: pointer;
}

/* 미니 액션 버튼 */
.btn-sheet-mini {
  background: #1e293b;
  border: 1px solid #334155;
  color: #94a3b8;
  font-size: 0.72rem;
  padding: 2px 7px;
  border-radius: 4px;
  cursor: pointer;
}
body.b4-paper-mode .btn-sheet-mini {
  background: #e2dcd0;
  color: #1f2937;
  border-color: #9ca3af;
}
.btn-sheet-mini:hover { background: #38bdf8; color: #000; }

/* 실시간 실전 칼채점 패널 */
.scoring-eval-bar {
  margin-top: 10px;
  padding: 8px 12px;
  background: #0d1422;
  border: 1px solid #1e293b;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
}
body.b4-paper-mode .scoring-eval-bar {
  background: #eae4d5;
  border-color: #8c826e;
}

.eval-score-text {
  font-weight: 800;
  color: var(--accent-gold);
}

#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #10b981;
  color: #fff;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 0.88rem;
  font-weight: 700;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  transform: translateY(10px);
  z-index: 9999;
}
#toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- 실전 고사장 상단 헤더 -->
<header class="kice-exam-header">
  <div class="header-inner">
    <div class="brand-section">
      <span class="kice-seal">KICE 실전 CBT</span>
      <h1 class="exam-main-title">2027학년도 공립 중등 전문상담교사 임용시험</h1>
      <span class="examinee-tag">수험생: 변귀섭 대표님</span>
    </div>

    <!-- 30분 스톱워치 타이머 -->
    <div class="timer-container">
      <span class="timer-label">잔여 시간</span>
      <span class="timer-digits" id="timer-display">30:00</span>
      <button class="btn-timer" onclick="toggleTimer()" id="btn-timer-toggle">일시정지</button>
      <button class="btn-timer" onclick="resetTimer()">30분 리셋</button>
    </div>

    <div class="header-actions">
      <button class="btn-kice" onclick="togglePaperMode()" id="btn-paper-mode">B4 시험지 모드</button>
      <button class="btn-kice" onclick="toggleAllMasks()" id="btn-toggle-all">모범답안 전체 가리기</button>
      <button class="btn-kice" onclick="clearCurrentAnswers()">현재 답안 비우기</button>
      <button class="btn-kice accent" onclick="exportAnswers()">답안지 최종 제출 (TXT)</button>
    </div>
  </div>
</header>

<div class="sub-bar">
  <div class="period-tabs">
    <button class="period-tab-btn active" id="tab-btn-A" onclick="switchPeriod('A')">2교시 전공 A형 (12문항 / 40점)</button>
    <button class="period-tab-btn" id="tab-btn-B" onclick="switchPeriod('B')">3교시 전공 B형 (11문항 / 40점)</button>
  </div>
  <div class="status-badge">
    <span>실전 답안 작성 완료:</span>
    <span class="badge-count" id="progress-count">0 / 12 문항 완료</span>
  </div>
</div>

<div class="nav-strip" id="nav-strip"></div>

<main id="exam-cards-container"></main>

<div id="toast">알림</div>

<script>
const dataA = [{"id": "A1", "num": 1, "type": "기입형", "score": 2, "title": "다음은 전문상담교사와 교육실습생의 대화이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "교육실습생: 선생님, 오늘 지도해 주신 주제통각검사(TAT) 사례를 보면서 투사 검사가 내담자의 성격을 어떻게 파악하는지 깊이 이해하게 되었습니다. 그림 카드를 보고 이야기를 지어낼 때 내담자의 내면이 그대로 반영되는 것 같습니다.\n\n전문상담교사: 맞습니다. 투사 검사에서 주인공의 행동을 분석할 때는 내담자 내부에서 특정한 방향으로 행동을 유발하고 이끄는 유기체 내부의 역동적인 힘인 (  ㉠  )을(를) 먼저 파악해야 합니다. 성취, 친애, 지배 등 다양한 형태로 나타나지요.\n\n교육실습생: 그렇군요. 그런데 주인공을 둘러싼 외부 환경에서도 주인공의 목표 달성을 돕거나 방해하는 여러 힘들이 작동하고 있었습니다.\n\n전문상담교사: 정확한 관찰입니다. 외부 환경에 실재하거나 개인이 주관적으로 지각하여 유기체의 행동에 영향을 미치는 환경적 압박이나 유인가를 (  ㉡  )(이)라고 부릅니다. 개인의 내적 (  ㉠  )과(와) 환경적 (  ㉡  )이(가) 상호작용하여 내담자 고유의 성격 주제가 형성되는 것입니다.", "instructions": "", "answer": "㉠: 욕구\n㉡: 압력"}, {"id": "A2", "num": 2, "type": "기입형", "score": 2, "title": "다음은 전문상담교사가 작성한 상담 사례 일지와 수퍼비전 협의록의 일부이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "[상담 사례 일지]\n내담자는 과거 주양육자로부터 극심한 정서적 학대와 거부를 경험한 이후, 감당할 수 없는 공포가 밀려올 때마다 \"내 몸에서 낯선 괴물이 튀어나오는 것 같다\"며 심각한 해리 증상을 호소한다. 이러한 경험은 자아체계가 정상적으로 통합하지 못하고 의식 밖으로 추방한 가장 기괴하고 위협적인 자기상인 (  ㉠  )의 상태로 기능하고 있다.\n\n[수퍼비전 협의록]\n수퍼바이저: 내담자가 (  ㉠  )의 불안을 표출할 때 상담자가 과도하게 동일시되거나 위축되어서는 곤란합니다. 상담자는 내담자의 정서적 소용돌이에 따뜻하게 공감하면서도, 한편으로는 전문가로서 객관적 거리를 유지하며 상호작용의 패턴을 명료하게 분석해야 합니다.\n\n전문상담교사: 네, 상담실 안에서 온전한 인간적 관계를 맺으며 치료적 상호작용에 적극 참여하되, 동시에 한 걸음 물러나 상호작용의 의미를 객관적으로 관찰하고 평가하는 (  ㉡  )의 치료적 역할을 철저히 견지하도록 하겠습니다.", "instructions": "", "answer": "㉠: 나 아닌 나\n㉡: 참여적 관찰자"}, {"id": "A3", "num": 3, "type": "기입형", "score": 2, "title": "다음은 전문상담교사가 학급 또래관계 증진을 위해 계획한 집단상담 프로그램 안내문의 일부이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "[대인관계 소통 모델에 기초한 집단상담 운영 계획]\n원활한 의사소통과 진솔한 인간관계를 형성하기 위해서는 대인관계 마음의 창을 체계적으로 확장해야 합니다.\n\n1. 자신도 알고 있고 상대방에게도 널리 알려져 있어 자유롭고 개방적인 상호작용이 일어나는 (  ㉠  )을(를) 넓히는 것이 집단의 궁극적 목표입니다.\n2. 타인은 관찰하여 알고 있으나 정작 자기 자신은 미처 깨닫지 못하고 있는 (  ㉡  )의 경우, 동료 집단원들로부터 진솔한 피드백을 수용함으로써 점차 축소시킬 수 있습니다.\n3. 따라서 집단원은 적극적인 '자기개방'을 통해 비밀 영역을 줄이고, 동료들의 '피드백 수용'을 통해 (  ㉡  )을(를) 줄임으로써 (  ㉠  )을(를) 극대화해야 합니다.", "instructions": "", "answer": "㉠: 개방 영역\n㉡: 맹목 영역"}, {"id": "A4", "num": 4, "type": "기입형", "score": 2, "title": "다음은 전문상담교사의 사례 회의록 일부이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "전문상담교사: 학교 부적응 학생들의 대인관계 생활양식을 교류분석적 관점에서 검토해 보았습니다.\n\n동료교사: 학생 A는 타인을 신뢰하지 못하고 자신이 항상 옳다는 우월감에 차 있어 교우들을 무시하는 반면, 학생 B는 매사에 \"나는 부족하고 쓸모없지만 다른 친구들은 다 대단하다\"며 과도하게 위축되어 굴종하는 태도를 보입니다.\n\n전문상담교사: 학생 B의 상태는 (  ㉡  )의 생활자세에 머물러 있는 전형적인 양상입니다. 우리가 상담을 통해 최종적으로 이끌어내야 하는 가장 성숙하고 생산적인 심리적 태도는 자신도 가치 있고 존중받아야 하며 타인 역시 고유한 존엄성을 지니고 있음을 인정하는 (  ㉠  )의 생활자세입니다.", "instructions": "", "answer": "㉠: 자기긍정-타인긍정\n㉡: 자기부정-타인긍정"}, {"id": "A5", "num": 5, "type": "서술형", "score": 4, "title": "다음은 전문상담교사가 작성한 두 학생의 상담 기록이다. 작성 방법에 따라 서술하시오.", "content": "[진숙 상담 기록]\n중학교 2학년 진숙는 손에 눈에 보이지 않는 세균이 묻어 가족들이 병에 걸려 죽을지도 모른다는 불합리한 생각이 쉴 새 없이 떠올라 극심한 불안을 호소한다. 학생 스스로도 이러한 생각이 지극히 터무니없고 비합리적임을 명백히 알고 있어 너무나 고통스러워하며, 이 고통스러운 생각에서 벗어나기 위해 하루에도 수십 번씩 손에 피가 날 정도로 비누칠을 30분 이상 반복하고 있다.\n\n[진수 상담 기록]\n고등학교 1학년 진수는 자신의 책상 위 학용품이 일직선으로 정렬되지 않거나 학급 청소 규칙이 1mm라도 어긋나면 극도의 분노를 표출하며 급우들을 맹비난한다. 진수는 \"규칙과 질서를 완벽하게 지키는 것은 인간으로서 당연한 정의이자 도리인데, 친구들이 나태해서 이를 지키지 않는다\"고 굳게 확신하고 있으며, 자신의 행동에 어떠한 문제의식이나 주관적 고통도 느끼지 않고 있다.", "instructions": "<작성 방법>\n○ 지문에 나타난 진숙와 진수의 호소 문제를 바탕으로 각각의 공식 진단명을 제시할 것.\n○ 두 학생의 증상이 자아와 맺는 관계적 특성(자아와의 일치 여부)을 대비하여 각각 서술할 것.\n○ 진숙의 반복 행동을 소거하기 위해 적용할 수 있는 대표적 행동치료 기법의 명칭을 쓰고, 그 구체적 개입 절차를 서술할 것.", "answer": "내담자 진숙의 공식 진단명은 강박장애이며 진수는 강박성 성격장애이다.\n진숙은 자아 이질적 특성이며 진수는 완벽주의를 당연시하는 자아 동질적이다.\n진숙에게 적용할 행동 치료적 기법의 정식 명칭은 노출 및 반응방지이다.\n자극에 노출시킨 후 강박행동을 차단하여 불안이 자연 소거되도록 돕는다."}, {"id": "A6", "num": 6, "type": "서술형", "score": 4, "title": "다음은 결석이 잦고 정서적 위기를 겪고 있는 고등학생 C의 심리검사 결과표 및 면담 기록이다. 작성 방법에 따라 서술하시오.", "content": "[MMPI-2-RF 주요 척도 프로파일 수치]\n- 무응답(CNS): 0점\n- 과소보고 척도(L-r / K-r): T = 42 / T = 38\n- 과대보고 척도(F-r): T = 68 (Help-seeking 상태)\n- 정서적/내재화 문제 척도(EID): T = 74\n- 의기소침 척도(RCd): T = 76\n- 자살/죽음 사고 척도(SUI): T = 82\n- 사고부전 척도(THD): T = 48\n- 행동화부전 척도(BXD): T = 50\n\n[면담 기록]\n전문상담교사가 학생 C의 사물함을 정리하던 중 \"더 이상 살아갈 힘이 없다. 내일 아침이 오지 않았으면 좋겠다\"라고 적힌 메모가 발견되었으며, 팔목 안쪽에서 얕은 주저흔이 관찰되었다.", "instructions": "<작성 방법>\n○ 검사 결과표에서 가장 즉각적인 생명 위협을 시사하는 척도 기호와 그 점수가 의미하는 임상적 위기 수준을 제시할 것.\n○ 해당 검사 결과와 면담 상황에 근거하여 전문상담교사가 학교 현장에서 즉각 시행해야 할 비밀보장 예외에 따른 위기 대응 조치 2가지를 서술할 것.", "answer": "즉각적인 생명 위협을 나타내는 척도의 공식 명칭은 자살 죽음사고 척도이다.\nT점수 82점은 구체적인 자살 사고와 실행 위험성이 극도로 임박함을 뜻한다.\n자살 위기는 비밀보장의 예외 사안이므로 보호자에게 사실을 즉각 통보한다.\n위기관리위원회를 소집하고 전문 의료기관으로 긴급 연계하여 안전을 지킨다."}, {"id": "A7", "num": 7, "type": "서술형", "score": 4, "title": "다음은 가족 갈등으로 인해 학교 부적응을 겪고 있는 중학생 D의 가족상담 축어록이다. 작성 방법에 따라 서술하시오.", "content": "상담자: 어머님, 최근 가정 내에서 남편분과의 관계는 어떠신가요?\n어머니: 남편과는 대화가 아예 단절되었어요. 얼굴만 보면 숨이 막히고 싸우게 되니까, 남편과 부딪힐 때마다 저는 딸아이 방에 들어가서 아빠가 얼마나 무책임하고 이기적인 사람인지 하소연을 하죠. 딸아이도 \"엄마, 아빠는 정말 나쁜 사람이야\"라며 제 편을 들어줘요.\n상담자: D는 그런 어머니의 이야기를 들을 때 어떤 반응을 보이나요?\n어머니: 처음에는 제 이야기를 잘 들어주더니, 얼마 전부터는 학교 갈 시간만 되면 원인 모를 심한 복통과 어지럼증을 호소하며 등교를 거부하고 있어요. 남편은 \"네가 애를 망쳐놨다\"고 소리치고, 저는 남편 탓을 하며 더 크게 싸우게 됩니다.", "instructions": "<작성 방법>\n○ 부부 갈등의 불안을 해소하기 위해 자녀를 개입시키는 가족 역동의 공식 명칭을 쓰고, 이 역동이 자녀의 증상 형성에 미친 기제를 서술할 것.\n○ 상담실 내에서 이 불안 구조를 해체하기 위해 상담자가 견지해야 할 치료적 태도 1가지와, 자녀를 갈등에서 해방시키는 개입 기법의 명칭을 제시할 것.", "answer": "부부 사이의 갈등에 자녀를 끌어들이는 가족 역동의 명칭은 삼각관계이다.\n자녀는 부모 사이의 불안을 흡수하여 복통이라는 신체화 증상을 나타낸다.\n상담자는 부모 어느 한쪽에도 치우치지 않고 객관적 정서적 중립성을 지킨다.\n자녀를 부모의 갈등에서 분리하여 자율성을 주는 개입 기법은 탈삼각화이다."}, {"id": "A8", "num": 8, "type": "서술형", "score": 4, "title": "다음은 모의고사 성적이 하락한 고등학생 E와의 상담 대화 내용이다. 작성 방법에 따라 서술하시오.", "content": "학생 E: 선생님, 이번 9월 모의고사에서 수학 1등급을 놓치고 2등급을 받았어요. 제 인생은 이제 완전히 끝장났어요.\n상담자: 1등급을 받지 못해서 상심이 크군요. 그런데 2등급을 받은 것이 왜 인생이 완전히 끝장난 것일까요?\n학생 E: ㉠ 1등급을 받지 못했다면 그건 완벽한 실패와 다름없잖아요. ㉡ 이번에 1등급을 놓쳤으니 저는 앞으로 어떤 대학도 가지 못하고 결국 인생의 낙오자가 될 거예요.\n상담자: 만약 그 생각이 사실이라고 가정해 봅시다. 당신이 2등급을 받아 원하는 대학에 가지 못한다는 것은 당신에게 궁극적으로 어떤 의미가 되나요?\n학생 E: 음... 그것은 제가 아무런 가치도 없는 무능한 인간이라는 뜻이에요.", "instructions": "<작성 방법>\n○ 밑줄 친 ㉠과 ㉡에 나타난 인지적 왜곡(인지적 오류)의 공식 명칭을 각각 쓰시오.\n○ 상담자가 학생의 표면적인 자동적 사고에서 출발하여 내면 깊숙이 자리 잡은 핵심 신념을 탐색하기 위해 사용한 질문 기법의 명칭을 제시할 것.\n○ 해당 기법을 적용할 때 상담자가 사용하는 표준적인 수직적 탐색 질문의 핵심 형식을 1가지 서술할 것.", "answer": "밑줄 친 ㉠은 이분법적 사고이며 ㉡은 파국적 결과를 예상하는 재앙화이다.\n핵심 신념을 체계적으로 탐색하기 위해 사용한 기법은 하향 화살표 기법이다.\n자동적 사고의 기저에 깔려 있는 역기능적 신념을 단계별로 파헤쳐 확인한다.\n만약 그 생각이 사실이라면 그것이 무엇을 의미하는지 질문하여 밝혀낸다."}, {"id": "A9", "num": 9, "type": "서술형", "score": 4, "title": "다음은 진로 장벽에 부딪혀 혼란을 겪고 있는 고등학생 F의 진로상담 일지이다. 작성 방법에 따라 서술하시오.", "content": "[진로상담 일지]\n고등학교 2학년 남학생 F는 어려서부터 웹툰 작가와 일러스트레이터가 되고 싶다는 뚜렷한 흥미를 품고 있었다. 그러나 학년이 올라가면서 \"웹툰 작가는 수입이 불안정하고 사회적 대우가 낮다\"는 부모님의 강력한 반대에 부딪혔다. 또한 남성으로서 안정적인 가정을 꾸려야 한다는 성역할 기대감과 높은 연봉을 보장하는 직업을 가져야 한다는 현실적 압박이 가중되자, 자신의 오랜 흥미 분야를 포기하고 컴퓨터 공학 계열로 진로를 수정해야 할지 심각한 내적 갈등을 겪고 있다.", "instructions": "<작성 방법>\n○ 개인이 성장 과정에서 수용 불가능한 진로 대안들을 점차 배제해 나가는 발달적 과정의 명칭을 쓰고, 남성성과 여성성에 기초하여 직업을 제한하는 제3단계의 공식 명칭을 제시할 것.\n○ 현실적 제약에 직면했을 때 자신의 이상적 진로 포부를 현실과 조율하여 좁히는 현상의 명칭을 쓸 것.\n○ 개인이 타협을 진행할 때 포기하게 되는 3대 차원(성역할, 사회적 지위/위세, 흥미)의 우선순위를 가장 먼저 포기하는 영역부터 가장 끝까지 고수하는 영역 순으로 나열할 것.", "answer": "진로 대안을 줄여나가는 과정은 제한이며 제3단계는 성역할 지향 단계이다.\n수용 가능한 진로 대안을 현실에 맞추어 조율하는 과정의 명칭은 타협이다.\n타협 시 흥미를 가장 먼저 포기하고 사회적 지위를 그다음으로 포기한다.\n자신의 성정체성과 직결되는 성역할은 마지막까지 포기하지 않고 지킨다."}, {"id": "A10", "num": 10, "type": "서술형", "score": 4, "title": "다음은 SNS에 자살 암시 글을 게시하여 위기상담실로 인계된 고등학생 G와의 초기 면담 기록이다. 작성 방법에 따라 서술하시오.", "content": "[위기 사정 면담 기록]\n전문상담교사는 학생 G의 즉각적인 생명 안전을 확인하기 위해 체계적인 자살 사정 프로토콜을 가동하였다.\n\n상담교사는 먼저 학생이 오늘 아침 위기상담실로 오게 된 직접적인 촉발 요인인 SNS 게시글 작성 경위를 파악하였다. 이어서 지난 48시간 동안 구체적인 자살 계획이나 치명적인 자살 수단을 탐색한 사실이 있는지 점검하였다. 이후 지난 2개월간 내담자가 겪었던 우울감과 절망감의 파동을 확인한 후, 과거 평생 동안 시도했던 자살 시도력과 자해 경험을 면밀히 사정하였다. 마지막으로 바로 지금, 이 상담실 문을 나서는 순간 자살을 실행에 옮기려는 즉각적인 충동이 존재하는지 확인하였다.", "instructions": "<작성 방법>\n○ 지문에 적용된 시계열적 자살 사정 면담 모델의 공식 명칭을 영문 약자 또는 한글로 제시할 것.\n○ 해당 모델에서 자살 위험을 사정하기 위해 순차적으로 탐색하는 4대 시간대별 사건 단계를 공식 명칭으로 순서대로 나열할 것.\n○ 해당 사정 모델의 최종 단계에서 상담자가 반드시 확인해야 하는 즉각적 위험 사정 질문의 핵심 내용을 1가지 서술할 것.", "answer": "구체적 자살 사고를 체계적으로 평가하는 모델은 숀 셰이의 케이스 모델이다.\n탐색 순서는 제시 사건 최근 사건 과거 사건 즉각 사건 순으로 진행된다.\n최종 단계인 즉각 사건에서는 상담실을 나선 직후의 자살 계획을 확인한다.\n지금 여기 상담실 안에서 자살 충동을 느끼는지 직접 구체적으로 묻는다."}, {"id": "A11", "num": 11, "type": "서술형", "score": 4, "title": "다음은 학교폭력 사안 처리 결과 통지서와 전문상담교사의 피해학생 지원 일지이다. 작성 방법에 따라 서술하시오.", "content": "[학교폭력대책심의위원회 조치 결정 통지서]\n가해학생 H는 교내 화장실에서 피해학생 I를 지속적으로 폭행하고 금품을 갈취하여 중대한 신체적·정신적 피해를 입혔다. 심의 결과 가해학생 H에게 출석정지 처분을 부과하기로 결정하였다.\n\n[피해학생 지원 일지]\n사안 접수 후 가해학생 H는 피해학생 I에게 \"학폭위에 신고하면 가만두지 않겠다\"며 협박 문자를 전송하는 2차 가해를 자행하였다. 피해학생 I는 극심한 보복 두려움으로 등교를 거부하고 불면증을 겪고 있어, 학교장은 심의위원회의 최종 조치 결정 전 피해학생에 대한 긴급한 보호조치를 즉각 시행하였다.", "instructions": "<작성 방법>\n○ 학교폭력예방법 제17조 제1항에 규정된 가해학생 조치 중 지문에 부과된 '출석정지'의 공식 호수(기호)를 쓰시오.\n○ 가해학생이 신고나 진술을 이유로 피해학생에게 보복행위를 한 경우, 심의위원회가 조치를 결정할 때 적용해야 하는 법적 가중 처분 기준을 서술할 것.\n○ 학교폭력예방법 제16조 제1항에 근거하여 심의위원회 개최 전 학교의 장이 피해학생을 긴급하게 보호하기 위해 시행할 수 있는 조치를 1가지 서술할 것.", "answer": "학교폭력 가해학생에게 부과된 출석정지 조치의 정식 명칭은 제6호 조치이다.\n가해학생이 피해학생에게 보복행위를 한 경우 심의위원회는 처분을 가중 조치한다.\n학교의 장은 피해학생 보호를 위해 전문 상담과 심리치료를 긴급 지원한다.\n2차 피해 방지를 위해 가해학생과의 즉시 분리 조치를 엄격히 시행한다."}, {"id": "A12", "num": 12, "type": "서술형", "score": 4, "title": "다음은 숨이 막히는 증상으로 등교에 곤란을 겪고 있는 고등학생 J와의 상담 축어록이다. 작성 방법에 따라 서술하시오.", "content": "학생 J: 아침에 만원 지하철을 타고 오는데 갑자기 가슴이 터질 듯이 두근거리고 숨이 가빠왔어요. 손발이 저리면서 어지러웠는데, ㉠ \"이러다 심장마비가 와서 여기서 쓰러져 죽겠구나\"라는 생각이 들며 미칠 것 같은 공포가 덮쳤어요.\n상담자: 신체 증상이 나타났을 때 곧바로 죽음에 이를 것이라는 극단적인 공포로 이어졌군요. 병원 검사 결과는 어떠했나요?\n학생 J: 심장내과와 신경과에서 정밀 검사를 받았는데 신체적으로는 아무런 이상이 없대요. 하지만 언제 또 그 증상이 나타나 쓰러질지 몰라 두려워요. 특히 지하철이나 영화관, 만원 버스처럼 사람이 많고 즉시 빠져나오기 힘든 장소는 아예 갈 수가 없어요.\n상담자: 신체 감각을 위험 신호로 오해하는 악순환을 끊어야 합니다. 다음 회기에는 상담실에서 좁은 빨대로 빠르게 호흡하거나 제자리에서 빙글빙글 도는 활동을 통해, 두근거림과 어지러움 같은 신체 감각 자체를 직접 경험하면서 그 감각이 결코 죽음이나 파멸을 초래하지 않는다는 것을 확인해 볼 것입니다.", "instructions": "<작성 방법>\n○ 밑줄 친 ㉠에 나타난 인지적 반응의 공식 명칭을 쓰고, 내담자의 신체 감각이 극심한 공포로 증폭되는 인지모델의 작동 기제를 서술할 것.\n○ 상담자가 내담자의 신체 감각 공포를 둔감화하기 위해 제안한 행동적 치료 기법의 공식 명칭을 쓸 것.\n○ 내담자가 공황 발작의 위협과 함께 즉각 탈출하기 어렵거나 도움을 받기 어려운 장소 2곳 이상을 회피하는 양상을 진단할 수 있는 공식 병명을 제시할 것.", "answer": "밑줄 친 ㉠의 공식 명칭은 신체 감각을 위험으로 여기는 파국적 오해석이다.\n무해한 생리적 각성을 파멸로 잘못 해석하여 극심한 공포가 악순환 증폭된다.\n신체 감각에 직접 직면하게 하는 행동 기법의 명칭은 내수용성 노출이다.\n즉각 탈출하기 어려운 장소를 지속적으로 회피하는 병명은 광장공포증이다."}];
const dataB = [{"id": "B1", "num": 1, "type": "기입형", "score": 2, "title": "다음은 진로상담교사와 동료 교사의 대화이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "동료 교사: 홀랜드 육각형 모델에서 성격 유형 코드 간의 관계를 분석할 때 어떤 기준을 보아야 하나요?\n\n진로상담교사: 육각형 기하학적 모델에서 유형 간의 거리는 심리적 유사성과 밀접한 관련이 있습니다. 육각형 상에서 서로 인접한 유형(예: R과 I)은 상관관계가 높고, 대각선 반대편에 위치한 유형(예: R과 S)은 상관관계가 낮다는 기하학적 거리 비례 원리를 (  ㉠  )(이)라고 합니다.\n\n동료 교사: 그렇군요. 그럼 검사 결과에서 첫 번째 코드와 두 번째 코드가 육각형에서 인접해 있을 때 성격적 안정성이 높다고 보는 개념은 무엇인가요?\n\n진로상담교사: 네, 3자리 코드 중 첫 두 글자가 육각형 상에서 서로 가까이 인접해 있을수록 내적 조화를 이루고 있음을 뜻하는 개념은 (  ㉡  )(이)라고 부릅니다.", "instructions": "", "answer": "㉠: 계측성\n㉡: 일관성"}, {"id": "B2", "num": 2, "type": "기입형", "score": 2, "title": "다음은 분석심리학적 성격 구조에 관한 전문상담교사의 사례 연구 발표문 일부이다. 괄호 안의 ㉠, ㉡에 들어갈 가장 적합한 용어를 각각 쓰시오.", "content": "인간은 사회적 존재로서 타인과의 원만한 관계를 맺고 사회적 규범과 역할 기대에 적응하기 위해 외부 세계에 보여주는 외적 인격, 즉 사회적 가면인 (  ㉠  )을(를) 발달시킵니다. 이는 사회생활을 유지하는 데 필수적인 적응적 기능을 수행합니다.\n\n그러나 개인이 자신의 진정한 자아를 잊어버리고 오직 이 사회적 가면이 곧 자기 자신이라고 착각하는 (  ㉡  )의 함정에 빠지게 되면, 내면의 참된 욕구와 무의식이 억압되어 심각한 자아 소외와 신경증적 갈등을 겪게 됩니다. 따라서 상담자는 내담자가 (  ㉠  )의 순기능을 유지하되, 무의식의 어두운 측면인 그림자를 통합하여 참된 자기를 실현하도록 도와야 합니다.", "instructions": "", "answer": "㉠: 페르소나\n㉡: 동일시"}, {"id": "B3", "num": 3, "type": "서술형", "score": 4, "title": "다음은 보건실에서 자주 의뢰되는 두 학생의 면담 일지이다. 작성 방법에 따라 서술하시오.", "content": "[훈이 면담 일지]\n중학교 3학년 훈이는 매일 아침 극심한 복통과 어지럼증, 전신 근육통을 호소한다. 여러 종합병원에서 내시경과 정밀 MRI 검사를 받았으나 의학적으로 설명 가능한 신체 질환은 발견되지 않았다. 그럼에도 학생은 실제 고통스러운 신체 통증을 지속적으로 경험하고 있으며, 온종일 자신의 통증에만 과도하게 몰두하여 학업을 전혀 수행하지 못하고 있다.\n\n[병철 면담 일지]\n고등학교 1학년 병철는 현재 뚜렷한 신체 통증이나 신체적 증상은 전혀 없다. 그러나 팔에 사소한 모기 물린 자국이나 미열만 있어도 \"림프종이나 불치병에 걸린 것이 틀림없다\"며 극심한 공포에 휩싸인다. 의사가 아무런 이상이 없다고 안심시켜도 믿지 못하고, 일주일 동안 대학병원 4곳을 돌며 검사를 요구하는 이른바 '닥터 쇼핑'을 반복하고 있다.", "instructions": "<작성 방법>\n○ 훈이와 병철의 호소 문제를 바탕으로 각각의 공식 진단명을 제시할 것.\n○ 두 학생의 증상에서 나타나는 '실제 신체적 증상의 존재 여부'를 대비하여 서술할 것.\n○ 병철가 보이는 질병 공포와 관련된 행동적 특징(예: 확인 및 회피 행동)을 지문과 연계하여 1가지 서술할 것.", "answer": "내담자 훈이의 공식 진단명은 신체증상장애이며 병철은 질병불안장애이다.\n훈이는 실제로 일상생활에 지장을 주는 고통스러운 신체 통증 증상이 지속된다.\n병철은 뚜렷한 신체 증상이 없음에도 불치병에 걸렸다는 집착과 불안에 몰두한다.\n병철은 의사의 정상 소견에도 불구하고 여러 병원을 전전하는 확인 행동을 보인다."}, {"id": "B4", "num": 4, "type": "서술형", "score": 4, "title": "다음은 대인 의사소통에 심각한 어려움을 보이는 두 학생에 대한 발달 평가 기록이다. 작성 방법에 따라 서술하시오.", "content": "[진호 발달 기록]\n초등학교 6학년 진호는 대화할 때 상대방의 말에 적절히 차례를 지켜 대답하지 못하고 맥락에 맞지 않는 말만 늘어놓는다. 또한 \"손이 발이 되도록 빌었다\"와 같은 관용어나 비유, 반어법을 전혀 이해하지 못하고 글자 그대로 받아들여 오해를 일으킨다. 그러나 특정한 물건에 대한 과도한 집착이나 손털기, 몸 흔들기 같은 반복적인 상동 행동은 전혀 관찰되지 않는다.\n\n[민우 발달 기록]\n중학교 1학년 민우는 진호와 마찬가지로 언어의 화용론적 기능과 사회적 맥락 파악에 심각한 결함을 보인다. 그런데 민우는 이에 더하여 손가락을 꼬거나 제자리에서 도는 상동증적 행동을 반복하며, 전국의 지하철 노선표 암기에만 하루 종일 병적으로 집착하고 일과표가 1분만 바뀌어도 극심한 분노 발작을 일으킨다.", "instructions": "<작성 방법>\n○ 진호와 민우의 임상 양상을 바탕으로 각각의 공식 진단명을 제시할 것.\n○ 두 장애를 감별하는 가장 결정적인 DSM-5-TR 진단 기준상의 차이점(증상 영역 유무)을 명시할 것.\n○ 진호가 나타내는 의사소통 결함의 핵심 영역(언어 사용 규칙 차원)을 전문 용어로 서술할 것.", "answer": "학생 진호의 진단명은 사회적 실용적 의사소통장애이며 민우는 자폐스펙트럼장애이다.\n두 장애를 구별하는 결정적 감별점은 제한적이고 반복적인 행동 패턴의 유무이다.\n민우는 상동 행동과 집착을 동반하지만 진호는 제한적이고 반복적인 행동이 없다.\n진호는 사회적 맥락에 맞게 소통하는 화용론적 언어 사용 기능에서 결함을 보인다."}, {"id": "B5", "num": 5, "type": "서술형", "score": 4, "title": "다음은 지속적인 무기력과 심리적 붕괴 위기를 호소하는 고등학생 E의 로샤 종합체계 검사 구조요약표의 일부이다. 작성 방법에 따라 서술하시오.", "content": "[로샤 종합체계 구조요약표 주요 변인]\n- 반응 수(R): 23\n- 람다(Lambda): 0.21\n- 경험균형(EB): M : WSumC = 1 : 6.5\n- 경험실제(EA): 7.5\n- 경험자극(es): 11.5\n- D 점수: -2\n- 조정 D 점수(Adj D): -1\n- 조직화 활동(Zf): 12, W:D:Dd = 8:13:2\n- 형태질(X+% / WDA%): 72% / 75%", "instructions": "<작성 방법>\n○ 경험균형(EB) 수치를 바탕으로 내담자의 문제해결 및 스트레스 대처 유형을 공식 명칭으로 제시하고, 그 심리적 특성을 서술할 것.\n○ D 점수(-2)가 시사하는 내담자의 현재 심리적 자원 및 스트레스 상태를 공식 용어로 서술할 것.\n○ 이 내담자를 상담할 때 상담 초기에 우선적으로 투입해야 할 위기 개입적 방향을 1가지 제시할 것.", "answer": "인간운동반응보다 유색반응 점수가 훨씬 높으므로 대처 유형은 외향형이다.\n외부의 정서적 자극에 민감하게 반응하고 행동 중심의 문제해결을 우선 시도한다.\nD 점수가 음수인 상태는 가용 자원보다 스트레스가 큰 과부하 상태이다.\n정서적 통제력 상실을 방지하기 위해 스트레스를 줄이고 지지를 제공한다."}, {"id": "B6", "num": 6, "type": "서술형", "score": 4, "title": "다음은 충동적인 일탈 행동으로 의뢰된 중학생 F의 TCI(기질 및 성격검사) 결과표이다. 작성 방법에 따라 서술하시오.", "content": "[TCI 척도별 백분위 프로파일]\n1. 기질 차원\n- 자극 추구 (Novelty Seeking, NS): 89 백분위 (매우 높음)\n- 위험 회피 (Harm Avoidance, HA): 12 백분위 (매우 낮음)\n- 사회적 보상의존성 (Reward Dependence, RD): 32 백분위 (낮음)\n- 인내력 (Persistence, P): 25 백분위 (낮음)\n\n2. 성격 차원\n- 자율성 (Self-Directedness, SD): 18 백분위 (매우 낮음)\n- 연대감 (Cooperativeness, CO): 21 백분위 (낮음)\n- 자기초월 (Self-Transcendence, ST): 55 백분위 (보통)", "instructions": "<작성 방법>\n○ 기질 차원의 '자극 추구(NS 고)'와 '위험 회피(HA 저)' 조합이 내담자의 행동 양식에 미치는 임상적 특징을 서술할 것.\n○ 성격 차원에서 한 개인의 성숙도와 사회적 적응 수준을 결정하는 2대 핵심 척도의 명칭을 제시할 것.\n○ 내담자의 성격 척도(SD 저, CO 저) 결과를 바탕으로 상담자가 장기적으로 증진시켜야 할 치료적 목표를 서술할 것.", "answer": "자극추구가 높고 위험회피가 낮으면 강한 호기심과 높은 충동성을 보인다.\n잠재적 위험에 대한 조심성이 결여되어 비행이나 규칙 위반 행동을 쉽게 일으킨다.\n성숙도와 사회적 적응을 결정하는 핵심 성격 척도는 자율성과 연대감이다.\n자기 행동을 책임지는 자율성과 타인을 존중하는 연대감을 함께 기른다."}, {"id": "B7", "num": 7, "type": "서술형", "score": 4, "title": "다음은 증상 완화를 위해 서로 다른 기법을 적용한 두 상담 사례이다. 작성 방법에 따라 서술하시오.", "content": "[사례 1]\n고등학생 G는 임원 선거 연설을 앞두고 무대에 설 때 손이 떨릴까 봐 극심한 예기불안을 겪고 있다. 학생은 발표 순간 자신의 손가락과 심장박동에 온 신경을 집중하고 있었다. 이에 상담자는 떨림 증상에 쏠린 과도한 주의를 차단하고, 자신이 전하고자 하는 연설의 참된 가치와 학급 친구들에게 봉사하겠다는 본래의 의미 있는 목표로 관심을 전향하도록 지도하였다.\n\n[사례 2]\n매일 밤 사소한 집안일로 격렬하게 다투는 부부 내담자에게 상담자는 다음과 같이 개입하였다. \"두 분은 오늘부터 다음 상담 회기까지 매일 밤 9시부터 9시 20분까지 거실에 마주 앉아 일부러 가장 격렬하게 큰 소리로 다투십시오. 20분이 지나면 싸움을 즉시 멈추어야 합니다.\" 부부는 당황하였으나 지시를 따르는 과정에서 싸움이 스스로 조절 가능함을 깨달았다.", "instructions": "<작성 방법>\n○ [사례 1]에서 상담자가 적용한 의미치료의 핵심 치료 기법 명칭을 공식 명칭으로 쓰고, 그 치료적 작동 기제를 서술할 것.\n○ [사례 2]에서 상담자가 적용한 전략적 치료 기법의 공식 명칭을 쓸 것.\n○ [사례 2]의 기법이 내담자의 변화를 이끌어내는 심리적 메커니즘을 서술할 것.", "answer": "문제 증상에 대한 과도한 주의를 다른 가치로 돌리는 기법은 탈숙고이다.\n지나친 반성으로 생기는 불안 악순환을 차단하여 자발성을 되찾게 한다.\n두려워하는 증상을 스스로 의도하여 증상을 통제하는 기법은 역설적 의도이다.\n회피하려던 증상을 직면하게 함으로써 증상이 스스로 통제됨을 깨닫게 한다."}, {"id": "B8", "num": 8, "type": "서술형", "score": 4, "title": "다음은 가족 구조의 역동을 다루는 가족상담 사례이다. 작성 방법에 따라 서술하시오.", "content": "[가족상담 관찰 일지]\n상담자는 부모-자녀 간의 상호작용을 관찰하였다. 어머니는 고등학생 아들의 가방 검사는 물론 일기장까지 매일 검사하며 아들의 사생활에 경계 없이 침범하고 있었고, 아들은 어머니의 기분에 따라 자신의 감정이 좌우되는 밀착된 모습을 보였다. 반면 아버지는 이러한 갈등에 전혀 관여하지 않고 차가운 침묵으로 일관하며 가족 구성원들과 정서적으로 완전히 차단되어 있었다.\n\n상담자는 이 가족의 경계선 문제를 다루기 위해, 상담실 안에서 어머니와 아들이 최근 갈등을 빚었던 학원 문제에 대해 평소 집에서 하던 방식 그대로 지금 여기서 직접 대화를 나누어보도록 요청하였다.", "instructions": "<작성 방법>\n○ 건강한 가족이 갖추어야 할 하위체계 간 공식 경계선의 명칭을 쓰고, 지문의 어머니-아들과 아버지에게서 각각 나타나는 병리적 경계선의 명칭을 제시할 것.\n○ 상담실 내에서 가족 갈등 장면을 실제로 직접 재연하도록 요구한 치료 기법의 공식 명칭을 쓸 것.\n○ 해당 기법을 통해 상담자가 가족 구조를 파악하고 개입할 수 있는 치료적 효과를 1가지 서술할 것.", "answer": "어머니와 아들은 밀착된 경계선이며 아버지는 가족과 유리된 경계선이다.\n상담실에서 실제 가족의 갈등 행동을 재연하게 하는 기법은 실연화이다.\n설명으로 듣는 대신 상호작용 패턴을 현장에서 있는 그대로 직접 관찰한다.\n역기능적 의사소통 구조를 교정하고 세대 간 명확한 경계선을 재형성한다."}, {"id": "B9", "num": 9, "type": "서술형", "score": 4, "title": "다음은 자해 행동을 보이는 중학생 H의 상담 축어록이다. 작성 방법에 따라 서술하시오.", "content": "학생 H: 부모님이 저를 무시하고 억압할 때마다 너무 화가 나고 미칠 것 같아요. 하지만 부모님께는 화를 낼 수가 없어요.\n상담자: 부모님을 향한 그 강한 분노와 공격성을 어떻게 처리하나요?\n학생 H: 그 분노가 차오르면 제 방으로 들어가서 제 허벅지를 칼로 긋거나 손등을 피가 날 때까지 물어뜯어요. 저를 아프게 해야 마음이 가라앉아요.\n상담자: 다른 사람에게 표현해야 할 에너지를 자신에게로 돌려 공격하고 있군요. 다음 시간에는 맞은편에 빈 의자를 두고, 한쪽에는 '부모님께 분노하는 나'를, 다른 쪽에는 '자신을 처벌하는 나'를 앉혀 두 자아가 직접 대화를 나누며 내면의 갈등을 다루어보겠습니다.", "instructions": "<작성 방법>\n○ 타인에게 표현해야 할 정서적 에너지를 자신에게로 돌려 자해하는 접촉경계혼란의 공식 명칭을 쓸 것.\n○ 상담자가 제안한 빈 의자를 활용한 게슈탈트 대표 기법의 명칭을 제시할 것.\n○ 해당 기법을 통해 내담자가 달성해야 하는 궁극적인 치료적 목표(자아 통합 측면)를 서술할 것.", "answer": "원래 타인에게 하고 싶었던 행동을 자신에게 돌리는 접촉경계혼란은 반전이다.\n내면의 양극성을 대화시켜 해소하는 게슈탈트 상담 기법은 빈의자 기법이다.\n자신을 자책하는 승리자와 억압된 패배자가 서로 솔직하게 대면하게 한다.\n소외되었던 부정적 감정을 수용하고 온전한 자기 통합을 이루도록 돕는다."}, {"id": "B10", "num": 10, "type": "서술형", "score": 4, "title": "다음은 진로 적응에 어려움을 겪는 고등학생 I에 대한 진로상담 일지이다. 작성 방법에 따라 서술하시오.", "content": "[생애설계 진로상담 일지]\n상담자는 내담자의 생애 주제를 탐색하기 위해 진로 이야기 면담을 진행하였다.\n\n상담자는 내담자에게 다음과 같은 질문들을 순차적으로 던졌다.\n1. \"어린 시절 가장 존경하거나 닮고 싶었던 역할모델 3명은 누구입니까?\"\n2. \"평소 가장 즐겨 읽는 잡지나 즐겨 시청하는 텔레비전 프로그램은 무엇입니까?\"\n3. \"가장 기억에 남는 좋아하는 책이나 영화의 줄거리는 무엇입니까?\"\n4. \"어린 시절의 가장 초기의 기억 3가지는 무엇입니까?\"\n\n이를 통해 내담자가 자신의 생애 이야기를 능동적으로 재구성하고, 다가올 미래의 직업적 전환에 유연하게 대처할 수 있는 진로적응도를 구축하도록 안내하였다.", "instructions": "<작성 방법>\n○ 지문에 적용된 사비카스의 생애 직업 스타일 면담(CSI)에서 위의 질문들을 통해 파악하고자 하는 핵심 개념의 명칭을 쓸 것.\n○ 진로적응도를 구성하는 4대 차원(4C)의 공식 명칭을 3가지 이상 제시할 것.\n○ 4대 차원 중 내담자가 자신의 진로 미래를 스스로 결정하고 통제할 수 있다는 신념을 뜻하는 차원의 명칭을 제시할 것.", "answer": "생애 직업 스타일 면담을 통하여 파악하려는 핵심 개념은 생애 주제이다.\n진로적응도를 구성하는 핵심 4대 차원은 관심 통제 호기심 자신감이다.\n미래 진로를 스스로 결정하고 책임질 수 있다고 믿는 차원은 통제이다.\n진로 발달 과업에 주도적으로 대처하며 내담자의 적응 역량을 극대화한다."}, {"id": "B11", "num": 11, "type": "서술형", "score": 4, "title": "다음은 급성 외상 스트레스를 겪는 학생 J에 대한 학교 위기개입 기록이다. 작성 방법에 따라 서술하시오.", "content": "[위기개입 면담 기록]\n친한 친구의 갑작스러운 사망 소식을 접하고 호흡곤란과 패닉 상태에 빠진 학생 J가 상담실로 급히 후송되었다.\n\n상담교사는 즉시 학생의 안전을 확보하고 정서적 쇼크를 완화하기 위해 개입하였다. 학생의 공포와 충격을 온전히 경청하고 수용하며 따뜻한 심리적 지지를 전달하여 신뢰 관계를 구축하였다. 이후 학생이 실행할 수 있는 현실적 대처 방안들을 모색하고 단기 행동 계획을 수립하였다.\n\n면담 종료 직전, 상담교사는 학생이 상담실을 나선 후에도 안전을 유지할 수 있도록 구체적인 이행 서약이 포함된 안전계획서를 함께 작성하고, 학생이 스스로 실천하겠다는 명확한 동의를 표명하도록 참여를 이끌어냈다.", "instructions": "<작성 방법>\n○ 지문에 적용된 길리랜드의 위기개입 6단계 중 학생에게 온전한 경청과 수용을 전달한 제3단계의 공식 명칭을 쓸 것.\n○ 면담 마무리 단계에서 안전계획서를 작성하고 내담자의 구체적 실천 서약을 이끌어낸 제6단계의 공식 명칭을 쓸 것.\n○ 위기개입 시 안전계획서에 반드시 포함되어야 하는 핵심 구성 요소 2가지를 서술할 것.", "answer": "정서적 안정을 형성하는 제3단계는 지지를 제공하는 지지 제공 단계이다.\n구체적 행동을 약속하는 제6단계는 참여를 이끌어내는 참여 유도 단계이다.\n자살 위험을 차단하기 위해 위기 시 연락할 비상 연락망을 명확히 적는다.\n위험 수단에 대한 접근을 차단하고 구체적 대처 지침인 안전계획서를 쓴다."}];

let currentPeriod = 'A';
let allMasked = false;
let isPaperMode = false;

// 30분 스톱워치 (5400초)
let timerSeconds = 30 * 60;
let timerInterval = null;
let isTimerRunning = true;

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) {
      timerSeconds--;
      updateTimerUI();
    } else {
      clearInterval(timerInterval);
      alert("종료 시각입니다! 작성하신 답안지를 최종 점검해 주세요.");
    }
  }, 1000);
}

function updateTimerUI() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const el = document.getElementById('timer-display');
  el.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  el.classList.toggle('warning', timerSeconds < 300);
}

function toggleTimer() {
  const btn = document.getElementById('btn-timer-toggle');
  if (isTimerRunning) {
    clearInterval(timerInterval);
    isTimerRunning = false;
    btn.textContent = '계속';
  } else {
    startTimer();
    isTimerRunning = true;
    btn.textContent = '일시정지';
  }
}

function resetTimer() {
  timerSeconds = 30 * 60;
  updateTimerUI();
  if (!isTimerRunning) {
    startTimer();
    isTimerRunning = true;
    document.getElementById('btn-timer-toggle').textContent = '일시정지';
  }
}

function togglePaperMode() {
  isPaperMode = !isPaperMode;
  document.body.classList.toggle('b4-paper-mode', isPaperMode);
  document.getElementById('btn-paper-mode').textContent = isPaperMode ? 'CBT 다크 모드' : 'B4 시험지 모드';
  showToast(isPaperMode ? '실전 B4 시험지 질감 모드로 전환되었습니다.' : 'CBT 다크 모드로 전환되었습니다.');
}

function init() {
  renderNav();
  renderCards();
  loadSavedAnswers();
  updateProgress();
  startTimer();
}

function switchPeriod(p) {
  currentPeriod = p;
  document.getElementById('tab-btn-A').classList.toggle('active', p === 'A');
  document.getElementById('tab-btn-B').classList.toggle('active', p === 'B');
  renderNav();
  renderCards();
  loadSavedAnswers();
  updateProgress();
}

function getList() {
  return currentPeriod === 'A' ? dataA : dataB;
}

function renderNav() {
  const nav = document.getElementById('nav-strip');
  const items = getList();
  nav.innerHTML = '';
  items.forEach(item => {
    const pill = document.createElement('button');
    pill.className = 'nav-pill';
    pill.id = 'nav-pill-' + currentPeriod + item.num;
    pill.textContent = currentPeriod + item.num + '번';
    pill.onclick = () => {
      const card = document.getElementById('card-' + currentPeriod + item.num);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const ta = document.getElementById('ta-' + currentPeriod + item.num);
        if (ta) ta.focus();
      }
    };
    nav.appendChild(pill);
  });
}

function renderCards() {
  const container = document.getElementById('exam-cards-container');
  const items = getList();
  container.innerHTML = '';

  items.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + currentPeriod + q.num;

    const badgeCls = q.type === '기입형' ? 'fillin' : 'essay';

    card.innerHTML = `
      <div class="q-card-head">
        <div class="q-num-title">
          <span>제${q.num}문</span>
          <span class="type-pill ${badgeCls}">${q.type}</span>
        </div>
        <span class="q-score-tag">[${q.score}점]</span>
      </div>

      <div class="q-card-body">
        <div class="q-question-text">${escapeHtml(q.title)}</div>

        <div class="passage-wrapper">${escapeHtml(q.content)}</div>

        ${q.instructions ? `<div class="instructions-box"><strong>&lt;작성 방법 및 출제 조건&gt;</strong><br>${escapeHtml(q.instructions)}</div>` : ''}

        <div class="sheet-grid">
          <!-- Left: 수험생 B4 실전 4줄 답안지 -->
          <div class="sheet-col">
            <div class="sheet-col-header">
              <span>수험생 실전 답안지 (B4 4줄 가이드라인)</span>
              <div class="line-status-chip" id="chip-box-${currentPeriod}${q.num}">
                <span class="chip-item">총 0자</span>
              </div>
            </div>
            <textarea 
              class="b4-typing-sheet" 
              id="ta-${currentPeriod}${q.num}" 
              placeholder="실전 B4 답안지처럼 줄당 38~45자 규격으로 타이핑해 보세요..."
              oninput="handleInput('${currentPeriod}', ${q.num})"></textarea>
          </div>

          <!-- Right: KICE 100% 모범답안 -->
          <div class="sheet-col">
            <div class="sheet-col-header">
              <span>KICE 100% 만점 공식 모범답안 (동일 대조선)</span>
              <div>
                <button class="btn-sheet-mini" onclick="toggleMask('${currentPeriod}', ${q.num})">가리기/보기</button>
                <button class="btn-sheet-mini" onclick="copyModelAnswer('${currentPeriod}', ${q.num})">복사</button>
              </div>
            </div>
            <div class="b4-answer-sheet" id="ans-${currentPeriod}${q.num}">${escapeHtml(q.answer)}</div>
          </div>
        </div>

        <!-- 실시간 칼채점 가이드 바 -->
        <div class="scoring-eval-bar">
          <span>줄당 권장 규격: <strong>공백 포함 38~45자</strong> (총 4줄 완료 시 만점)</span>
          <span class="eval-score-text" id="eval-score-${currentPeriod}${q.num}">판정 대기</span>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

function handleInput(period, num) {
  const ta = document.getElementById('ta-' + period + num);
  const text = ta.value;
  const lines = text.split('\n');
  const chipBox = document.getElementById('chip-box-' + period + num);
  const evalScore = document.getElementById('eval-score-' + period + num);

  // 줄별 실시간 글자수 분석
  let chipsHtml = `<span class="chip-item">총 ${text.length}자</span>`;
  let validLineCount = 0;

  lines.forEach((l, idx) => {
    if (idx < 4) {
      const len = l.length;
      const isOk = (len >= 38 && len <= 45);
      if (isOk) validLineCount++;
      chipsHtml += `<span class="chip-item ${isOk ? 'perfect' : ''}">${idx+1}줄:${len}자</span>`;
    }
  });
  chipBox.innerHTML = chipsHtml;

  // 칼채점 점수 피드백
  if (text.trim().length === 0) {
    evalScore.textContent = '판정 대기';
    evalScore.style.color = 'var(--accent-gold)';
  } else if (validLineCount === 4) {
    evalScore.textContent = '★ 4줄 B4 규격 100% 만점 일치! (4.0 / 4.0)';
    evalScore.style.color = 'var(--accent-emerald)';
  } else {
    evalScore.textContent = `현재 ${lines.length}줄 작성 중 (규격 일치 ${validLineCount}줄)`;
    evalScore.style.color = 'var(--accent-blue)';
  }

  localStorage.setItem('kice_real_cbt_' + period + num, text);

  const pill = document.getElementById('nav-pill-' + period + num);
  if (pill) pill.classList.toggle('done', text.length >= 20);

  updateProgress();
}

function updateProgress() {
  const items = getList();
  let done = 0;
  items.forEach(q => {
    const saved = localStorage.getItem('kice_real_cbt_' + currentPeriod + q.num);
    if (saved && saved.trim().length >= 20) done++;
  });
  document.getElementById('progress-count').textContent = `${done} / ${items.length} 문항 완료`;
}

function loadSavedAnswers() {
  const items = getList();
  items.forEach(q => {
    const saved = localStorage.getItem('kice_real_cbt_' + currentPeriod + q.num);
    if (saved) {
      const ta = document.getElementById('ta-' + currentPeriod + q.num);
      if (ta) {
        ta.value = saved;
        handleInput(currentPeriod, q.num);
      }
    }
  });
}

function toggleMask(period, num) {
  const el = document.getElementById('ans-' + period + num);
  if (el) el.classList.toggle('masked');
}

function toggleAllMasks() {
  allMasked = !allMasked;
  const items = getList();
  items.forEach(q => {
    const el = document.getElementById('ans-' + currentPeriod + q.num);
    if (el) el.classList.toggle('masked', allMasked);
  });
  document.getElementById('btn-toggle-all').textContent = allMasked ? '모범답안 전체 보기' : '모범답안 전체 가리기';
}

function copyModelAnswer(period, num) {
  const items = period === 'A' ? dataA : dataB;
  const q = items.find(x => x.num === num);
  if (q && q.answer) {
    navigator.clipboard.writeText(q.answer).then(() => showToast('모범답안이 복사되었습니다!'));
  }
}

function clearCurrentAnswers() {
  if (!confirm('현재 ' + currentPeriod + '형의 모든 수험생 작성 내용을 초기화하시겠습니까?')) return;
  const items = getList();
  items.forEach(q => {
    localStorage.removeItem('kice_real_cbt_' + currentPeriod + q.num);
    const ta = document.getElementById('ta-' + currentPeriod + q.num);
    if (ta) ta.value = '';
    const chipBox = document.getElementById('chip-box-' + currentPeriod + q.num);
    if (chipBox) chipBox.innerHTML = '<span class="chip-item">총 0자</span>';
    const evalScore = document.getElementById('eval-score-' + currentPeriod + q.num);
    if (evalScore) { evalScore.textContent = '판정 대기'; evalScore.style.color = 'var(--accent-gold)'; }
    const pill = document.getElementById('nav-pill-' + currentPeriod + q.num);
    if (pill) pill.classList.remove('done');
  });
  updateProgress();
  showToast('답안지가 초기화되었습니다.');
}

function exportAnswers() {
  const items = getList();
  let txt = `=======================================================================\n`;
  txt += `[2027학년도 공립 중등 전문상담교사 임용후보자 선정경쟁시험 ${currentPeriod}형 답안지]\n`;
  txt += `수험자: 변귀섭 대표님 | 제출일시: ${new Date().toLocaleString()}\n`;
  txt += `=======================================================================\n\n`;

  items.forEach(q => {
    const ans = localStorage.getItem('kice_real_cbt_' + currentPeriod + q.num) || '(미작성)';
    txt += `[제${q.num}문 - ${q.type} (${q.score}점)]\n`;
    txt += `문제: ${q.title}\n`;
    txt += `수험생 작성 답안:\n${ans}\n\n`;
    txt += `-----------------------------------------------------------------------\n\n`;
  });

  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `2027_임용_전문상담_${currentPeriod}형_변귀섭대표님_답안지.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('실전 답안지가 TXT 파일로 다운로드되었습니다!');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

window.addEventListener('DOMContentLoaded', init);
</script>
