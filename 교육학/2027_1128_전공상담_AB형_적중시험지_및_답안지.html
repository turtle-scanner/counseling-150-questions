let allMasked = false;
let activeSection = 'ALL';

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightKws(line, kws) {
  let out = escapeHtml(line);
  [...kws].sort((a, b) => b.length - a.length).forEach(kw => {
    const ek = escapeHtml(kw);
    out = out.split(ek).join(`<span class="kw">${ek}</span>`);
  });
  return out;
}

function renderList(list, containerId, periodLabel) {
  const container = document.getElementById(containerId);
  container.innerHTML = list.map(q => {
    const asksHtml = q.asks.length > 0
      ? `<div class="q-asks"><strong>&lt;작성 방법&gt;</strong><br>${q.asks.map(a => '○ ' + escapeHtml(a)).join('<br>')}</div>`
      : '';
    const ansLinesHtml = q.ans.map(ln => `<div>${highlightKws(ln, q.kws)}</div>`).join('');
    const rows = q.type === '기입형' ? 2 : 4;
    return `
      <div class="q-block ${periodLabel === 'B' ? 'type-b' : ''}">
        <div class="q-header">
          <span>${q.num}. ${escapeHtml(q.lead)} [${q.score}점]</span>
          <span class="q-badge ${q.type === '서술형' ? 'essay' : ''}">${q.type}</span>
        </div>
        <div class="q-passage">${escapeHtml(q.passage)}</div>
        ${asksHtml}
        <div class="b4-ans-box ${allMasked ? 'masked' : ''}" onclick="this.classList.toggle('masked')" title="클릭하면 가리거나 볼 수 있습니다">${ansLinesHtml}</div>
        <div class="practice-wrap">
          <textarea class="practice-input" rows="${rows}" placeholder="${q.type === '기입형' ? '㉠, ㉡ 정답을 직접 입력해 보세요...' : '직접 4줄 답안을 타이핑해 보세요 (인쇄 후 손글씨 연습 가능)...'}" oninput="this.nextElementSibling.textContent='작성 글자 수: '+this.value.length+'자';"></textarea>
          <div class="char-info">작성 글자 수: 0자</div>
        </div>
      </div>
    `;
  }).join('');
}

function filterExam(sec, btnEl) {
  activeSection = sec;
  document.getElementById('section-A').style.display = (sec === 'ALL' || sec === 'A') ? 'block' : 'none';
  document.getElementById('section-B').style.display = (sec === 'ALL' || sec === 'B') ? 'block' : 'none';
  ['btn-show-all', 'btn-show-a', 'btn-show-b'].forEach(id => {
    const b = document.getElementById(id);
    b.className = 'btn ' + (b === btnEl ? 'active-tab' : 'dark');
  });
}

function toggleAllAnswers() {
  allMasked = !allMasked;
  document.querySelectorAll('.b4-ans-box').forEach(el => el.classList.toggle('masked', allMasked));
  const btn = document.getElementById('btn-mask-all');
  btn.textContent = allMasked ? '👀 정답 모두 보기' : '🙈 정답 가리기 (백지 연습)';
}

function speakCurrentSection() {
  if (!('speechSynthesis' in window)) return alert('이 브라우저는 음성 낭독을 지원하지 않습니다.');
  window.speechSynthesis.cancel();
  const list = activeSection === 'A' ? EXAM_A : (activeSection === 'B' ? EXAM_B : [...EXAM_A, ...EXAM_B]);
  const text = list.map(q => `${q.num}번 모범답안. ${q.ans.join(' ')}`).join(' ');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 0.96;
  window.speechSynthesis.speak(u);
}

renderList(EXAM_A, 'container-A', 'A');
renderList(EXAM_B, 'container-B', 'B');
