      '전제와 결론 사이의 비약과 모순을 지적하는 (다)는 논리적 논박이다.',
      '타인의 시선에 대한 파국적 두려움을 깨뜨리는 수치심 공격 연습을 실천한다.'
    ],
    kws: ['실증적(경험적) 논박', '실용적 논박', '논리적 논박', '수치심 공격 연습']
  },
  {
    num: 11, type: '서술형', score: 4,
    lead: '다음은 아동중심 놀이치료실의 상담 축어록 일부이다. <작성 방법>에 따라 서술하시오.',
    passage: `[아동중심 놀이치료실의 상담 축어록]
초등학교 1학년 아동 M이 놀이치료실에서 20분 넘게 정성을 다해 크레파스로 공룡 그림을 색칠한 뒤, 그림을 높이 들어 보이며 상담자에게 다가왔다.

아동 M: "선생님! 이것 좀 보세요. 제가 그린 공룡 멋지죠? 저 그림 잘 그렸죠?"
상담자: "M이 이 공룡을 색칠하려고 다양한 색깔을 고르고 선 밖으로 나가지 않게 끝까지 집중해서 열심히 칠했구나!"

잠시 후 아동 M은 모래놀이 상자에서 원하던 자동차 장난감이 바퀴가 빠지자 갑자기 얼굴이 붉어지며 화를 내더니, 장난감 칼을 집어 들고 상담자의 얼굴을 향해 세게 찌르려고 달려들었다.

상담자: (부드럽지만 단호하게 아동의 손을 멈추며) "M아, 네가 지금 자동차가 망가져서 너무 속상하고 선생님한테도 아주 화가 많이 났구나. 화가 날 수 있어. 하지만 장난감 칼로 선생님의 얼굴을 찌르는 것은 안 되는 거야. 선생님은 다치면 안 되거든. 대신 네가 화가 난 마음을 풀고 싶다면 저기 서 있는 보보 인형이나 스펀지 쿠션을 찌르는 것은 할 수 있어."

아동 M은 잠시 멈칫하더니 상담자의 안내를 받아들여 스펀지 쿠션을 힘껏 찌르며 분노를 안전하게 발산한 뒤 안정을 되찾았다.`,
    asks: [
      '결과를 평가하는 칭찬 대신 사용하여 자아존중감을 키우는 반응 기법을 쓸 것.',
      '상담자가 아동의 위험한 행동을 다룰 때 적용한 제한설정 3단계의 각 내용을 쓸 것.'
    ],
    ans: [
      '결과를 평가하는 칭찬 대신 노력과 과정을 인정(격려)해 자아존중감을 키운다.',
      '아동의 분노와 파괴 욕구를 먼저 충분히 수용하고 깊이 공감하며 인정한다(A).',
      '선생님을 찌르는 행동은 안 된다고 한계와 제한을 명확히 전달한다(C).',
      '대신 보보 인형을 찌를 수 있도록 안전하고 수용 가능한 대안을 제시한다(T).'
    ],
    kws: ['과정 인정(격려)', '수용', '제한', '대안']
  }
];

let allMasked = false;
let activeSection = 'ALL';

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightKws(line, kws) {
  let out = escapeHtml(line);
  [...kws].sort((a, b) => b.length - a.length).forEach(kw => {
    const ek = escapeHtml(kw);
    out = out.split(ek).join(`<span class="kw">${ek}</span>`);
  });
  return out;
}

const STORAGE_KEY = 'kice_2027_ab_exam_inputs_v1';
let savedInputs = {};
try {
  savedInputs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
} catch (e) {
  savedInputs = {};
}

function normText(s) {
  return String(s || '').replace(/[\s.,'"`·()\-:/]/g, '').toLowerCase();
}

function updateProgress() {
  const inputs = document.querySelectorAll('.line-input');
  let done = 0;
  inputs.forEach(inp => {
    if (inp.classList.contains('matched')) done++;
  });
  const pill = document.getElementById('progress-pill');
  if (pill) pill.textContent = `완료: ${done} / ${inputs.length}줄`;
}

function handleLineInput(inp) {
  const key = inp.dataset.key;
  const target = inp.dataset.target;
  const val = inp.value;
  savedInputs[key] = val;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedInputs)); } catch (e) {}

  const isMatch = normText(val).length > 0 && normText(val) === normText(target);
  inp.classList.toggle('matched', isMatch);
  const badge = inp.previousElementSibling;
  if (badge) {
    badge.classList.toggle('done', isMatch);
    badge.textContent = isMatch ? '✅ 완료' : inp.dataset.label;
  }
  updateProgress();
}

function handleLineKeydown(e, inp) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const all = Array.from(document.querySelectorAll('.line-input')).filter(el => el.offsetParent !== null);
    const idx = all.indexOf(inp);
    if (idx >= 0 && idx + 1 < all.length) {
      all[idx + 1].focus();
    }
  }
}

function resetAllInputs() {
  if (!confirm('작성한 모든 답안 연습 기록을 초기화할까요?')) return;
  savedInputs = {};
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  document.querySelectorAll('.line-input').forEach(inp => {
    inp.value = '';
    handleLineInput(inp);
  });
}

function renderList(list, containerId, periodLabel) {
  const container = document.getElementById(containerId);
  container.innerHTML = list.map(q => {
    const asksHtml = q.asks.length > 0
      ? `<div class="q-asks"><strong>&lt;작성 방법&gt;</strong><br>${q.asks.map(a => '○ ' + escapeHtml(a)).join('<br>')}</div>`
      : '';
    const ansLinesHtml = q.ans.map(ln => `<div>${highlightKws(ln, q.kws)}</div>`).join('');
    const practiceRowsHtml = q.ans.map((ln, idx) => {
      const key = `${periodLabel}_${q.num}_${idx}`;
      const label = q.type === '기입형' ? '정답' : `${idx + 1}줄`;
      const prevVal = savedInputs[key] || '';
      const isMatch = normText(prevVal).length > 0 && normText(prevVal) === normText(ln);
      return `
        <div class="line-row">
          <span class="line-badge ${isMatch ? 'done' : ''}">${isMatch ? '✅ 완료' : label}</span>
          <input type="text"
            class="line-input ${isMatch ? 'matched' : ''}"
            data-key="${key}"
            data-label="${label}"
            data-target="${escapeHtml(ln).replace(/"/g, '&quot;')}"
            value="${escapeHtml(prevVal).replace(/"/g, '&quot;')}"
            placeholder="${escapeHtml(ln).replace(/"/g, '&quot;')} (보고 치기 / Enter 다음)"
            oninput="handleLineInput(this)"
            onkeydown="handleLineKeydown(event, this)">
        </div>
      `;
    }).join('');
    return `
      <div class="q-block ${periodLabel === 'B' ? 'type-b' : ''}">
        <div class="q-header">
          <span>${q.num}. ${escapeHtml(q.lead)} [${q.score}점]</span>
          <span class="q-badge ${q.type === '서술형' ? 'essay' : ''}">${q.type}</span>
        </div>
        <div class="q-passage">${escapeHtml(q.passage)}</div>
        ${asksHtml}
        <div class="b4-ans-box ${allMasked ? 'masked' : ''}" onclick="this.classList.toggle('masked')" title="클릭하면 가리거나 볼 수 있습니다">${ansLinesHtml}</div>
        <div class="practice-wrap">${practiceRowsHtml}</div>
      </div>
    `;
  }).join('');
  updateProgress();
}

function filterExam(sec, btnEl) {
  activeSection = sec;
  document.getElementById('section-A').style.display = (sec === 'ALL' || sec === 'A') ? 'block' : 'none';
  document.getElementById('section-B').style.display = (sec === 'ALL' || sec === 'B') ? 'block' : 'none';
  ['btn-show-all', 'btn-show-a', 'btn-show-b'].forEach(id => {
    const b = document.getElementById(id);
    b.className = 'btn ' + (b === btnEl ? 'active-tab' : 'dark');
  });
}

function toggleAllAnswers() {
  allMasked = !allMasked;
  document.querySelectorAll('.b4-ans-box').forEach(el => el.classList.toggle('masked', allMasked));
  const btn = document.getElementById('btn-mask-all');
  btn.textContent = allMasked ? '👀 정답 모두 보기' : '🙈 정답 가리기 (백지 연습)';
}

function speakCurrentSection() {
  if (!('speechSynthesis' in window)) return alert('이 브라우저는 음성 낭독을 지원하지 않습니다.');
  window.speechSynthesis.cancel();
  const list = activeSection === 'A' ? EXAM_A : (activeSection === 'B' ? EXAM_B : [...EXAM_A, ...EXAM_B]);
  const text = list.map(q => `${q.num}번 모범답안. ${q.ans.join(' ')}`).join(' ');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 0.96;
  window.speechSynthesis.speak(u);
}

renderList(EXAM_A, 'container-A', 'A');
renderList(EXAM_B, 'container-B', 'B');
</script>
