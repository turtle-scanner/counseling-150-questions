<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 KICE 임용고시 전공 전문상담교사 55대 핵심 출제 마스터 (인쇄 및 웹 뷰)</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #090d16;
  --bg-card: #151e2e;
  --bg-input: #0f1624;
  --border-card: #23324a;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --gold: #f59e0b;
  --gold-bg: rgba(245, 158, 11, 0.12);
  --emerald: #10b981;
  --emerald-bg: rgba(16, 185, 129, 0.12);
  --sky: #38bdf8;
  --sky-bg: rgba(56, 189, 248, 0.12);
  --rose: #f43f5e;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: 'Noto Sans KR', sans-serif;
  line-height: 1.6;
  padding-bottom: 80px;
}

/* Header */
.top-header {
  background: rgba(15, 22, 36, 0.95);
  border-bottom: 1px solid var(--border-card);
  padding: 18px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.header-container {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}
.header-title-box h1 {
  font-size: 1.35rem;
  font-weight: 800;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-title-box p {
  font-size: 0.85rem;
  color: var(--text-sub);
  margin-top: 4px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Buttons */
.btn {
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-print {
  background: var(--gold);
  color: #000;
}
.btn-print:hover {
  background: #d97706;
  transform: translateY(-1px);
}
.btn-blind {
  background: #1e293b;
  border-color: #334155;
  color: #f8fafc;
}
.btn-blind.active {
  background: var(--rose);
  border-color: var(--rose);
  color: #fff;
}

/* Search Box */
.search-input {
  background: var(--bg-input);
  border: 1px solid var(--border-card);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.88rem;
  outline: none;
  width: 220px;
}
.search-input:focus {
  border-color: var(--sky);
}

/* Filter Nav */
.filter-nav {
  max-width: 1400px;
  margin: 18px auto 0;
  padding: 0 24px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}
.tab-btn {
  background: #111827;
  border: 1px solid var(--border-card);
  color: var(--text-sub);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn.active, .tab-btn:hover {
  background: var(--sky-bg);
  border-color: var(--sky);
  color: var(--sky);
}

/* Content Container */
.main-container {
  max-width: 1400px;
  margin: 24px auto 0;
  padding: 0 24px;
}

/* Domain Section */
.domain-section {
  margin-bottom: 40px;
}
.domain-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border-card);
  margin-bottom: 20px;
}
.domain-badge {
  background: var(--sky);
  color: #000;
  font-size: 0.85rem;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 20px;
}
.domain-title {
  font-size: 1.25rem;
  font-weight: 800;
  color: #fff;
}

/* Cards Grid */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}
@media (min-width: 1100px) {
  .cards-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Topic Card */
.topic-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}
.topic-card:hover {
  border-color: #3b82f6;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.card-num {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 800;
  color: var(--gold);
  font-size: 0.95rem;
}
.card-title-text {
  font-size: 1.05rem;
  font-weight: 800;
  color: #fff;
  line-height: 1.4;
}
.card-concept {
  font-size: 0.84rem;
  color: var(--sky);
  background: var(--sky-bg);
  padding: 6px 10px;
  border-radius: 6px;
  border-left: 3px solid var(--sky);
  margin-top: 4px;
}

/* Sub-questions Box */
.sub-q-box {
  background: #090d16;
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 0.85rem;
}
.sub-q-header {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sub-q-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sub-q-list li {
  color: #e2e8f0;
  line-height: 1.5;
  display: flex;
  gap: 6px;
}
.sub-q-list li span.q-num {
  color: var(--sky);
  font-weight: 700;
}

/* Keyword Tags */
.kw-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.kw-tag {
  background: rgba(56, 189, 248, 0.1);
  color: var(--sky);
  border: 1px solid rgba(56, 189, 248, 0.25);
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.78rem;
  font-weight: 600;
}

/* Model Answer Box */
.ans-box {
  background: #0b1524;
  border: 1px solid #1e3a5f;
  border-left: 3px solid var(--emerald);
  border-radius: 8px;
  padding: 12px 14px;
}
.ans-header {
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--emerald);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ans-lines {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 0.88rem;
  line-height: 1.6;
  color: #f1f5f9;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ans-line-item {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px dashed rgba(255,255,255,0.06);
  padding-bottom: 3px;
}

/* Rubric Box */
.rubric-box {
  background: rgba(245, 158, 11, 0.05);
  border: 1px solid rgba(245, 158, 11, 0.25);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.8rem;
}
.rubric-header {
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 6px;
}
.rubric-items {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: #cbd5e1;
}

/* Blind Mode */
body.blind-mode .ans-lines,
body.blind-mode .kw-tag {
  filter: blur(5px);
  user-select: none;
  transition: filter 0.2s;
}
body.blind-mode .ans-lines:hover,
body.blind-mode .kw-tag:hover {
  filter: blur(0);
}

/* ================= PRINT CSS OPTIMIZATION ================= */
@media print {
  @page {
    size: A4 portrait;
    margin: 12mm 10mm;
  }
  body {
    background: #fff !important;
    color: #000 !important;
    font-size: 9.5pt;
    line-height: 1.4;
    padding-bottom: 0;
  }
  .top-header, .filter-nav, .btn, .search-input, .no-print {
    display: none !important;
  }
  .main-container {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .domain-section {
    page-break-before: always;
    margin-bottom: 20px !important;
  }
  .domain-section:first-child {
    page-break-before: avoid;
  }
  .domain-header {
    border-bottom: 2px solid #000 !important;
    padding-bottom: 6px !important;
    margin-bottom: 12px !important;
  }
  .domain-badge {
    background: #000 !important;
    color: #fff !important;
    font-size: 8pt;
    padding: 2px 8px;
  }
  .domain-title {
    color: #000 !important;
    font-size: 13pt;
  }
  .cards-grid {
    grid-template-columns: 1fr !important;
    gap: 14px !important;
  }
  .topic-card {
    background: #fff !important;
    border: 1px solid #333 !important;
    color: #000 !important;
    padding: 12px 14px !important;
    box-shadow: none !important;
    page-break-inside: avoid !important;
    margin-bottom: 10px !important;
  }
  .card-num {
    color: #000 !important;
    font-size: 9pt;
  }
  .card-title-text {
    color: #000 !important;
    font-size: 11pt;
  }
  .card-concept {
    background: #f1f5f9 !important;
    color: #000 !important;
    border-left: 3px solid #333 !important;
    font-size: 8.5pt;
    padding: 4px 6px;
  }
  .sub-q-box {
    background: #f8fafc !important;
    border: 1px solid #cbd5e1 !important;
    padding: 8px 10px !important;
    font-size: 8.5pt !important;
  }
  .sub-q-header {
    color: #000 !important;
  }
  .sub-q-list li {
    color: #111 !important;
  }
  .kw-tag {
    background: #f1f5f9 !important;
    color: #000 !important;
    border: 1px solid #cbd5e1 !important;
    font-size: 8pt !important;
  }
  .ans-box {
    background: #fafafa !important;
    border: 1px solid #666 !important;
    border-left: 3px solid #000 !important;
    padding: 8px 10px !important;
  }
  .ans-header {
    color: #000 !important;
    font-size: 8.5pt;
  }
  .ans-lines {
    color: #000 !important;
    font-size: 9pt;
    line-height: 1.45;
  }
  .ans-line-item {
    border-bottom: 1px solid #ddd !important;
  }
  .rubric-box {
    background: #fff !important;
    border: 1px dashed #666 !important;
    padding: 6px 8px !important;
    font-size: 8pt !important;
  }
  .rubric-header {
    color: #000 !important;
  }
  .rubric-items {
    color: #222 !important;
  }
  body.blind-mode .ans-lines,
  body.blind-mode .kw-tag {
    filter: none !important;
  }
}
</style>
</head>
<body>

<header class="top-header">
  <div class="header-container">
    <div class="header-title-box">
      <h1>🏆 2027 KICE 임용고시 전공 전문상담교사 55대 핵심 출제 마스터</h1>
      <p>7대 핵심 영역(정신병리·심리검사·상담이론·가족치료·진로상담·집단대인·위기놀이법) 55대 필수 테마 및 B4 38-45자 실전 모범답안</p>
    </div>
    <div class="header-actions">
      <input type="text" class="search-input" id="search-box" placeholder="🔍 표제어·키워드 검색..." oninput="handleSearch()">
      <button class="btn btn-blind" id="blind-toggle" onclick="toggleBlindMode()">🙈 블라인드 암기 모드</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ A4 인쇄하기</button>
    </div>
  </div>
</header>

<nav class="filter-nav">
  <button class="tab-btn active" onclick="filterDomain('all')">전체 55대 주제</button>
  <button class="tab-btn" onclick="filterDomain('정신병리')">1. 정신병리 (12선)</button>
  <button class="tab-btn" onclick="filterDomain('심리검사')">2. 심리검사 (10선)</button>
  <button class="tab-btn" onclick="filterDomain('상담이론')">3. 상담이론 (10선)</button>
  <button class="tab-btn" onclick="filterDomain('가족치료')">4. 가족치료 (8선)</button>
  <button class="tab-btn" onclick="filterDomain('진로상담')">5. 진로상담 (5선)</button>
  <button class="tab-btn" onclick="filterDomain('집단·대인')">6. 집단·대인 (5선)</button>
  <button class="tab-btn" onclick="filterDomain('위기·놀이·법')">7. 위기·놀이·법 (5선)</button>
</nav>

<main class="main-container" id="content-container">
</main>

: 24, "title": "아들러 개인심리학: 생활양식 4대 유형 및 격려 기법", "concept": "어린 시절 형성된 인지적 틀(지배형, 기생형, 회피형, 사회적 유용형)과 용기 부여", "sub_questions": ["사회적 관심과 활동 수준의 두 축에 따라 구분되는 생활양식 4대 유형 제시 [1점]", "지배형, 기생형, 회피형의 낮은 사회적 관심으로 인한 부적응적 특성 서술 [1점]", "인생의 세 가지 과제(일, 우정, 사랑)를 주도적으로 해결하는 사회적 유용형의 특징 설명 [1점]", "열등감을 극복하고 자기효능감을 회복하도록 돕는 아들러의 '격려(Encouragement)' 기법 제시 [1점]"], "keywords": ["생활양식 4대 유형", "사회적 관심", "활동 수준", "격려(Encouragement)"], "model_answer": ["사회적 관심과 활동 수준에 따라 지배형과 기생형 및 회피형 유용형이 있다. (41자)", "지배형은 독단적이고 기생형은 의존하며 회피형은 도피하여 문제를 피한다. (39자)", "사회적 유용형은 높은 관심과 활동으로 타인과 협동하며 과제를 완수한다. (39자)", "결과보다 노력의 과정을 지지하고 인정하는 격려로 내적 용기를 북돋운다. (39자)"], "rubric": ["사회적 관심과 활동 수준의 높낮이 매트릭스에 따른 4대 생활양식 명시: 1점", "독재적 공격성(지배), 타인 착취 의존(기생), 소극적 철수(회피) 부적응 설명: 1점", "높은 사회적 관심과 높은 활동 수준으로 타인에게 공헌하는 사회적 유용형 서술: 1점", "칭찬(결과 중심)과 구별되는 노력과 강점 초점의 용기 부여(격려) 기법 제시: 1점"]}, {"domain": "상담이론", "num": 25, "title": "융 분석심리학: 페르소나 순기능 및 동일시 부작용, 그림자", "concept": "사회적 가면(페르소나)의 적응적 가치와 자아의 과도한 동일시 병리, 억압된 그림자", "sub_questions": ["사회가 요구하는 도덕적·직업적 가면인 페르소나(Persona)의 순기능 서술 [1점]", "자아가 페르소나와 지나치게 동일시될 때 나타나는 소외 및 심리적 경직성 부작용 설명 [1점]", "의식에서 억압된 어둡고 열등한 무의식적 성격 측면인 '그림자(Shadow)'의 양면성 서술 [1점]", "페르소나와 그림자를 자각하고 통합하여 참된 자기를 실현하는 '개성화(Individuation)' 원리 제시 [1점]"], "keywords": ["페르소나(Persona)", "동일시 부작용", "그림자(Shadow)", "개성화(Individuation)"], "model_answer": ["페르소나는 원만한 사회생활을 돕고 상처를 보호해 주는 순기능을 갖는다. (39자)", "가면과 자아를 동일시하면 진정한 본래 자기를 잃고 소외되며 공허해진다. (39자)", "그림자는 억압된 어두운 면이지만 창조성과 생명력의 원천이 되기도 한다. (39자)", "가면을 벗고 그림자를 포용하여 온전한 자기로 통합하는 개성화를 이룬다. (39자)"], "rubric": ["사회적 역할 수행 촉진 및 내적 취약성 보호라는 페르소나의 적응적 순기능 서술: 1점", "역할과의 과도한 동일시로 인한 진정한 자아 상실, 피로감, 신경증적 부작용 설명: 1점", "동물적 본능이자 창조적 에너지의 보고라는 그림자의 이중적 속성 서술: 1점", "의식과 무의식의 대극을 통합하여 온전한 자기(Self)에 도달하는 개성화 과정 제시: 1점"]}, {"domain": "상담이론", "num": 26, "title": "합리적 정서행동치료(REBT): ABCDEF 모형 및 3대 논박", "concept": "비합리적 신념 체계(B)의 교정을 위한 논리적, 실증적, 실용적 논박(D)과 효과(E)", "sub_questions": ["선행사건(A), 신념(B), 정서적 결과(C)로 이어지는 REBT의 기본 문제 분석 틀 서술 [1점]", "당위성(절대적 요구)을 포함하는 비합리적 신념(iB)의 3대 핵심 영역 설명 [1점]", "논리적 논박, 실증적 논박, 실용적(기능적) 논박의 3대 논박 질문 기법 구분 [1점]", "효과적인 합리적 철학(E) 확립과 건강한 새로운 감정(F)으로의 변화 과정 제시 [1점]"], "keywords": ["ABCDEF 모형", "비합리적 신념", "3대 논박(논리·실증·실용)", "효과적 신념"], "model_answer": ["사건 자체가 아닌 사건을 해석하는 비합리적 신념이 왜곡된 결과를 낳는다. (40자)", "자신과 타인 및 세상에 대한 비현실적이고 절대적인 당위성에 집착한다. (38자)", "논리적 모순을 지적하고 경험적 근거를 묻고 실용적 유익성을 따져 논박한다. (41자)", "합리적 신념을 세워 부적응적 결과를 건강한 정서와 행동으로 전환한다. (38자)"], "rubric": ["사건(A)이 아닌 인지적 신념(B)이 결과(C)를 결정한다는 REBT 기본 원리 명시: 1점", "자신에 대한 당위, 타인에 대한 당위, 세상에 대한 당위 3대 영역 설명: 1점", "이치에 맞는지(논리적), 증거가 있는지(실증적), 도움이 되는지(실용적) 3대 논박 구분: 1점", "논박(D)을 거쳐 합리적 철학(E)을 형성하고 건강한 정서/행동(F) 획득 과정 제시: 1점"]}, {"domain": "상담이론", "num": 27, "title": "벡(Beck) 인지치료: 자동적 사고 및 하향화살표 기법", "concept": "표층의 자동적 사고에서 중간신념을 거쳐 심층의 핵심신념(Core Belief)으로 진입", "sub_questions": ["특정 상황에서 반사적으로 떠오르는 인지적 평가인 '자동적 사고'의 개념 서술 [1점]", "임상에서 흔히 나타나는 인지적 오류 2가지(파국화, 개인화, 선택적 추론 등) 정의 [1점]", "자동적 사고 이면의 조건부 가정을 파고들어 핵심신념을 찾는 '하향화살표 기법' 절차 설명 [1점]", "자신에 대한 무능감 및 사랑받을 수 없음으로 구성된 '핵심신념'의 재구성 방안 제시 [1점]"], "keywords": ["자동적 사고", "인지적 오류", "하향화살표 기법", "핵심신념(Core Belief)"], "model_answer": ["자동적 사고는 상황에 부딪힐 때 의식의 통제 없이 반사적으로 떠오른다. (39자)", "작은 실수를 최악으로 보는 파국화와 남의 탓을 나에게 돌리는 개인화가 있다. (42자)", "만약 그것이 사실이라면 무슨 의미인가를 질문하여 하향 화살표를 적용한다. (40자)", "심층에 숨은 무능력 핵심신념을 증거 기반으로 검증하여 합리적으로 고친다. (40자)"], "rubric": ["자동적이고 자발적으로 발생하는 주관적 인지 반응인 자동적 사고 정의: 1점", "파국화, 흑백논리, 개인화, 선택적 추론 등 인지적 왜곡 2가지 정의: 1점", "사고의 함의를 단계적으로 질문하여 기저의 무조건적 핵심신념을 찾아내는 절차 서술: 1점", "무능감/사랑받지 못함 핵심신념을 반증 증거 탐색을 통해 유연한 대안 신념으로 수정: 1점"]}, {"domain": "상담이론", "num": 28, "title": "게슈탈트 치료: 접촉경계 혼란 및 빈 의자 기법", "concept": "자신과 환경 간의 건강한 접촉을 방해하는 신경증적 방어(내사, 투사, 반전, 융합) 극복", "sub_questions": ["비판적 검토 없이 타인의 가치관을 무조건 삼켜버리는 '내사(Introjection)' 개념 서술 [1점]", "타인에게 하고 싶은 행동을 자기 자신에게 억압적으로 행하는 '반전(Retroflection)' 설명 [1점]", "자타의 경계가 모호해져 갈등을 회피하는 '융합(Confluence)'의 임상적 특징 서술 [1점]", "미해결 과제를 해결하고 분열된 자아를 대화시키는 '빈 의자 기법'의 작동 원리 제시 [1점]"], "keywords": ["접촉경계 혼란", "내사(Introjection)", "반전(Retroflection)", "빈 의자 기법"], "model_answer": ["내사는 외부 규범을 소화하지 않고   const container = document.getElementById('content-container');
  container.innerHTML = '';

  const domains = ['정신병리', '심리검사', '상담이론', '가족치료', '진로상담', '집단·대인', '위기·놀이·법'];

  domains.forEach(d => {
    if (currentDomain !== 'all' && currentDomain !== d) return;

    let domainTopics = topics.filter(t => t.domain === d);
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      domainTopics = domainTopics.filter(t => 
        t.title.toLowerCase().includes(q) || 
        t.concept.toLowerCase().includes(q) ||
        t.keywords.some(k => k.toLowerCase().includes(q))
      );
    }

    if (domainTopics.length === 0) return;

    const section = document.createElement('section');
    section.className = 'domain-section';
    section.id = 'domain-' + d;

    let cardsHtml = '';
    domainTopics.forEach(t => {
      const qListHtml = t.sub_questions.map((q, idx) => 
        '<li><span class="q-num">Q' + (idx + 1) + '.</span> <span>' + q + '</span></li>'
      ).join('');

      const kwHtml = t.keywords.map(kw => 
        '<span class="kw-tag">' + kw + '</span>'
      ).join('');

      const ansHtml = t.model_answer.map(line => 
        '<div class="ans-line-item"><span>' + line + '</span></div>'
      ).join('');

      const rubricHtml = t.rubric.map(r => 
        '<div>✓ ' + r + '</div>'
      ).join('');

      cardsHtml += 
        '<div class="topic-card">' +
          '<div class="card-top">' +
            '<div>' +
              '<div class="card-num">TOPIC ' + String(t.num).padStart(2, '0') + '</div>' +
              '<div class="card-title-text">' + t.title + '</div>' +
            '</div>' +
            '<span class="domain-badge">' + t.domain + '</span>' +
          '</div>' +
          '<div class="card-concept">📌 <strong>출제 논점:</strong> ' + t.concept + '</div>' +
          '<div class="sub-q-box">' +
            '<div class="sub-q-header">📋 [세부 질문 3-4개 / 4점 만점 구조]</div>' +
            '<ul class="sub-q-list">' + qListHtml + '</ul>' +
          '</div>' +
          '<div class="kw-tags">' + kwHtml + '</div>' +
          '<div class="ans-box">' +
            '<div class="ans-header">' +
              '<span>🏆 B4 답안지 4줄 공식 모범답안 (줄당 38-45자)</span>' +
              '<span style="font-size:0.75rem; color:#94a3b8;">4점 만점</span>' +
            '</div>' +
            '<div class="ans-lines">' + ansHtml + '</div>' +
          '</div>' +
          '<div class="rubric-box">' +
            '<div class="rubric-header">⚖️ [KICE 4점 만점 공식 채점 기준표]</div>' +
            '<div class="rubric-items">' + rubricHtml + '</div>' +
          '</div>' +
        '</div>';
    });

    section.innerHTML = 
      '<div class="domain-header">' +
        '<span class="domain-badge">' + d + '</span>' +
        '<h2 class="domain-title">' + d + ' 영역 핵심 테마</h2>' +
      '</div>' +
      '<div class="cards-grid">' + cardsHtml + '</div>';

    container.appendChild(section);
  });
}

function filterDomain(domain) {
  currentDomain = domain;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.innerText.includes(domain) || (domain === 'all' && btn.innerText.includes('전체'))) {
      btn.classList.add('active');
    }
  });
  renderTopics();
}

function handleSearch() {
  searchQuery = document.getElementById('search-box').value;
  renderTopics();
}

function toggleBlindMode() {
  document.body.classList.toggle('blind-mode');
  const btn = document.getElementById('blind-toggle');
  if (document.body.classList.contains('blind-mode')) {
    btn.classList.add('active');
    btn.innerText = '👀 정답 보기 모드';
  } else {
    btn.classList.remove('active');
    btn.innerText = '🙈 블라인드 암기 모드';
  }
}

// Initial render
window.addEventListener('DOMContentLoaded', () => {
  renderTopics();
});
</script>
</body>
</html>
